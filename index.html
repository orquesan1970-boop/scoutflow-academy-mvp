            firmado_por: D.firma_nombre, dni_firmante: D.firma_dni, relacion: D.fam_relation,
            consentimientos: Object.assign({}, D.consent),
            recogido_por: SF.store.currentUser().name
          }
        });
        SF._insDatos = null; SF._insPaso = 1;
        U.toast('Ficha creada'); location.hash = '#/jugador/' + p.id;
      };
      pie.appendChild(bFin);
    }
    view.appendChild(pie);

    if (paso === 1) {
      view.appendChild(el('<p class="hint">Los campos con * son los imprescindibles. El resto se puede completar después.</p>'));
    }
  };

  /* ===================== LICENCIAS ===================== */
  pages.licencias = function (view) {
    var r = role();
    view.innerHTML = head('Licencias federativas ' + esc(SF.SEASON),
      'Quién está listo para federar y a quién le falta algo. Aquí no se tramita nada: se prepara.');

    var ps = scopedPlayers().filter(function (p) { return p.status !== 'Rechazado'; });
    var listos = ps.filter(SF.licenciaListo);
    var falta = ps.filter(function (p) { return !SF.licenciaListo(p); });

    /* --- Resumen arriba, que es la pregunta real: ¿cuánto me queda? --- */
    view.appendChild(el('<div class="foco ' + (falta.length ? 'is-warn' : 'is-ok') + '">' +
      '<div class="foco-ic">' + ico(falta.length ? 'alert' : 'check') + '</div><div class="foco-body">' +
      '<p class="foco-t">' + listos.length + ' de ' + ps.length + ' jugadores listos para federar</p>' +
      '<p class="foco-s">' + (falta.length
        ? 'A ' + falta.length + (falta.length === 1 ? ' le falta algún dato.' : ' les falta algún dato.') +
          ' Mejor resolverlo antes de entrar en la intranet de la federación que a mitad de la ficha.'
        : 'Puedes tramitarlas todas.') + '</p></div></div>'));

    /* --- Qué falta, agrupado: si a diez les falta el DNI, es una gestión, no diez --- */
    if (falta.length) {
      var porDato = {};
      falta.forEach(function (p) { SF.licenciaPend(p).forEach(function (d) { (porDato[d.label] = porDato[d.label] || []).push(p); }); });
      view.appendChild(el('<p class="sec-label">Qué falta en total</p>'));
      var lg = el('<div class="mini-list"></div>');
      Object.keys(porDato).sort(function (a, b) { return porDato[b].length - porDato[a].length; }).forEach(function (lab) {
        var req = SF.LICENCIA_REQ.filter(function (x) { return x.label === lab; })[0] || {};
        lg.appendChild(el('<div class="mini-row"><span><b>' + esc(lab) + '</b> · ' + porDato[lab].length +
          (porDato[lab].length === 1 ? ' jugador' : ' jugadores') +
          (req.nota ? '<br><span class="hint">' + esc(req.nota) + '</span>' : '') + '</span>' +
          '<span class="hint">' + esc(porDato[lab].slice(0, 4).map(function (p) { return p.full_name.split(' ')[0]; }).join(', ')) +
          (porDato[lab].length > 4 ? '…' : '') + '</span></div>'));
      });
      view.appendChild(lg);
    }

    /* --- Por equipo, que es como se tramita --- */
    var equipos = SF.store.teams().filter(function (t) { return r.segments === 'all' || !r.segments || r.segments.indexOf(t.segment) >= 0; });
    var sinEquipo = ps.filter(function (p) { return !p.team_id; });

    equipos.forEach(function (t) {
      var roster = ps.filter(function (p) { return p.team_id === t.id; });
      if (!roster.length) return;
      var okN = roster.filter(SF.licenciaListo).length;
      view.appendChild(el('<p class="sec-label">' + esc(t.name) + ' · ' + okN + ' de ' + roster.length + ' listos</p>'));
      var l = el('<div class="mini-list"></div>');
      roster.forEach(function (p) {
        var pend = SF.licenciaPend(p);
        var row = el('<div class="mini-row"><span><b>' + esc(p.full_name) + '</b> <span class="hint">' + SF.fichaCode(p.ficha) + '</span>' +
          (pend.length
            ? '<br>' + pend.map(function (d) { return '<span class="tag tag-warn">' + esc(d.label) + '</span>'; }).join(' ')
            : ' <span class="tag tag-green">listo</span>') +
          '</span><span class="row-actions"></span></div>');
        var ra = row.querySelector('.row-actions');
        if (!pend.length) {
          var bc = el('<button class="lnk">copiar datos</button>');
          bc.onclick = function () {
            var txt = SF.licenciaTexto(p);
            if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { U.toast('Datos copiados'); });
            else U.modal('Datos de ' + p.full_name, el('<div><p class="bz-body">' + esc(txt) + '</p></div>'));
          };
          ra.appendChild(bc);
        }
        var bf = el('<button class="lnk">ficha</button>');
        bf.onclick = function () { location.hash = '#/jugador/' + p.id; };
        ra.appendChild(bf);
        l.appendChild(row);
      });
      view.appendChild(l);
    });

    if (sinEquipo.length) {
      view.appendChild(el('<p class="sec-label">Sin equipo asignado · ' + sinEquipo.length + '</p>'));
      view.appendChild(el('<p class="hint">La licencia se pide por equipo, así que estos no se pueden federar todavía: ' +
        esc(sinEquipo.map(function (p) { return p.full_name; }).join(', ')) + '.</p>'));
    }

    /* --- El staff también se federa, y se olvida siempre --- */
    if (r.nav.indexOf('staff') >= 0) {
      var staffMal = SF.store.staff().filter(function (s) {
        var l = s.licence || {};
        return l.status && l.status !== 'no_aplica' && !(l.status === 'vigente' && l.season === SF.SEASON);
      });
      view.appendChild(el('<p class="sec-label">Entrenadores y técnicos</p>'));
      if (!staffMal.length) view.appendChild(el('<p class="hint">Todas las licencias del staff están al día.</p>'));
      var ls = el('<div class="mini-list"></div>');
      staffMal.forEach(function (s) {
        var l = s.licence || {};
        var row = el('<div class="mini-row"><span><b>' + esc(s.full_name) + '</b> <span class="hint">' + esc(roleLabel(s.role)) + '</span><br>' +
          '<span class="tag tag-warn">Licencia de ' + esc(l.season || 'ninguna') + '</span> <span class="hint">hay que renovarla para ' + esc(SF.SEASON) + '</span></span>' +
          '<span class="row-actions"><button class="lnk" data-f>ficha</button></span></div>');
        row.querySelector('[data-f]').onclick = function () { location.hash = '#/staff/' + s.id; };
        ls.appendChild(row);
      });
      view.appendChild(ls);
    }

    view.appendChild(el('<p class="hint" style="margin-top:14px">Los <b>permisos de los padres no se piden aquí</b>: ya se firman al inscribir al jugador en el club.<br>' +
      'De momento esta pantalla <b>no genera el fichero</b> de la federación, porque aún no sabemos qué columnas pide Intrafeb. ' +
      'En cuanto tengamos su plantilla, se añade el botón. Mientras, «copiar datos» te deja el bloque listo para pegar.</p>'));
  };

  /* ===================== BUSCADOR UNIVERSAL =====================
     Una sola caja para jugadores y para personal. Lo que se busca de cada
     ficha está declarado aquí a propósito: NO entran las notas internas, ni
     el presupuesto, ni el estado de pagos. Un buscador que encuentra por un
     dato es un buscador que enseña ese dato. */

  function textoJugador(p) {
    var t = [p.full_name, SF.fichaCode(p.ficha), p.scoutflow_id, p.birth_year,
      p.primary_position, p.secondary_position, (p.nationality || []).join(' '),
      p.club, p.league, p.category, p.city, p.residence_country, p.status, p.school];
    return t.filter(Boolean).join(' ').toLowerCase();
  }
  /* La trayectoria va aparte para poder decir POR QUÉ ha salido:
     si buscas "EBA" quieres saber que ha coincidido ahí, no adivinarlo. */
  function textoTrayectoria(p) {
    var t = [];
    SF.careerNorm(p.career_history).forEach(function (c) {
      t.push(c.club);
      c.seasons.forEach(function (s) { t.push(s.season, s.category, s.competition, s.finish); });
    });
    return t.filter(Boolean).join(' ').toLowerCase();
  }
  function trayectoriaResumen(p, terms) {
    var out = [];
    SF.careerNorm(p.career_history).forEach(function (c) {
      c.seasons.forEach(function (s) {
        var linea = [c.club, s.season, s.category, s.competition, s.finish].filter(Boolean).join(' · ');
        if (terms.some(function (q) { return linea.toLowerCase().indexOf(q) >= 0; })) out.push(linea);
      });
    });
    return out;
  }
  function textoStaff(s) {
    var eq = (s.team_ids || []).map(function (id) { return (SF.store.teamGet(id) || {}).name; });
    var l = s.licence || {};
    return [s.full_name, SF.staffCode(s.num), roleLabel(s.role), s.qualification, s.qual_entity,
      s.qual_number, l.category, l.number, s.languages, s.email, eq.join(' ')]
      .filter(Boolean).join(' ').toLowerCase();
  }
  /* Todos los términos tienen que aparecer: "cadete 2009" busca las dos cosas,
     no una o la otra. */
  function casa(texto, terms) { return terms.every(function (q) { return texto.indexOf(q) >= 0; }); }

  pages.buscar = function (view) {
    var q = (SF._q || '').trim();
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    var r = role();

    view.innerHTML = head('Resultados', q ? 'Buscando «' + esc(q) + '»' : 'Escribe algo en la barra de búsqueda.');
    if (!terms.length) return;

    /* Jugadores: solo los de su ámbito. Un entrenador no busca en todo el club. */
    var ps = scopedPlayers().map(function (p) {
      var base = textoJugador(p), tray = textoTrayectoria(p);
      if (!casa(base + ' ' + tray, terms)) return null;
      return { p: p, porTray: !casa(base, terms), lineas: trayectoriaResumen(p, terms) };
    }).filter(Boolean);

    /* Personal: solo para quien tiene acceso al listado de staff. */
    var verStaff = r.nav.indexOf('staff') >= 0;
    var ss = verStaff ? SF.store.staff().filter(function (s) { return casa(textoStaff(s), terms); }) : [];

    var eqs = r.nav.indexOf('equipos') >= 0
      ? SF.store.teams().filter(function (t) { return casa((t.name + ' ' + t.category + ' ' + (t.coaches || []).join(' ')).toLowerCase(), terms); })
      : [];

    if (!ps.length && !ss.length && !eqs.length) {
      view.appendChild(el('<div class="empty-panel"><div class="em-ic">' + ico('search') + '</div>' +
        '<h3>Nada con «' + esc(q) + '»</h3><p>Puedes buscar por nombre, número de ficha, año, posición, nacionalidad, ' +
        'club de la trayectoria, categoría o competición. Y por personal: nombre, rol, titulación o equipo.</p></div>'));
      return;
    }

    if (ps.length) {
      view.appendChild(el('<p class="sec-label">Jugadores · ' + ps.length + '</p>'));
      var lp = el('<div class="mini-list"></div>');
      ps.slice(0, 25).forEach(function (x) {
        var p = x.p;
        var meta = [p.birth_year, p.primary_position, (p.nationality || [])[0]].filter(Boolean).join(' · ');
        var row = el('<div class="mini-row"><span><b>' + esc(p.full_name) + '</b> <span class="hint">' +
          SF.fichaCode(p.ficha) + (meta ? ' · ' + esc(meta) : '') + '</span>' +
          (x.lineas.length ? '<br><span class="hint">' + ico('star') + ' En su trayectoria: ' +
            esc(x.lineas.slice(0, 3).join('  |  ')) + '</span>' : '') +
          '</span><span class="row-actions"><button class="lnk" data-v>abrir ficha</button></span></div>');
        row.querySelector('[data-v]').onclick = function () { location.hash = '#/jugador/' + p.id; };
        lp.appendChild(row);
      });
      view.appendChild(lp);
      if (ps.length > 25) view.appendChild(el('<p class="hint">y ' + (ps.length - 25) + ' más.</p>'));
    }

    if (ss.length) {
      view.appendChild(el('<p class="sec-label">Personal del club · ' + ss.length + '</p>'));
      var ls = el('<div class="mini-list"></div>');
      ss.forEach(function (s) {
        var st = SF.staffStatus(s);
        var eq = (s.team_ids || []).map(function (id) { return (SF.store.teamGet(id) || {}).name; }).filter(Boolean);
        var row = el('<div class="mini-row"><span><b>' + esc(s.full_name) + '</b> <span class="hint">' +
          SF.staffCode(s.num) + ' · ' + esc(roleLabel(s.role)) + (s.qualification ? ' · ' + esc(s.qualification) : '') + '</span><br>' +
          '<span class="tag ' + (st.level === 'ok' ? 'tag-green' : st.level === 'warn' ? 'tag-warn' : 'tag-danger') + '">' + st.label + '</span> ' +
          (eq.length ? '<span class="hint">' + esc(eq.join(', ')) + '</span>' : '<span class="hint">sin equipo asignado</span>') +
          '</span><span class="row-actions"><button class="lnk" data-v>abrir ficha</button></span></div>');
        row.querySelector('[data-v]').onclick = function () { location.hash = '#/staff/' + s.id; };
        ls.appendChild(row);
      });
      view.appendChild(ls);
    }

    if (eqs.length) {
      view.appendChild(el('<p class="sec-label">Equipos · ' + eqs.length + '</p>'));
      var le = el('<div class="mini-list"></div>');
      eqs.forEach(function (t) {
        var row = el('<div class="mini-row"><span><b>' + esc(t.name) + '</b> <span class="hint">' +
          esc(t.category || '') + (t.coaches && t.coaches.length ? ' · ' + esc(t.coaches.join(', ')) : '') + '</span></span>' +
          '<span class="row-actions"><button class="lnk" data-v>abrir</button></span></div>');
        row.querySelector('[data-v]').onclick = function () { location.hash = '#/equipo/' + t.id; };
        le.appendChild(row);
      });
      view.appendChild(le);
    }

    if (!verStaff && SF.store.staff().some(function (s) { return casa(textoStaff(s), terms); })) {
      view.appendChild(el('<p class="hint">Hay personal del club que coincide, pero tu rol no tiene acceso al listado de staff.</p>'));
    }
  };

  /* ===================== MIS AVISOS =====================
     El buzón de cada persona del staff. Existe porque un entrenador no tiene
     "Comunicados" (esa pantalla es la del que envía, no la del que recibe):
     sin un sitio propio, los avisos se enviaban a ninguna parte. */
  /* Un hilo abierto, desde el lado del staff. Mismo formato que ve la
     familia: mensajes uno debajo de otro y una caja para responder. */
  function abrirHilo(c, me) {
    var p = c.player_id ? SF.store.get(c.player_id) : null;
    var box = el('<div></div>');
    var destIds = c.to_staff_ids || (c.to_staff ? [c.to_staff] : []);
    var supervisa = destIds.indexOf(me.id) < 0 && !(c.opened_by && c.opened_by.id === me.id);
    if (p) box.appendChild(el('<p class="hint">Sobre <b>' + esc(p.full_name) + '</b>' +
      (p.team_id ? ' · ' + esc((SF.store.teamGet(p.team_id) || {}).name || '') : '') + '</p>'));
    /* Con varios destinatarios hay que decir quiénes son: si no, nadie sabe
       si su respuesta la va a leer solo quien preguntó o todo el club. */
    if (destIds.length > 1) {
      var nombres = destIds.map(function (id) {
        var s = SF.store.staff().filter(function (x) { return x.id === id; })[0];
        return s ? s.full_name : null;
      }).filter(Boolean);
      box.appendChild(el('<p class="hint">Va a <b>' + destIds.length + ' personas</b>: ' + esc(nombres.join(', ')) +
        '. Lo que respondas lo verán todas.</p>'));
    }
    if (supervisa) box.appendChild(el('<p class="aviso-lin">Ves esta conversación porque supervisas este equipo, no porque vaya dirigida a ti. Puedes responder si hace falta, y quedará con tu nombre.</p>'));

    var hilo = el('<div></div>');
    c.messages.forEach(function (m) {
      hilo.appendChild(el('<div class="conv-m' + (m.by.kind !== 'staff' ? ' otro' : '') + '">' +
        '<span class="conv-who">' + esc(m.by.name) + ' <span class="hint">' + esc(m.by.role) + ' · ' +
        fmtDate((m.at || '').slice(0, 10)) + '</span></span><p>' + esc(m.text).replace(/\n/g, '<br>') + '</p></div>'));
    });
    box.appendChild(hilo);

    if (c.closed_at) {
      box.appendChild(el('<p class="hint">Conversación cerrada por ' + esc(c.closed_by || 'el club') + '.</p>'));
    } else {
      var resp = el('<div class="conv-new"><textarea placeholder="Responder…"></textarea></div>');
      var acc = el('<div class="modal-actions"></div>');
      var bR = el('<button class="btn btn-primary">Responder</button>');
      var bC = el('<button class="btn">Dar por cerrada</button>');
      bR.onclick = function () {
        var t = resp.querySelector('textarea').value.trim();
        if (!t) { U.toast('Escribe la respuesta'); return; }
        SF.store.convReply(c.id, { kind: 'staff', id: me.id, name: me.full_name, role: roleLabel(me.role) }, t);
        U.closeModal(); U.toast('Respuesta enviada'); SF.router.render();
      };
      bC.onclick = function () {
        SF.store.convClose(c.id, me.full_name);
        U.closeModal(); U.toast('Conversación cerrada'); SF.router.render();
      };
      acc.appendChild(bC); acc.appendChild(bR);
      box.appendChild(resp); box.appendChild(acc);
    }
    SF.store.convMarkRead(c.id, me.id);
    U.modal(c.subject, box);
    SF.router.renderShell();
  }

  /* Hilo nuevo entre personas del club. Entre staff no hay restricción: el
     filtro fuerte es el de las familias y el de los jugadores. */
  function nuevoHiloStaff(me) {
    var otros = SF.store.staff().filter(function (s) { return s.id !== me.id; });
    if (!otros.length) { U.toast('No hay nadie más en el club'); return; }
    var sel = {};
    var box = el('<div></div>');
    var f = el('<div class="form-grid">' +
      '<div class="frow"><label>Sobre un jugador <span class="hint">opcional</span></label><select id="qp"><option value="">—</option>' +
        scopedPlayers().map(function (p) { return '<option value="' + p.id + '">' + esc(p.full_name) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="frow"><label>Asunto</label><input id="qs" placeholder="Disponibilidad para el sábado"></div>' +
      '<div class="frow" style="grid-column:1/-1"><label>Mensaje</label><textarea id="qb" rows="4"></textarea></div></div>');
    box.appendChild(f);

    /* --- Destinatarios: varios --- */
    box.appendChild(el('<p class="sec-label">¿A quién?</p>'));
    var atajos = el('<div class="row-c" style="margin-bottom:8px"></div>');
    var cuenta = el('<p class="hint"></p>');
    var lista = el('<div class="att-list"></div>');

    function pinta() {
      lista.innerHTML = '';
      /* Agrupados por rol: en un club de veinte personas, una lista plana de
         nombres no dice quién es quién. */
      var porRol = {};
      otros.forEach(function (s) { (porRol[s.role] = porRol[s.role] || []).push(s); });
      Object.keys(porRol).forEach(function (rol) {
        lista.appendChild(el('<p class="hint" style="margin:8px 0 2px">' + esc(roleLabel(rol)) + '</p>'));
        porRol[rol].forEach(function (s) {
          var on = !!sel[s.id];
          var eq = (s.team_ids || []).map(function (id) { return (SF.store.teamGet(id) || {}).name; }).filter(Boolean);
          var row = el('<button class="mini-row" style="width:100%;text-align:left;cursor:pointer"><span>' +
            (on ? '☑ ' : '☐ ') + '<b>' + esc(s.full_name) + '</b>' +
            (eq.length ? ' <span class="hint">· ' + esc(eq.join(', ')) + '</span>' : '') + '</span></button>');
          row.onclick = function () { sel[s.id] = !sel[s.id]; pinta(); };
          lista.appendChild(row);
        });
      });
      var n = Object.keys(sel).filter(function (k) { return sel[k]; }).length;
      cuenta.textContent = n ? (n === 1 ? '1 destinatario seleccionado' : n + ' destinatarios seleccionados')
                             : 'Marca al menos uno.';
    }
    var bTodos = el('<button class="btn btn-light btn-sm">Todos</button>');
    var bNadie = el('<button class="btn btn-light btn-sm">Ninguno</button>');
    var bTec = el('<button class="btn btn-light btn-sm">Solo cuerpo técnico</button>');
    bTodos.onclick = function () { otros.forEach(function (s) { sel[s.id] = true; }); pinta(); };
    bNadie.onclick = function () { sel = {}; pinta(); };
    bTec.onclick = function () {
      sel = {};
      otros.forEach(function (s) {
        if (['entrenador', 'preparador_fisico', 'fisioterapeuta', 'psicologo'].indexOf(s.role) >= 0) sel[s.id] = true;
      });
      pinta();
    };
    atajos.appendChild(bTodos); atajos.appendChild(bTec); atajos.appendChild(bNadie);
    box.appendChild(atajos); box.appendChild(cuenta); box.appendChild(lista);

    /* Un hilo compartido es lo normal para coordinarse: preguntas quién puede
       el sábado y todos ven las respuestas. Cuando no interesa que se lean
       entre ellos, se marca esto y salen hilos separados. */
    var priv = el('<label class="chk" style="margin-top:10px"><input type="checkbox" id="qpriv"> ' +
      'Que cada uno responda solo a mí, sin ver las respuestas de los demás</label>');
    box.appendChild(priv);
    pinta();

    var foot = el('<div class="modal-actions"><button class="btn">Cancelar</button><button class="btn btn-primary">Enviar</button></div>');
    foot.children[0].onclick = U.closeModal;
    foot.children[1].onclick = function () {
      var asunto = f.querySelector('#qs').value.trim();
      var texto = f.querySelector('#qb').value.trim();
      var ids = Object.keys(sel).filter(function (k) { return sel[k]; });
      if (!ids.length) { U.toast('Elige al menos un destinatario'); return; }
      if (!asunto) { U.toast('Ponle un asunto'); return; }
      if (!texto) { U.toast('Escribe el mensaje'); return; }
      var pid = f.querySelector('#qp').value;
      var pj = pid ? SF.store.get(pid) : null;
      var de = { kind: 'staff', id: me.id, name: me.full_name, role: roleLabel(me.role) };
      var base = { player_id: pid || null, team_id: pj ? pj.team_id : null, subject: asunto, text: texto, from: de };

      if (priv.querySelector('#qpriv').checked) {
        ids.forEach(function (id) { SF.store.convCreate(Object.assign({}, base, { to_staff_ids: [id] })); });
      } else {
        SF.store.convCreate(Object.assign({}, base, { to_staff_ids: ids }));
      }
      U.closeModal();
      U.toast('Enviado a ' + ids.length + (ids.length === 1 ? ' persona' : ' personas'));
      SF.router.render(); SF.router.renderShell();
    };
    box.appendChild(foot);
    U.modal('Escribir a compañeros', box);
  }

  pages['mis-avisos'] = function (view) {
    var me = SF.store.staffMe();
    view.innerHTML = head('Mis avisos', 'Lo que te manda el club y lo que te preguntan las familias.');
    if (!me) { view.appendChild(el('<div class="empty-panel"><p>No hay ninguna ficha de staff asociada a este usuario.</p></div>')); return; }

    /* --- Conversaciones: primero, porque son lo que hay que CONTESTAR ---
       Un aviso se lee y se olvida; una consulta de una familia esperando
       respuesta es una deuda. Por eso van arriba. */
    var hilos = SF.store.convsForStaff(me.id);
    var pendientes = hilos.filter(function (c) { return !c.closed_at && SF.store.convSinLeer(c, me.id); });

    view.appendChild(el('<p class="sec-label">Conversaciones' +
      (pendientes.length ? ' · ' + pendientes.length + ' sin leer' : '') + '</p>'));

    var bNuevo = el('<button class="btn btn-light btn-sm" style="margin-bottom:10px">' + ico('arrow') + 'Escribir a un compañero</button>');
    bNuevo.onclick = function () { nuevoHiloStaff(me); };
    view.appendChild(bNuevo);

    if (!hilos.length) {
      view.appendChild(el('<p class="hint">Aquí aparecerán las consultas de las familias y de tus compañeros. Nadie te ha escrito todavía.</p>'));
    } else {
      var hl = el('<div class="mini-list" style="margin-bottom:18px"></div>');
      hilos.forEach(function (c) {
        var p = c.player_id ? SF.store.get(c.player_id) : null;
        var ult = c.messages[c.messages.length - 1];
        var nuevos = SF.store.convSinLeer(c, me.id);
        var dIds = c.to_staff_ids || (c.to_staff ? [c.to_staff] : []);
        var mio = dIds.indexOf(me.id) >= 0 || (c.opened_by && c.opened_by.id === me.id);
        var row = el('<div class="mini-row"><span><b>' + esc(c.subject) + '</b>' +
          (nuevos ? ' <span class="tag tag-purple">' + nuevos + ' sin leer</span>' : '') +
          (dIds.length > 1 ? ' <span class="tag tag-gray">a ' + dIds.length + '</span>' : '') +
          (mio ? '' : ' <span class="tag tag-gray">supervisas</span>') +
          (c.closed_at ? ' <span class="tag tag-green">cerrada</span>' : '') +
          '<br><span class="hint">' + esc(ult.by.name) + ' · ' + esc(ult.by.role) +
          (p ? ' · sobre ' + esc(p.full_name) : '') + ' · ' + fmtDate((ult.at || '').slice(0, 10)) +
          '</span></span><span class="row-actions"><button class="lnk" data-a>Abrir</button></span></div>');
        row.querySelector('[data-a]').onclick = function () { abrirHilo(c, me); };
        hl.appendChild(row);
      });
      view.appendChild(hl);
    }

    view.appendChild(el('<p class="sec-label">Avisos del club</p>'));

    var lista = SF.store.commsForStaff(me.id);
    var sinLeer = lista.filter(function (x) { return !x.leido; }).length;

    if (!lista.length) {
      view.appendChild(el('<p class="hint">No tienes avisos. Aquí te llegan las comunicaciones del club: documentación pendiente, cambios de horario y avisos de dirección.</p>'));
      return;
    }

    if (sinLeer) {
      var bt = el('<button class="btn btn-light btn-sm" style="margin-bottom:12px">' + ico('check') + 'Marcar todo como leído</button>');
      bt.onclick = function () {
        lista.forEach(function (x) { if (!x.leido) SF.store.commMarkRead(x.c.id, me.id); });
        U.toast('Todo marcado como leído'); SF.router.render(); SF.router.renderShell();
      };
      view.appendChild(bt);
    }

    lista.forEach(function (x) {
      var c = x.c;
      var b = el('<button class="bz' + (x.leido ? '' : ' nuevo') + '">' +
        '<div class="bz-ic">' + ico(c.title === 'Documentación pendiente' ? 'file' : 'bell') + '</div>' +
        '<div class="bz-b"><p class="bz-t">' + esc(c.title) +
        (x.leido ? '' : ' <span class="tag tag-purple">nuevo</span>') + '</p>' +
        '<p class="bz-m">' + esc(c.author) + ' · ' + esc(c.author_role) + ' · ' + fmtDate((c.created_at || '').slice(0, 10)) + '</p>' +
        '<p class="bz-p">' + esc(c.body) + '</p></div></button>');
      b.onclick = function () {
        if (!x.leido) SF.store.commMarkRead(c.id, me.id);
        var cuerpo = el('<div><p class="bz-body">' + esc(c.body) + '</p></div>');
        /* Si el club pide que se traslade a las familias, lo dice aquí y
           queda constancia de quién lo trasladó. */
        if (c.mode === 'reenviar' && x.team_id && !x.relayed) {
          var br = el('<button class="btn btn-primary btn-sm" style="margin-top:14px">Ya se lo he trasladado a las familias</button>');
          br.onclick = function () { SF.store.commMarkRelayed(c.id, me.id, x.team_id); U.closeModal(); U.toast('Anotado'); SF.router.render(); };
          cuerpo.appendChild(br);
        }
        U.modal(c.title, cuerpo);
        SF.router.renderShell(); SF.router.render();
      };
      view.appendChild(b);
    });
  };

  /* ===================== RECEPCIÓN =====================
     La entrada a la plataforma. Se ve una vez por sesión y por rol: da
     contexto (quién eres, qué club, qué temporada, qué te espera) y entrega
     el mando. Repetirla en cada navegación la convertiría en un estorbo. */
  SF.welcome = function (onEnter) {
    var r = role(), u = SF.store.currentUser(), a = SF.store.academy();
    var esFamilia = u.role === 'padre' || u.role === 'jugador';

    /* Los avisos de la entrada salen de las mismas reglas que el Inicio:
       una familia NO ve recuentos del club, y quien no tiene permiso de
       finanzas no ve dinero tampoco aquí. */
    var chips = [];
    if (!esFamilia) {
      var mios = scopedPlayers();
      var venc = r.canSeeFinance ? mios.filter(function (p) { return SF.finHas(p, 'vencido'); }) : [];
      var inc = mios.filter(function (p) { return p.status === 'Datos incompletos'; });
      var ent = mios.filter(function (p) { return p.status === 'Entrevista'; });
      var med = r.canEditPhysical ? mios.filter(function (p) { return !p.height_cm || !p.weight_kg; }) : [];
      if (venc.length) chips.push({ c: 'is-danger', t: venc.length + (venc.length === 1 ? ' cuota vencida' : ' cuotas vencidas') });
      if (inc.length) chips.push({ c: 'is-warn', t: inc.length + (inc.length === 1 ? ' ficha incompleta' : ' fichas incompletas') });
      if (ent.length) chips.push({ c: '', t: ent.length + (ent.length === 1 ? ' entrevista' : ' entrevistas') });
      if (med.length && chips.length < 3) chips.push({ c: 'is-warn', t: med.length + ' sin medidas' });
      if (!chips.length) chips.push({ c: 'is-ok', t: 'Todo al día' });
      chips = chips.slice(0, 3);
    }

    var w = el('<div class="wel" role="dialog" aria-label="Bienvenida a ScoutFlow Academy">' +
      '<svg class="wel-lines" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<circle cx="600" cy="350" r="250" fill="none" stroke="#fff" stroke-width="1"/>' +
      '<circle cx="600" cy="350" r="410" fill="none" stroke="#fff" stroke-width="1"/>' +
      '<path d="M0 350h1200M600 0v700" stroke="#fff" stroke-width="1"/></svg>' +
      '<div class="wel-in">' +
      '<img class="wel-logo" src="' + SF.LOGO + '" alt="">' +
      '<p class="wel-eyebrow">' + esc(a.name) + ' · Temporada ' + esc(SF.SEASON) + '</p>' +
      '<h1 class="wel-h">' + saludo() + ',<br>' + esc(u.name) + '</h1>' +
      '<p class="wel-role">' + esc(u.label) + ' · ' + fechaLarga() + '</p>' +
      '<div class="wel-rule"></div>' +
      (esFamilia
        ? '<p class="wel-lead">Aquí tienes al día los documentos, los informes y los pagos.</p>'
        : '<p class="wel-lead">Esto es lo que te espera hoy</p><div class="wel-chips">' +
          chips.map(function (c) { return '<span class="wel-chip ' + c.c + '"><span class="dot"></span><b>' + esc(c.t) + '</b></span>'; }).join('') +
          '</div>') +
      /* La flecha es decoración: sin <title>, o un lector de pantalla
         anunciaría "Entrar Enviar". */
      '<button class="wel-go">Entrar<svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></button>' +
      '<p class="wel-foot">FROM PROSPECT TO PLAYER</p>' +
      '</div></div>');

    function entrar() {
      w.classList.add('out');
      setTimeout(function () { if (w.parentNode) w.parentNode.removeChild(w); }, 450);
      document.removeEventListener('keydown', tecla);
      document.body.style.overflow = prevOverflow;   // devolvemos el scroll
      if (onEnter) onEnter();
    }
    /* Enter, Escape o espacio entran igual: nadie debería quedarse atrapado
       aquí buscando dónde hacer clic. */
    function tecla(e) { if (e.key === 'Enter' || e.key === 'Escape' || e.key === ' ') { e.preventDefault(); entrar(); } }

    w.querySelector('.wel-go').onclick = entrar;
    document.addEventListener('keydown', tecla);
    var prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';   // sin barra de scroll de fondo
    document.body.appendChild(w);
  };

  SF.pages = pages;
  /* Permisos efectivos (rol + excepciones vigentes). Se publica porque el
     router está en otro bloque y también los necesita: el menú y el control
     de rutas tienen que ver exactamente lo mismo que las pantallas. */
  SF.perms = role;
})();

</script>
  <script>
/* js/router.js */
/* Router por hash (#/ruta). Sin servidor: funciona en Vercel y con doble clic. */
window.SF = window.SF || {};
SF.router = (function () {
  var U = SF.ui, el = U.el, ico = U.ico, esc = U.esc;
  var root, view;

  var NAV = [
    ['inicio', 'Inicio', 'home'], ['jugadores', 'Jugadores', 'users'], ['equipos', 'Equipos', 'grid'], ['importar', 'Importar mensaje', 'ai'],
    ['captacion', 'Captación', 'target'], ['documentos', 'Documentos', 'file'], ['informes', 'Informes', 'chart'],
    ['family', 'Family', 'family'], ['finanzas', 'Finanzas', 'card'], ['economia', 'Economía', 'coins'], ['permisos', 'Permisos', 'shield'],
    ['config', 'Configuración', 'cog'],
    ['mi-equipo', 'Mi equipo', 'grid'], ['comunicados', 'Comunicados', 'ai'], ['staff', 'Staff', 'shield'],
    ['presupuesto', 'Presupuesto', 'chart'], ['licencias', 'Licencias', 'shield'],
    ['importar-datos', 'Importar datos', 'chart'], ['mis-avisos', 'Mis avisos', 'bell'], ['mi-ficha', 'Mi ficha', 'file'],
    ['portal-family', 'Portal Family', 'family'], ['portal-jugador', 'Mi ScoutFlow', 'users']
  ];
  var ROUTE_PAGE = {
    inicio: 'inicio', jugadores: 'jugadores', jugador: 'jugador', equipos: 'equipos', equipo: 'equipo',
    importar: 'importar', captacion: 'captacion', documentos: 'documentos', informes: 'informes',
    family: 'family', finanzas: 'finanzas', economia: 'economia', permisos: 'permisos', config: 'config',
    'portal-family': 'portal-family', 'portal-jugador': 'portal-jugador',
    staff: 'staff', 'staff-ficha': 'staff-ficha', 'mi-ficha': 'mi-ficha', 'mi-equipo': 'mi-equipo',
    comunicados: 'comunicados', 'importar-datos': 'importar-datos', 'mis-avisos': 'mis-avisos',
    buscar: 'buscar', presupuesto: 'presupuesto', licencias: 'licencias', inscripcion: 'inscripcion'
  };
  // a qué item de nav corresponde resaltar
  var NAV_OF = { jugador: 'jugadores', equipo: 'equipos', 'portal-family': 'family', 'staff-ficha': 'staff' };

  function parse() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean);
    return { route: parts[0] || '', param: parts[1] || null };
  }

  function defaultRoute() {
    var r = SF.store.role();
    if (r === 'padre') return '#/portal-family';
    if (r === 'jugador') return '#/portal-jugador';
    if (r === 'entrenador') return '#/mi-equipo';
    return '#/inicio';
  }

  /* ¿El rol actual puede acceder a esta ruta? */
  function canAccess(route, r) {
    r = r || SF.perms();   // y también puede entrar por la URL, no solo por el menú
    // Los resultados de búsqueda: quien puede ver jugadores o personal
    if (route === 'buscar') return r.nav.indexOf('jugadores') >= 0 || r.nav.indexOf('staff') >= 0;
    // La inscripción: quien puede dar de alta jugadores
    if (route === 'inscripcion') return !!r.canCreatePlayers;
    if (route === 'jugador') return r.nav.indexOf('jugadores') >= 0;        // solo roles con Jugadores
    if (route === 'equipo') return r.nav.indexOf('equipos') >= 0;            // detalle de equipo
    if (route === 'portal-family') {                                         // padre (su portal) o staff que lo previsualiza
      return r.nav.indexOf('portal-family') >= 0 || r.nav.indexOf('family') >= 0 || r.nav.indexOf('jugadores') >= 0;
    }
    // La ficha de staff: la abre quien ve el listado, o cualquiera la suya.
    if (route === 'staff-ficha') return r.nav.indexOf('staff') >= 0 || r.nav.indexOf('mi-ficha') >= 0;
    return r.nav.indexOf(route) >= 0;
  }

  /* La campana: el aviso de que ha entrado algo. Va en la barra superior
     porque tiene que verse desde cualquier pantalla, no solo desde el buzón. */
  function campana(r) {
    if (r.nav.indexOf('mis-avisos') < 0) return '';
    var me = SF.store.staffMe();
    /* La campana suma avisos y conversaciones sin leer. Si una consulta de
       una familia no hiciera sonar la campana, se quedaría sin contestar. */
    var n = 0;
    if (me) {
      n = SF.store.commUnread(me.id);
      SF.store.convsForStaff(me.id).forEach(function (c) {
        if (!c.closed_at && SF.store.convSinLeer(c, me.id)) n++;
      });
    }
    return '<button class="bell' + (n ? ' has' : '') + '" id="bell" title="' +
      (n ? n + (n === 1 ? ' cosa sin leer' : ' cosas sin leer') : 'Sin avisos nuevos') + '" aria-label="' +
      (n ? n + ' sin leer' : 'Avisos') + '">' +
      '<svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg>' +
      (n ? '<span class="bell-n">' + (n > 9 ? '9+' : n) + '</span>' : '') + '</button>';
  }

  function renderShell() {
    var r = SF.perms();   // rol + permisos particulares: si le dan una sección, sale en el menú
    var a = SF.store.academy();
    root.innerHTML =
      '<div class="app">' +
      '<aside class="sidebar">' +
      '<div class="brand"><img class="logo" src="' + SF.LOGO + '" alt="ScoutFlow"><div><h1>ScoutFlow</h1><p>From Prospect to Player</p></div></div>' +
      '<nav class="nav" id="nav"></nav>' +
      '<div class="sb-foot"><span class="sb-academy">' + esc(a.name) + ' · ' + esc((SF.SPORTS[a.primary_sport] || {}).label || '') +
      '<br><span style="opacity:.55">v' + esc(SF.BUILD) + '</span></span></div>' +
      '</aside>' +
      '<main class="main">' +
      '<header class="topbar">' +
      /* Familia y jugador no buscan en el club: solo tienen su portal. */
      (r.nav.indexOf('jugadores') >= 0 || r.nav.indexOf('staff') >= 0
        ? '<div class="search"><button class="search-go" id="gsearch-go" aria-label="Buscar" title="Buscar"><svg class="ic"><use href="#i-search"/></svg></button><input id="gsearch" placeholder="Buscar jugador, entrenador, club de su trayectoria, categoría…"></div>'
        : '<div class="search-none"></div>') +
      '<div class="top-right">' +
      campana(r) +
      '<label class="role-switch">Rol <select id="role"></select></label>' +
      (r.canCreatePlayers ? '<button class="btn btn-primary" id="tnew">' + ico('plus') + 'Nuevo jugador</button>' : '') +
      '</div></header>' +
      '<div id="view" class="view"></div>' +
      '</main></div>' +
      '<div class="toast" id="sf-toast"><svg class="ic"><use href="#i-arrow"/></svg><span></span></div>';

    view = document.getElementById('view');

    // nav filtrada por rol
    var nav = document.getElementById('nav');
    NAV.forEach(function (n) {
      if (r.nav.indexOf(n[0]) < 0) return;
      var b = el('<button class="nav-item" data-key="' + n[0] + '" title="' + n[1] + '">' + ico(n[2]) + '<span>' + n[1] + '</span></button>');
      b.onclick = function () { location.hash = '#/' + n[0]; };
      nav.appendChild(b);
    });
    if (r.nav.indexOf('portal-family') >= 0) {
      var pf = el('<button class="nav-item" data-key="portal-family" title="Portal Family">' + ico('family') + '<span>Portal Family</span></button>');
      pf.onclick = function () { location.hash = '#/portal-family'; };
      nav.appendChild(pf);
    }

    // selector de rol
    var sel = document.getElementById('role');
    Object.keys(SF.ROLES).forEach(function (k) { sel.appendChild(el('<option value="' + k + '"' + (k === SF.store.role() ? ' selected' : '') + '>' + SF.ROLES[k].label + '</option>')); });
    /* Cambiar de rol es entrar como otra persona: pasa por recepción otra vez,
       y así se ve la entrada de cada rol al enseñar la plataforma. */
    sel.onchange = function () { SF.store.setRole(sel.value); renderShell(); location.hash = defaultRoute(); render(); recepcion(); };

    var gs = document.getElementById('gsearch');
    /* El buscador tiene que responder a las TRES formas de usarlo: pulsar
       Enter, hacer clic en la lupa, y simplemente escribir. Antes solo
       funcionaba el Enter, y la lupa era un dibujo sin acción. */
    function goSearch() {
      if (!gs) return;
      var q = gs.value.trim();
      if (!q) { gs.focus(); return; }
      SF._q = q;
      /* Cambiar el hash al mismo valor no dispara 'hashchange', así que si ya
         estamos en resultados hay que repintar a mano o la búsqueda se pierde. */
      if (location.hash === '#/buscar') render();
      else location.hash = '#/buscar';
    }
    if (gs) {
      gs.addEventListener('keydown', function (e) { if (e.key === 'Enter') goSearch(); });
      /* Al escribir, si ya estás viendo resultados, se van afinando solos.
         Con un respiro de 250 ms para no repintar en cada tecla. */
      var gsT = null;
      gs.addEventListener('input', function () {
        if (location.hash !== '#/buscar') return;
        clearTimeout(gsT);
        gsT = setTimeout(function () { SF._q = gs.value.trim(); render(); }, 250);
      });
    }

    var gsGo = document.getElementById('gsearch-go');
    if (gsGo) gsGo.onclick = goSearch;
    var bell = document.getElementById('bell');
    if (bell) bell.onclick = function () { location.hash = '#/mis-avisos'; };

    var tnew = document.getElementById('tnew');
    if (tnew) tnew.onclick = function () { location.hash = '#/jugadores'; setTimeout(function () { var b = document.getElementById('nuevo'); if (b) b.click(); }, 60); };

    render();
  }

  function render() {
    if (!view) return;
    var p = parse();
    if (!p.route) { location.hash = defaultRoute(); return; }
    var r = SF.perms();   // permisos efectivos, no solo los del rol
    var navKey = NAV_OF[p.route] || p.route;
    // control de acceso por rol
    if (!canAccess(p.route, r)) {
      var dr = defaultRoute();
      if (location.hash !== dr) { location.hash = dr; }
      else if (view) { view.innerHTML = '<div class="empty-panel"><p>Tu rol no tiene acceso a esta sección.</p></div>'; }
      return;
    }

    var fn = SF.pages[ROUTE_PAGE[p.route]];
    if (!fn) { view.innerHTML = '<div class="empty-panel"><p>Sección no encontrada.</p></div>'; return; }

    // pasar query global a jugadores
    if (p.route === 'jugadores' && SF._jugQuery) { /* handled in page via closure variable */ }
    view.innerHTML = '';
    try { fn(view, p.param); } catch (e) { view.innerHTML = '<div class="empty-panel"><p>Error al pintar la sección.</p></div>'; console.error(e); }

    document.querySelectorAll('.nav-item').forEach(function (b) { b.classList.toggle('active', b.dataset.key === navKey); });
    view.scrollTop = 0;
  }

  /* ¿Ya ha pasado por recepción en esta sesión con este rol?
     sessionStorage, no localStorage: queremos "una vez cada vez que abre la
     plataforma", no "una vez en la vida". Si el navegador lo bloquea,
     tiramos de memoria y como mucho se ve una vez de más. */
  var welMem = {};
  function welVisto(k) {
    try { return sessionStorage.getItem('sf_wel_' + k) === '1'; } catch (e) { return !!welMem[k]; }
  }
  function welMarcar(k) {
    try { sessionStorage.setItem('sf_wel_' + k, '1'); } catch (e) { welMem[k] = true; }
  }
  function recepcion() {
    var k = SF.store.role();
    if (welVisto(k) || typeof SF.welcome !== 'function') return;
    welMarcar(k);
    SF.welcome(function () { render(); });   // repinta al entrar, con datos frescos
  }

  function start(mount) {
    root = mount;
    window.addEventListener('hashchange', render);
    renderShell();
    if (!location.hash) location.hash = defaultRoute();
    recepcion();
  }

  return { start: start, render: render, renderShell: renderShell };
})();

</script>
  <script>
/* js/app.js */
/* Arranque de la app */
(function () {
  // inyecta el sprite de iconos
  var s = document.createElement('div'); s.innerHTML = SF.SPRITE; document.body.appendChild(s.firstChild);
  // arranca el router en el contenedor raíz
  SF.router.start(document.getElementById('app-root'));
})();

</script>
