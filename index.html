    /* Informes: SOLO los que el staff haya publicado. Un informe escrito no
       aparece hasta que alguien lo publica a propósito. (Decisión de producto) */
    b.appendChild(el('<p class="ph-sec">Informes</p>'));
    var reps = (p.reports || []).filter(function (r) { return r.published; });
    if (!reps.length) {
      b.appendChild(el('<p class="hint">El club aún no ha publicado ningún informe.</p>'));
    } else {
      reps.slice().sort(function (a, c) { return (c.date || '').localeCompare(a.date || ''); }).forEach(function (r) {
        var card = el('<div class="ph-report"><b>' + esc(r.title) + '</b>' +
          '<span class="hint">' + fmtDate(r.date) + ' · ' + esc(r.author || '') + '</span>' +
          '<p>' + esc(r.body) + '</p></div>');
        b.appendChild(card);
      });
    }

    /* Mis autorizaciones (RGPD). Hay que RESPONDER, no hay que ACEPTAR:
       el "no" es una respuesta válida y no bloquea nada. Revocable siempre. */
    b.appendChild(el('<p class="ph-sec">Mis autorizaciones</p>'));
    var cs = p.consents || {};
    [
      { k: 'imagen_publica', label: 'Uso de imagen',
        desc: 'El club puede publicar imágenes y vídeos donde aparezca ' + esc(p.first_name || p.full_name) +
              ' en su página web, sus redes sociales y en medios de comunicación, para difundir la actividad deportiva del club.' },
      { k: 'comunicaciones', label: 'Comunicaciones del club',
        desc: 'Recibir avisos de entrenamientos, horarios, partidos y convocatorias.' }
    ].forEach(function (c) {
      var v = cs[c.k];
      var box = el('<div class="ph-consent"><b>' + c.label + '</b><p>' + c.desc + '</p></div>');
      var row = el('<div class="ph-yn"></div>');
      [['si', 'SÍ autorizo', true], ['no', 'NO autorizo', false]].forEach(function (o) {
        var on = (v === o[2]);
        var btn = el('<button class="ph-btn yn' + (on ? ' on' : '') + '">' + o[1] + '</button>');
        btn.onclick = function () {
          var nc = Object.assign({}, p.consents || {}); nc[c.k] = o[2];
          SF.store.update(p.id, { consents: nc });
          U.toast(o[2] ? 'Autorización registrada' : 'Registrado: no autorizas');
          SF.router.render();
        };
        row.appendChild(btn);
      });
      box.appendChild(row);
      box.appendChild(el('<p class="hint">' + (v === undefined || v === null
        ? 'Sin responder. Es obligatorio contestar, pero puedes decir que no: tu respuesta no afecta a la inscripción ni a la participación.'
        : 'Puedes cambiar esta decisión cuando quieras, sin dar explicaciones.') + '</p>'));
      b.appendChild(box);
    });

    view.appendChild(phone);
  };

  /* ===================== STAFF =====================
     Ficha profesional de quien trabaja con jugadores.
     Quién edita qué:
       - Su currículum, titulación y experiencia -> el propio interesado
       - Licencia federativa y habilitación       -> SOLO administración/dirección
     Si cada uno pudiera marcarse su habilitación, la ficha no acreditaría nada. */
  function roleLabel(r) { return (SF.ROLES[r] || {}).label || r; }
  function isAdminRole() { return ['director', 'administrativo'].indexOf(SF.store.role()) >= 0; }
  function canAssignTeams() { return !!(SF.ROLES[SF.store.role()] || {}).canManageTeams; }

  function staffBadge(s) {
    var st = SF.staffStatus(s);
    var cls = st.level === 'ok' ? 'tag-green' : (st.level === 'warn' ? 'tag-warn' : 'tag-danger');
    return '<span class="tag ' + cls + '">' + st.label + '</span>';
  }

  pages.staff = function (view, id) {
    if (id) return pages['staff-ficha'](view, id);   // #/staff/s1 -> ficha
    view.innerHTML = head('Staff', 'Cuerpo técnico y personal del club. Titulación, licencia y habilitación.');
    var all = SF.store.staff();

    /* Aviso arriba: lo que hay que resolver, no la lista entera. */
    var bad = all.filter(function (s) { return SF.staffStatus(s).level === 'bad'; });
    var warn = all.filter(function (s) { return SF.staffStatus(s).level === 'warn'; });

    /* Solicitudes de cambio pendientes: administración tiene que verlas
       nada más entrar, o el interesado se queda esperando sin saberlo. */
    var reqs = all.filter(function (s) { return !!s.unlock_request; });
    if (reqs.length && isAdminRole()) {
      var rq = el('<div class="empty-panel" style="text-align:left"></div>');
      rq.appendChild(el('<p class="sec-label" style="margin-top:0">Solicitudes de cambio de ficha</p>'));
      reqs.forEach(function (s) {
        var row = el('<div class="mini-row"><span><b>' + esc(s.full_name) + '</b> · <i>"' + esc(s.unlock_request.reason || '') + '"</i></span><span class="row-actions"><button class="lnk">Revisar</button></span></div>');
        row.querySelector('button').onclick = function () { location.hash = '#/staff/' + s.id; };
        rq.appendChild(row);
      });
      view.appendChild(rq);
    }

    if (bad.length || warn.length) {
      var al = el('<div class="empty-panel" style="text-align:left"></div>');
      al.appendChild(el('<p class="sec-label" style="margin-top:0">Habilitación del staff</p>'));
      bad.forEach(function (s) { al.appendChild(el('<p class="hint"><b>' + esc(s.full_name) + '</b> · sin comprobar para ' + SF.SEASON + ' — no puede trabajar con jugadores</p>')); });
      warn.forEach(function (s) { al.appendChild(el('<p class="hint"><b>' + esc(s.full_name) + '</b> · licencia federativa caducada</p>')); });
      al.appendChild(el('<p class="hint">' + (all.length - bad.length - warn.length) + ' de ' + all.length + ' al día.</p>'));
      view.appendChild(al);
    }

    var t = el('<table class="tbl"><thead><tr><th>Nº</th><th>Nombre</th><th>Función</th><th>Titulación</th><th>Equipos</th><th>Habilitación</th></tr></thead><tbody></tbody></table>');
    var tb = t.querySelector('tbody');
    all.forEach(function (s) {
      var teams = (s.team_ids || []).map(function (id) { var x = SF.store.teamGet(id); return x ? x.name : ''; }).filter(Boolean).join(', ');
      var lkS = (s.lock || {}).state || 'borrador';
      var lkTag = lkS === 'confirmada' ? '<span class="tag tag-gray">bloqueada</span>'
        : (lkS === 'desbloqueada' ? '<span class="tag tag-warn">desbloqueada</span>' : '<span class="tag tag-info">borrador</span>');
      var tr = el('<tr><td>' + SF.staffCode(s.num) + '</td><td><div class="tcell"><span class="av-sm">' + U.initials(s.full_name) + '</span>' + esc(s.full_name) + '</div></td><td>' + esc(roleLabel(s.role)) + '</td><td>' + esc(s.qualification || '—') + '</td><td>' + esc(teams || '—') + '</td><td>' + staffBadge(s) + ' ' + lkTag + '</td></tr>');
      tr.onclick = function () { location.hash = '#/staff/' + s.id; };
      tb.appendChild(tr);
    });
    view.appendChild(t);
  };

  pages['mi-ficha'] = function (view) {
    var me = SF.store.staffMe();
    if (!me) { view.innerHTML = head('Mi ficha', '') + '<div class="empty-panel"><p>Tu rol todavía no tiene ficha de staff creada.</p></div>'; return; }
    pages['staff-ficha'](view, me.id, true);
  };

  pages['staff-ficha'] = function (view, id, mine) {
    var s = SF.store.staffGet(id);
    if (!s) { view.innerHTML = head('Staff', '') + '<div class="empty-panel"><p>Ficha no encontrada.</p></div>'; return; }
    var st = SF.staffStatus(s);
    var me = SF.store.staffMe();
    var isMine = mine || (me && me.id === s.id);
    var canEditOfficial = isAdminRole();           // licencia y habilitación

    /* CANDADO DE LA FICHA.
       borrador     -> el interesado la rellena libremente
       confirmada   -> la ha dado por buena: queda bloqueada
       desbloqueada -> administración ha autorizado un cambio puntual;
                       al guardar se vuelve a bloquear sola.
       Administración y dirección pueden editar siempre, y queda registrado. */
    var lk = s.lock || { state: 'borrador' };
    var bloqueada = lk.state === 'confirmada';
    var canEditPro = isAdminRole() || (isMine && !bloqueada);

    /* Guardar del interesado: si estaba desbloqueada, se vuelve a cerrar. */
    function saveProfile(patch, action) {
      if (!isAdminRole() && lk.state === 'desbloqueada') {
        patch = Object.assign({}, patch, {
          lock: { state: 'confirmada', confirmed_at: new Date().toISOString().slice(0, 10), confirmed_by: s.full_name }
        });
        action = (action || 'Cambio') + ' · la ficha se vuelve a bloquear';
      }
      SF.store.staffUpdate(s.id, patch, action);
      U.toast('Guardado'); SF.router.render();
    }

    view.innerHTML = head(mine ? 'Mi ficha' : 'Ficha de staff', SF.staffCode(s.num) + ' · ' + roleLabel(s.role));

    // Cabecera
    var hd = el('<div class="ficha-head"><div class="fh-photo">' + U.initials(s.full_name) + '</div><div class="fh-info"></div></div>');
    hd.querySelector('.fh-info').innerHTML =
      '<h2>' + esc(s.full_name) + '</h2>' +
      '<p class="fh-sub"><b>' + SF.staffCode(s.num) + '</b> · ' + esc(roleLabel(s.role)) + (s.email ? ' · ' + esc(s.email) : '') + (s.phone ? ' · ' + esc(s.phone) : '') + '</p>' +
      '<p>' + staffBadge(s) + (st.why ? ' <span class="hint">' + esc(st.why) + '</span>' : '') + '</p>';
    view.appendChild(hd);

    /* ---- Estado del candado y sus acciones ---- */
    var lockBox = el('<div class="empty-panel" style="text-align:left"></div>');
    if (lk.state === 'borrador') {
      lockBox.appendChild(el('<p class="hint"><b>Ficha en borrador.</b> Puedes rellenarla y modificarla libremente. Cuando esté completa, confírmala: a partir de ahí quedará bloqueada y cualquier cambio necesitará autorización del club.</p>'));
      if (isMine) {
        var bconf = el('<button class="btn btn-primary btn-sm">' + ico('shield') + 'Confirmar ficha y bloquear</button>');
        bconf.onclick = function () {
          if (!confirm('Al confirmar, la ficha queda bloqueada. Para cambiar algo tendrás que pedir autorización a administración. ¿Confirmas?')) return;
          SF.store.staffUpdate(s.id, { lock: { state: 'confirmada', confirmed_at: new Date().toISOString().slice(0, 10), confirmed_by: s.full_name } }, 'Ficha confirmada y bloqueada por el interesado');
          U.toast('Ficha confirmada'); SF.router.render();
        };
        lockBox.appendChild(bconf);
      }
    } else if (bloqueada) {
      lockBox.appendChild(el('<p class="hint"><b>Ficha confirmada y bloqueada</b> el ' + (lk.confirmed_at ? fmtDate(lk.confirmed_at) : '—') + '. Cualquier cambio requiere autorización de administración o dirección.</p>'));
      if (s.unlock_request) {
        lockBox.appendChild(el('<p class="hint">Solicitud de cambio pendiente · ' + fmtDate((s.unlock_request.at || '').slice(0, 10)) + ' · <i>"' + esc(s.unlock_request.reason || '') + '"</i></p>'));
      }
      if (isMine && !s.unlock_request) {
        var breq = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Solicitar autorización para cambiar</button>');
        breq.onclick = function () {
          U.modal('Solicitar cambio', smallForm([{ name: 'reason', label: '¿Qué necesitas cambiar y por qué?', type: 'textarea' }], {},
            function (d) {
              SF.store.staffUpdate(s.id, { unlock_request: { at: new Date().toISOString(), by: s.full_name, reason: d.reason } }, 'Solicita autorización para modificar: ' + (d.reason || ''));
              U.toast('Solicitud enviada al club'); SF.router.render();
            }));
        };
        lockBox.appendChild(breq);
      }
      if (isAdminRole()) {
        var bunl = el('<button class="btn btn-primary btn-sm">' + ico('shield') + (s.unlock_request ? 'Autorizar el cambio' : 'Desbloquear para edición') + '</button>');
        bunl.onclick = function () {
          SF.store.staffUpdate(s.id, {
            lock: { state: 'desbloqueada', unlocked_at: new Date().toISOString().slice(0, 10), unlocked_by: SF.store.me().name, reason: (s.unlock_request || {}).reason || '' },
            unlock_request: null
          }, 'Autorizado un cambio' + ((s.unlock_request || {}).reason ? ': ' + s.unlock_request.reason : ''));
          U.toast('Ficha desbloqueada'); SF.router.render();
        };
        lockBox.appendChild(bunl);
        if (s.unlock_request) {
          var brej = el('<button class="btn btn-light btn-sm">Rechazar</button>');
          brej.onclick = function () { SF.store.staffUpdate(s.id, { unlock_request: null }, 'Solicitud de cambio rechazada'); U.toast('Solicitud rechazada'); SF.router.render(); };
          lockBox.appendChild(brej);
        }
      }
    } else if (lk.state === 'desbloqueada') {
      lockBox.appendChild(el('<p class="hint"><b>Desbloqueada</b> por ' + esc(lk.unlocked_by || 'el club') + ' el ' + (lk.unlocked_at ? fmtDate(lk.unlocked_at) : '—') + (lk.reason ? ' · <i>"' + esc(lk.reason) + '"</i>' : '') + '.<br>Al guardar un cambio, la ficha se volverá a bloquear automáticamente.</p>'));
    }
    view.appendChild(lockBox);

    if (canEditPro) {
      var bph = el('<div class="row-c"><button class="btn btn-light btn-sm">' + ico('camera') + 'Foto de la ficha</button><button class="btn btn-light btn-sm">' + ico('file') + (s.cv_file ? 'Cambiar CV (PDF)' : 'Subir CV (PDF)') + '</button></div>');
      var bs = bph.querySelectorAll('button');
      bs[0].onclick = function () { U.toast('Abriría la cámara o la galería'); };
      bs[1].onclick = function () { U.toast('Subiría el PDF a un almacén privado'); };
      view.appendChild(bph);
      if (s.cv_file) view.appendChild(el('<p class="hint">CV actual: ' + esc(s.cv_file) + '</p>'));
    }

    function sec(label) { view.appendChild(el('<p class="sec-label">' + label + '</p>')); }
    function fld(l, v) { return '<div class="field"><span class="f-lab">' + l + '</span><span class="f-val">' + (v ? esc(String(v)) : '—') + '</span></div>'; }

    /* --- Permisos particulares de esta persona.
       Nadie debe tener un permiso extra sin saber que lo tiene, ni hasta cuándo. */
    var misPerm = SF.store.userPermsActive(s.id);
    if (misPerm.length) {
      sec('Permisos particulares');
      var pl = el('<div class="mini-list"></div>');
      misPerm.forEach(function (x) {
        var dias = Math.round((new Date(x.until) - new Date(new Date().toISOString().slice(0, 10))) / 86400000);
        pl.appendChild(el('<div class="mini-row"><span><b>' + esc(SF.permLabel(x.perm)) + '</b><br>' +
          '<span class="hint">Hasta ' + fmtDate(x.until) + (dias <= 30 ? ' · <b>caduca en ' + dias + ' días</b>' : '') +
          ' · concedido por ' + esc(x.granted_by) + '<br><i>"' + esc(x.reason) + '"</i></span></span></div>'));
      });
      view.appendChild(pl);
      view.appendChild(el('<p class="hint">Estos permisos se suman a los del rol y caducan solos en la fecha indicada. Los concede la dirección del club.</p>'));
    }

    // --- Currículum y titulación (lo edita el interesado)
    sec('Titulación y currículum');
    view.appendChild(el('<div class="field-grid">' +
      fld('Titulación', s.qualification) + fld('Entidad', s.qual_entity) +
      fld('Año', s.qual_year) + fld('Nº de título', s.qual_number) +
      fld('Idiomas', s.languages) + '</div>'));
    if (s.bio) view.appendChild(el('<p class="hint">' + esc(s.bio) + '</p>'));
    if (canEditPro) {
      var be = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Editar</button>');
      be.onclick = function () {
        U.modal('Titulación y currículum', smallForm([
          { name: 'qualification', label: 'Titulación' }, { name: 'qual_entity', label: 'Entidad' },
          { name: 'qual_year', label: 'Año', type: 'number' }, { name: 'qual_number', label: 'Nº de título' },
          { name: 'languages', label: 'Idiomas' }, { name: 'bio', label: 'Presentación', type: 'textarea' }
        ], s, function (d) { saveProfile(d, 'Editada la titulación / currículum'); }));
      };
      view.appendChild(be);
    } else if (isMine) {
      view.appendChild(el('<p class="hint">Ficha bloqueada: para cambiar estos datos, pide autorización arriba.</p>'));
    }

    // --- Experiencia
    sec('Experiencia');
    var ex = (s.experience || []);
    if (!ex.length) view.appendChild(el('<p class="hint">Sin experiencia registrada.</p>'));
    var exl = el('<div class="mini-list"></div>');
    ex.forEach(function (e, i) {
      var row = el('<div class="mini-row"><span><b>' + esc(e.club) + '</b> · ' + esc(e.role || '') + (e.category ? ' · ' + esc(e.category) : '') + '</span><span class="hint">' + esc(e.from || '') + (e.to ? ' — ' + esc(e.to) : ' — actualidad') + '</span></div>');
      if (canEditPro) {
        var del = el('<button class="lnk-del">' + ico('x') + '</button>');
        del.onclick = function () { var a = ex.slice(); a.splice(i, 1); saveProfile({ experience: a }, 'Eliminada una etapa de experiencia: ' + (e.club || '')); };
        row.appendChild(del);
      }
      exl.appendChild(row);
    });
    view.appendChild(exl);
    if (canEditPro) {
      var bx = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir etapa</button>');
      bx.onclick = function () {
        U.modal('Añadir experiencia', smallForm([
          { name: 'club', label: 'Club o entidad' }, { name: 'role', label: 'Cargo' },
          { name: 'category', label: 'Categoría' }, { name: 'from', label: 'Desde (temporada)' }, { name: 'to', label: 'Hasta (temporada)' }
        ], {}, function (d) { saveProfile({ experience: (s.experience || []).concat([d]) }, 'Añadida experiencia: ' + (d.club || '')); }));
      };
      view.appendChild(bx);
    }

    // --- Licencia federativa (solo administración)
    sec('Licencia federativa');
    var l = s.licence || {};
    if (l.status === 'no_aplica' || !l.status) view.appendChild(el('<p class="hint">No aplica a esta función.</p>'));
    else view.appendChild(el('<div class="field-grid">' + fld('Número', l.number) + fld('Temporada', l.season) +
      fld('Categoría habilitada', l.category) + fld('Vigente hasta', l.valid_until ? fmtDate(l.valid_until) : '') +
      fld('Estado', l.status) + '</div>'));
    if (canEditOfficial) {
      var bl = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Actualizar licencia</button>');
      bl.onclick = function () {
        U.modal('Licencia federativa', smallForm([
          { name: 'number', label: 'Número de licencia' }, { name: 'season', label: 'Temporada' },
          { name: 'category', label: 'Categoría habilitada' }, { name: 'valid_until', label: 'Vigente hasta', type: 'date' },
          { name: 'status', label: 'Estado', type: 'select', options: ['en_tramite', 'vigente', 'caducada', 'no_aplica'] }
        ], l, function (d) { SF.store.staffUpdate(s.id, { licence: d }, 'Actualizada la licencia federativa'); U.toast('Licencia actualizada'); SF.router.render(); }));
      };
      view.appendChild(bl);
    } else view.appendChild(el('<p class="hint">La licencia la registra administración del club.</p>'));

    // --- Habilitación para trabajar con menores
    sec('Habilitación para trabajar con jugadores');
    var c = s.clearance || {};
    view.appendChild(el('<div class="field-grid">' +
      fld('Temporada', c.season) +
      fld('Habilitado', c.cleared && c.season === SF.SEASON ? 'Sí' : 'No') +
      fld('Comprobado el', c.checked_on ? fmtDate(c.checked_on) : '') +
      fld('Comprobado por', c.checked_by) + '</div>'));
    view.appendChild(el('<p class="hint">La app <b>no guarda el certificado</b>: solo registra que administración lo comprobó y para qué temporada. La documentación la custodia el club.</p>'));
    if (canEditOfficial) {
      var bc = el('<button class="btn btn-light btn-sm">' + ico('shield') + 'Registrar comprobación</button>');
      bc.onclick = function () {
        U.modal('Habilitación ' + SF.SEASON, smallForm([
          { name: 'cleared', label: '¿Puede trabajar con jugadores esta temporada?', type: 'select', options: ['Sí', 'No'] },
          { name: 'checked_on', label: 'Fecha de comprobación', type: 'date' },
          { name: 'checked_by', label: 'Comprobado por' }
        ], { cleared: c.cleared ? 'Sí' : 'No', checked_on: c.checked_on, checked_by: c.checked_by || SF.store.me().name },
          function (d) {
            SF.store.staffUpdate(s.id, { clearance: { season: SF.SEASON, cleared: d.cleared === 'Sí', checked_on: d.checked_on, checked_by: d.checked_by } },
              'Habilitación ' + SF.SEASON + ': ' + (d.cleared === 'Sí' ? 'puede trabajar con jugadores' : 'NO habilitado'));
            U.toast('Habilitación registrada'); SF.router.render();
          }));
      };
      view.appendChild(bc);
    } else view.appendChild(el('<p class="hint">Solo administración puede registrarla.</p>'));

    // --- Equipos asignados (lo hace dirección técnica)
    sec('Equipos asignados');
    var teams = SF.store.teams();
    var asg = (s.team_ids || []);
    if (!asg.length) view.appendChild(el('<p class="hint">Sin equipos asignados.</p>'));
    var tl = el('<div class="mini-list"></div>');
    asg.forEach(function (tid) {
      var tt = SF.store.teamGet(tid); if (!tt) return;
      var row = el('<div class="mini-row"><span><b>' + esc(tt.name) + '</b> · ' + esc(tt.category || '') + '</span></div>');
      if (canAssignTeams()) {
        var q = el('<button class="lnk-del">' + ico('x') + '</button>');
        q.onclick = function () { SF.store.staffAssign(s.id, tid, false); U.toast('Quitado del equipo'); SF.router.render(); };
        row.appendChild(q);
      }
      tl.appendChild(row);
    });
    view.appendChild(tl);
    if (canAssignTeams()) {
      var libres = teams.filter(function (tt) { return asg.indexOf(tt.id) < 0; });
      if (libres.length) {
        var ba = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Asignar a un equipo</button>');
        ba.onclick = function () {
          var box = el('<div class="mini-list"></div>');
          libres.forEach(function (tt) {
            var r = el('<button class="mini-row" style="width:100%;text-align:left;cursor:pointer"><span><b>' + esc(tt.name) + '</b> · ' + esc(tt.category || '') + '</span></button>');
            r.onclick = function () { SF.store.staffAssign(s.id, tt.id, true); U.closeModal(); U.toast('Asignado a ' + tt.name); SF.router.render(); };
            box.appendChild(r);
          });
          U.modal('Asignar ' + s.full_name + ' a un equipo', box);
        };
        view.appendChild(ba);
      }
    } else view.appendChild(el('<p class="hint">La asignación a equipos la hace la dirección técnica.</p>'));

    /* --- Historial de cambios.
       Es lo que da valor al candado: una ficha bloqueada sin registro de
       quién la tocó y cuándo no acredita nada. No se puede borrar. */
    sec('Historial de cambios');
    var hist = (s.history || []).slice().reverse();
    if (!hist.length) view.appendChild(el('<p class="hint">Sin cambios registrados todavía.</p>'));

  /* ===================== PORTAL JUGADOR (mobile) =====================
     La edad se CALCULA, no se guarda: cambia sola el día del cumpleaños.
     - MENOR: vista corta. Sus datos, su equipo, citas y avisos. Nada más:
       ni pagos, ni documentación, ni informes, ni valoraciones.
     - MAYOR de 18: ve lo mismo que su familia, pero sobre sí mismo.
     Sin fecha de nacimiento se trata como menor (opción protectora). */
  function playerAge(p) {
    if (!p.birth_date) return null;
    var b = new Date(p.birth_date), t = new Date();
    var a = t.getFullYear() - b.getFullYear();
    var m = t.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
    return a;
  }
  function playerIsAdult(p) { var a = playerAge(p); return a != null && a >= 18; }

    }

    view.innerHTML = head('Portal Jugador', 'Vista del jugador menor de edad (mobile-first).');
    var sel = el('<div class="empty-panel" style="margin-bottom:14px"><p><b>' + esc(p.full_name) + ' · ' +

    var phone = el('<div class="phone"><div class="phone-top"><img src="' + SF.LOGO + '" alt="" class="ph-logo"><span>ScoutFlow</span></div><div class="phone-body"></div></div>');
    var b = phone.querySelector('.phone-body');

    b.appendChild(el('<div class="ph-hero"><div class="ph-photo">' + U.initials(p.full_name) + '</div><div><div class="ph-name">' + esc(p.full_name) + '</div><div class="ph-sub">' + (t ? esc(t.name) : 'Sin equipo') + '</div></div></div>'));

      if (nm) b.appendChild(el('<div class="ph-pay"><b>Partido · ' + esc(nm.opponent || 'rival') + '</b><span>' + fmtDate(nm.date) + (nm.time ? ' · ' + nm.time : '') + (nm.place ? ' · ' + esc(nm.place) : '') + '</span></div>'));
    } else b.appendChild(el('<p class="hint">Sin equipo asignado.</p>'));

    /* Avisos del club: en un solo sentido. No es un chat y no ve a nadie más.
       Salen del tablón real, no del muro del equipo. */

    jAnns.slice(0, 6).forEach(function (a) {

      var ai = a.status === 'Inscrito' ? 0 : 1, bi = b.status === 'Inscrito' ? 0 : 1;

      return (a.full_name || '').localeCompare(b.full_name || '');
    });
    var box = el('<div></div>');

    box.appendChild(search);
    var list = el('<div class="mini-list add-list"></div>');
    if (!candidates.length) list.appendChild(el('<p class="hint">No hay más jugadores con ficha para añadir.</p>'));

      var tag = p.status === 'Inscrito' ? '<span class="tag tag-green">Inscrito</span>' : '<span class="tag tag-gray">' + esc(p.status) + '</span>';
      var other = (p.team_id && p.team_id !== t.id) ? ' · <span class="hint">en ' + esc((SF.store.teamGet(p.team_id) || {}).name || 'otro equipo') + '</span>' : '';

      list.appendChild(row);
    });

      var q = search.value.trim().toLowerCase(), vis = 0;

  /* ── Calendario del equipo: entrenamientos y partidos ── */
  var SF_DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var SF_MON = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  function fmtDate(d) { var x = new Date(d + 'T00:00:00'); if (isNaN(x.getTime())) return d; return SF_DOW[x.getDay()] + ' ' + x.getDate() + ' ' + SF_MON[x.getMonth()]; }
  function teamEventsSorted(t, type) { return (t.events || []).filter(function (e) { return !type || e.type === type; }).sort(function (a, b) { return (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')); }); }
  function teamUpcoming(t, type) { var today = new Date().toISOString().slice(0, 10); return teamEventsSorted(t, type).filter(function (e) { return e.date >= today; }); }
  function eventDesc(ev) {
    if (ev.type === 'partido') return 'vs ' + esc(ev.opponent || 'rival') + ' · ' + fmtDate(ev.date) + (ev.time ? ' · ' + ev.time : '') + (ev.place ? ' · ' + esc(ev.place) : '') + (ev.competition ? ' · ' + esc(ev.competition) : '');
    return fmtDate(ev.date) + (ev.time ? ' · ' + ev.time : '') + (ev.place ? ' · ' + esc(ev.place) : '') + (ev.note ? ' · ' + esc(ev.note) : '');
  }
  function attendanceModal(t, ev, onDone) {
    var roster = SF.store.players().filter(function (p) { return p.team_id === t.id; });
    var marks = Object.assign({}, ev.attendance || {});
    var box = el('<div></div>');
    box.appendChild(el('<p class="hint">' + (ev.type === 'partido' ? 'Partido vs ' + esc(ev.opponent || '') : 'Entrenamiento') + ' · ' + fmtDate(ev.date) + (ev.time ? ' · ' + ev.time : '') + '</p>'));
    if (!roster.length) box.appendChild(el('<p class="hint">Este equipo aún no tiene jugadores en la plantilla.</p>'));
    var list = el('<div class="att-list"></div>');
    var counter = el('<p class="hint att-count"></p>');
    function refreshCount() {
      var pr = roster.filter(function (p) { return marks[p.id] === 'presente'; }).length;
      counter.innerHTML = '<b>' + pr + '</b> de ' + roster.length + ' presentes';
    }
    roster.forEach(function (p) {
      var row = el('<div class="att-row"><span class="att-name">' + esc(p.full_name) + '</span><span class="att-btns"></span></div>');
      var btns = row.querySelector('.att-btns');
      [['presente', 'Sí'], ['ausente', 'No'], ['justificado', 'Just.']].forEach(function (o) {
        var bt = el('<button class="att-b att-' + o[0] + (marks[p.id] === o[0] ? ' on' : '') + '">' + o[1] + '</button>');
        bt.onclick = function () {
          marks[p.id] = o[0];
          Array.prototype.forEach.call(btns.children, function (c) { c.classList.remove('on'); });
          bt.classList.add('on'); refreshCount();
        };
        btns.appendChild(bt);
      });
      list.appendChild(row);
    });
    box.appendChild(list); box.appendChild(counter); refreshCount();
    var quick = el('<button class="btn btn-light btn-sm">Marcar todos presentes</button>');
    quick.onclick = function () {
      roster.forEach(function (p) { marks[p.id] = 'presente'; });

        Array.prototype.forEach.call(bs.children, function (c, i) { c.classList.toggle('on', i === 0); });
      });
      refreshCount();
    };
    box.appendChild(quick);

    foot.children[0].onclick = U.closeModal;

    box.appendChild(foot);
    U.modal('Pasar lista — ' + esc(t.name), box);

  /* ===================== MI EQUIPO (portada del entrenador) =====================
     Una sola pantalla con lo del día: la próxima cita y quién falta por
     confirmar, quién no puede jugar, pasar lista y avisar. Sin menús.
     Si el entrenador tiene que buscar dónde está cada cosa, vuelve a WhatsApp. */
  function annComposer(t, roster, preset, onSent) {
    var sel = {};                                   // player_id -> true
    (preset && preset.players || []).forEach(function (id) { sel[id] = true; });
    var box = el('<div></div>');
    var f = el('<div class="form-grid">' +
      '<div class="frow"><label>Título</label><input id="ti" placeholder="Cambio de horario del sábado"></div>' +
      '<div class="frow"><label>Mensaje</label><textarea id="bo" rows="3" placeholder="El partido se adelanta a las 10:00."></textarea></div>' +
      '<div class="frow"><label><input type="checkbox" id="rs"' + (preset && preset.rsvp ? ' checked' : '') + '> Pedir confirmación de asistencia</label></div></div>');
    if (preset && preset.title) f.querySelector('#ti').value = preset.title;
    if (preset && preset.body) f.querySelector('#bo').value = preset.body;
    box.appendChild(f);

  /* Equipos que este rol puede dirigirse. El alcance sale del rol:
     la DT de femenino solo alcanza equipos femeninos, y se detecta sola. */
  function scopeTeams() {
    var r = SF.store.role(), all = SF.store.teams();
    if (['director', 'dt_general', 'administrativo'].indexOf(r) >= 0) return all;
    var seg = { dt_femenino: 'femenino', dt_masculino: 'masculino', dt_escuelas: 'escuelas', dt_minis: 'minis' }[r];
    if (seg) return all.filter(function (t) { return t.segment === seg; });
    return myTeams();
  }

  /* ===================== IMPORTAR DATOS DE PARTIDO =====================
     Power BI NO es la fuente: es el final del recorrido. Se importa lo que
     hay detrás (el Excel o la exportación de la app de anotación) en CSV.
     La clave de cruce es el NÚMERO DE FICHA: con dos "Diego Romero" en el
     club, cruzar por nombre falla el primer día. */
  function parseCSV(text) {
    var lines = text.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim(); });
    if (!lines.length) return { head: [], rows: [] };

    /* Se detecta UN separador y se usa solo ese. Es clave: las actas de la
       federación traen los nombres como "RÍOS, MARTÍN", y si se partiera
       también por comas, el nombre se rompería en dos y descuadraría toda
       la fila. Prioridad: tabulador (copiado de web/Excel) > ; > , */
    var h0 = lines[0];
    var sep = h0.indexOf('\t') >= 0 ? '\t' : (h0.indexOf(';') >= 0 ? ';' : ',');

    function split(l) {
      var out = [], cur = '', q = false;
      for (var i = 0; i < l.length; i++) {
        var ch = l[i];
        if (ch === '"') { q = !q; continue; }
        if (ch === sep && !q) { out.push(cur.trim()); cur = ''; continue; }
        cur += ch;
      }
      out.push(cur.trim()); return out;
    }
    var head = split(lines[0]).map(function (h) { return h.toLowerCase(); });
    return { head: head, rows: lines.slice(1).map(split) };
  }

  /* 'local' permite el rendimiento en casa / fuera que pide el staff.
     Se guarda SIEMPRE por partido, nunca la media: con la media se pierde
     para siempre la posibilidad de filtrar por rival, casa o competición. */
  var CSV_EJEMPLO = 'ficha,fecha,rival,competicion,local,dorsal,minutos,puntos,rebotes,asistencias,valoracion\n' +
    'J-0002,2026-11-15,CB Estudiantes,Liga Cadete FBM,si,7,24,14,7,3,18\n' +
    'J-0003,2026-11-15,CB Estudiantes,Liga Cadete FBM,si,4,18,9,2,5,11\n' +
    'J-0004,2026-11-22,Real Canoe,Liga Cadete FBM,no,12,27,21,11,1,26';

  /* Importador reutilizable. Se usa en dos sitios:
       - Menú "Importar datos": hay que elegir equipo (o ninguno)
       - Dentro de un equipo: el equipo ya se sabe, así que el DORSAL basta
         para identificar a cada jugador sin elegir nada. */
  function statsImport(view, presetTeam) {
    view.appendChild(el('<p class="hint">Puedes pegar una tabla <b>copiada de una web</b> (la de la federación, por ejemplo), un CSV o algo copiado de Excel.' +
      (presetTeam
        ? ' Se identifica a cada jugador por su <b>dorsal</b> dentro de este equipo, así que basta con pegar el acta.'
        : ' Para identificar a cada jugador vale la columna <b>ficha</b>, el <b>nombre</b> o el <b>dorsal</b> —eligiendo el equipo—.') +
      ' Las demás columnas se guardan tal cual, así que podéis medir lo que queráis.</p>'));

    /* Equipo de referencia: permite identificar por DORSAL, que es lo que trae
       el acta de la federación. Sin equipo, el dorsal 7 es ambiguo. */
    var teamSel = el('<div class="frow" style="max-width:420px' + (presetTeam ? ';display:none' : '') + '"><label>¿De qué equipo son estos datos?</label><select id="tsel"><option value="">— sin equipo (identificar por ficha o nombre) —</option>' +
      SF.store.teams().map(function (t) { return '<option value="' + t.id + '"' + (t.id === presetTeam ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') + '</select></div>');
    view.appendChild(teamSel);

    var ta = el('<textarea rows="7" placeholder="Pega aquí la tabla: copiada de una web, exportada a CSV o pegada desde Excel…" style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px"></textarea>');
    view.appendChild(ta);

    var tools = el('<div class="row-c"></div>');
    var bEj = el('<button class="btn btn-light btn-sm">Usar un ejemplo</button>');
    bEj.onclick = function () { ta.value = CSV_EJEMPLO; ta.dispatchEvent(new Event('input')); };
    var fileWrap = el('<label class="btn btn-light btn-sm" style="cursor:pointer">' + ico('upload') + 'Abrir archivo CSV<input type="file" accept=".csv,text/csv" style="display:none"></label>');
    fileWrap.querySelector('input').onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { ta.value = r.result; ta.dispatchEvent(new Event('input')); };
      r.readAsText(f);
    };
    tools.appendChild(bEj); tools.appendChild(fileWrap);
    view.appendChild(tools);

    var out = el('<div></div>'); view.appendChild(out);

    ta.addEventListener('input', function () {
      out.innerHTML = '';
      var txt = ta.value.trim(); if (!txt) return;
      var csv = parseCSV(txt);
      var teamId = teamSel.querySelector('#tsel').value;

      /* IDENTIFICACIÓN EN CASCADA. El acta de la federación no trae nuestro
         número de ficha, así que hay que reconocer al jugador por lo que sí
         trae: dorsal dentro de su equipo, o nombre.
           1. ficha          -> exacto, sin ambigüedad
           2. alias guardado -> lo que ya asignaste a mano una vez
           3. dorsal + equipo
           4. nombre normalizado (sin tildes y sin importar el orden) */
      var iF = csv.head.indexOf('ficha');
      var iN = ['nombre', 'jugador', 'jugadora', 'apellidos'].map(function (k) { return csv.head.indexOf(k); }).filter(function (i) { return i >= 0; })[0];
      var iD = csv.head.indexOf('dorsal');
      if (iF < 0 && iN == null && iD < 0) {
        out.appendChild(el('<div class="empty-panel"><p>No encuentro cómo identificar a los jugadores. La tabla debe traer al menos una columna <b>ficha</b>, <b>nombre</b> o <b>dorsal</b>.</p></div>'));
        return;
      }
      if (iD >= 0 && iF < 0 && iN == null && !teamId) {
        out.appendChild(el('<div class="empty-panel"><p>Con solo el dorsal hay que decir <b>de qué equipo</b> son los datos: el dorsal 7 existe en todos los equipos.</p></div>'));
        return;
      }

      function norm(s) {
        return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');
      }
      var players = SF.store.players();
      var aliases = SF.store.importAliases();
      var pool = teamId ? players.filter(function (p) { return p.team_id === teamId; }) : players;

      function findPlayer(r) {
        if (iF >= 0) {
          var raw = (r[iF] || '').toLowerCase().replace(/^j-?/, '').replace(/^0+(?=\d)/, '');
          var byF = players.filter(function (x) { return String(x.ficha) === raw; })[0];
          if (byF) return byF;
        }
        var nameRaw = iN != null ? r[iN] : '';
        if (nameRaw) {
          var key = (teamId ? teamId + '|' : '') + norm(nameRaw);
          if (aliases[key]) { var al = SF.store.get(aliases[key]); if (al) return al; }
        }
        if (iD >= 0 && teamId) {
          var d = String(r[iD] || '').trim();
          var byD = pool.filter(function (x) { return String(x.dorsal || '') === d && d !== ''; })[0];
          if (byD) return byD;
        }
        if (nameRaw) {
          var nn = norm(nameRaw);
          var byN = pool.filter(function (x) { return norm(x.full_name) === nn; })[0];
          if (byN) return byN;
          // Coincidencia parcial: todos los trozos del nombre del acta están en la ficha
          var parts = nn.split(' ');
          var cand = pool.filter(function (x) {
            var t = norm(x.full_name).split(' ');
            return parts.length >= 2 && parts.every(function (w) { return t.indexOf(w) >= 0; });
          });
          if (cand.length === 1) return cand[0];
        }
        return null;
      }

      var ok = [], bad = [];
      csv.rows.forEach(function (r, n) {
        var p = findPlayer(r);
        var metrics = {}, meta = {};
        csv.head.forEach(function (h, i) {
          if (h === 'ficha') return;
          var v = r[i];
          // Contexto del partido: no son métricas, son el "dónde y contra quién"
          if (['fecha', 'rival', 'competicion', 'competición', 'local', 'dorsal'].indexOf(h) >= 0) { meta[h] = v; return; }
          var num = parseFloat(String(v).replace(',', '.'));
          metrics[h] = isNaN(num) ? v : num;
        });
        if (p) ok.push({ p: p, meta: meta, metrics: metrics });
        else bad.push({ line: n + 2, row: r, etiqueta: (iN != null ? r[iN] : '') || (iF >= 0 ? r[iF] : '') || ('dorsal ' + (iD >= 0 ? r[iD] : '?')), meta: meta, metrics: metrics });
      });

      out.appendChild(el('<p class="sec-label">Vista previa</p>'));
      out.appendChild(el('<p class="hint"><b>' + ok.length + '</b> fila' + (ok.length === 1 ? '' : 's') + ' se importará' + (ok.length === 1 ? '' : 'n') +
        (bad.length ? ' · <b>' + bad.length + '</b> con ficha desconocida, se descartan' : '') + '</p>'));

      /* Filas sin reconocer: en vez de descartarlas, se asignan a mano UNA vez.
         La app recuerda la equivalencia y en las siguientes jornadas ya entra
         sola. Es lo que hace que importar el acta cada semana cueste segundos. */
      if (bad.length) {
        out.appendChild(el('<p class="sec-label">Sin identificar — asígnalos y los recordaré</p>'));
        var bl = el('<div class="mini-list"></div>');
        bad.forEach(function (b) {
          var row = el('<div class="mini-row"><span><b>' + esc(b.etiqueta) + '</b> <span class="hint">línea ' + b.line + '</span></span></div>');
          var sel = el('<select style="max-width:260px"><option value="">— ¿quién es? —</option>' +
            pool.map(function (p) { return '<option value="' + p.id + '">' + SF.fichaCode(p.ficha) + ' · ' + esc(p.full_name) + (p.dorsal ? ' (' + esc(p.dorsal) + ')' : '') + '</option>'; }).join('') + '</select>');
          sel.onchange = function () {
            if (!sel.value) return;
            var nameRaw = iN != null ? b.row[iN] : '';
            if (nameRaw) SF.store.importAliasSet((teamId ? teamId + '|' : '') + norm(nameRaw), sel.value);
            U.toast('Recordado para las próximas veces');
            ta.dispatchEvent(new Event('input'));
          };
          row.appendChild(sel);
          bl.appendChild(row);
        });
        out.appendChild(bl);
      }

      if (ok.length) {
        var cols = Object.keys(ok[0].metrics);
        var t = el('<table class="tbl"><thead><tr><th>Jugador</th><th>Fecha</th><th>Rival</th>' +
          cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody></tbody></table>');
        var tb = t.querySelector('tbody');
        ok.slice(0, 12).forEach(function (o) {
          tb.appendChild(el('<tr><td>' + SF.fichaCode(o.p.ficha) + ' · ' + esc(o.p.full_name) + '</td><td>' + esc(o.meta.fecha || '') + '</td><td>' + esc(o.meta.rival || '') + '</td>' +
            cols.map(function (c) { return '<td>' + esc(String(o.metrics[c])) + '</td>'; }).join('') + '</tr>'));
        });
        out.appendChild(t);

        var bImp = el('<button class="btn btn-primary btn-sm">' + ico('download') + 'Importar ' + ok.length + ' filas</button>');
        bImp.onclick = function () {
          ok.forEach(function (o) {
            /* Hay que releer al jugador en cada vuelta: si el CSV trae varios
               partidos del mismo, la referencia capturada al analizar el
               archivo está obsoleta y cada fila pisaría a la anterior.
               Con 5 partidos de un jugador solo entraba el último. */
            var actual = SF.store.get(o.p.id) || o.p;
            var prev = (actual.stats_games || []).slice();
            var loc = String(o.meta.local || '').toLowerCase();
            prev.push({
              id: 'g' + Date.now() + Math.random().toString(16).slice(2, 6),
              season: SF.SEASON, date: o.meta.fecha || '', opponent: o.meta.rival || '',
              competition: o.meta.competicion || o.meta['competición'] || '',
              home: ['si', 'sí', 's', 'true', '1', 'local'].indexOf(loc) >= 0 ? true : (loc ? false : null),
              source: 'csv', metrics: o.metrics
            });
            var patch = { stats_games: prev };
            // El dorsal viene en el acta: si el club no lo tenía, se rellena solo.
            if (o.meta.dorsal && !actual.dorsal) patch.dorsal = o.meta.dorsal;
            SF.store.update(o.p.id, patch);
          });
          U.toast(ok.length + ' filas importadas'); ta.value = ''; out.innerHTML = '';
          if (presetTeam) SF.router.render();   // refresca la ficha del equipo
        };
        out.appendChild(bImp);
      }
    });
  }

  pages['importar-datos'] = function (view) {

        c.staff_targets.forEach(function (t) {

          if (!s) return;
          ul.appendChild(el('<div class="mini-row"><span>' + esc(s.full_name) + ' <span class="hint">' + esc(tm ? tm.name : '') + '</span></span>' +
            '<span class="row-actions">' + (t.relayed_at ? '<span class="tag tag-green">reenviado</span>' :
              (t.read_at ? '<span class="tag tag-warn">leído, sin reenviar</span>' : '<span class="tag tag-gray">sin leer</span>')) + '</span></div>'));
        });
        box.appendChild(ul);
      }
      view.appendChild(box);
    });
  };

  pages['mi-equipo'] = function (view) {
    var mine = myTeams();
    var u = SF.store.currentUser();
    view.innerHTML = head('Mi equipo', 'Lo del día: citas, asistencia y avisos.');
    if (!mine.length) { view.appendChild(el('<div class="empty-panel"><p>Todavía no tienes ningún equipo asignado. La dirección técnica lo hace desde tu ficha.</p></div>')); return; }

    mine.forEach(function (t) {
      var roster = SF.store.players().filter(function (p) { return p.team_id === t.id; });
      var nextEv = teamUpcoming(t)[0];
      var anns = SF.store.announcements(t.id);

      view.appendChild(el('<p class="sec-label">' + esc(t.name) + ' · ' + roster.length + ' jugadores</p>'));

      /* --- Comunicados del club pendientes de reenviar --- */
      var meS = SF.store.staffMe();
      if (meS) {
        var pend = SF.store.comms().filter(function (c) {
          return c.mode === 'reenviar' && c.staff_targets.some(function (x) { return x.staff_id === meS.id && x.team_id === t.id && !x.relayed_at; });
        });
        pend.forEach(function (c) {
          SF.store.commMarkRead(c.id, meS.id);
          var cb = el('<div class="empty-panel" style="text-align:left;border-left:3px solid var(--purple)"></div>');
          cb.appendChild(el('<p><span class="tag tag-purple">Del club</span> <b>' + esc(c.title) + '</b></p>'));
          if (c.body) cb.appendChild(el('<p class="hint">' + esc(c.body) + '</p>'));
          cb.appendChild(el('<p class="hint">' + esc(c.author) + ' · ' + esc(c.author_role) + ' · ' + fmtDate((c.created_at || '').slice(0, 10)) + '</p>'));
          var br = el('<button class="btn btn-primary btn-sm">' + ico('ai') + 'Reenviar a mi equipo</button>');
          br.onclick = function () {
            U.modal('Reenviar: ' + c.title, annComposer(t, roster, {
              title: c.title, body: c.body, players: roster.map(function (p) { return p.id; })
            }, function () { SF.store.commMarkRelayed(c.id, meS.id, t.id); }));
          };
          cb.appendChild(br);
          view.appendChild(cb);
        });
      }

      /* --- Lo urgente arriba --- */
      var top = el('<div class="empty-panel" style="text-align:left"></div>');
      if (nextEv) {
        var lbl = nextEv.type === 'partido' ? 'Partido vs ' + esc(nextEv.opponent || 'rival') : 'Entrenamiento';
        top.appendChild(el('<p><b>' + lbl + '</b> · ' + fmtDate(nextEv.date) + (nextEv.time ? ' · ' + nextEv.time : '') + (nextEv.place ? ' · ' + esc(nextEv.place) : '') + '</p>'));
        var conv = anns.filter(function (a) { return a.needs_rsvp; })[0];
        if (conv) {
          var si = conv.targets.filter(function (x) { return x.rsvp === 'ire'; }).length;
          var pend = conv.targets.filter(function (x) { return !x.rsvp; }).length;
          top.appendChild(el('<p class="hint"><b>' + si + '</b> confirmados · <b>' + pend + '</b> sin responder</p>'));
        } else top.appendChild(el('<p class="hint">Sin convocatoria enviada todavía.</p>'));
      } else top.appendChild(el('<p class="hint">Sin citas próximas. Añade un entrenamiento o un partido.</p>'));

      var sinApto = roster.filter(function (p) { return (p.documents || {}).seguro_medico !== 'validado'; });
      if (sinApto.length) top.appendChild(el('<p class="hint">' + sinApto.length + ' jugador' + (sinApto.length === 1 ? '' : 'es') + ' con el seguro médico pendiente: ' + esc(sinApto.map(function (p) { return p.full_name; }).join(', ')) + '</p>'));
      view.appendChild(top);

      /* --- Cuatro botones, y ya --- */
      var acts = el('<div class="row-c"></div>');
      var b1 = el('<button class="btn btn-primary btn-sm">' + ico('ai') + 'Enviar aviso</button>');
      b1.onclick = function () { U.modal('Aviso a ' + t.name, annComposer(t, roster, null)); };
      var b2 = el('<button class="btn btn-light btn-sm">' + ico('users') + 'Convocar</button>');
      b2.onclick = function () {
        U.modal('Convocatoria · ' + t.name, annComposer(t, roster, {
          title: nextEv ? ((nextEv.type === 'partido' ? 'Convocatoria partido ' : 'Convocatoria ') + fmtDate(nextEv.date) + (nextEv.time ? ' · ' + nextEv.time : '')) : 'Convocatoria',
          rsvp: true, players: roster.map(function (p) { return p.id; })
        }));
      };
      var b3 = el('<button class="btn btn-light btn-sm">' + ico('list') + 'Pasar lista</button>');
      b3.onclick = function () {
        if (!nextEv) { U.toast('No hay ninguna cita próxima'); return; }
        attendanceModal(t, nextEv, function () { SF.router.render(); });
      };
      var b4 = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir cita</button>');
      b4.onclick = function () { trainingModal(t, function () { SF.router.render(); }); };
      acts.appendChild(b1); acts.appendChild(b2); acts.appendChild(b3); acts.appendChild(b4);
      view.appendChild(acts);

      /* --- Plantilla con asistencia --- */
      view.appendChild(el('<p class="sec-label">Plantilla y asistencia</p>'));
      var rl = el('<div class="mini-list"></div>');
      if (!roster.length) rl.appendChild(el('<p class="hint">Sin jugadores en la plantilla.</p>'));
      roster.forEach(function (p) {
        var st = SF.store.attendanceStats ? SF.store.attendanceStats(p.id) : null;
        var pct = st && st.pct != null ? st.pct : null;
        var tag = pct == null ? '<span class="hint">sin datos</span>'
          : '<span class="tag ' + (pct >= 80 ? 'tag-green' : (pct >= 60 ? 'tag-warn' : 'tag-danger')) + '">' + pct + '% asistencia</span>';
        var row = el('<div class="mini-row"><span><b>' + esc(p.full_name) + '</b> · ' + (p.birth_year || '') + ' · ' + esc(p.primary_position || '') + '</span><span class="row-actions">' + tag + '<button class="lnk" data-o>Ficha</button></span></div>');
        row.querySelector('[data-o]').onclick = function () { location.hash = '#/jugador/' + p.id; };
        rl.appendChild(row);
      });
      view.appendChild(rl);

      /* --- Avisos enviados y sus respuestas --- */
      view.appendChild(el('<p class="sec-label">Avisos enviados</p>'));
      if (!anns.length) view.appendChild(el('<p class="hint">Todavía no has enviado ningún aviso.</p>'));
      var al = el('<div class="mini-list"></div>');
      anns.slice(0, 8).forEach(function (a) {
        var vistos = a.targets.filter(function (x) { return x.read_player || x.read_family; }).length;
        var conf = a.targets.filter(function (x) { return x.rsvp === 'ire'; }).length;
        var resume = vistos + '/' + a.targets.length + ' visto' + (a.needs_rsvp ? ' · ' + conf + ' confirmados' : '');
        var row = el('<div class="mini-row"><span><b>' + esc(a.title) + '</b> <span class="hint">' + fmtDate((a.created_at || '').slice(0, 10)) + '</span></span><span class="row-actions"><span class="hint">' + resume + '</span><button class="lnk" data-v>Ver respuestas</button></span></div>');
        row.querySelector('[data-v]').onclick = function () { U.modal(a.title, annResponses(a, roster)); };
        al.appendChild(row);
      });
      view.appendChild(al);
    });
  };

  pages.equipo = function (view, id) {
    var t = SF.store.teamGet(id);
    if (!t) { view.innerHTML = head('Equipo', '') + '<div class="empty-panel"><p>Equipo no encontrado.</p></div>'; return; }
    var r = role();
    var can = r.canManageTeams;
    var head2 = '<button class="btn" id="back">' + ico('back') + 'Equipos</button>' + (can ? '<button class="btn" id="ed">' + ico('edit') + 'Editar</button><button class="btn btn-danger" id="del">' + ico('trash') + '</button>' : '');
    view.innerHTML = head('Equipo', '', head2);
    view.querySelector('#back').onclick = function () { location.hash = '#/equipos'; };
    if (can) {
      view.querySelector('#ed').onclick = function () { U.modal('Editar equipo', teamForm(t, function (d) { SF.store.teamUpdate(t.id, d); U.toast('Guardado'); SF.router.render(); })); };
      view.querySelector('#del').onclick = function () { if (confirm('¿Eliminar el equipo ' + t.name + '? Los jugadores quedarán sin equipo.')) { SF.store.teamRemove(t.id); U.toast('Equipo eliminado'); location.hash = '#/equipos'; } };
    }
    var seg = SF.SEGMENTS[t.segment] || t.segment || '—';
    view.appendChild(el('<div class="ficha-head"><div class="fh-photo">' + ico('grid') + '</div><div class="fh-info"><h2>' + esc(t.name) + '</h2><p class="fh-sub">' + esc((SF.SPORTS[t.sport] || {}).label || '') + ' · ' + esc(seg) + ' · ' + esc(t.category || '') + '</p></div></div>'));

    // Plantilla
    view.appendChild(el('<p class="sec-label">Plantilla</p>'));
    var roster = SF.store.players().filter(function (p) { return p.team_id === t.id; });
    var rl = el('<div class="mini-list"></div>');
    if (!roster.length) rl.appendChild(el('<p class="hint">Sin jugadores asignados.</p>'));
    roster.forEach(function (p) {
      var row = el('<div class="mini-row"><span><b>' + esc(p.full_name) + '</b> · ' + (p.birth_year || '—') + ' · ' + esc(p.primary_position || '—') + '</span><span class="row-actions"><button class="lnk" data-open>Ver ficha</button>' + (can ? '<button class="lnk-del" data-rm>' + ico('x') + '</button>' : '') + '</span></div>');
      row.querySelector('[data-open]').onclick = function () { location.hash = '#/jugador/' + p.id; };
      var rm = row.querySelector('[data-rm]'); if (rm) rm.onclick = function () { SF.store.update(p.id, { team_id: '' }); U.toast('Quitado del equipo'); SF.router.render(); };
      rl.appendChild(row);
    });
    view.appendChild(rl);
    if (can) { var addP = el('<button class="btn btn-light btn-sm">' + ico('search') + 'Buscar y añadir jugadores</button>'); addP.onclick = function () { openAddPlayers(t); }; view.appendChild(addP); }

    /* Partidos y estadísticas del equipo.
       Se pega el acta y cada fila va a la ficha de SU jugador, identificado
       por el dorsal que tiene asignado desde principio de temporada. */
    view.appendChild(el('<p class="sec-label">Partidos y estadísticas</p>'));
    var statsRoster = SF.store.players().filter(function (p) { return p.team_id === t.id; });
    var allGames = [];
    statsRoster.forEach(function (p) {
      (p.stats_games || []).forEach(function (g) { allGames.push({ p: p, g: g }); });
    });
    // Agrupadas por partido (misma fecha y rival)
    var byGame = {};
    allGames.forEach(function (x) {
      var k = (x.g.date || '') + '|' + (x.g.opponent || '');
      (byGame[k] = byGame[k] || { date: x.g.date, opponent: x.g.opponent, home: x.g.home, rows: [] }).rows.push(x);
    });
    var gameKeys = Object.keys(byGame).sort(function (a, b) { return (byGame[b].date || '').localeCompare(byGame[a].date || ''); });

    if (!gameKeys.length) view.appendChild(el('<p class="hint">Todavía no hay estadísticas cargadas para este equipo.</p>'));
    var gl = el('<div class="mini-list"></div>');
    gameKeys.slice(0, 10).forEach(function (k) {
      var G = byGame[k];
      var hl = G.home === true ? '<span class="tag tag-gray">casa</span>' : (G.home === false ? '<span class="tag tag-gray">fuera</span>' : '');
      var row = el('<div class="mini-row"><span><b>' + esc(G.opponent || 'rival') + '</b> · ' + fmtDate(G.date) + ' ' + hl + '</span>' +
        '<span class="row-actions"><span class="hint">' + G.rows.length + ' jugador' + (G.rows.length === 1 ? '' : 'es') + '</span><button class="lnk" data-v>Ver</button></span></div>');
      row.querySelector('[data-v]').onclick = function () {
        var keys = Object.keys(G.rows[0].g.metrics || {});
        var tb = el('<table class="tbl"><thead><tr><th>Dorsal</th><th>Jugador</th>' + keys.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody></tbody></table>');
        var body2 = tb.querySelector('tbody');
        G.rows.sort(function (a, b) { return (parseInt(a.p.dorsal, 10) || 99) - (parseInt(b.p.dorsal, 10) || 99); }).forEach(function (x) {
          body2.appendChild(el('<tr><td>' + esc(x.p.dorsal || '—') + '</td><td>' + SF.fichaCode(x.p.ficha) + ' · ' + esc(x.p.full_name) + '</td>' +
            keys.map(function (c) { return '<td>' + esc(String(x.g.metrics[c] != null ? x.g.metrics[c] : '—')) + '</td>'; }).join('') + '</tr>'));
        });
        U.modal(esc(G.opponent || 'Partido') + ' · ' + fmtDate(G.date), tb);
      };
      gl.appendChild(row);
    });
    view.appendChild(gl);

    // canManageThisTeam() aquí y no canEv: esa variable se define más abajo.
    if (canManageThisTeam(t)) {
      var bStats = el('<button class="btn btn-light btn-sm">' + ico('chart') + 'Cargar acta / estadísticas</button>');
      bStats.onclick = function () {
        var box = el('<div></div>');
        statsImport(box, t.id);
        U.modal('Cargar estadísticas · ' + t.name, box);
      };
      view.appendChild(bStats);
      /* Sin dorsal no hay forma de cruzar el acta: se avisa aquí, que es
         donde el entrenador lo va a resolver. */
      var sinDorsal = statsRoster.filter(function (p) { return !p.dorsal; });
      if (sinDorsal.length) view.appendChild(el('<p class="hint">' + sinDorsal.length + ' jugador' + (sinDorsal.length === 1 ? '' : 'es') +
        ' sin dorsal asignado: ' + esc(sinDorsal.map(function (p) { return p.full_name; }).join(', ')) +
        '. Sin dorsal no se les puede cruzar con el acta.</p>'));
    }

    // Cuerpo técnico — desde las fichas de staff asignadas a este equipo.
    // Con distintivo de habilitación: quien no puede trabajar con jugadores
    // tiene que verse AQUÍ, antes del sábado, no en una pestaña escondida.
    view.appendChild(el('<p class="sec-label">Cuerpo técnico</p>'));
    var sTeam = SF.store.staffOfTeam(t.id);
    var sl = el('<div class="mini-list"></div>');
    if (!sTeam.length) sl.appendChild(el('<p class="hint">Sin cuerpo técnico asignado.' + ((t.coaches || []).length ? ' (Antiguo: ' + esc(t.coaches.join(', ')) + ')' : '') + '</p>'));
    sTeam.forEach(function (s) {
      var stt = SF.staffStatus(s);
      var cls = stt.level === 'ok' ? 'tag-green' : (stt.level === 'warn' ? 'tag-warn' : 'tag-danger');
      var row = el('<div class="mini-row"><span><b>' + esc(s.full_name) + '</b> · ' + esc(roleLabel(s.role)) + ' <span class="hint">' + SF.staffCode(s.num) + '</span></span>' +
        '<span class="row-actions"><span class="tag ' + cls + '">' + stt.label + '</span><button class="lnk" data-open>Ver ficha</button></span></div>');
      row.querySelector('[data-open]').onclick = function () { location.hash = '#/staff/' + s.id; };
      sl.appendChild(row);
    });
    view.appendChild(sl);
    if (can) {
      var bAsig = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Asignar staff a este equipo</button>');
      bAsig.onclick = function () {
        var libres = SF.store.staff().filter(function (s) { return (s.team_ids || []).indexOf(t.id) < 0; });
        var box = el('<div class="mini-list"></div>');
        if (!libres.length) box.appendChild(el('<p class="hint">Todo el staff ya está asignado a este equipo.</p>'));
        libres.forEach(function (s) {
          var stt = SF.staffStatus(s);
          var r2 = el('<button class="mini-row" style="width:100%;text-align:left;cursor:pointer"><span><b>' + esc(s.full_name) + '</b> · ' + esc(roleLabel(s.role)) + '</span><span class="hint">' + stt.label + '</span></button>');
          r2.onclick = function () { SF.store.staffAssign(s.id, t.id, true); U.closeModal(); U.toast(s.full_name + ' asignado a ' + t.name); SF.router.render(); };
          box.appendChild(r2);
        });
        U.modal('Asignar staff a ' + t.name, box);
      };
      view.appendChild(bAsig);
    }

    // Familias
    view.appendChild(el('<p class="sec-label">Familias del equipo</p>'));
    var fams = roster.filter(function (p) { return p.family_active && p.family && p.family.contact; });
    var fl = el('<div class="mini-list"></div>');
    if (!fams.length) fl.appendChild(el('<p class="hint">Ninguna familia con acceso activo en este equipo.</p>'));
    fams.forEach(function (p) { fl.appendChild(el('<div class="mini-row"><span><b>' + esc(p.family.contact) + '</b> · ' + esc(p.family.relation || '') + '</span><span class="hint">' + esc(p.full_name) + '</span></div>')); });
    view.appendChild(fl);

    // Calendario — entrenamientos y partidos
    view.appendChild(el('<p class="sec-label">Calendario — entrenamientos y partidos</p>'));
    var canEv = canManageThisTeam(t);
    var matches = teamUpcoming(t, 'partido'), trains = teamUpcoming(t, 'entrenamiento');
    var cl = el('<div class="mini-list"></div>');
    if (!matches.length && !trains.length) cl.appendChild(el('<p class="hint">Sin citas próximas.</p>'));
    function evRow(ev, tag) {
      var att = ev.attendance ? Object.keys(ev.attendance).filter(function (k) { return ev.attendance[k] === 'presente'; }).length : null;
      var badge = ev.attendance ? ' <span class="tag tag-green">lista: ' + att + '</span>' : '';
      var row = el('<div class="mini-row"><span>' + tag + ' ' + eventDesc(ev) + badge + '</span><span class="row-actions">' +
        (canEv ? '<button class="lnk" data-at>' + (ev.attendance ? 'ver lista' : 'pasar lista') + '</button><button class="lnk-del" data-rm>' + ico('x') + '</button>' : '') + '</span></div>');
      if (canEv) {
        row.querySelector('[data-at]').onclick = function () { attendanceModal(t, ev, function () { SF.router.render(); }); };
        row.querySelector('[data-rm]').onclick = function () { SF.store.teamRemoveEvent(t.id, ev.id); SF.router.render(); };
      }
      return row;
    }
    matches.forEach(function (ev) { cl.appendChild(evRow(ev, '<span class="tag tag-purple">Partido</span>')); });
    trains.forEach(function (ev) { cl.appendChild(evRow(ev, '<span class="tag tag-gray">Entreno</span>')); });
    view.appendChild(cl);
    if (canEv) {
      var evtools = el('<div class="row-c"></div>');
      var bt = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir entrenamiento</button>'); bt.onclick = function () { trainingModal(t, function () { SF.router.render(); }); };
      var bm = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir partido</button>'); bm.onclick = function () { matchModal(t, function () { SF.router.render(); }); };
      evtools.appendChild(bt); evtools.appendChild(bm); view.appendChild(evtools);
      view.appendChild(el('<p class="hint">Al añadir una cita se publica un aviso automático en la comunicación del equipo. Los partidos los carga el entrenador según la federación.</p>'));
    }

    // Comunicación
    view.appendChild(el('<p class="sec-label">Comunicación del equipo</p>'));
    view.appendChild(el('<p class="hint">Espacio compartido entre entrenador, dirección técnica y familias.</p>'));
    var wallWrap = el('<div class="wall"></div>');
    var wall = (t.wall || []).slice().reverse();
    if (!wall.length) wallWrap.appendChild(el('<p class="hint">Aún no hay mensajes.</p>'));
    wall.forEach(function (m) { wallWrap.appendChild(el('<div class="msg"><div class="msg-head"><b>' + esc(m.by) + '</b> <span class="hint">' + esc(m.role) + ' · ' + esc(m.date) + '</span></div><p>' + esc(m.text) + '</p></div>')); });
    view.appendChild(wallWrap);
    var composer = el('<div class="composer"><textarea id="msg" placeholder="Escribe un mensaje para el equipo…"></textarea><button class="btn btn-primary" id="send">' + ico('arrow') + 'Enviar</button></div>');
    view.appendChild(composer);
    composer.querySelector('#send').onclick = function () {
      var txt = composer.querySelector('#msg').value.trim(); if (!txt) return;
      var u = SF.store.currentUser();
      SF.store.teamPost(t.id, { by: u.name, role: u.label, date: new Date().toISOString().slice(0, 10), text: txt });
      U.toast('Mensaje enviado'); SF.router.render();
    };
  };

  /* ===================== RECEPCIÓN =====================
     La entrada a la plataforma. Se ve una vez por sesión y por rol: da
     contexto (quién eres, qué club, qué temporada, qué te espera) y entrega
     el mando. Repetirla en cada navegación la convertiría en un estorbo. */
  SF.welcome = function (onEnter) {
    var r = role(), u = SF.store.currentUser(), a = SF.store.academy();
    var esFamilia = u.role === 'padre' || u.role === 'jugador';

    /* Los avisos de la entrada salen de las mismas reglas que el Inicio:
       una familia NO ve recuentos del club, y quien no tiene permiso de
       finanzas no ve dinero tampoco aquí. */
    var chips = [];
    if (!esFamilia) {
      var mios = scopedPlayers();
      var venc = r.canSeeFinance ? mios.filter(function (p) { return SF.finHas(p, 'vencido'); }) : [];
      var inc = mios.filter(function (p) { return p.status === 'Datos incompletos'; });
      var ent = mios.filter(function (p) { return p.status === 'Entrevista'; });
      var med = r.canEditPhysical ? mios.filter(function (p) { return !p.height_cm || !p.weight_kg; }) : [];
      if (venc.length) chips.push({ c: 'is-danger', t: venc.length + (venc.length === 1 ? ' cuota vencida' : ' cuotas vencidas') });
      if (inc.length) chips.push({ c: 'is-warn', t: inc.length + (inc.length === 1 ? ' ficha incompleta' : ' fichas incompletas') });
      if (ent.length) chips.push({ c: '', t: ent.length + (ent.length === 1 ? ' entrevista' : ' entrevistas') });
      if (med.length && chips.length < 3) chips.push({ c: 'is-warn', t: med.length + ' sin medidas' });
      if (!chips.length) chips.push({ c: 'is-ok', t: 'Todo al día' });
      chips = chips.slice(0, 3);
    }

    var w = el('<div class="wel" role="dialog" aria-label="Bienvenida a ScoutFlow Academy">' +
      '<svg class="wel-lines" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<circle cx="600" cy="350" r="250" fill="none" stroke="#fff" stroke-width="1"/>' +
      '<circle cx="600" cy="350" r="410" fill="none" stroke="#fff" stroke-width="1"/>' +
      '<path d="M0 350h1200M600 0v700" stroke="#fff" stroke-width="1"/></svg>' +
      '<div class="wel-in">' +
      '<img class="wel-logo" src="' + SF.LOGO + '" alt="">' +
      '<p class="wel-eyebrow">' + esc(a.name) + ' · Temporada ' + esc(SF.SEASON) + '</p>' +
      '<h1 class="wel-h">' + saludo() + ',<br>' + esc(u.name) + '</h1>' +
      '<p class="wel-role">' + esc(u.label) + ' · ' + fechaLarga() + '</p>' +
      '<div class="wel-rule"></div>' +
      (esFamilia
        ? '<p class="wel-lead">Aquí tienes al día los documentos, los informes y los pagos.</p>'
        : '<p class="wel-lead">Esto es lo que te espera hoy</p><div class="wel-chips">' +
          chips.map(function (c) { return '<span class="wel-chip ' + c.c + '"><span class="dot"></span><b>' + esc(c.t) + '</b></span>'; }).join('') +
          '</div>') +
      '<button class="wel-go">Entrar' + ico('arrow') + '</button>' +
      '<p class="wel-foot">FROM PROSPECT TO PLAYER</p>' +
      '</div></div>');

    function entrar() {
      w.classList.add('out');
      setTimeout(function () { if (w.parentNode) w.parentNode.removeChild(w); }, 450);
      document.removeEventListener('keydown', tecla);
      document.body.style.overflow = prevOverflow;   // devolvemos el scroll
      if (onEnter) onEnter();
    }
    /* Enter, Escape o espacio entran igual: nadie debería quedarse atrapado
       aquí buscando dónde hacer clic. */
    function tecla(e) { if (e.key === 'Enter' || e.key === 'Escape' || e.key === ' ') { e.preventDefault(); entrar(); } }

    w.querySelector('.wel-go').onclick = entrar;
    document.addEventListener('keydown', tecla);
    var prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';   // sin barra de scroll de fondo
    document.body.appendChild(w);
  };

  SF.pages = pages;
  /* Permisos efectivos (rol + excepciones vigentes). Se publica porque el
     router está en otro bloque y también los necesita: el menú y el control
     de rutas tienen que ver exactamente lo mismo que las pantallas. */
  SF.perms = role;
})();

</script>
  <script>
/* js/router.js */
/* Router por hash (#/ruta). Sin servidor: funciona en Vercel y con doble clic. */
window.SF = window.SF || {};
SF.router = (function () {
  var U = SF.ui, el = U.el, ico = U.ico, esc = U.esc;
  var root, view;

  var NAV = [
    ['inicio', 'Inicio', 'home'], ['jugadores', 'Jugadores', 'users'], ['equipos', 'Equipos', 'grid'], ['importar', 'Importar con IA', 'ai'],
    ['captacion', 'Captación', 'target'], ['documentos', 'Documentos', 'file'], ['informes', 'Informes', 'chart'],
    ['family', 'Family', 'family'], ['finanzas', 'Finanzas', 'card'], ['economia', 'Economía', 'coins'], ['permisos', 'Permisos', 'shield'],
    ['config', 'Configuración', 'cog'],
    ['mi-equipo', 'Mi equipo', 'grid'], ['comunicados', 'Comunicados', 'ai'], ['staff', 'Staff', 'shield'],
    ['importar-datos', 'Importar datos', 'chart'], ['mi-ficha', 'Mi ficha', 'file'],
    ['portal-family', 'Portal Family', 'family'], ['portal-jugador', 'Mi ScoutFlow', 'users']
  ];
  var ROUTE_PAGE = {
    inicio: 'inicio', jugadores: 'jugadores', jugador: 'jugador', equipos: 'equipos', equipo: 'equipo',
    importar: 'importar', captacion: 'captacion', documentos: 'documentos', informes: 'informes',
    family: 'family', finanzas: 'finanzas', economia: 'economia', permisos: 'permisos', config: 'config',
    'portal-family': 'portal-family', 'portal-jugador': 'portal-jugador',
    staff: 'staff', 'staff-ficha': 'staff-ficha', 'mi-ficha': 'mi-ficha', 'mi-equipo': 'mi-equipo',
    comunicados: 'comunicados', 'importar-datos': 'importar-datos'
  };
  // a qué item de nav corresponde resaltar
  var NAV_OF = { jugador: 'jugadores', equipo: 'equipos', 'portal-family': 'family', 'staff-ficha': 'staff' };

  function parse() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean);
    return { route: parts[0] || '', param: parts[1] || null };
  }

  function defaultRoute() {
    var r = SF.store.role();
    if (r === 'padre') return '#/portal-family';
    if (r === 'jugador') return '#/portal-jugador';
    if (r === 'entrenador') return '#/mi-equipo';
    return '#/inicio';
  }

  /* ¿El rol actual puede acceder a esta ruta? */
  function canAccess(route, r) {
    r = r || SF.perms();   // y también puede entrar por la URL, no solo por el menú
    if (route === 'jugador') return r.nav.indexOf('jugadores') >= 0;        // solo roles con Jugadores
    if (route === 'equipo') return r.nav.indexOf('equipos') >= 0;            // detalle de equipo
    if (route === 'portal-family') {                                         // padre (su portal) o staff que lo previsualiza
      return r.nav.indexOf('portal-family') >= 0 || r.nav.indexOf('family') >= 0 || r.nav.indexOf('jugadores') >= 0;
    }
    // La ficha de staff: la abre quien ve el listado, o cualquiera la suya.
    if (route === 'staff-ficha') return r.nav.indexOf('staff') >= 0 || r.nav.indexOf('mi-ficha') >= 0;
    return r.nav.indexOf(route) >= 0;
  }

  function renderShell() {
    var r = SF.perms();   // rol + permisos particulares: si le dan una sección, sale en el menú
    var a = SF.store.academy();
    root.innerHTML =
      '<div class="app">' +
      '<aside class="sidebar">' +
      '<div class="brand"><img class="logo" src="' + SF.LOGO + '" alt="ScoutFlow"><div><h1>ScoutFlow</h1><p>From Prospect to Player</p></div></div>' +
      '<nav class="nav" id="nav"></nav>' +
      '<div class="sb-foot"><span class="sb-academy">' + esc(a.name) + ' · ' + esc((SF.SPORTS[a.primary_sport] || {}).label || '') + '</span></div>' +
      '</aside>' +
      '<main class="main">' +
      '<header class="topbar">' +
      '<div class="search"><button class="search-go" id="gsearch-go" aria-label="Buscar" title="Buscar"><svg class="ic"><use href="#i-search"/></svg></button><input id="gsearch" placeholder="Buscar: nombre, J-0007, 2009, pívot…"></div>' +
      '<div class="top-right">' +
      '<label class="role-switch">Rol <select id="role"></select></label>' +
      (r.canCreatePlayers ? '<button class="btn btn-primary" id="tnew">' + ico('plus') + 'Nuevo jugador</button>' : '') +
      '</div></header>' +
      '<div id="view" class="view"></div>' +
      '</main></div>' +
      '<div class="toast" id="sf-toast"><svg class="ic"><use href="#i-arrow"/></svg><span></span></div>';

    view = document.getElementById('view');

    // nav filtrada por rol
    var nav = document.getElementById('nav');
    NAV.forEach(function (n) {
      if (r.nav.indexOf(n[0]) < 0) return;
      var b = el('<button class="nav-item" data-key="' + n[0] + '" title="' + n[1] + '">' + ico(n[2]) + '<span>' + n[1] + '</span></button>');
      b.onclick = function () { location.hash = '#/' + n[0]; };
      nav.appendChild(b);
    });
    if (r.nav.indexOf('portal-family') >= 0) {
      var pf = el('<button class="nav-item" data-key="portal-family" title="Portal Family">' + ico('family') + '<span>Portal Family</span></button>');
      pf.onclick = function () { location.hash = '#/portal-family'; };
      nav.appendChild(pf);
    }

    // selector de rol
    var sel = document.getElementById('role');
    Object.keys(SF.ROLES).forEach(function (k) { sel.appendChild(el('<option value="' + k + '"' + (k === SF.store.role() ? ' selected' : '') + '>' + SF.ROLES[k].label + '</option>')); });
    /* Cambiar de rol es entrar como otra persona: pasa por recepción otra vez,
       y así se ve la entrada de cada rol al enseñar la plataforma. */
    sel.onchange = function () { SF.store.setRole(sel.value); renderShell(); location.hash = defaultRoute(); render(); recepcion(); };

    var gs = document.getElementById('gsearch');
    /* El buscador tiene que responder a las TRES formas de usarlo: pulsar
       Enter, hacer clic en la lupa, y simplemente escribir. Antes solo
       funcionaba el Enter, y la lupa era un dibujo sin acción. */
    function goSearch() {
      var q = gs.value.trim();
      if (!q) { gs.focus(); return; }
      SF._jugQuery = q;
      /* Si YA estamos en #/jugadores, cambiar el hash al mismo valor no dispara
         'hashchange' y la búsqueda se perdía en silencio. Hay que repintar. */
      if (location.hash === '#/jugadores') render();
      else location.hash = '#/jugadores';
    }
    gs.addEventListener('keydown', function (e) { if (e.key === 'Enter') goSearch(); });

    var gsGo = document.getElementById('gsearch-go');
    if (gsGo) gsGo.onclick = goSearch;

    /* Búsqueda al escribir: si ya estás en Jugadores, filtra solo, sin Enter.
       Con un respiro de 250 ms para no repintar en cada tecla. */
    var gsT = null;
    gs.addEventListener('input', function () {
      if (location.hash !== '#/jugadores') return;
      clearTimeout(gsT);
      gsT = setTimeout(function () { SF._jugQuery = gs.value.trim(); render(); }, 250);
    });
    var tnew = document.getElementById('tnew');
    if (tnew) tnew.onclick = function () { location.hash = '#/jugadores'; setTimeout(function () { var b = document.getElementById('nuevo'); if (b) b.click(); }, 60); };

    render();
  }

  function render() {
    if (!view) return;
    var p = parse();
    if (!p.route) { location.hash = defaultRoute(); return; }
    var r = SF.perms();   // permisos efectivos, no solo los del rol
    var navKey = NAV_OF[p.route] || p.route;
    // control de acceso por rol
    if (!canAccess(p.route, r)) {
      var dr = defaultRoute();
      if (location.hash !== dr) { location.hash = dr; }
      else if (view) { view.innerHTML = '<div class="empty-panel"><p>Tu rol no tiene acceso a esta sección.</p></div>'; }
      return;
    }

    var fn = SF.pages[ROUTE_PAGE[p.route]];
    if (!fn) { view.innerHTML = '<div class="empty-panel"><p>Sección no encontrada.</p></div>'; return; }

    // pasar query global a jugadores
    if (p.route === 'jugadores' && SF._jugQuery) { /* handled in page via closure variable */ }
    view.innerHTML = '';
    try { fn(view, p.param); } catch (e) { view.innerHTML = '<div class="empty-panel"><p>Error al pintar la sección.</p></div>'; console.error(e); }

    document.querySelectorAll('.nav-item').forEach(function (b) { b.classList.toggle('active', b.dataset.key === navKey); });
    view.scrollTop = 0;
  }

  /* ¿Ya ha pasado por recepción en esta sesión con este rol?
     sessionStorage, no localStorage: queremos "una vez cada vez que abre la
     plataforma", no "una vez en la vida". Si el navegador lo bloquea,
     tiramos de memoria y como mucho se ve una vez de más. */
  var welMem = {};
  function welVisto(k) {
    try { return sessionStorage.getItem('sf_wel_' + k) === '1'; } catch (e) { return !!welMem[k]; }
  }
  function welMarcar(k) {
    try { sessionStorage.setItem('sf_wel_' + k, '1'); } catch (e) { welMem[k] = true; }
  }
  function recepcion() {
    var k = SF.store.role();
    if (welVisto(k) || typeof SF.welcome !== 'function') return;
    welMarcar(k);
    SF.welcome(function () { render(); });   // repinta al entrar, con datos frescos
  }

  function start(mount) {
    root = mount;
    window.addEventListener('hashchange', render);
    renderShell();
    if (!location.hash) location.hash = defaultRoute();
    recepcion();
  }

  return { start: start, render: render, renderShell: renderShell };
})();

</script>

/* Arranque de la app */
(function () {
  // inyecta el sprite de iconos
  var s = document.createElement('div'); s.innerHTML = SF.SPRITE; document.body.appendChild(s.firstChild);
  // arranca el router en el contenedor raíz
  SF.router.start(document.getElementById('app-root'));
})();

</script>
