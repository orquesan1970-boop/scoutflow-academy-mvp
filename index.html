<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScoutFlow Academy</title>
  <style>
/* ScoutFlow Academy — design system + componentes */
:root{
  --purple:#6F5AEF; --purple-2:#8D7CFF; --purple-d:#4B35C9;
  --bg:#F7F7FC; --surface:#FFFFFF; --ink:#1F2430; --ink-2:#5C6275; --ink-3:#9298A8;
  --sidebar:#17132A; --sb-ink:#B6B0D4; --sb-ink-2:#6E6890; --sb-active:#241C44;
  --line:#ECEAF3; --line-2:#E0DCEE;
  --danger:#D8453B; --danger-bg:#FCEDEC; --danger-ink:#9A2D26;
  --warn:#B9791A; --warn-bg:#FBF1DD; --warn-ink:#7A4F0F;
  --ok:#1B9E74; --ok-bg:#E4F4EE; --ok-ink:#0F6E50;
  --info:#3F7FD6; --info-bg:#E9F1FB; --info-ink:#264F7C;
  --teal-bg:#E1F5EE; --teal-ink:#0F6E56;
  --r:10px; --r-lg:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;margin:0}
.ic{width:18px;height:18px;flex-shrink:0}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:var(--sidebar);color:var(--sb-ink);padding:22px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.logo{width:46px;height:46px;flex-shrink:0;object-fit:contain;display:block}
.brand h1{font-size:16px;color:#fff}
.brand p{margin:2px 0 0;font-size:11px;color:var(--sb-ink-2)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--sb-ink);padding:10px 12px;border-radius:var(--r);font-size:13.5px;cursor:pointer;text-align:left;transition:background .15s,color .15s;font-family:inherit}
.nav-item .ic{opacity:.85}
.nav-item:hover{background:var(--sb-active);color:#fff}
.nav-item.active{background:var(--purple);color:#fff}
.sb-foot{margin-top:auto;padding:0 8px}
.sb-academy{font-size:11px;color:var(--sb-ink-2)}

/* Main + topbar */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;gap:14px;align-items:center;padding:16px 28px;border-bottom:0.5px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:9px 14px}
.search .ic{color:var(--ink-3)}
.empty-panel[style*="left"], .empty-panel[style*="left"] p, .empty-panel[style*="left"] .mini-row{text-align:left}
.search-go{border:0;background:none;padding:0;margin:0;display:flex;align-items:center;cursor:pointer;border-radius:6px;transition:color .15s}
.search-go:hover .ic{color:var(--purple)}
.search-go:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.search input{flex:1;border:0;outline:0;background:transparent;font-family:inherit;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.top-right{display:flex;align-items:center;gap:12px}
.role-switch{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.role-switch select{font-family:inherit}
.view{padding:24px 28px 48px;flex:1}

/* Botones / forms */
.btn{font-family:inherit;font-size:13px;border-radius:var(--r);padding:9px 14px;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn .ic{width:15px;height:15px}
.btn:hover{border-color:var(--purple-2)}
.btn-primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-d);border-color:var(--purple-d)}
.btn-danger{color:var(--danger-ink);border-color:var(--danger-bg);background:var(--danger-bg)}
.btn-danger:hover{border-color:var(--danger)}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:4px;border-radius:8px}
.icon-btn:hover{background:var(--bg)}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 11px;color:var(--ink);background:var(--surface);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--purple-2);box-shadow:0 0 0 3px rgba(111,90,239,.12)}
textarea{resize:vertical;min-height:90px}

/* Page head + utilidades */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:21px}
.page-head .sub{margin:5px 0 0;font-size:13.5px;color:var(--ink-2)}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}
.priority{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.priority .ic{width:16px;height:16px;color:var(--warn)}
.priority b{font-weight:600}
.c-danger{color:var(--danger)} .c-warn{color:var(--warn)}
.sec-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);margin:18px 0 10px}
.hint{font-size:12.5px;color:var(--ink-3);margin:6px 0}
/* Aviso en línea: llama la atención sin gritar. Se usa, por ejemplo, cuando la
   asimetría entre piernas pasa del umbral. */
.aviso-lin{font-size:12.5px;color:#8A5A00;background:#FFF7E6;border-left:3px solid #E8A33D;
  border-radius:0 8px 8px 0;padding:9px 12px;margin:8px 0;line-height:1.55}
.aviso-lin b{color:#6B4500}

/* Banda de disponibilidad: lo primero de Deportivo. Sin diagnóstico, nunca. */
.dispo{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:13px 15px;margin-bottom:16px}
.dispo.act{border-color:#E8A33D;background:linear-gradient(180deg,#FFFCF5,var(--surface))}
.dispo-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.dispo .hint{margin:6px 0 0}
.dispo .btn{margin-top:10px}
.count{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.row-c{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;text-align:left;font-family:inherit;cursor:default}
button.kpi{cursor:pointer;transition:border-color .15s,transform .15s}
button.kpi:hover{border-color:var(--purple-2);transform:translateY(-2px)}
.kpi-top{display:flex;justify-content:space-between;align-items:center;color:var(--ink-2);font-size:12.5px}
.kpi-top .ic{width:15px;height:15px;color:var(--ink-3)}
.kpi-num{font-size:29px;font-weight:600;margin-top:4px;line-height:1.1}
.kpi.danger .kpi-num{color:var(--danger)} .kpi.warn .kpi-num{color:var(--warn)} .kpi.purple .kpi-num{color:var(--purple-d)}
.stat-line{font-size:12.5px;color:var(--ink-3);margin:0 0 8px}

/* Funnel */
.funnel{display:flex;gap:7px;margin-bottom:8px}
.stage{flex:1;min-width:0;border-radius:var(--r);padding:13px 8px;text-align:center;cursor:pointer;border:0;font-family:inherit;transition:transform .15s}
.stage:hover{transform:translateY(-2px)}
.stage .n{font-size:20px;font-weight:600;line-height:1}
.stage .l{font-size:11.5px;margin-top:5px}
.st-gray{background:#F0EFF4}.st-gray .n,.st-gray .l{color:#4A4A55}
.st-warn{background:var(--warn-bg)}.st-warn .n,.st-warn .l{color:var(--warn-ink)}
.st-info{background:var(--info-bg)}.st-info .n,.st-info .l{color:var(--info-ink)}
.st-purple{background:#EEEBFC}.st-purple .n,.st-purple .l{color:var(--purple-d)}
.st-teal{background:var(--teal-bg)}.st-teal .n,.st-teal .l{color:var(--teal-ink)}
.st-green{background:#EAF4DD}.st-green .n,.st-green .l{color:#3B6D11}

/* Cards / listas */
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:4px}
.att{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.att:first-of-type{border-top:none}
.att:hover .att-name{color:var(--purple-d)}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex-shrink:0;background:#EBE7FB;color:#3C3489}
.av-purple{background:#EBE7FB;color:#3C3489}
.att-body{flex:1;min-width:0}
.att-name{font-size:14px;font-weight:500;margin:0}
.att-desc{font-size:12.5px;color:var(--ink-2);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.recent:first-of-type{border-top:none}
.rec-photo{width:40px;height:40px;border-radius:9px;background:#EFEDF8;display:flex;align-items:center;justify-content:center;color:var(--purple);font-weight:600;font-size:13px;flex-shrink:0}
.rec-name{font-size:13.5px;font-weight:500;margin:0}
.rec-meta{font-size:12px;color:var(--ink-3);margin:2px 0 0}

/* ===== Inicio =====
   Clases propias (dash-*, foco-*, at-*, ag-*) para no chocar con las del
   modal de asistencia, que usa .att-list y .att-name para otra cosa. */
.dash-hero{margin-bottom:18px}
.dash-hi{font-size:23px;font-weight:600;letter-spacing:-.2px}
.dash-date{font-size:13px;color:var(--ink-3);margin:4px 0 0}
.dash-date::first-letter{text-transform:uppercase}   /* "Domingo, 16 de agosto", no "16 De Agosto" */

/* La tarjeta de foco: lo único importante de la pantalla. */
.foco{display:flex;align-items:center;gap:16px;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--purple);
  border-radius:var(--r-lg);padding:16px 18px;margin-bottom:18px}
.foco.is-danger{border-left-color:var(--danger);background:linear-gradient(90deg,var(--danger-bg) 0%,var(--surface) 42%)}
.foco.is-warn{border-left-color:var(--warn);background:linear-gradient(90deg,var(--warn-bg) 0%,var(--surface) 42%)}
.foco.is-ok{border-left-color:var(--ok);background:linear-gradient(90deg,var(--ok-bg) 0%,var(--surface) 42%)}
.foco-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#EFEDF8;color:var(--purple-d)}
.foco.is-danger .foco-ic{background:#F8DCDA;color:var(--danger-ink)}
.foco.is-warn .foco-ic{background:#F5E4C4;color:var(--warn-ink)}
.foco.is-ok .foco-ic{background:#CFEBE0;color:var(--ok-ink)}
.foco-ic .ic{width:21px;height:21px}
.foco-body{flex:1;min-width:0}
.foco-t{font-size:15.5px;font-weight:600;margin:0}
.foco-s{font-size:13px;color:var(--ink-2);margin:3px 0 0}

/* KPI como botón de verdad */
.kpi.is-btn{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.kpi.is-btn:hover{border-color:var(--line-2);box-shadow:0 6px 18px rgba(31,36,48,.07);transform:translateY(-2px)}
.kpi.is-btn:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.kpi.ok .kpi-num{color:var(--ok)}
.kpi-foot{font-size:11.5px;color:var(--ink-3);margin-top:3px}

/* Necesita tu atención */
.at-list{display:flex;flex-direction:column}
.at-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);
  background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;
  font-family:inherit;cursor:pointer}
.at-item:first-child{border-top:none}
.at-item:hover .at-name{color:var(--purple-d)}
.at-body{flex:1;min-width:0}
.at-name{font-size:14px;font-weight:500;margin:0;color:var(--ink)}
.at-desc{font-size:12.5px;color:var(--ink-2);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-empty{display:flex;align-items:center;gap:10px;padding:16px 0;color:var(--ok-ink);font-size:13.5px}
.at-empty .ic{width:18px;height:18px;color:var(--ok)}

/* Agenda */
.ag-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.ag-item:first-of-type{border-top:none}
.ag-day{width:44px;flex-shrink:0;text-align:center;background:#F4F2FC;border-radius:9px;padding:5px 0}
.ag-day .d{font-size:16px;font-weight:600;line-height:1;color:var(--purple-d)}
.ag-day .m{font-size:10px;text-transform:uppercase;color:var(--ink-3);margin-top:1px}
.ag-t{font-size:13.5px;font-weight:500;margin:0}
.ag-s{font-size:12px;color:var(--ink-3);margin:2px 0 0}

@media(max-width:900px){
  .cols{grid-template-columns:1fr}
  .foco{flex-wrap:wrap}
  .dash-hi{font-size:20px}
}

/* ===== La caja: lo primero que se ve en Economía =====
   Un solo número grande y, debajo, la cuenta en lenguaje llano. Si hay que
   explicar de dónde sale el saldo, la pantalla no está terminada. */
.caja{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);
  border-radius:var(--r-lg);padding:20px 22px;margin-bottom:12px}
.caja.mal{border-left-color:var(--danger)}
.caja-top{font-size:12.5px;color:var(--ink-2)}
.caja-num{font-size:40px;font-weight:600;letter-spacing:-1px;line-height:1.1;margin:2px 0 14px;color:var(--ok-ink)}
.caja.mal .caja-num{color:var(--danger)}
.caja-cta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.caja-cta .cq{display:flex;flex-direction:column;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.caja-cta .cq b{font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.caja-cta .cq.ent{color:var(--ok-ink)} .caja-cta .cq.sal{color:var(--danger-ink)}
.caja-cta .op{font-size:17px;color:var(--ink-3);padding-bottom:14px}

/* ===== Mes a mes ===== */
.mes-wrap{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.mes-row{display:grid;grid-template-columns:44px 1fr 96px 96px 104px;gap:10px;align-items:center;
  padding:8px 15px;border-top:1px solid var(--line);font-size:12.5px}
.mes-row:first-child{border-top:none}
.mes-row.mal{background:var(--danger-bg)}
.mes-n{font-weight:600;text-transform:capitalize;color:var(--ink-2)}
.mes-bar{display:flex;flex-direction:column;gap:3px;min-width:0}
.mes-e,.mes-s{height:7px;border-radius:4px;min-width:2px}
.mes-e{background:var(--ok)} .mes-s{background:var(--danger)}
.mes-v{text-align:right;font-variant-numeric:tabular-nums}
.mes-v.ent{color:var(--ok-ink)} .mes-v.sal{color:var(--danger-ink)}
.mes-ac{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.mes-row.mal .mes-ac{color:var(--danger)}
.leg{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle}
.leg.e{background:var(--ok)} .leg.s{background:var(--danger)}
@media(max-width:700px){
  .mes-row{grid-template-columns:38px 1fr 84px;font-size:12px}
  .mes-row>.mes-v.sal{display:none}
  .caja-num{font-size:32px}
}

/* ===== Presupuesto ===== */
.pre-grupo{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin-bottom:12px;overflow:hidden}
.pre-head{display:flex;align-items:center;gap:10px;padding:11px 15px;background:#FAF9FE;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.pre-head .tot{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.pre-row{display:grid;grid-template-columns:1fr 118px 118px 108px;gap:10px;align-items:center;
  padding:9px 15px;border-top:1px solid var(--line)}
.pre-row:first-of-type{border-top:none}
.pre-lab{font-size:13.5px;min-width:0}
.pre-lab .q{border:0;background:none;cursor:help;color:var(--ink-3);padding:0 0 0 5px;font-size:12px}
.pre-in{width:100%;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:inherit;background:var(--surface)}
.pre-in:focus{outline:2px solid var(--purple);outline-offset:-1px;border-color:var(--purple)}
.pre-real{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);padding-right:9px}
.pre-real.auto{color:var(--purple-d);font-weight:600}
.pre-dev{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
.pre-dev.mal{color:var(--danger)} .pre-dev.bien{color:var(--ok)}
.pre-cab{display:grid;grid-template-columns:1fr 118px 118px 108px;gap:10px;padding:0 15px 6px;
  font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3)}
.pre-cab span:not(:first-child){text-align:right}
.pre-riesgo{font-size:11px;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.pre-chk{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);margin-left:6px}
.pre-chk input{width:auto;margin:0}
.pre-tot{display:grid;grid-template-columns:1fr 118px 118px 108px;gap:10px;padding:13px 15px;
  border-top:2px solid var(--line-2);font-weight:600;font-size:14px;background:#FAF9FE}
.pre-tot span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:760px){
  .pre-row,.pre-cab,.pre-tot{grid-template-columns:1fr 90px 90px;font-size:12.5px}
  .pre-row>*:nth-child(4),.pre-cab>*:nth-child(4),.pre-tot>*:nth-child(4){display:none}
}

/* ===== Inscripción por pasos ===== */
.pasos{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.paso{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.paso.on{border-color:var(--purple);color:var(--purple-d);font-weight:600}
.paso.hecho{background:var(--ok-bg);border-color:transparent;color:var(--ok-ink)}
.paso-n{width:20px;height:20px;border-radius:50%;background:#EFEDF8;color:var(--purple-d);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.paso.hecho .paso-n{background:var(--ok);color:#fff}
.paso.on .paso-n{background:var(--purple);color:#fff}
@media(max-width:700px){ .paso-t{display:none} .paso{padding:7px} }

/* Consentimientos: la pregunta, el texto y dos botones grandes. Nada de
   casillas diminutas para algo que tiene consecuencias legales. */
.cons{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:10px;background:var(--surface)}
.cons>b{font-size:14px;display:block;margin-bottom:5px}
.cons>p{font-size:13px;color:var(--ink-2);margin:0 0 8px;line-height:1.55}
.cons-yn{display:flex;gap:8px;margin-top:10px}
.cyn{flex:1;padding:10px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;
  font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2);transition:all .15s}
.cyn:hover{border-color:var(--purple-2)}
.cyn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cyn.no.on{background:var(--danger);border-color:var(--danger)}

/* ===== Vídeos ===== */
.vid-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.vid{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);padding:10px 14px}
.vid-thumb{position:relative;width:110px;height:62px;border-radius:9px;overflow:hidden;flex:none;
  background:#EFEDF8;display:flex;align-items:center;justify-content:center}
.vid-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vid-src{font-size:11px;color:var(--purple-d);font-weight:600;text-align:center;padding:0 6px}
.vid-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.vid-b{flex:1;min-width:0}
.vid-t{font-size:14px;font-weight:600;margin:0}
.vid-m{font-size:12px;color:var(--ink-3);margin:4px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vid-n{font-size:12.5px;color:var(--ink-2);margin:5px 0 0}
.vid-acc{display:flex;align-items:center;gap:8px;flex:none}
.vid-frame{position:relative;padding-top:56.25%;border-radius:var(--r);overflow:hidden;background:#000}
.vid-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(max-width:600px){ .vid{flex-wrap:wrap} .vid-thumb{width:92px;height:52px} }

/* ===== Trayectoria: el club es la carpeta, las temporadas van dentro ===== */
.car-club{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin-bottom:10px;overflow:hidden}
.car-head{display:flex;align-items:center;gap:10px;padding:12px 15px;background:#FAF9FE;border-bottom:1px solid var(--line)}
.car-name{font-size:14.5px;font-weight:600;flex:1;min-width:0}
.car-n{font-size:11.5px;color:var(--ink-3);font-weight:400}
.car-season{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid var(--line)}
.car-season:first-of-type{border-top:none}
.car-y{font-size:13px;font-weight:600;min-width:66px;flex:none;color:var(--purple-d)}
.car-d{flex:1;min-width:0;font-size:13px;color:var(--ink-2)}
.car-fin{font-size:12px;color:var(--ink-2);background:#F4F2FC;border-radius:7px;padding:3px 9px;white-space:nowrap}
.car-add{padding:10px 15px;border-top:1px dashed var(--line-2)}
.car-vacio{padding:12px 15px;font-size:12.5px;color:var(--ink-3)}

/* ===== Evolución del jugador ===== */
.evo-band{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;margin-bottom:16px;
  border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,#FAF9FE,var(--surface))}
.evo-band-txt{flex:1;min-width:200px;display:flex;flex-direction:column;gap:3px}
.evo-band-txt b{font-size:14.5px}
.evo-band-txt span{font-size:12.5px;color:var(--ink-3)}
.evo-lead{font-size:14px;color:var(--ink-2);margin:0 0 14px;line-height:1.55}
.evo-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px}
.evo-tab{width:100%;border-collapse:collapse;font-size:13px;min-width:340px}
.evo-tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);
  font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.evo-tab td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.evo-tab tbody tr:last-child td{border-bottom:none}
.evo-tab tbody tr:hover{background:#FAF9FE}
.evo-tab .evo-y{text-align:center;min-width:44px}
/* Ancho fijo en la primera columna: si no, cada tabla se dimensiona sola y
   las temporadas de Técnica, Física y Mental no quedan en la misma vertical. */
.evo-sk{table-layout:fixed}
.evo-sk td:first-child,.evo-sk th:first-child{white-space:normal;width:44%;color:var(--ink-2)}
.evo-sk th:first-child{color:var(--purple-d)}
.evo-d{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 6px;margin-left:4px;white-space:nowrap}
.evo-d.up{color:#1B7A4B;background:#E8F6EE}
.evo-d.down{color:#A33; background:#FBEDED}

/* ===== Campana de avisos ===== */
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink-2);flex:none;transition:border-color .15s,color .15s}
.bell:hover{border-color:var(--line-2);color:var(--ink)}
.bell.has{color:var(--purple-d);border-color:var(--purple-2)}
.bell-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;
  background:var(--danger);color:#fff;border-radius:9px;font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
/* Que se note que ha entrado algo, una vez, sin agitarse para siempre */
.bell.has .ic{animation:bell-ring 1s ease 2}
@keyframes bell-ring{0%,100%{transform:rotate(0)}20%{transform:rotate(11deg)}40%{transform:rotate(-9deg)}60%{transform:rotate(6deg)}80%{transform:rotate(-4deg)}}
@media(prefers-reduced-motion:reduce){ .bell.has .ic{animation:none} }

/* Buzón */
/* Prefijo bz- (buzón) para no chocar con .msg, que ya usa el tablón del equipo */
.bz{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--surface);margin-bottom:9px;cursor:pointer;
  width:100%;text-align:left;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.bz:hover{border-color:var(--line-2);box-shadow:0 5px 16px rgba(31,36,48,.06)}
.bz.nuevo{border-left:3px solid var(--purple)}
.bz-ic{width:36px;height:36px;border-radius:10px;background:#EFEDF8;color:var(--purple-d);
  display:flex;align-items:center;justify-content:center;flex:none}
.bz-b{flex:1;min-width:0}
.bz-t{font-size:14px;font-weight:600;margin:0;color:var(--ink)}
.bz-m{font-size:12px;color:var(--ink-3);margin:2px 0 0}
.bz-p{font-size:13px;color:var(--ink-2);margin:7px 0 0;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bz-body{white-space:pre-wrap;font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0}

/* ===== Recepción =====
   La entrada a la plataforma. No es una pantalla de carga (eso sería un peaje
   diario): se ve UNA vez por sesión y por rol, y se sale con un clic o Enter. */
.wel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:var(--sidebar);color:#fff;padding:28px;
  animation:wel-in .5s ease both}
.wel.out{animation:wel-out .45s ease both;pointer-events:none}
@keyframes wel-in{from{opacity:0}to{opacity:1}}
@keyframes wel-out{from{opacity:1}to{opacity:0;visibility:hidden}}
/* Ambiente: dos focos de luz, nada figurativo — el logo no va ligado a un deporte */
.wel::before{content:'';position:absolute;inset:0;
  background:radial-gradient(760px 420px at 22% 18%,rgba(111,90,239,.42),transparent 62%),
             radial-gradient(620px 520px at 82% 88%,rgba(141,124,255,.24),transparent 60%)}
.wel-lines{position:absolute;inset:0;opacity:.10;pointer-events:none}
.wel-in{position:relative;width:100%;max-width:660px;text-align:center;
  animation:wel-rise .7s cubic-bezier(.2,.8,.25,1) both .06s}
@keyframes wel-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.wel-logo{width:76px;height:76px;object-fit:contain;margin:0 auto 22px;display:block;
  filter:drop-shadow(0 12px 34px rgba(111,90,239,.6))}
.wel-eyebrow{font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;color:#A79FD8;margin:0 0 12px}
.wel-h{font-size:37px;font-weight:600;letter-spacing:-.6px;margin:0;line-height:1.12}
.wel-role{font-size:14.5px;color:#BFB8E6;margin:11px 0 0}
.wel-rule{width:52px;height:2px;background:linear-gradient(90deg,var(--purple),transparent);margin:26px auto;border-radius:2px}
.wel-lead{font-size:13px;color:#A79FD8;margin:0 0 13px}
.wel-chips{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.wel-chip{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
  border-radius:999px;padding:8px 15px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.wel-chip b{font-weight:600}
.wel-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--purple-2);flex:none}
.wel-chip.is-danger .dot{background:#FF7A70} .wel-chip.is-warn .dot{background:#F0B45A}
.wel-chip.is-ok .dot{background:#4FD3A5}
.wel-go{background:#fff;color:#241C44;border:0;border-radius:12px;padding:14px 34px;
  font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;transition:transform .15s,box-shadow .15s}
.wel-go:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(0,0,0,.34)}
.wel-go:focus-visible{outline:3px solid var(--purple-2);outline-offset:3px}
.wel-go .ic{width:17px;height:17px}
.wel-foot{margin:26px 0 0;font-size:11.5px;color:#7D77A6;letter-spacing:.4px}
@media(max-width:600px){ .wel-h{font-size:27px} .wel-logo{width:60px;height:60px} }
@media(prefers-reduced-motion:reduce){
  .wel,.wel-in,.wel.out{animation:none}
}

/* Tags */
.tag{font-size:11px;padding:3px 9px;border-radius:7px;white-space:nowrap;font-weight:500;display:inline-block}
.tag-gray{background:#F0EFF4;color:var(--ink-2)}
.tag-warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag-info{background:var(--info-bg);color:var(--info-ink)}
.tag-purple{background:#EEEBFC;color:var(--purple-d)}
.tag-teal{background:var(--teal-bg);color:var(--teal-ink)}
.tag-green{background:#EAF4DD;color:#3B6D11}
.tag-danger{background:var(--danger-bg);color:var(--danger-ink)}

/* Empty state */
.empty-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:34px 26px;text-align:center}
.empty-panel .em-ic{width:54px;height:54px;border-radius:14px;background:#EFEDF8;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--purple)}
.empty-panel .em-ic .ic{width:26px;height:26px}
.empty-panel h3{font-size:17px;margin-bottom:6px}
.empty-panel p{margin:0 auto 16px;font-size:13.5px;color:var(--ink-2);max-width:440px}

/* Filtros + Jugadores */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search-mini{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:0 11px;flex:1;min-width:200px}
.search-mini .ic{color:var(--ink-3);width:16px;height:16px}
.search-mini input{border:0;box-shadow:none;padding-left:0}
.filters select{width:auto;min-width:120px}
.view-toggle{display:inline-flex;background:#EFEDF8;border-radius:var(--r);padding:3px;gap:2px}
.view-toggle button{border:0;background:none;color:var(--ink-3);padding:6px 9px;border-radius:7px;cursor:pointer}
.view-toggle button.on{background:#fff;color:var(--purple-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:0;overflow:hidden;cursor:pointer;transition:.15s;display:block}
.pcard:hover{border-color:var(--purple-2);transform:translateY(-2px)}
.pcard-photo{height:120px;background:#EFEDF8;display:flex;align-items:center;justify-content:center;color:var(--purple);font-weight:600;font-size:30px;position:relative}
.pcard-ficha{position:absolute;top:8px;left:8px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;letter-spacing:.2px}
.pcard-body{padding:12px 14px}
.pcard-name{font-size:14.5px;font-weight:600}
.pcard-meta{font-size:12px;color:var(--ink-2);margin-top:3px}
.pcard-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.pcard-score{font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.pcard-score .ic{width:13px;height:13px;color:var(--purple)}

/* Tablas */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--bg)}
.tcell{display:flex;align-items:center;gap:10px}
.av-sm{width:28px;height:28px;border-radius:50%;background:#EBE7FB;color:#3C3489;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}

/* Ficha */
.ficha-head{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:16px}
.fh-photo{width:64px;height:64px;border-radius:16px;background:#EFEDF8;color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:22px;flex-shrink:0}
.fh-info h2{font-size:22px}
.fh-sub{font-size:13px;color:var(--ink-2);margin:4px 0 8px}
.fh-tags{display:flex;gap:7px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0;margin-bottom:18px}
.tab{border:0;background:none;font-family:inherit;font-size:13.5px;color:var(--ink-2);padding:8px 12px;cursor:pointer;border-radius:8px 8px 0 0;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--purple-d);border-bottom-color:var(--purple);font-weight:500}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.field{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.f-label{font-size:11.5px;color:var(--ink-3)}
.f-val{font-size:14px;color:var(--ink)}
.skills{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px 16px}
.skill{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.skill:first-child{border-top:none}
.skill span{width:130px;color:var(--ink-2)}
.skill .bar{flex:1;height:7px;background:#EFEDF8;border-radius:4px;overflow:hidden}
.skill .bar i{display:block;height:100%;background:var(--purple)}
.skill b{width:64px;text-align:right;font-weight:500;color:var(--ink-2);font-size:12px}
.doc-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:4px 16px}
.doc-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.doc-row:first-child{border-top:none}
.doc-st{border:0;font-family:inherit;font-size:12px;padding:4px 11px;border-radius:7px;cursor:pointer;text-transform:capitalize}
.st-pendiente{background:var(--warn-bg);color:var(--warn-ink)}
.st-recibido{background:var(--info-bg);color:var(--info-ink)}
.st-validado{background:#EAF4DD;color:#3B6D11}
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 18px}
.tl-step{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:13.5px;color:var(--ink-3)}
.tl-step .dot{width:11px;height:11px;border-radius:50%;background:var(--line-2);flex-shrink:0}
.tl-step.done{color:var(--ink)}
.tl-step.done .dot{background:var(--purple)}
.ia-report ul{margin:6px 0;padding-left:18px}
.ia-report li{font-size:13.5px;margin:3px 0}
.notes{margin-top:8px}

/* Import */
.import-wrap{max-width:760px}
.import-ta{min-height:120px;margin-bottom:12px}

/* Board / pipeline */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.bcol{flex:0 0 220px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px}
.bcol-head{font-size:12.5px;font-weight:600;color:var(--ink-2);padding:4px 6px 10px;display:flex;justify-content:space-between}
.bcol-head span{background:#fff;border-radius:20px;padding:1px 9px;color:var(--ink-3)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:9px;cursor:pointer}
.kcard:hover{border-color:var(--purple-2)}
.kc-name{font-size:13.5px;font-weight:500}
.kc-meta{font-size:12px;color:var(--ink-3);margin:2px 0 8px}
/* ===== Evaluación: la nota dice en palabras qué significa ===== */
.ev-ancla{font-size:11px;color:var(--ink-3);margin-top:3px;display:block;min-height:14px}
.ev-ancla.n9{color:#0F6E50;font-weight:600} .ev-ancla.n7{color:var(--ok-ink)}
.ev-ancla.n5{color:var(--ink-2)} .ev-ancla.n3{color:var(--warn-ink)} .ev-ancla.n1{color:var(--danger-ink)}
.ev-leyenda{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.ev-l{font-size:11px;border-radius:6px;padding:3px 8px;background:#F4F2FC;color:var(--ink-2)}
.ev-l b{font-weight:600}
.ev-l.n9{background:#E4F4EE;color:#0F6E50} .ev-l.n7{background:#EAF4DD;color:#3B6D11}
.ev-l.n5{background:#F0EFF4} .ev-l.n3{background:var(--warn-bg);color:var(--warn-ink)}
.ev-l.n1{background:var(--danger-bg);color:var(--danger-ink)}

/* ===== Scout Score: se ve de dónde sale ===== */
.score-box{display:flex;gap:20px;align-items:center;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);padding:16px 18px;flex-wrap:wrap}
.score-box.flojo{border-style:dashed}
.score-n{font-size:38px;font-weight:600;color:var(--purple-d);line-height:1;letter-spacing:-1px}
.score-n span{font-size:14px;color:var(--ink-3);font-weight:400}
.score-d{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.score-g{display:grid;grid-template-columns:130px 1fr 38px;gap:10px;align-items:center;font-size:12.5px}
.sg-n b{color:var(--ink-3);font-weight:600;font-size:11px}
.sg-b{height:7px;background:#EFEDF8;border-radius:4px;overflow:hidden}
.sg-b i{display:block;height:100%;background:var(--purple);border-radius:4px}
.sg-v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* Etiqueta que además es enlace: se nota que se puede pulsar */
.tag-lnk{border:0;background:none;padding:0;cursor:pointer;font-family:inherit;line-height:1}
.tag-lnk .tag{display:inline-flex;align-items:center;gap:5px;transition:filter .15s,transform .15s}
.tag-lnk:hover .tag{filter:brightness(.94);transform:translateY(-1px)}
.tag-lnk:focus-visible .tag{outline:2px solid var(--purple);outline-offset:2px}
.tag-lnk .ic{width:13px;height:13px}

.kc-move{font-size:12px;padding:5px 8px;flex:1;min-width:0}
.bcol{align-self:flex-start}
.bcol-vacio{font-size:12px;color:var(--ink-3);text-align:center;padding:14px 0;margin:0}
/* Lo pendiente va en la tarjeta pase lo que pase: no depende de la etapa */
.kc-tags{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.kc-tags .tag{font-size:10.5px;padding:2px 7px}
.kc-cita{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--purple-d);
  background:#F1EEFC;border-radius:7px;padding:5px 8px;margin-bottom:8px}
.kc-cita .ic{width:13px;height:13px;flex:none}
.kc-cita.hoy{background:var(--purple);color:#fff}
.kc-cita.tarde{background:var(--warn-bg);color:var(--warn-ink)}
.kc-acc{display:flex;gap:6px;align-items:center}
.kc-cal{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}
.kc-cal:hover{border-color:var(--purple-2);color:var(--purple-d)}
.kc-cal .ic{width:15px;height:15px}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(23,19,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:40;overflow:auto}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:620px;box-shadow:0 12px 40px rgba(23,19,42,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px}
.modal-body{padding:18px 20px}
.modal-foot{padding:0 20px 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow{display:flex;flex-direction:column;gap:5px}
.frow label{font-size:12px;color:var(--ink-2)}
.frow .hint{margin:0;font-size:11.5px}
/* Separador de bloque: ocupa las dos columnas para que el título quede
   claramente por encima de los campos que agrupa, y no al lado de uno. */
.frow-sep{grid-column:1/-1;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.frow-sep .sec-label{margin:0}
.frow-sep .hint{margin-top:4px}

/* Toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:.22s;display:flex;align-items:center;gap:9px;z-index:60;max-width:90vw}
.toast .ic{width:15px;height:15px;color:var(--purple-2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Portal Family (mobile-first) */
.phone{max-width:380px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 10px 40px rgba(23,19,42,.12)}
.phone-top{background:var(--sidebar);color:#fff;display:flex;align-items:center;gap:9px;padding:16px 18px;font-size:14px;font-weight:500}
.ph-logo{width:26px;height:26px}
.phone-body{padding:18px}
.ph-hero{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ph-photo{width:54px;height:54px;border-radius:14px;background:#EFEDF8;color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px}
.ph-name{font-size:16px;font-weight:600}
.ph-sub{font-size:12.5px;color:var(--ink-2)}
.ph-sec{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);margin:18px 0 8px}
.ph-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.ph-row:first-of-type{border-top:none}
.ph-btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ph-consent{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0;background:var(--surface)}
.ph-consent>b{display:block;margin-bottom:5px;font-size:13px}
.ph-consent>p{font-size:12px;color:var(--ink-2);margin:0 0 9px;line-height:1.45}
.ph-yn{display:flex;gap:8px}
.ph-btn.yn{flex:1;justify-content:center;font-weight:600}
.ph-btn.yn.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.ph-report{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0;background:var(--surface)}
.ph-report>b{display:block;font-size:13px}
.ph-report>span{display:block;font-size:11.5px;margin-bottom:6px}
.ph-report>p{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.5}
.ph-btn .ic{width:14px;height:14px}
/* Aviso plegado: llega cerrado y se abre. Solo así el "leído" es verdad. */
.ph-report.is-nuevo{border-color:var(--purple);box-shadow:0 0 0 3px rgba(111,90,239,.09)}
.ph-open{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
.ph-open-t{display:flex;align-items:center;gap:8px;font-size:13px}
.ph-open-t b{font-size:13px}
.ph-open>.hint{display:block;font-size:11.5px;margin:2px 0 0}
.ph-open-b{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.ph-open-b>p{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.5}
.ph-open-b[hidden]{display:none}
/* Conversaciones: formato correo, no chat. Los mensajes van uno debajo de
   otro, a ancho completo, sin burbujas ni alineación a la derecha, que es lo
   que invita a contestar con monosílabos. */
.conv-new{display:flex;flex-direction:column;gap:7px;margin:8px 0 4px}
.conv-new input,.conv-new select,.conv-new textarea{font-size:12.5px}
.conv-new textarea{min-height:62px;resize:vertical}
.conv-new .ph-btn{align-self:flex-start}
.conv-m{border-top:1px solid var(--line);padding:9px 0}
.conv-m:first-child{border-top:0;padding-top:0}
.conv-m.otro{border-left:2px solid var(--purple);padding-left:9px}
.conv-who{display:block;font-size:12px;font-weight:600;margin-bottom:3px}
.conv-m p{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.5}
.ph-btn.pay{background:var(--purple);color:#fff;border-color:var(--purple)}

/* Responsive */
@media (max-width:920px){
  .app{grid-template-columns:64px 1fr}
  .brand h1,.brand p,.nav-item span,.sb-academy{display:none}
  .nav-item{justify-content:center;padding:11px}
  .logo{width:38px;height:38px}
  .cols{grid-template-columns:1fr}
}
@media (max-width:680px){
  .topbar{padding:12px 16px;flex-wrap:wrap}
  .view{padding:18px 16px 40px}
  .funnel{flex-wrap:wrap}.stage{flex:1 1 28%}
  .form-grid{grid-template-columns:1fr}
  .role-switch{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── Botones y listas auxiliares (campos incorporados desde fichas externas) ── */
.btn-light{background:var(--bg);border-color:var(--line)}
.btn-light:hover{border-color:var(--purple-2)}
.btn-sm{font-size:12px;padding:6px 11px;margin-top:8px}
.btn-sm .ic{width:13px;height:13px}
.mini-list{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px}
.mini-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.mini-row b{font-weight:700}
.mini-row .hint{font-size:11.5px}
.lnk-del{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:2px;border-radius:6px;flex:0 0 auto}
.lnk-del:hover{color:var(--danger)}
.lnk-del .ic{width:15px;height:15px}

/* ── Equipos y comunicación ── */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:6px}
.team-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;cursor:pointer;transition:.15s;font-family:inherit}
.team-card:hover{border-color:var(--purple-2);box-shadow:0 6px 18px rgba(111,90,239,.10)}
.team-card h3{font-size:16px;font-weight:800;color:var(--ink);margin:8px 0 6px}
.tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tc-meta{font-size:12.5px;color:var(--ink-2)}
.row-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.lnk{border:0;background:none;cursor:pointer;color:var(--purple);font-family:inherit;font-size:12.5px;font-weight:600;padding:2px 4px;border-radius:6px}
.lnk:hover{background:var(--bg)}
.chks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input,.mini-row input[type=checkbox]{width:auto}
.wall{display:flex;flex-direction:column;gap:10px;margin:4px 0 10px}
.msg{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--purple-2);
  border-radius:10px;padding:10px 13px}
.msg-head{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.msg-head b{font-size:13px}
.msg p{margin:0;font-size:13.5px;color:var(--ink)}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{min-height:64px;resize:vertical}
.composer .btn{flex:0 0 auto}

/* Compositor de avisos: asunto, cuerpo y, sobre todo, a quién va. El
   destinatario está a la vista antes de enviar, no escondido en un menú. */
.composer-x{display:flex;flex-direction:column;gap:9px;border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--surface);padding:13px;margin-bottom:6px}
.composer-x textarea{min-height:74px;resize:vertical}
.composer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.composer-row select{flex:1 1 240px;min-width:0}
.composer-row .btn{flex:0 0 auto}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chk input{width:15px;height:15px;margin:0}

/* ── Pagos en el Portal Family ── */
.ph-pay{display:flex;flex-direction:column;gap:1px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;margin-bottom:6px}
.ph-pay b{font-size:12.5px}
.ph-pay span{font-size:11px;color:var(--ink-2)}
.tab-body .kpis{margin-bottom:6px}

/* Botón ancho en el portal (pedidos, datos bancarios) */
.ph-btn.full{width:100%;justify-content:center;margin-top:4px}

/* ── Línea temporal de Seguimiento (hitos marcables + anotaciones) ── */
.timeline{position:relative;margin:6px 0 4px;padding-left:6px}
.tl-step{position:relative;display:flex;gap:12px;padding:0 0 16px 18px}
.tl-step::before{content:"";position:absolute;left:5px;top:16px;bottom:-2px;width:2px;background:var(--line)}
.tl-step:last-child::before{display:none}
.tl-dot{position:absolute;left:0;top:2px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line);box-sizing:border-box;flex:none}
.tl-step.done .tl-dot{background:var(--brand);border-color:var(--brand)}
.tl-step.done .tl-dot::after{content:"";position:absolute;left:3px;top:1px;width:3px;height:6px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tl-step.done::before{background:var(--brand)}
.tl-body{flex:1;min-width:0}
.tl-title{font-weight:650;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.tl-step:not(.done) .tl-title{color:var(--ink-2)}
.tl-meta{font-weight:400;font-size:11px;color:var(--ink-2)}
.tl-desc{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.tl-note{font-size:12px;margin-top:5px;padding:7px 10px;background:var(--bg);
  border:1px solid var(--line);border-left:2px solid var(--brand);border-radius:8px}
.tl-step.clickable{cursor:pointer;border-radius:8px;transition:background .12s}
.tl-step.clickable:hover{background:var(--bg)}

/* ── Economía: gastos, ticket y barras ── */
.exp-list{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.exp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.exp-main{display:flex;flex-direction:column;gap:1px;min-width:0}
.exp-main b{font-size:13px}
.exp-side{display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:650;font-size:13px}
.tk-prev{margin-top:6px}
.tk-prev img{max-width:140px;max-height:120px;border-radius:8px;border:1px solid var(--line)}
.tk-prev.big img{max-width:100%;max-height:60vh}
.bars{display:flex;flex-direction:column;gap:7px;margin:4px 0}
.bar-row{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:10px}
.bar-label{font-size:12px;color:var(--ink-2)}
.bar-track{height:9px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--brand);border-radius:6px}
.bar-val{font-size:12px;font-weight:650}

/* Buscar y añadir jugadores al equipo */
.add-search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  font-size:13px;margin:2px 0 8px;box-sizing:border-box;background:var(--bg)}
.add-list{max-height:320px;overflow:auto}
.add-row{cursor:pointer}

/* ── Asistencia (pasar lista) ── */
.att-list{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:5px;margin:6px 0}
.att-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.att-name{font-size:13px;font-weight:600}
.att-btns{display:flex;gap:4px;flex:none}
.att-b{border:1px solid var(--line);background:var(--surface);border-radius:7px;
  padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.att-b.on.att-presente{background:#16a34a;border-color:#16a34a;color:#fff}
.att-b.on.att-ausente{background:#dc2626;border-color:#dc2626;color:#fff}
.att-b.on.att-justificado{background:#d97706;border-color:#d97706;color:#fff}
.att-count{margin-top:2px}

/* ── Inicio por rol: tarjetas "hoy" ── */
.today-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:4px 0 10px}
.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.today-t{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2);font-weight:700}
.today-s{font-size:14px;font-weight:650;margin-top:5px;line-height:1.35}

</style>
