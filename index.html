    var ps = scopedPlayers();
    var years = Array.from(new Set(ps.map(function (p) { return p.birth_year; }).filter(Boolean))).sort();
    var nats = Array.from(new Set([].concat.apply([], ps.map(function (p) { return p.nationality || []; }))));
    var poss = Array.from(new Set(ps.map(function (p) { return p.primary_position; }).filter(Boolean)));

    var bar = el('<div class="filters"></div>');
    bar.innerHTML =
      '<div class="search-mini">' + ico('search') + '<input id="q" placeholder="Buscar por nombre, año, posición…"></div>' +
      '<select id="fy"><option value="">Año</option>' + years.map(function (y) { return '<option>' + y + '</option>'; }).join('') + '</select>' +
      '<select id="fp"><option value="">Posición</option>' + poss.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('') + '</select>' +
      '<select id="fn"><option value="">Nacionalidad</option>' + nats.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '</select>' +
      '<select id="fs"><option value="">Estado</option>' + SF.STATUSES.map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select>' +
      '<div class="view-toggle"><button id="vg" class="' + (jugView === 'grid' ? 'on' : '') + '" aria-label="Tarjetas">' + ico('grid') + '</button><button id="vt" class="' + (jugView === 'table' ? 'on' : '') + '" aria-label="Tabla">' + ico('list') + '</button></div>';
    view.appendChild(bar);

    var out = el('<div id="jug-out"></div>'); view.appendChild(out);

    // aplicar query global (desde KPI o buscador)
    var qmap = { '@Pagos vencidos': function (p) { return SF.finHas(p, 'vencido'); }, '@Datos incompletos': function (p) { return p.status === 'Datos incompletos'; }, '@Pendiente de vídeo': function (p) { return p.documents.video_highlights === 'pendiente'; }, '@Entrevistas': function (p) { return p.status === 'Entrevista'; } };
    var gq = SF._jugQuery || ''; SF._jugQuery = null;
    var preFilter = qmap[gq] || null;
    if (gq && !preFilter) bar.querySelector('#q').value = gq;

    function render() {
      var q = bar.querySelector('#q').value.toLowerCase().trim();
      var fy = bar.querySelector('#fy').value, fp = bar.querySelector('#fp').value, fn = bar.querySelector('#fn').value, fs = bar.querySelector('#fs').value;
      var rows = ps.filter(function (p) {
        if (preFilter && !preFilter(p)) return false;
        if (fy && String(p.birth_year) !== fy) return false;
        if (fp && p.primary_position !== fp) return false;
        if (fn && (p.nationality || []).indexOf(fn) < 0) return false;
        if (fs && p.status !== fs) return false;
        if (q) {
          /* Búsqueda por NÚMERO DE FICHA. Acepta las tres formas en que la
             gente lo va a escribir: "7", "J-7", "J-0007". Si la consulta es
             un número, se compara EXACTA, para que buscar "7" no devuelva a
             todos los nacidos en 2007. */
          var qn = q.replace(/^j-?/, '').replace(/^0+(?=\d)/, '');
          if (/^\d+$/.test(qn) && String(p.ficha) === qn) return true;
          var hay = (p.full_name + ' ' + (p.primary_position || '') + ' ' + (p.nationality || []).join(' ') + ' ' +
            (p.birth_year || '') + ' ' + (p.scoutflow_id || '') + ' ' + SF.fichaCode(p.ficha)).toLowerCase();
          if (q.indexOf('sin pasaporte') >= 0) return p.documents.pasaporte === 'pendiente';
          if (hay.indexOf(q) < 0) return false;
        }
        return true;
      });
      out.innerHTML = '';
      out.appendChild(el('<p class="count">' + rows.length + ' jugador' + (rows.length === 1 ? '' : 'es') + (preFilter ? ' · filtro activo' : '') + '</p>'));
      if (!rows.length) { out.appendChild(el('<div class="empty-panel"><p>Ningún jugador con esos filtros.</p></div>')); return; }
      if (jugView === 'grid') {
        var g = el('<div class="grid"></div>');
        rows.forEach(function (p) { g.appendChild(U.playerCard(p)); });
        out.appendChild(g);
      } else {
        var t = el('<table class="tbl"><thead><tr><th>Jugador</th><th>Año</th><th>Posición</th><th>Estado</th><th>Score</th></tr></thead><tbody></tbody></table>');
        var tb = t.querySelector('tbody');
        rows.forEach(function (p) {
          var tr = el('<tr><td><div class="tcell"><span class="av-sm">' + U.initials(p.full_name) + '</span>' + esc(p.full_name) + '</div></td><td>' + (p.birth_year || '—') + '</td><td>' + esc(p.primary_position || '—') + '</td><td>' + U.statusTag(p.status) + '</td><td>' + (p.scout_score != null ? p.scout_score : '—') + '</td></tr>');
          tr.onclick = function () { location.hash = '#/jugador/' + p.id; };
          tb.appendChild(tr);
        });
        out.appendChild(t);
      }
    }
    bar.querySelectorAll('input,select').forEach(function (i) { i.addEventListener('input', render); });
    bar.querySelector('#vg').onclick = function () { jugView = 'grid'; bar.querySelector('#vg').classList.add('on'); bar.querySelector('#vt').classList.remove('on'); render(); };
    bar.querySelector('#vt').onclick = function () { jugView = 'table'; bar.querySelector('#vt').classList.add('on'); bar.querySelector('#vg').classList.remove('on'); render(); };
    render();
  };

  /* ===================== FICHA MAESTRA ===================== */
  var TABS = [
    ['perfil', 'Perfil'], ['deportivo', 'Deportivo'], ['academico', 'Académico'], ['familia', 'Familia'],
    ['documentos', 'Documentos'], ['videos', 'Vídeos'], ['captacion', 'Captación'], ['seguimiento', 'Seguimiento'],
    ['informes', 'Informes'], ['finanzas', 'Finanzas'], ['portal', 'Portal Family'], ['notas', 'Notas internas']
  ];

  pages.jugador = function (view, id) {
    var p = SF.store.get(id);
    if (!p) { view.innerHTML = head('Jugador', '') + '<div class="empty-panel"><p>No encontrado.</p></div>'; return; }
    var r = role();
    var allowed = r.tabs === 'all' ? TABS.map(function (t) { return t[0]; }) : r.tabs;

    var back = '<button class="btn" id="back">' + ico('back') + 'Jugadores</button>';
    var edit = '<button class="btn" id="ed">' + ico('edit') + 'Editar perfil</button><button class="btn btn-danger" id="del">' + ico('trash') + '</button>';
    view.innerHTML = head('Ficha del jugador', '', back + edit);
    view.querySelector('#back').onclick = function () { location.hash = '#/jugadores'; };
    view.querySelector('#del').onclick = function () {
      if (confirm('¿Eliminar a ' + p.full_name + '?')) { SF.store.remove(p.id); U.toast('Eliminado'); location.hash = '#/jugadores'; }
    };
    view.querySelector('#ed').onclick = function () {
      U.modal('Editar perfil', playerForm(p, function (data) { SF.store.update(p.id, data); U.toast('Guardado'); SF.router.render(); }));
    };

    var fhead = el('<div class="ficha-head"><div class="fh-photo">' + U.initials(p.full_name) + '</div><div class="fh-info"></div></div>');
    var nat = (p.nationality || []).join(', ');
    fhead.querySelector('.fh-info').innerHTML =
      '<h2>' + esc(p.full_name) + '</h2>' +
      '<p class="fh-sub">' + (p.ficha != null ? '<b>' + SF.fichaCode(p.ficha) + '</b> · ' : '') + (p.dorsal ? 'dorsal ' + esc(p.dorsal) + ' · ' : '') + esc(p.scoutflow_id) + ' · ' + (p.birth_year || '—') + ' · ' + esc(p.primary_position || '—') + (p.height_cm ? ' · ' + (p.height_cm / 100).toFixed(2) + ' m' : '') + '</p>' +
      '<div class="fh-tags">' + U.statusTag(p.status) + (r.canSeeScore ? '<span class="tag tag-purple">Score ' + (p.scout_score != null ? p.scout_score : 'pendiente') + '</span>' : '') + '<span class="tag tag-gray">' + esc(nat || '—') + '</span></div>';
    view.appendChild(fhead);

    var tabbar = el('<div class="tabs"></div>');
    var body = el('<div class="tab-body"></div>');
    var cur = (SF._openTab && allowed.indexOf(SF._openTab) >= 0) ? SF._openTab : allowed[0];
    SF._openTab = null;
    TABS.forEach(function (t) {
      if (allowed.indexOf(t[0]) < 0) return;
      var b = el('<button class="tab' + (t[0] === cur ? ' on' : '') + '">' + t[1] + '</button>');
      b.onclick = function () { cur = t[0]; tabbar.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); paint(); };
      tabbar.appendChild(b);
    });
    view.appendChild(tabbar); view.appendChild(body);

    function paint() {
      body.innerHTML = '';
      if (cur === 'perfil') {
        var posNum = (SF.POS_NUM[p.sport] || {})[p.primary_position];
        var posLabel = p.primary_position ? (p.primary_position + (posNum ? ' (' + posNum + ')' : '')) : '';
        var g = el('<div class="field-grid"></div>');
        g.innerHTML = fld('Nombre completo', p.full_name) + fld('Fecha de nacimiento', p.birth_date) +
          fld('Edad', SF.store.age(p.birth_date) != null ? SF.store.age(p.birth_date) + ' años' : '') +
          fld('Nacionalidad', nat) + fld('País de residencia', p.residence_country) + fld('Ciudad', p.city) +
          fld('Sexo', p.gender) + fld('Teléfono', p.phone) + fld('Email', p.email) +
          fld('Instagram', p.instagram) + fld('Facebook', p.facebook) +
          fld('DNI / documento', p.dni) + fld('Dirección', p.address) + fld('Teléfono de emergencia', p.emergency_phone) +
          fld('Deporte', SF.SPORTS[p.sport] ? SF.SPORTS[p.sport].label : p.sport) +
          fld('Posición principal', posLabel) + fld('Posición secundaria', p.secondary_position);
        body.appendChild(g);
      } else if (cur === 'deportivo') {
        var sp = SF.SPORTS[p.sport];
        body.appendChild(el('<div class="field-grid">' + fld('Club', p.club) + fld('Liga', p.league) + fld('Categoría', p.category) + fld('Equipo', teamName(p)) +
          fld('Dorsal', p.dorsal) + fld('Edad de inicio', p.start_age ? p.start_age + ' años' : '') + '</div>'));
        /* Altura: se distingue la medida de la estimada a ojo por el scout.
           Nunca se pisan: la del preparador físico manda. */
        if (p.height_cm || p.height_est_cm) {
          body.appendChild(el('<p class="hint">Altura: ' +
            (p.height_cm ? '<b>' + (p.height_cm / 100).toFixed(2) + ' m</b> medida' : '') +
            (p.height_cm && p.height_est_cm ? ' · ' : '') +
            (p.height_est_cm ? '~' + (p.height_est_cm / 100).toFixed(2) + ' m estimada por scouting' : '') + '</p>'));
        }
        var bRow = el('<div class="row-c"></div>');
        if (role().canManageTeams) {
          var bteam = el('<button class="btn btn-light btn-sm">' + ico('grid') + 'Asignar / cambiar equipo</button>');
          bteam.onclick = function () { U.modal('Asignar equipo — ' + esc(p.full_name), assignTeam(p, function () { p = SF.store.get(p.id); paint(); })); };
          bRow.appendChild(bteam);
        }
        /* El dorsal se asigna a principio de temporada: es la llave con la que
           el acta de la federación se cruza con esta ficha. */
        if (role().canManageTeams || role().canEvaluate) {
          var bDor = el('<button class="btn btn-light btn-sm">' + ico('edit') + (p.dorsal ? 'Cambiar dorsal' : 'Asignar dorsal') + '</button>');
          bDor.onclick = function () {
            U.modal('Dorsal — ' + esc(p.full_name), smallForm([
              { name: 'dorsal', label: 'Dorsal' },
              { name: 'height_est_cm', label: 'Altura estimada por scouting (cm)', type: 'number' }
            ], p, function (d) {
              SF.store.update(p.id, { dorsal: d.dorsal, height_est_cm: d.height_est_cm || null });
              U.toast('Guardado'); p = SF.store.get(p.id); paint();
            }));
          };
          bRow.appendChild(bDor);
        }
        if (bRow.children.length) body.appendChild(bRow);

        /* Estadísticas de partido importadas. Solo unas pocas métricas
           acordadas: el análisis profundo vive en su herramienta, no aquí. */
        var gs = (p.stats_games || []).slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
        if (gs.length) {
          body.appendChild(el('<p class="sec-label">Estadísticas de partido</p>'));
          var keys = Object.keys(gs[0].metrics || {});
          // Medias de la temporada
          var med = {};
          keys.forEach(function (k) {
            var vals = gs.map(function (g) { return g.metrics[k]; }).filter(function (v) { return typeof v === 'number'; });
            if (vals.length) med[k] = Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length * 10) / 10;
          });
          var mk = Object.keys(med);
          if (mk.length) body.appendChild(el('<div class="field-grid">' + mk.map(function (k) {
            return '<div class="field"><span class="f-lab">' + esc(k) + ' · media</span><span class="f-val">' + med[k] + '</span></div>';
          }).join('') + '</div>'));

          /* REGULARIDAD y CASA/FUERA: no se piden al staff, se calculan.
             Regularidad = cuánto se desvía de su media. 14-13-15 es regular;
             4-28-6 no. Se mide sobre la métrica principal disponible. */
          var kRef = ['puntos', 'valoracion', 'valoración'].filter(function (k) { return keys.indexOf(k) >= 0; })[0];
          if (kRef && gs.length >= 3) {
            var vs = gs.map(function (g) { return g.metrics[kRef]; }).filter(function (v) { return typeof v === 'number'; });
            var m = vs.reduce(function (a, b) { return a + b; }, 0) / vs.length;
            var sd = Math.sqrt(vs.reduce(function (a, b) { return a + Math.pow(b - m, 2); }, 0) / vs.length);
            var cv = m ? sd / m : 0;   // coeficiente de variación
            var lab = cv < 0.25 ? 'muy regular' : (cv < 0.45 ? 'regular' : 'irregular');
            var cls = cv < 0.25 ? 'tag-green' : (cv < 0.45 ? 'tag-warn' : 'tag-danger');
            body.appendChild(el('<p class="hint">Regularidad en <b>' + esc(kRef) + '</b>: <span class="tag ' + cls + '">' + lab + '</span> ' +
              '<span class="hint">(media ' + Math.round(m * 10) / 10 + ', desviación ' + Math.round(sd * 10) / 10 + ')</span></p>'));
          }
          var casa = gs.filter(function (g) { return g.home === true; }), fuera = gs.filter(function (g) { return g.home === false; });
          if (kRef && casa.length && fuera.length) {
            function prom(arr) { var v = arr.map(function (g) { return g.metrics[kRef]; }).filter(function (x) { return typeof x === 'number'; }); return v.length ? Math.round(v.reduce(function (a, b) { return a + b; }, 0) / v.length * 10) / 10 : '—'; }
            body.appendChild(el('<p class="hint">' + esc(kRef) + ' en casa: <b>' + prom(casa) + '</b> (' + casa.length + ') · fuera: <b>' + prom(fuera) + '</b> (' + fuera.length + ')</p>'));
          }

          var gt = el('<table class="tbl"><thead><tr><th>Fecha</th><th>Rival</th><th></th>' + keys.map(function (k) { return '<th>' + esc(k) + '</th>'; }).join('') + '</tr></thead><tbody></tbody></table>');
          var gtb = gt.querySelector('tbody');
          gs.slice(0, 10).forEach(function (g) {
            var hl = g.home === true ? '<span class="tag tag-gray">casa</span>' : (g.home === false ? '<span class="tag tag-gray">fuera</span>' : '');
            gtb.appendChild(el('<tr><td>' + esc(g.date || '') + '</td><td>' + esc(g.opponent || '') + '</td><td>' + hl + '</td>' +
              keys.map(function (k) { return '<td>' + esc(String(g.metrics[k] != null ? g.metrics[k] : '—')) + '</td>'; }).join('') + '</tr>'));
          });
          body.appendChild(gt);
          body.appendChild(el('<p class="hint">' + gs.length + ' partido' + (gs.length === 1 ? '' : 's') + ' importado' + (gs.length === 1 ? '' : 's') + ' · origen: CSV</p>'));
        }

        if (p.team_id) {
          var att0 = SF.store.attendanceStats(p.id);
          if (att0.total) body.appendChild(el('<p class="hint">Asistencia registrada: <b>' + att0.pct + '%</b> (' + att0.present + ' de ' + att0.total + ' citas)</p>'));
          var tt0 = SF.store.teamGet(p.team_id);
          if (tt0) {
            var nm0 = teamUpcoming(tt0, 'partido')[0], nt0 = teamUpcoming(tt0, 'entrenamiento')[0];
            if (nm0 || nt0) {
              body.appendChild(el('<p class="sec-label">Próximas citas del equipo</p>'));
              var al0 = el('<div class="mini-list"></div>');
              if (nm0) al0.appendChild(el('<div class="mini-row"><span><span class="tag tag-purple">Partido</span> ' + eventDesc(nm0) + '</span></div>'));
              if (nt0) al0.appendChild(el('<div class="mini-row"><span><span class="tag tag-gray">Entreno</span> ' + eventDesc(nt0) + '</span></div>'));
              body.appendChild(al0);
            }
          }
        }

        // ── Físico: medidas y antropometría (las toma el preparador físico) ──
        body.appendChild(el('<p class="sec-label">Físico — medidas</p>'));
        body.appendChild(el('<div class="field-grid">' +
          fld('Altura', p.height_cm ? (p.height_cm / 100).toFixed(2) + ' m' : '') +
          fld('Peso', p.weight_kg ? p.weight_kg + ' kg' : '') +
          fld('Envergadura', p.wingspan_cm ? p.wingspan_cm + ' cm' : '') +
          fld('Alcance vertical (sin impulso)', p.vertical_reach_stand ? p.vertical_reach_stand + ' cm' : '') +
          fld('Alcance vertical (con impulso)', p.vertical_reach_run ? p.vertical_reach_run + ' cm' : '') +
          fld('Altura de torso', p.torso_height_cm ? p.torso_height_cm + ' cm' : '') +
          fld('Longitud de pie', p.foot_length_cm ? p.foot_length_cm + ' cm' : '') +
          fld('Longitud de manos', p.hand_length_cm ? p.hand_length_cm + ' cm' : '') +
          fld('Mano dominante', p.dominant_hand) +
          fld('Usa las dos manos', p.uses_both_hands) + '</div>'));
        var mlog = p.measure_log || [];
        if (mlog.length) {
          var lastM = mlog[mlog.length - 1];
          body.appendChild(el('<p class="hint">Última medición: <b>' + esc(lastM.by) + '</b> · ' + esc(lastM.role) + ' · ' + esc(lastM.date) + '</p>'));
        }
        if (role().canEditPhysical) {
          var edPhys = el('<button class="btn btn-primary btn-sm">' + ico('edit') + 'Editar medidas físicas</button>');
          edPhys.onclick = function () {
            U.modal('Medidas físicas — ' + esc(p.full_name), smallForm([
              { name: 'height_cm', label: 'Altura (cm)', type: 'number' },
              { name: 'weight_kg', label: 'Peso (kg)', type: 'number' },
              { name: 'wingspan_cm', label: 'Envergadura (cm)', type: 'number' },
              { name: 'vertical_reach_stand', label: 'Alcance vertical sin impulso (cm)', type: 'number' },
              { name: 'vertical_reach_run', label: 'Alcance vertical con impulso (cm)', type: 'number' },
              { name: 'torso_height_cm', label: 'Altura de torso (cm)', type: 'number' },
              { name: 'foot_length_cm', label: 'Longitud de pie (cm)', type: 'number' },
              { name: 'hand_length_cm', label: 'Longitud de manos (cm)', type: 'number' },
              { name: 'dominant_hand', label: 'Mano dominante', type: 'select', options: ['Derecha', 'Izquierda', 'Ambidiestra'] },
              { name: 'uses_both_hands', label: 'Usa las dos manos', type: 'select', options: ['Sí', 'No'] }
            ], p, function (d) {
              var u = SF.store.currentUser();
              var entry = Object.assign({ by: u.name, role: u.label, date: new Date().toISOString().slice(0, 10) }, d);
              var newLog = (p.measure_log || []).slice(); newLog.push(entry);
              SF.store.update(p.id, Object.assign({}, d, { measure_log: newLog }));
              p = SF.store.get(p.id); U.toast('Medidas guardadas por ' + u.name); paint();
            }));
          };
          body.appendChild(el('<p class="hint">Las medidas las toma el preparador físico cada temporada; cada actualización queda registrada.</p>'));
          body.appendChild(edPhys);
        }
        if (mlog.length) {
          body.appendChild(el('<p class="sec-label">Historial de medidas</p>'));
          var ml = el('<div class="mini-list"></div>');
          mlog.slice().reverse().slice(0, 6).forEach(function (e) {
            var vals = [];
            if (e.height_cm) vals.push((e.height_cm / 100).toFixed(2) + ' m');
            if (e.weight_kg) vals.push(e.weight_kg + ' kg');
            if (e.wingspan_cm) vals.push('env. ' + e.wingspan_cm);
            if (e.vertical_reach_run) vals.push('alc. ' + e.vertical_reach_run);
            ml.appendChild(el('<div class="mini-row"><span><b>' + esc(e.date) + '</b> · ' + esc(vals.join(' · ')) + '</span><span class="hint">' + esc(e.by) + '</span></div>'));
          });
          body.appendChild(ml);
        }

        if (sp) Object.keys(sp.skills).forEach(function (group) {
          body.appendChild(el('<p class="sec-label">' + group + '</p>'));
          var rows = el('<div class="skills"></div>');
          sp.skills[group].forEach(function (sk) {
            var v = (p.stats && p.stats[sk]) || 0;
            rows.appendChild(el('<div class="skill"><span>' + sk + '</span><div class="bar"><i style="width:' + (v ? v * 20 : 4) + '%"></i></div><b>' + (v ? v : 'sin evaluar') + '</b></div>'));
          });
          body.appendChild(rows);
        });

        // Evaluación: registro y edición (permiso por rol)
        var log = p.eval_log || [];
        if (log.length) {
          var last = log[log.length - 1];
          body.appendChild(el('<p class="hint">Última evaluación: <b>' + esc(last.by) + '</b> · ' + esc(last.role) + ' · ' + esc(last.date) + '</p>'));
        } else {
          body.appendChild(el('<p class="hint">Sin evaluación registrada todavía.</p>'));
        }
        if (role().canEvaluate && sp) {
          var groups = role().evalGroups;
          var restricted = groups && groups !== 'all';
          var edEval = el('<button class="btn btn-primary btn-sm">' + ico('star') + (restricted ? 'Editar evaluación física' : 'Editar evaluación') + '</button>');
          edEval.onclick = function () {
            U.modal('Evaluación deportiva — ' + esc(p.full_name), evalForm(p, sp, function (ns) {
              var u = SF.store.currentUser();
              var entry = { by: u.name, role: u.label, date: new Date().toISOString().slice(0, 10) };
              var newLog = (p.eval_log || []).slice(); newLog.push(entry);
              SF.store.update(p.id, { stats: ns, eval_log: newLog });
              p = SF.store.get(p.id); U.toast('Evaluación guardada por ' + u.name); paint();
            }, groups));
          };
          body.appendChild(edEval);
        }
        if (log.length) {
          body.appendChild(el('<p class="sec-label">Historial de evaluaciones</p>'));
          var hl = el('<div class="mini-list"></div>');
          log.slice().reverse().slice(0, 6).forEach(function (e) {
            hl.appendChild(el('<div class="mini-row"><span><b>' + esc(e.by) + '</b> · ' + esc(e.role) + '</span><span class="hint">' + esc(e.date) + '</span></div>'));
          });
          body.appendChild(hl);
        }

        // Trayectoria de clubes
        body.appendChild(el('<p class="sec-label">Trayectoria de clubes</p>'));
        var ch = p.career_history || [];
        var chWrap = el('<div class="mini-list"></div>');
        if (!ch.length) chWrap.appendChild(el('<p class="hint">Sin trayectoria registrada.</p>'));
        ch.forEach(function (c, i) {
          var per = (c.from || '') + (c.to ? '–' + c.to : '');
          var row = el('<div class="mini-row"><span>' + esc(c.club) + (per ? ' · ' + esc(per) : '') + '</span><button class="lnk-del">' + ico('trash') + '</button></div>');
          row.querySelector('.lnk-del').onclick = function () { var arr = (p.career_history || []).slice(); arr.splice(i, 1); SF.store.update(p.id, { career_history: arr }); p = SF.store.get(p.id); paint(); };
          chWrap.appendChild(row);
        });
        body.appendChild(chWrap);
        var addClub = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir club</button>');
        addClub.onclick = function () {
          U.modal('Añadir club a la trayectoria', smallForm(
            [{ name: 'club', label: 'Club' }, { name: 'from', label: 'Desde (año)' }, { name: 'to', label: 'Hasta (año)' }], {},
            function (d) { if (!d.club) return; var arr = (p.career_history || []).slice(); arr.push(d); SF.store.update(p.id, { career_history: arr }); p = SF.store.get(p.id); paint(); }));
        };
        body.appendChild(addClub);

        // Selecciones
        var sel = p.selections || {};
        body.appendChild(el('<p class="sec-label">Selecciones</p>'));
        body.appendChild(el('<div class="field-grid">' + fld('Local / colegio', sel.local) + fld('Provincial', sel.provincial) + fld('Regional', sel.regional) + fld('Nacional', sel.national) + '</div>'));
        var edSel = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Editar selecciones</button>');
        edSel.onclick = function () {
          U.modal('Selecciones', smallForm(
            [{ name: 'local', label: 'Local / colegio' }, { name: 'provincial', label: 'Provincial' }, { name: 'regional', label: 'Regional' }, { name: 'national', label: 'Nacional' }],
            sel, function (d) { SF.store.update(p.id, { selections: d }); p = SF.store.get(p.id); paint(); }));
        };
        body.appendChild(edSel);

        // Competencias
        body.appendChild(el('<p class="sec-label">Competencias</p>'));
        var comps = p.competitions || [];
        var cWrap = el('<div class="mini-list"></div>');
        if (!comps.length) cWrap.appendChild(el('<p class="hint">Sin competencias registradas.</p>'));
        comps.forEach(function (c, i) {
          var meta = [c.place, c.ranking, c.result].filter(Boolean).join(' · ');
          var row = el('<div class="mini-row"><div><b>' + esc(c.name || '—') + '</b> <span class="hint">' + esc(c.date || '') + '</span>' + (meta ? '<br><span class="hint">' + esc(meta) + '</span>' : '') + '</div><button class="lnk-del">' + ico('trash') + '</button></div>');
          row.querySelector('.lnk-del').onclick = function () { var arr = comps.slice(); arr.splice(i, 1); SF.store.update(p.id, { competitions: arr }); p = SF.store.get(p.id); paint(); };
          cWrap.appendChild(row);
        });
        body.appendChild(cWrap);
        var addComp = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir competencia</button>');
        addComp.onclick = function () {
          U.modal('Añadir competencia', smallForm(
            [{ name: 'name', label: 'Nombre' }, { name: 'date', label: 'Fecha' }, { name: 'place', label: 'Lugar' }, { name: 'ranking', label: 'Ranking / puesto' }, { name: 'result', label: 'Marcas / resultado' }], {},
            function (d) { if (!d.name) return; var arr = (p.competitions || []).slice(); arr.push(d); SF.store.update(p.id, { competitions: arr }); p = SF.store.get(p.id); paint(); }));
        };
        body.appendChild(addComp);
      } else if (cur === 'academico') {
        body.appendChild(el('<div class="field-grid">' + fld('Centro', p.school) + fld('Curso', p.course) +
          fld('Promedio de notas', p.gpa) + fld('Nivel de inglés', p.english) + fld('Otros idiomas', p.other_languages) +
          fld('Fecha de graduación', p.graduation_date) + fld('Intereses', p.objective) + '</div>'));
      } else if (cur === 'familia') {
        var fam = p.family || {};
        body.appendChild(el('<div class="field-grid">' + fld('Contacto', fam.contact) + fld('Relación', fam.relation) + fld('Teléfono', fam.phone) + fld('Email', fam.email) + fld('Family activo', p.family_active ? 'Sí' : 'No') + '</div>'));
      } else if (cur === 'documentos') {
        /* Expediente de documentación, compuesto por jugador.
           Cada línea lleva quién la aporta y para cuándo: un visado sin fecha
           no es un pendiente, es un problema que se descubre tarde. */
        var docs = SF.docsOf(p).slice();
        var puedeGestionar = ['director', 'administrativo'].indexOf(SF.store.role()) >= 0;

        function guardar(lista, accion) {
          SF.store.update(p.id, { docs_req: lista });
          p = SF.store.get(p.id); paint();
          if (accion) U.toast(accion);
        }

        var grupos = {};
        docs.forEach(function (d) { (grupos[d.group || 'Otros'] = grupos[d.group || 'Otros'] || []).push(d); });

        var pend = docs.filter(function (d) { return !d.delivered; });
        var venc = docs.filter(SF.docVencido);
        var resumen = el('<div class="empty-panel" style="text-align:left"></div>');
        resumen.appendChild(el('<p><b>' + (docs.length - pend.length) + ' de ' + docs.length + '</b> entregados' +
          (venc.length ? ' · <span class="tag tag-danger">' + venc.length + ' fuera de plazo</span>' : '') + '</p>'));
        body.appendChild(resumen);

        Object.keys(grupos).forEach(function (g) {
          body.appendChild(el('<p class="sec-label">' + esc(g) + '</p>'));
          var dl = el('<div class="mini-list"></div>');
          grupos[g].forEach(function (d) {
            var i = docs.indexOf(d);
            var estado = d.delivered
              ? '<span class="tag tag-green">entregado' + (d.delivered_at ? ' ' + fmtDate(d.delivered_at) : '') + '</span>'
              : (SF.docVencido(d) ? '<span class="tag tag-danger">fuera de plazo</span>' : '<span class="tag tag-warn">pendiente</span>');
            /* La apostilla se controla aparte: un documento puede estar
               entregado y aun así no valer porque le falta el sello. */
            var apo = d.apostilla
              ? (d.apostillado ? ' <span class="tag tag-green">apostillado</span>'
                               : ' <span class="tag tag-danger">falta apostilla</span>')
              : '';
            var plazo = d.due ? '<span class="hint">límite ' + fmtDate(d.due) + '</span>' : '';
            var row = el('<div class="mini-row"><span><b>' + esc(d.label) + '</b> <span class="hint">· lo aporta ' + esc(d.owner || 'Familia') + '</span><br>' +
              estado + apo + ' ' + plazo +
              (d.requisito ? '<br><span class="hint">' + esc(d.requisito) + '</span>' : '') +
              (d.note ? ' <span class="hint">' + esc(d.note) + '</span>' : '') + '</span><span class="row-actions"></span></div>');
            var acts = row.querySelector('.row-actions');
            if (puedeGestionar) {
              var bt = el('<button class="lnk">' + (d.delivered ? 'Marcar pendiente' : 'Marcar entregado') + '</button>');
              bt.onclick = function () {
                var l = docs.slice();
                l[i] = Object.assign({}, d, { delivered: !d.delivered, delivered_at: d.delivered ? '' : new Date().toISOString().slice(0, 10) });
                guardar(l, 'Actualizado');
              };
              if (d.apostilla) {
                var bap = el('<button class="lnk">' + (d.apostillado ? 'Quitar apostilla' : 'Apostillado') + '</button>');
                bap.onclick = function () { var l = docs.slice(); l[i] = Object.assign({}, d, { apostillado: !d.apostillado }); guardar(l, 'Actualizado'); };
                acts.appendChild(bap);
              }
              var be2 = el('<button class="lnk">Plazo</button>');
              be2.onclick = function () {
                U.modal('Plazo y responsable — ' + d.label, smallForm([
                  { name: 'due', label: 'Fecha límite', type: 'date' },
                  { name: 'owner', label: 'Quién lo aporta', type: 'select', options: ['Familia', 'Club', 'Jugador'] },
                  { name: 'note', label: 'Nota', }
                ], d, function (v) {
                  var l = docs.slice(); l[i] = Object.assign({}, d, v); guardar(l, 'Guardado');
                }));
              };
              var bx = el('<button class="lnk-del">' + ico('x') + '</button>');
              bx.onclick = function () { var l = docs.slice(); l.splice(i, 1); guardar(l, 'Quitado del expediente'); };
              acts.appendChild(bt); acts.appendChild(be2); acts.appendChild(bx);
            }
            dl.appendChild(row);
          });
          body.appendChild(dl);
        });

        if (puedeGestionar) {
          var bAdd = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir documento</button>');
          bAdd.onclick = function () {
            var yaKeys = docs.map(function (d) { return d.key; });
            var libres = SF.DOC_CATALOG.filter(function (c) { return yaKeys.indexOf(c.key) < 0; });
            var box = el('<div class="mini-list"></div>');
            if (!libres.length) box.appendChild(el('<p class="hint">Ya están todos los del catálogo.</p>'));
            var porGrupo = {};
            libres.forEach(function (c) { (porGrupo[c.group] = porGrupo[c.group] || []).push(c); });
            Object.keys(porGrupo).forEach(function (g) {
              box.appendChild(el('<p class="sec-label">' + esc(g) + '</p>'));
              porGrupo[g].forEach(function (c) {
                var r = el('<button class="mini-row" style="width:100%;text-align:left;cursor:pointer"><span>' + esc(c.label) + ' <span class="hint">· ' + esc(c.owner) + '</span></span></button>');
                r.onclick = function () {
                  guardar(docs.concat([{ key: c.key, label: c.label, group: c.group, owner: c.owner, due: '', delivered: false }]), c.label + ' añadido');
                  U.closeModal();
                };
                box.appendChild(r);
              });
            });
            U.modal('Añadir al expediente de ' + p.full_name, box);
          };
          body.appendChild(bAdd);

          /* Plantillas: cargar el expediente entero de golpe. Componerlo a
             mano documento a documento es lento y se olvida alguno. */
          var bPre = el('<button class="btn btn-light btn-sm">' + ico('file') + 'Cargar plantilla</button>');
          bPre.onclick = function () {
            var box = el('<div class="mini-list"></div>');
            Object.keys(SF.DOC_PRESETS).forEach(function (nombre) {
              var keys = SF.DOC_PRESETS[nombre];
              var r = el('<button class="mini-row" style="width:100%;text-align:left;cursor:pointer"><span><b>' + esc(nombre) + '</b><br><span class="hint">' + keys.length + ' documentos</span></span></button>');
              r.onclick = function () {
                var ya = docs.map(function (d) { return d.key; });
                var nuevos = keys.filter(function (k) { return ya.indexOf(k) < 0; }).map(function (k) {
                  var c = SF.docCat(k);
                  return { key: c.key, label: c.label, group: c.group, owner: c.owner, due: '',
                           apostilla: !!c.apostilla, apostillado: false, requisito: c.requisito || '', delivered: false };
                });
                U.closeModal();
                guardar(docs.concat(nuevos), nuevos.length + ' documentos añadidos');
              };
              box.appendChild(r);
            });
            U.modal('Plantillas de expediente', box);
          };
          body.appendChild(bPre);

          body.appendChild(el('<p class="hint">El expediente se compone por jugador: un jugador internacional en seguimiento necesita papeles que un jugador local no. <b>' + SF.DOC_FORMATO + '</b></p>'));
        }

        if (SF.store.role() !== 'padre') {
          body.appendChild(el('<p class="sec-label">Antecedentes médicos</p>'));
          var md = p.medical || {};
          var mg = el('<div class="field-grid">' +
            fld('Enfermedad congénita', (md.congenital || '') + (md.congenital_detail ? ' — ' + md.congenital_detail : '')) +
            fld('Enf. respiratorias / cardíacas', (md.cardio_resp || '') + (md.cardio_resp_detail ? ' — ' + md.cardio_resp_detail : '')) +
            fld('Intervenciones quirúrgicas', (md.surgeries || '') + (md.surgeries_detail ? ' — ' + md.surgeries_detail : '')) +
            fld('Lesiones músculo-esqueléticas', (md.injuries || '') + (md.injuries_detail ? ' — ' + md.injuries_detail : '')) +
            fld('Grupo sanguíneo', md.blood_type) +
            fld('Alergias', md.allergies) +
            fld('Correctores (lentes / plantillas)', md.correctors) +
            fld('Esquema de vacunación completo', md.vaccination) + '</div>');
          body.appendChild(mg);
          if (md.notes) body.appendChild(el('<p class="hint">' + esc(md.notes) + '</p>'));
          body.appendChild(el('<p class="hint">Datos de salud sensibles. No visibles en el Portal Family salvo lo que la familia rellene.</p>'));
          var edMed = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Editar antecedentes médicos</button>');
          edMed.onclick = function () {
            U.modal('Antecedentes médicos', smallForm([
              { name: 'congenital', label: 'Enfermedad congénita', type: 'select', options: ['Sí', 'No'] },
              { name: 'congenital_detail', label: '¿Cuál?' },
              { name: 'cardio_resp', label: 'Enf. respiratorias / cardíacas', type: 'select', options: ['Sí', 'No'] },
              { name: 'cardio_resp_detail', label: 'Detalle' },
              { name: 'surgeries', label: 'Intervenciones quirúrgicas', type: 'select', options: ['Sí', 'No'] },
              { name: 'surgeries_detail', label: 'Detalle' },
              { name: 'injuries', label: 'Lesiones músculo-esqueléticas', type: 'select', options: ['Sí', 'No'] },
              { name: 'injuries_detail', label: 'Detalle' },
              { name: 'blood_type', label: 'Grupo sanguíneo' },
              { name: 'allergies', label: 'Alergias (medic. / aliment.)' },
              { name: 'correctors', label: 'Correctores (lentes / plantillas)' },
              { name: 'vaccination', label: 'Vacunación completa', type: 'select', options: ['Sí', 'No'] },
              { name: 'notes', label: 'Observaciones', type: 'textarea' }
            ], md, function (d) { SF.store.update(p.id, { medical: d }); p = SF.store.get(p.id); U.toast('Antecedentes guardados'); paint(); }));
          };
          body.appendChild(edMed);
        }
      } else if (cur === 'videos') {
        body.appendChild(el('<div class="empty-panel"><div class="em-ic">' + ico('camera') + '</div><p>Sin vídeos aún. En v0.3 (Supabase) se subirán highlights, partidos y entrenamientos.</p></div>'));
      } else if (cur === 'captacion') {
        body.appendChild(el('<div class="field-grid">' + fld('Canal de origen', p.channel) + fld('Fecha de captación', p.capture_date) + fld('Responsable', p.responsible) + fld('Objetivo', p.objective) + '</div>'));
      } else if (cur === 'seguimiento') {
        var tr = p.tracking || { steps: {}, log: [], next: {} };
        var canT = SF.store.role() !== 'padre';
        var statusIdx = SF.PIPELINE.indexOf(p.status === 'Rechazado' ? 'Inscrito' : p.status);

        // Próxima acción
        body.appendChild(el('<p class="sec-label">Próxima acción</p>'));
        var nx = tr.next || {};
        body.appendChild(el('<p class="hint">' + (nx.action ? '<b>' + esc(nx.action) + '</b>' + (nx.date ? ' · ' + fmtDate(nx.date) : '') : 'Sin próxima acción definida.') + '</p>'));
        if (canT) {
          var bn = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Definir próxima acción</button>');
          bn.onclick = function () {
            U.modal('Próxima acción', smallForm([{ name: 'action', label: 'Acción' }, { name: 'date', label: 'Fecha', type: 'date' }], { action: nx.action, date: nx.date }, function (d) {
              var t2 = JSON.parse(JSON.stringify(p.tracking || { steps: {}, log: [] })); t2.next = { action: d.action, date: d.date };
              SF.store.update(p.id, { tracking: t2 }); p = SF.store.get(p.id); U.toast('Próxima acción guardada'); paint();
            }));
          };
          body.appendChild(bn);
        }

        // Línea temporal con hitos marcables
        body.appendChild(el('<p class="sec-label">Línea temporal</p>'));
        body.appendChild(el('<p class="hint">' + (canT ? 'Toca un hito para marcarlo como completado y dejar una anotación de qué pasó y cuándo.' : 'Estado del proceso del jugador.') + '</p>'));
        var tl = el('<div class="timeline"></div>');
        SF.PIPELINE.forEach(function (s, i) {
          var st = (tr.steps || {})[s] || {};
          var done = st.done || i <= statusIdx;
          var meaning = (SF.PIPELINE_INFO || {})[s] || '';
          var meta = st.date ? '<span class="tl-meta">' + (st.by ? esc(st.by) + ' · ' : '') + fmtDate(st.date) + '</span>' : '';
          var step = el('<div class="tl-step ' + (done ? 'done' : '') + (canT ? ' clickable' : '') + '"><span class="tl-dot"></span>' +
            '<div class="tl-body"><div class="tl-title">' + esc(s) + meta + '</div>' +
            '<div class="tl-desc">' + esc(meaning) + '</div>' +
            (st.note ? '<div class="tl-note">' + esc(st.note) + '</div>' : '') + '</div></div>');
          if (canT) {
            step.onclick = function () {
              U.modal('Hito: ' + esc(s), smallForm([
                { name: 'done', label: '¿Completado?', type: 'select', options: ['Sí', 'No'] },
                { name: 'date', label: 'Fecha', type: 'date' },
                { name: 'note', label: 'Anotación', type: 'textarea' }
              ], { done: done ? 'Sí' : 'No', date: st.date || new Date().toISOString().slice(0, 10), note: st.note || '' }, function (d) {
                var t2 = JSON.parse(JSON.stringify(p.tracking || { steps: {}, log: [] })); if (!t2.steps) t2.steps = {};
                t2.steps[s] = { done: d.done === 'Sí', date: d.date, by: SF.store.currentUser().name, note: d.note };
                SF.store.update(p.id, { tracking: t2 }); p = SF.store.get(p.id); U.toast('Hito actualizado'); paint();
              }));
            };
          }
          tl.appendChild(step);
        });
        body.appendChild(tl);

        // Registro de seguimiento (anotaciones)
        body.appendChild(el('<p class="sec-label">Registro de seguimiento</p>'));
        var slog = (tr.log || []).slice().reverse();
        var lw = el('<div class="wall"></div>');
        if (!slog.length) lw.appendChild(el('<p class="hint">Sin anotaciones todavía.</p>'));
        slog.forEach(function (m) { lw.appendChild(el('<div class="msg"><div class="msg-head"><b>' + esc(m.by) + '</b> <span class="hint">' + esc(m.date) + '</span></div><p>' + esc(m.text) + '</p></div>')); });
        body.appendChild(lw);
        if (canT) {
          var comp = el('<div class="composer"><textarea id="tn" placeholder="Añade una anotación de seguimiento…"></textarea><button class="btn btn-primary" id="ta">' + ico('arrow') + 'Añadir</button></div>');
          body.appendChild(comp);
          comp.querySelector('#ta').onclick = function () {
            var txt = comp.querySelector('#tn').value.trim(); if (!txt) return;
            var t2 = JSON.parse(JSON.stringify(p.tracking || { steps: {}, log: [] })); if (!t2.log) t2.log = [];
            t2.log.push({ date: new Date().toISOString().slice(0, 10), by: SF.store.currentUser().name, text: txt });
            SF.store.update(p.id, { tracking: t2 }); p = SF.store.get(p.id); U.toast('Anotación añadida'); paint();
          };
        }
      } else if (cur === 'informes') {
        var b = el('<button class="btn btn-primary">' + ico('ai') + 'Analizar con IA</button>');
        b.onclick = function () { analizarIA(p); };
        body.appendChild(b);
        body.appendChild(el('<p class="hint">Genera resumen ejecutivo, fortalezas, áreas de mejora y siguiente paso (simulado).</p>'));
      } else if (cur === 'finanzas') {
        if (!role().canSeeFinance) { body.appendChild(el('<div class="empty-panel"><p>Tu rol no tiene acceso a finanzas.</p></div>')); return; }
        var refF = function () { p = SF.store.get(p.id); paint(); };
        body.appendChild(bankBlock(p, role().canManageFinance, refF));
        body.appendChild(finPlanBlock(p, role().canManageFinance, refF));
        if (role().canManageFinance) { var bf = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Generar plan FBM</button>'); bf.onclick = function () { genPlanFBMModal(p, refF); }; body.appendChild(bf); }
        body.appendChild(kitBlock(p, role().canManageFinance, refF));
      } else if (cur === 'portal') {
        var b3 = el('<button class="btn btn-primary">' + ico('family') + 'Ver portal de la familia</button>');
        b3.onclick = function () { location.hash = '#/portal-family/' + p.id; };
        body.appendChild(el('<div class="field-grid">' + fld('Acceso Family', p.family_active ? 'Activado' : 'No activado') + fld('Contacto', (p.family || {}).contact) + '</div>'));
        body.appendChild(b3);
      } else if (cur === 'notas') {
        if (!role().canSeeNotes) { body.appendChild(el('<div class="empty-panel"><p>Tu rol no puede ver notas internas.</p></div>')); return; }
        var ta = el('<textarea class="notes" placeholder="Situación económica, presupuesto, beca posible, observaciones de scout…">' + esc(p.notes_internal) + '</textarea>');
        var sv = el('<button class="btn btn-primary">Guardar notas</button>');
        sv.onclick = function () { SF.store.update(p.id, { notes_internal: ta.value }); p = SF.store.get(p.id); U.toast('Notas guardadas'); };
        body.appendChild(el('<p class="hint">Solo staff autorizado. Aquí vive el presupuesto y la situación económica.</p>'));
        body.appendChild(ta); body.appendChild(sv);
      }
    }
    paint();
  };

  /* "Analizar con IA" — resumen basado en reglas (simulado, honesto) */
  function analizarIA(p) {
    var strengths = [], gaps = [];
    if (p.height_cm >= 195) strengths.push('Envergadura física destacada para su posición.');
    if (p.scout_score >= 80) strengths.push('Scout Score alto (' + p.scout_score + ').');
    if ((p.nationality || []).length > 1) strengths.push('Doble nacionalidad: facilita movilidad internacional.');
    if (!strengths.length) strengths.push('Perfil en evaluación; faltan datos para destacar fortalezas.');
    var missing = [];
    if (p.documents.pasaporte === 'pendiente') missing.push('pasaporte');
    if (p.documents.video_highlights === 'pendiente') missing.push('vídeo highlights');
    if (!p.email) missing.push('email de contacto');
    if (!p.club) missing.push('club actual');
    if (missing.length) gaps.push('Faltan: ' + missing.join(', ') + '.');
    var next = p.status === 'Datos incompletos' ? 'Completar la ficha y solicitar vídeo a la familia.' :
      p.status === 'En evaluación' ? 'Asignar Scout Score y agendar entrevista.' :
        p.status === 'Entrevista' ? 'Preparar oferta tras la entrevista.' : 'Hacer seguimiento del estado actual.';
    var node = el('<div class="ia-report"><p class="sec-label">Resumen ejecutivo</p><p>' + esc(p.full_name) + ', ' + (p.birth_year || '') + ', ' + esc(p.primary_position || '') + '. Estado: ' + esc(p.status) + '.</p>' +
      '<p class="sec-label">Fortalezas</p><ul>' + strengths.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +
      '<p class="sec-label">Áreas / datos faltantes</p><ul>' + (gaps.length ? gaps : ['Ficha razonablemente completa.']).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +
      '<p class="sec-label">Siguiente paso sugerido</p><p>' + esc(next) + '</p>' +
      '<p class="hint">Generado por reglas (demo). En v0.3 esto lo produce la IA real con el texto y documentos del jugador.</p></div>');
    U.modal('Análisis con IA · ' + p.full_name, node);
  }

  pages.importar = function (view) {
    view.innerHTML = head('Importar con IA', 'Pega un mensaje, email o nota y la IA arma la ficha (extracción simulada).');
    var wrap = el('<div class="import-wrap"></div>');
    var ta = el('<textarea class="import-ta" placeholder="Ej: Pablo Ignacio Andrés Suárez nacido el 25 de agosto del 2002, posición Base/Escolta, nacionalidad argentina y española, mide 1,86 m"></textarea>');
    var btns = el('<div class="row-c"><button class="btn btn-primary" id="ext">' + ico('ai') + 'Extraer datos</button></div>');
    var outp = el('<div id="ext-out"></div>');
    wrap.appendChild(ta); wrap.appendChild(btns); wrap.appendChild(outp);
    view.appendChild(wrap);

    btns.querySelector('#ext').onclick = function () {
      var t = ta.value.trim(); if (!t) { U.toast('Pega algún texto primero'); return; }
      var d = parseText(t);
      outp.innerHTML = '';
      var card = el('<div class="card"><p class="sec-label">Datos detectados</p></div>');
      var g = el('<div class="field-grid">' + fld('Nombre', ((d.first_name || '') + ' ' + (d.last_name || '')).trim()) + fld('Año', d.birth_year) + fld('Posición', d.primary_position) + fld('Nacionalidad', (d.nationality || []).join(', ')) + fld('Altura', d.height_cm ? (d.height_cm / 100).toFixed(2) + ' m' : '') + '</div>');
      card.appendChild(g);
      var miss = [];
      if (!d.email) miss.push('email'); if (!d.city) miss.push('ciudad'); if (!d.club) miss.push('club'); miss.push('foto', 'documentos');
      card.appendChild(el('<p class="sec-label">Datos faltantes</p><p class="hint">' + miss.join(', ') + '.</p>'));
      var crear = el('<button class="btn btn-primary">Crear ficha</button>');
      crear.onclick = function () { U.modal('Revisar y crear ficha', playerForm(d, function (data) { var np = SF.store.create(data); U.toast('Ficha creada'); location.hash = '#/jugador/' + np.id; })); };
      card.appendChild(crear);
      outp.appendChild(card);
    };

    function parseText(t) {
      var d = { sport: 'baloncesto', status: 'Datos incompletos' };
      var year = (t.match(/\b(19|20)\d{2}\b/) || [])[0]; if (year) d.birth_year = +year;
      var h = t.match(/1[,\.]\d{2}\s*m|\b1\d{2}\s*cm/i);
      if (h) { var num = h[0].replace(/[^\d,\.]/g, '').replace(',', '.'); d.height_cm = num.indexOf('.') >= 0 ? Math.round(parseFloat(num) * 100) : +num; }
      var pos = ['Base', 'Escolta', 'Alero', 'Ala-pívot', 'Pívot'].filter(function (p) { return new RegExp(p, 'i').test(t); });
      if (pos.length) { d.primary_position = pos[0]; if (pos[1]) d.secondary_position = pos[1]; }
      var nats = []; if (/argentin/i.test(t)) nats.push('Argentina'); if (/español|espana|españa/i.test(t)) nats.push('España'); if (/mexic|méxic/i.test(t)) nats.push('México'); if (/colombi/i.test(t)) nats.push('Colombia');
      d.nationality = nats;
      var words = t.split(/[\n,]/)[0].trim().split(/\s+/).filter(function (w) { return /^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+$/.test(w); });
      if (words.length) { d.first_name = words.slice(0, 2).join(' '); d.last_name = words.slice(2).join(' '); }
      return d;
    }
  };

  /* ===================== DOCUMENTOS ===================== */
  /* ===================== DOCUMENTOS =====================
     Esta pantalla NO repite lo que ya está en cada ficha: enseña solo
     LO QUE FALTA, en jugadores y en staff, y sirve para pedirlo.
     El recordatorio se manda uno a uno: cada familia recibe solo lo suyo,
     nunca una lista con los nombres de los demás. */
  pages.documentos = function (view) {
    view.innerHTML = head('Documentos', 'Solo lo que falta. Desde aquí se pide.');
    /* Por defecto avisan dirección y administración. Si el director le da el
       permiso "Gestionar documentación" a otra persona, aquí lo hereda sola. */
    var puedeAvisar = role().canDocs || ['director', 'administrativo'].indexOf(SF.store.role()) >= 0;

    /* ---------- filtro por equipo ---------- */
    var teams = SF.store.teams();
    var bar = el('<div class="filters"><select id="ft"><option value="">Todos los equipos</option>' +
      teams.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + '</option>'; }).join('') +
      '<option value="__sin">Sin equipo</option></select></div>');
    view.appendChild(bar);

    var out = el('<div></div>'); view.appendChild(out);

    function paint() {
      out.innerHTML = '';
      var ft = bar.querySelector('#ft').value;
      var ps = SF.store.players().filter(function (p) {
        if (ft === '__sin') return !p.team_id;
        return !ft || p.team_id === ft;
      });
      var faltan = ps.map(function (p) { return { p: p, pend: SF.docsPend(p) }; })
        .filter(function (x) { return x.pend.length; });
      // Lo que está fuera de plazo va primero: es lo que urge.
      faltan.sort(function (a, b) {
        return b.pend.filter(SF.docVencido).length - a.pend.filter(SF.docVencido).length;
      });

      /* ---------- resumen y envío masivo ---------- */
      var top = el('<div class="empty-panel" style="text-align:left"></div>');
      if (!faltan.length) {
        top.appendChild(el('<p><b>Nada pendiente.</b> Toda la documentación de jugadores está entregada.</p>'));
      } else {
        var totalDocs = faltan.reduce(function (a, x) { return a + x.pend.length; }, 0);
        top.appendChild(el('<p><b>' + faltan.length + ' jugador' + (faltan.length === 1 ? '' : 'es') + '</b> con documentación pendiente · ' + totalDocs + ' documento' + (totalDocs === 1 ? '' : 's') + ' en total</p>'));
        if (puedeAvisar) {
          var bAll = el('<button class="btn btn-primary btn-sm">' + ico('ai') + 'Enviar recordatorio a los ' + faltan.length + '</button>');
          bAll.onclick = function () {
            if (!confirm('Se enviará un aviso a cada familia con SU documentación pendiente. Nadie ve la de los demás. ¿Continuar?')) return;
            var n = 0;
            faltan.forEach(function (x) { if (enviarRecordatorio(x.p, x.pend)) n++; });
            U.toast(n + ' recordatorios enviados'); SF.router.render();
          };
          top.appendChild(bAll);
          top.appendChild(el('<p class="hint">Cada familia recibe un aviso propio, solo con lo que le falta a su hijo/a.</p>'));
        } else {
          top.appendChild(el('<p class="hint">Los recordatorios los envía dirección o administración.</p>'));
        }
      }
      out.appendChild(top);

      /* ---------- jugadores ---------- */
      if (faltan.length) {
        out.appendChild(el('<p class="sec-label">Jugadores</p>'));
        var l = el('<div class="mini-list"></div>');
        faltan.forEach(function (x) {
          var tName = x.p.team_id ? (SF.store.teamGet(x.p.team_id) || {}).name : 'En seguimiento · sin equipo';
          var av = x.p.doc_reminder_at ? '<span class="hint">avisado ' + fmtDate(x.p.doc_reminder_at) + '</span>' : '';
          var row = el('<div class="mini-row"><span><b>' + esc(x.p.full_name) + '</b> <span class="hint">' + SF.fichaCode(x.p.ficha) + ' · ' + esc(tName || '') + '</span><br>' +
            x.pend.map(function (d) {
              return '<span class="tag ' + (SF.docVencido(d) ? 'tag-danger' : 'tag-warn') + '">' + esc(d.label) +
                (d.due ? ' · ' + fmtDate(d.due) : '') + '</span>';
            }).join(' ') + '</span>' +
            '<span class="row-actions">' + av + '<button class="lnk" data-f>Ficha</button></span></div>');
          row.querySelector('[data-f]').onclick = function () { location.hash = '#/jugador/' + x.p.id; };
          if (puedeAvisar) {
            var b1 = el('<button class="lnk" data-r>Recordar</button>');
            b1.onclick = function () {
              if (enviarRecordatorio(x.p, x.pend)) { U.toast('Recordatorio enviado a ' + x.p.full_name); SF.router.render(); }
            };
            row.querySelector('.row-actions').insertBefore(b1, row.querySelector('[data-f]'));
          }
          l.appendChild(row);
        });
        out.appendChild(l);
      }

      /* ---------- staff ---------- */
      var staffMal = SF.store.staff().filter(function (s) { return SF.staffStatus(s).level !== 'ok'; });
      out.appendChild(el('<p class="sec-label">Staff</p>'));
      if (!staffMal.length) out.appendChild(el('<p class="hint">Todo el staff está al día.</p>'));
      var sl = el('<div class="mini-list"></div>');
      staffMal.forEach(function (s) {
        var st = SF.staffStatus(s);
        var cls = st.level === 'warn' ? 'tag-warn' : 'tag-danger';
        var row = el('<div class="mini-row"><span><b>' + esc(s.full_name) + '</b> <span class="hint">' + SF.staffCode(s.num) + ' · ' + esc(roleLabel(s.role)) + '</span><br>' +
          '<span class="tag ' + cls + '">' + st.label + '</span> <span class="hint">' + esc(st.why) + '</span></span>' +
          '<span class="row-actions"><button class="lnk" data-f>Ficha</button></span></div>');
        row.querySelector('[data-f]').onclick = function () { location.hash = '#/staff/' + s.id; };
        sl.appendChild(row);
      });
      out.appendChild(sl);
      if (staffMal.length) out.appendChild(el('<p class="hint">El staff todavía no recibe recordatorios por la app: la comunicación con el personal está sin construir. De momento se avisa por correo desde administración.</p>'));
    }

    /* Envía un aviso individual a la familia con SU documentación pendiente */
    function enviarRecordatorio(p, pend) {
      /* Funciona con o sin equipo: un jugador en seguimiento todavía no
         pertenece a ninguno y es justo al que más papeles le faltan. */
      var soloFamilia = pend.filter(function (d) { return (d.owner || 'Familia') !== 'Club'; });
      if (!soloFamilia.length) return false;   // si todo lo tramita el club, no se molesta a la familia

      /* El aviso arrastra el requisito y la apostilla de cada documento.
         Es justo lo que hoy se escribe a mano en un WhatsApp larguísimo, y
         donde se cuela el error que hace que el consulado lo devuelva. */
      var lista = soloFamilia.map(function (d) {
        var t = '· ' + d.label + (d.due ? '  — antes del ' + fmtDate(d.due) : '');
        if (d.apostilla) t += '\n    ⚠ Debe llevar la Apostilla de La Haya. Sin ese sello no se acepta en España.';
        if (d.requisito) t += '\n    ' + d.requisito;
        if (d.delivered && d.apostilla && !d.apostillado) t += '\n    (Ya lo tenemos, pero falta apostillarlo.)';
        return t;
      }).join('\n\n');

      SF.store.annCreate(p.team_id || null, {
        kind: 'documentacion',
        title: 'Documentación pendiente',
        body: 'Todavía falta por reunir:\n\n' + lista +
              '\n\n' + SF.DOC_FORMATO +
              '\n\nPuedes enviarlo por correo a secretaría o entregarlo en el club. Lo marcamos al recibirlo.'
      }, [p.id]);
      SF.store.update(p.id, { doc_reminder_at: new Date().toISOString().slice(0, 10) });
      return true;
    }

    bar.querySelector('#ft').addEventListener('change', paint);
    paint();
  };

  /* ===================== FINANZAS (helpers) ===================== */
  function finTag(s) { var c = s === 'pagado' ? 'green' : s === 'vencido' ? 'danger' : 'warn'; return '<span class="tag tag-' + c + '">' + esc(s) + '</span>'; }
  function nextStatus(s) { var o = ['pendiente', 'pagado', 'vencido']; return o[(o.indexOf(s) + 1) % 3]; }
  function finSaveItems(p, items, refresh) { SF.store.update(p.id, { finance: { items: items } }); refresh(); }

  function genCuotasModal(p, refresh) {
    var mo = SF.MONTHS.map(function (m) { return '<option>' + m + '</option>'; }).join('');
    var f = el('<div class="form-grid">' +
      '<div class="frow"><label>Desde mes</label><select id="fm">' + mo + '</select></div>' +
      '<div class="frow"><label>Hasta mes</label><select id="tm">' + mo + '</select></div>' +
      '<div class="frow"><label>Importe por cuota (€)</label><input id="amt" type="number" value="95"></div></div>');
    var foot = el('<div class="modal-actions"><button class="btn">Cancelar</button><button class="btn btn-primary">Generar</button></div>');
    foot.children[0].onclick = U.closeModal;
    foot.children[1].onclick = function () {
      var from = SF.MONTHS.indexOf(f.querySelector('#fm').value), to = SF.MONTHS.indexOf(f.querySelector('#tm').value), amt = +f.querySelector('#amt').value || 0;
      if (to < from) { U.toast('El mes final es anterior al inicial'); return; }
      var items = SF.finItems(p).slice(), now = Date.now();

  /* ===================== PERMISOS ===================== */
  pages.permisos = function (view) {
    view.innerHTML = head('Permisos', 'Lo que cada rol trae por defecto, y lo que el director concede aparte.');
    var esDirector = SF.store.role() === 'director';
    function yn(b) { return b ? '<span class="tag tag-green">Sí</span>' : '<span class="tag tag-gray">No</span>'; }

    /* ---------- 1. Por defecto ---------- */
    view.appendChild(el('<p class="sec-label">Por defecto, según el rol</p>'));
    var t = el('<table class="tbl"><thead><tr><th>Rol</th><th>Secciones</th><th>Evalúa</th><th>Medidas</th><th>Score</th><th>Finanzas</th><th>Notas internas</th></tr></thead><tbody></tbody></table>');
    var tb = t.querySelector('tbody');
    Object.keys(SF.ROLES).forEach(function (k) {
      var r = SF.ROLES[k];
      tb.appendChild(el('<tr><td><b>' + esc(r.label) + '</b></td><td>' + r.nav.length + (r.nav.length === 1 ? ' sección' : ' secciones') + '</td><td>' + yn(r.canEvaluate) + '</td><td>' + yn(r.canEditPhysical) + '</td><td>' + yn(r.canSeeScore) + '</td><td>' + yn(r.canSeeFinance) + '</td><td>' + yn(r.canSeeNotes) + '</td></tr>'));
    });
    view.appendChild(t);

    /* ---------- 2. Permisos particulares ---------- */
    view.appendChild(el('<p class="sec-label">Permisos particulares</p>'));
    view.appendChild(el('<p class="hint">Para las excepciones: el entrenador que además lleva la caja de su equipo, o el scout que necesita ver el Scout Score. <b>Solo suman</b> sobre lo que ya da el rol, nunca quitan, y <b>caducan siempre</b>.</p>'));

    if (esDirector) {
      var bNew = el('<button class="btn btn-primary btn-sm">' + ico('shield') + 'Conceder un permiso</button>');
      bNew.onclick = function () {
        var staff = SF.store.staff();
        var delegables = SF.PERM_KEYS.filter(function (p) { return SF.PERM_NUNCA.indexOf(p.key) < 0; });
        var finTemporada = (new Date().getFullYear() + 1) + '-06-30';
        U.modal('Conceder un permiso', smallForm([
          { name: 'staff_id', label: '¿A quién?', type: 'select', options: staff.map(function (s) { return s.full_name + ' — ' + roleLabel(s.role); }) },
          { name: 'perm', label: '¿Qué permiso?', type: 'select', options: delegables.map(function (p) { return p.label; }) },
          { name: 'reason', label: '¿Por qué? (obligatorio)', type: 'textarea' },
          { name: 'until', label: 'Caduca el', type: 'date' }
        ], { until: finTemporada }, function (d) {
          if (!d.reason || !d.reason.trim()) { U.toast('El motivo es obligatorio'); return false; }
          if (!d.until) { U.toast('Hay que ponerle fecha de caducidad'); return false; }
          var s = staff.filter(function (x) { return (x.full_name + ' — ' + roleLabel(x.role)) === d.staff_id; })[0];
          var p = delegables.filter(function (x) { return x.label === d.perm; })[0];
          if (!s || !p) { U.toast('Falta elegir persona y permiso'); return false; }
          SF.store.userPermGrant(s.id, p.key, d.reason.trim(), d.until);
          U.toast('Permiso concedido a ' + s.full_name); SF.router.render();
        }));
      };
      view.appendChild(bNew);
    } else {
      view.appendChild(el('<p class="hint">Solo el director puede conceder permisos particulares.</p>'));
    }

    var todos = SF.store.userPerms().filter(function (x) { return !x.revoked_at; });
    var hoy = new Date().toISOString().slice(0, 10);
    if (!todos.length) view.appendChild(el('<p class="hint">No hay ningún permiso particular concedido.</p>'));
    var l = el('<div class="mini-list"></div>');
    todos.forEach(function (x) {
      var s = SF.store.staffGet(x.staff_id); if (!s) return;
      var caducado = x.until < hoy;
      var dias = Math.round((new Date(x.until) - new Date(hoy)) / 86400000);
      var estado = caducado ? '<span class="tag tag-gray">caducado</span>'
        : (dias <= 30 ? '<span class="tag tag-warn">caduca en ' + dias + ' días</span>' : '<span class="tag tag-green">vigente</span>');
      var row = el('<div class="mini-row"><span><b>' + esc(s.full_name) + '</b> <span class="hint">' + esc(roleLabel(s.role)) + '</span><br>' +
        esc(SF.permLabel(x.perm)) + ' · ' + estado + ' <span class="hint">hasta ' + fmtDate(x.until) + '</span><br>' +
        '<span class="hint"><i>"' + esc(x.reason) + '"</i> — concedido por ' + esc(x.granted_by) + ' el ' + fmtDate(x.granted_at) + '</span></span>' +
        '<span class="row-actions"></span></div>');
      if (esDirector) {
        var bq = el('<button class="lnk-del">Retirar</button>');
        bq.onclick = function () { SF.store.userPermRevoke(x.id); U.toast('Permiso retirado'); SF.router.render(); };
        row.querySelector('.row-actions').appendChild(bq);
      }
      l.appendChild(row);
    });
    view.appendChild(l);

    /* ---------- 3. La pregunta al revés ----------
       "¿Quién puede ver las finanzas?" es la pregunta que te van a hacer
       algún día. Con la matriz sola no se responde. */
    view.appendChild(el('<p class="sec-label">¿Quién puede hacer cada cosa?</p>'));
    var inv = el('<div class="mini-list"></div>');
    SF.PERM_KEYS.forEach(function (p) {
      /* Un rol "puede" si tiene la marca, o si tiene la sección que da acceso:
         para las secciones, entrar ya es poder. */
      var porRol = Object.keys(SF.ROLES).filter(function (k) {
        var r = SF.ROLES[k];
        if (r[p.key]) return true;
        return (p.nav || []).some(function (n) { return r.nav.indexOf(n) >= 0; });
      }).map(function (k) { return SF.ROLES[k].label; });
      var porExc = todos.filter(function (x) { return x.perm === p.key && x.until >= hoy; })

  /* ===================== ECONOMÍA DE LA ACADEMIA ===================== */
  function econSummary() {
    var ps = SF.store.players(), income = 0, pending = 0;
    ps.forEach(function (p) { var t = SF.finTotals(p); income += t.paid; pending += t.pending + t.overdue; });
    var exps = SF.store.expenses();
    var spent = exps.filter(function (e) { return e.status === 'aprobado'; }).reduce(function (s, e) { return s + (+e.amount || 0); }, 0);
    var ec = SF.store.academy().economy || {};
    var prev = +ec.prev_balance || 0;
    return { income: income, pending: pending, spent: spent, prev: prev, balance: prev + income - spent, est_income: +ec.est_income || 0, est_expense: +ec.est_expense || 0, exps: exps, players: ps };
  }
  function eur(n) { return Math.round(n).toLocaleString('es-ES') + ' €'; }
  function expStatusTag(s) { return '<span class="tag tag-' + (s === 'aprobado' ? 'green' : s === 'rechazado' ? 'danger' : 'warn') + '">' + esc(s) + '</span>'; }

  function expenseModal(refresh) {
    var cats = (SF.EXPENSE_CATEGORIES || []).map(function (c) { return '<option>' + c + '</option>'; }).join('');
    var f = el('<div class="form-grid">' +
      '<div class="frow"><label>Concepto</label><input id="c" placeholder="Escríbelo, ej.: compra en supermercado"></div>' +
      '<div class="frow"><label>Categoría</label><input id="cat" list="sf-catlist" placeholder="Ej.: Supermercado"><datalist id="sf-catlist">' + cats + '</datalist></div>' +
      '<div class="frow"><label>Importe (€)</label><input id="amt" type="number"></div>' +
      '<div class="frow"><label>Fecha</label><input id="d" type="date" value="' + new Date().toISOString().slice(0, 10) + '"></div>' +
      '<div class="frow"><label>Ticket / factura (foto, si procede)</label><input id="tk" type="file" accept="image/*,application/pdf" capture="environment"></div>' +
      '<div class="frow"><label>Nota (opcional)</label><input id="n"></div></div>');
    var prev = el('<div class="tk-prev"></div>'); f.appendChild(prev);
    var ticket = { name: '', data: '' };
    f.querySelector('#tk').onchange = function (ev) {
      var file = ev.target.files && ev.target.files[0]; if (!file) return;
      ticket.name = file.name;
      if (/^image\//.test(file.type)) { var rd = new FileReader(); rd.onload = function () { ticket.data = rd.result; prev.innerHTML = '<img src="' + rd.result + '" alt="ticket">'; }; rd.readAsDataURL(file); }
      else { prev.innerHTML = '<span class="hint">Adjunto: ' + esc(file.name) + '</span>'; }
    };
    var foot = el('<div class="modal-actions"><button class="btn">Cancelar</button><button class="btn btn-primary">Enviar gasto</button></div>');
    foot.children[0].onclick = U.closeModal;
    foot.children[1].onclick = function () {
      var concept = f.querySelector('#c').value.trim(), amt = +f.querySelector('#amt').value || 0;
      if (!concept || !amt) { U.toast('Indica concepto e importe'); return; }
      var u = SF.store.currentUser();
      SF.store.expenseAdd({ id: 'g' + Date.now(), date: f.querySelector('#d').value, concept: concept, category: f.querySelector('#cat').value.trim() || 'Otros', amount: amt, by: u.name, role: u.label, status: 'pendiente', note: f.querySelector('#n').value.trim(), ticket: ticket.name, ticket_data: ticket.data });
      U.closeModal(); refresh(); U.toast('Gasto enviado a administración');
    };
    var w = el('<div></div>'); w.appendChild(f); w.appendChild(foot); U.modal('Pasar un gasto', w);
  }

  function expenseRow(e, canManage, refresh) {
    var tk = e.ticket ? (e.ticket_data ? '<a class="lnk" data-tk>ver ticket</a>' : '<span class="hint">' + esc(e.ticket) + '</span>') : '';
    var row = el('<div class="exp-row"><div class="exp-main"><b>' + esc(e.concept) + '</b><span class="hint">' + esc(e.category) + ' · ' + esc(e.by) + ' · ' + esc(e.date) + (tk ? ' · ' + tk : '') + '</span></div>' +
      '<div class="exp-side">' + eur(+e.amount || 0) + ' ' + expStatusTag(e.status) +
      (canManage ? ' <button class="lnk" data-ap>' + (e.status === 'aprobado' ? 'rechazar' : 'aprobar') + '</button><button class="lnk-del" data-rm>' + ico('x') + '</button>' : '') + '</div></div>');
    if (e.ticket_data) { var a = row.querySelector('[data-tk]'); if (a) a.onclick = function () { U.modal('Ticket — ' + esc(e.concept), el('<div class="tk-prev big"><img src="' + e.ticket_data + '"></div>')); }; }
