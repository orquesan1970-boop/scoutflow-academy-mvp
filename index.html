         entrenadores del equipo. Con lo anterior, un fisioterapeuta o un
         psicólogo —que no son "coaches" de ningún equipo— no veían a ningún
         jugador y su pantalla salía vacía. Se conserva la lista de
         entrenadores como respaldo para los equipos antiguos. */
      var me = SF.store.staffMe();
      var nombre = SF.store.currentUser().name;
      var myTeams = SF.store.teams().filter(function (t) {
        if (me && (me.team_ids || []).indexOf(t.id) >= 0) return true;
        return (t.coaches || []).indexOf(nombre) >= 0;
      }).map(function (t) { return t.id; });
      return all.filter(function (p) { return myTeams.indexOf(p.team_id) >= 0; });
    }
    if (r.segments && r.segments !== 'all') {
      var seg = {};
      SF.store.teams().forEach(function (t) { seg[t.id] = t.segment; });
      return all.filter(function (p) { return p.team_id && r.segments.indexOf(seg[p.team_id]) >= 0; });
    }
    return all;
  }
  function fld(label, val) { return '<div class="field"><span class="f-label">' + esc(label) + '</span><span class="f-val">' + (val == null || val === '' ? '—' : esc(val)) + '</span></div>'; }

  /* Mini-formulario reutilizable para modales (competencias, selecciones, salud) */
  function smallForm(fields, current, onSave) {
    current = current || {};
    var f = el('<div class="form-grid"></div>');
    f.innerHTML = fields.map(function (fd) {
      /* 'sep' no es un campo: parte el formulario en bloques con título. Sin
         esto, la antropometría y los tests de rendimiento quedan en una lista
         de veinte casillas iguales y no se distingue qué es cada cosa. */
      if (fd.sep) return '<div class="frow frow-sep"><p class="sec-label">' + esc(fd.sep) + '</p>' +
        (fd.nota ? '<p class="hint">' + fd.nota + '</p>' : '') + '</div>';
      var v = current[fd.name] != null ? current[fd.name] : '';
      var inner;
      if (fd.type === 'select') {
        inner = '<select name="' + fd.name + '"><option value="">—</option>' +
          fd.options.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
      } else if (fd.type === 'textarea') {
        inner = '<textarea name="' + fd.name + '">' + esc(v) + '</textarea>';
      } else {
        /* 'step' es imprescindible en los tests: un sprint son 3,12 segundos.
           Sin step, el navegador solo acepta enteros y el dato no se puede
           meter. */
        inner = '<input type="' + (fd.type || 'text') + '" name="' + fd.name + '"' +
          (fd.step ? ' step="' + fd.step + '"' : '') + ' value="' + esc(v) + '">';
      }
      return '<div class="frow"><label>' + fd.label + '</label>' + inner +
        (fd.hint ? '<span class="hint">' + fd.hint + '</span>' : '') + '</div>';
    }).join('');
    var foot = el('<div class="modal-actions"><button class="btn">Cancelar</button><button class="btn btn-primary">Guardar</button></div>');
    foot.children[0].onclick = U.closeModal;
    foot.children[1].onclick = function () {
      var data = {};
      f.querySelectorAll('input,select,textarea').forEach(function (i) {
        var val = (i.value || '').trim();
        var fd = fields.filter(function (x) { return x.name === i.name; })[0];
        data[i.name] = (fd && fd.type === 'number') ? (val ? +val : null) : val;
      });
      /* Si el que guarda devuelve false, la ventana se queda abierta: así una
         validación no le borra a nadie lo que acaba de escribir. */
      if (onSave(data) !== false) U.closeModal();
    };
    var wrap = el('<div></div>'); wrap.appendChild(f); wrap.appendChild(foot);
    return wrap;
  }

  /* ---------- Escribir al club, desde el portal ----------
     Sirve para la familia y para el jugador; cambia a quién puede escribir y
     poco más. No es un chat: hay asunto, se manda, y las respuestas quedan
     debajo. Nadie ve escribiendo a nadie ni espera contestación inmediata. */
  function bloqueConversaciones(p, quien) {
    var esFam = quien === 'familia';
    var dest = esFam ? SF.destinatariosFamilia(p) : SF.destinatariosJugador(p);
    var hilos = SF.store.convsForPlayer(p.id, quien);
    var box = el('<div></div>');
    box.appendChild(el('<p class="ph-sec">' + (esFam ? 'Escribir al club' : 'Escribir a tu entrenador') + '</p>'));

    if (!dest.length) {
      box.appendChild(el('<p class="hint">' + (p.team_id
        ? 'Todavía no hay nadie asignado a este equipo a quien escribir.'
        : 'Cuando el club asigne un equipo, aquí podrás escribir a su entrenador.') + '</p>'));
    } else {
      var f = el('<div class="conv-new"></div>');
      f.appendChild(el('<select id="cd">' + dest.map(function (s) {
        return '<option value="' + s.id + '">' + esc(s.full_name) + ' · ' + esc((SF.ROLES[s.role] || {}).label || s.role) + '</option>';
      }).join('') + '</select>'));
      f.appendChild(el('<input id="cs" placeholder="Asunto: no podrá venir el sábado">'));
      f.appendChild(el('<textarea id="cb" placeholder="Escribe tu mensaje…"></textarea>'));
      var bEnv = el('<button class="ph-btn on">Enviar</button>');
      f.appendChild(bEnv);
      bEnv.onclick = function () {
        var asunto = f.querySelector('#cs').value.trim();
        var texto = f.querySelector('#cb').value.trim();
        if (!asunto) { U.toast('Ponle un asunto'); return; }
        if (!texto) { U.toast('Escribe el mensaje'); return; }
        SF.store.convCreate({
          player_id: p.id, team_id: p.team_id, subject: asunto, text: texto,
          to_staff: f.querySelector('#cd').value,
          from: esFam
            ? { kind: 'familia', id: 'familia', name: (p.family || {}).contact || 'Familia', role: (p.family || {}).relation || 'Familia' }
            : { kind: 'jugador', id: 'jugador', name: p.full_name, role: 'Jugador' }
        });
        U.toast('Mensaje enviado'); SF.router.render();
      };
      box.appendChild(f);
      /* La supervisión se avisa. Una conversación que alguien más lee sin
         decirlo no es una conversación, es otra cosa. */
      box.appendChild(el('<p class="hint">' + (esFam
        ? 'La dirección del club y el director técnico también ven estas conversaciones. Es para que quede constancia de lo que se habla con las familias.'
        : 'Tus padres o tutores y la dirección del club también ven lo que escribes aquí.') + '</p>'));
    }

    if (hilos.length) {
      box.appendChild(el('<p class="ph-sec">Tus conversaciones</p>'));
      hilos.forEach(function (c) {
        var staff = SF.store.staff().filter(function (s) { return s.id === c.to_staff; })[0];
        var ultimo = c.messages[c.messages.length - 1];
        var sinLeer = SF.store.convSinLeer(c, quien);
        var card = el('<div class="ph-report' + (sinLeer ? ' is-nuevo' : '') + '"></div>');
        var cab = el('<button class="ph-open"><span class="ph-open-t"><b>' + esc(c.subject) + '</b>' +
          (sinLeer ? '<span class="tag tag-warn">respuesta</span>' : '') + '</span>' +
          '<span class="hint">' + esc(staff ? staff.full_name : 'el club') + ' · ' +
          c.messages.length + (c.messages.length === 1 ? ' mensaje' : ' mensajes') + ' · ' +
          fmtDate((ultimo.at || '').slice(0, 10)) + (c.closed_at ? ' · cerrada' : '') + '</span></button>');
        var cuerpo = el('<div class="ph-open-b" hidden></div>');
        c.messages.forEach(function (m) {
          cuerpo.appendChild(el('<div class="conv-m' + (m.by.kind === 'staff' ? ' otro' : '') + '">' +
            '<span class="conv-who">' + esc(m.by.name) + ' <span class="hint">' + esc(m.by.role) + ' · ' +
            fmtDate((m.at || '').slice(0, 10)) + '</span></span><p>' + esc(m.text).replace(/\n/g, '<br>') + '</p></div>'));
        });
        if (!c.closed_at) {
          var resp = el('<div class="conv-new"><textarea placeholder="Responder…"></textarea><button class="ph-btn on">Responder</button></div>');
          resp.querySelector('button').onclick = function () {
            var t = resp.querySelector('textarea').value.trim();
            if (!t) return;
            SF.store.convReply(c.id, esFam
              ? { kind: 'familia', id: 'familia', name: (p.family || {}).contact || 'Familia', role: (p.family || {}).relation || 'Familia' }
              : { kind: 'jugador', id: 'jugador', name: p.full_name, role: 'Jugador' }, t);
            U.toast('Respuesta enviada'); SF.router.render();
          };
          cuerpo.appendChild(resp);
        } else cuerpo.appendChild(el('<p class="hint">El club dio esta conversación por cerrada.</p>'));
        cab.onclick = function () {
          if (cuerpo.hasAttribute('hidden')) {
            cuerpo.removeAttribute('hidden');
            SF.store.convMarkRead(c.id, quien);
            var t = cab.querySelector('.tag'); if (t) t.remove();
            card.classList.remove('is-nuevo');
          } else cuerpo.setAttribute('hidden', '');
        };
        card.appendChild(cab); card.appendChild(cuerpo);
        box.appendChild(card);
      });
    }
    return box;
  }

  /* ---------- Evolución del jugador temporada a temporada ----------
     Lo que un club gana teniendo a un chaval desde los ocho años. Arriba, una
     fila por temporada con lo que se mide (edad, altura, peso, Score); abajo,
     apartado por apartado, para ver que a los nueve no botaba con la izquierda
     y a los doce sí. Se lee de la temporada más antigua a la más reciente. */
  function evolucionBody(p) {
    var wrap = el('<div class="evo"></div>');
    var filas = SF.evolucion(p);
    var verScore = role().canSeeScore;

    if (!filas.length) {
      wrap.appendChild(el('<p class="hint">Todavía no hay nada que comparar. En cuanto el preparador tome medidas ' +
        'o el entrenador evalúe, esta temporada quedará registrada y el año que viene se podrá ver el cambio.</p>'));
      return wrap;
    }

    /* Titular en una frase. Un número dice más que una tabla, y la tabla
       queda debajo para quien quiera el detalle. */
    var conAlt = filas.filter(function (f) { return f.altura != null; });
    var conPes = filas.filter(function (f) { return f.peso != null; });
    var resumen = [];
    if (conAlt.length > 1) {
      var cm = conAlt[conAlt.length - 1].altura - conAlt[0].altura;
      if (cm > 0) resumen.push('ha crecido <b>' + cm + ' cm</b>');
    }
    if (conPes.length > 1) {
      var kg = Math.round((conPes[conPes.length - 1].peso - conPes[0].peso) * 10) / 10;
      if (kg > 0) resumen.push('ha ganado <b>' + kg + ' kg</b>');
    }
    var nT = filas.length;
    wrap.appendChild(el('<p class="evo-lead">' + esc(p.full_name) + ' tiene <b>' + nT +
      (nT === 1 ? ' temporada' : ' temporadas') + '</b> registradas' +
      (resumen.length ? '. Desde la primera ' + resumen.join(' y ') : '') + '.</p>'));

    function delta(d, unidad) {
      if (d == null || d === 0) return '';
      return '<span class="evo-d ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + d + (unidad || '') + '</span>';
    }

    /* --- Una fila por temporada --- */
    var th = '<th>Temporada</th><th>Edad</th><th>Altura</th><th>Peso</th>' + (verScore ? '<th>Score</th>' : '');
    var tab = el('<div class="evo-scroll"><table class="evo-tab"><thead><tr>' + th + '</tr></thead><tbody></tbody></table></div>');
    var tb = tab.querySelector('tbody');

    filas.forEach(function (f) {
      var edad = f.edad ? f.edad.años + ' años' + (f.edad.exacta ? '' : ' aprox.') : '—';
      var alt = f.altura != null ? (f.altura / 100).toFixed(2) + ' m ' + delta(f.dAltura, ' cm') : '—';
      var pes = f.peso != null ? f.peso + ' kg ' + delta(f.dPeso, ' kg') : '—';
      var sc = f.score != null ? '<b>' + f.score + '</b> ' + delta(f.dScore)
             : (f.sinDetalle ? '<span class="hint">sin detalle</span>' : '—');
      tb.appendChild(el('<tr><td><b>' + esc(f.season) + '</b></td><td>' + esc(edad) + '</td><td>' +
        alt + '</td><td>' + pes + '</td>' + (verScore ? '<td>' + sc + '</td>' : '') + '</tr>'));
    });
    wrap.appendChild(tab);

    if (filas.some(function (f) { return f.sinDetalle; })) {
      wrap.appendChild(el('<p class="hint">Las temporadas marcadas como <i>sin detalle</i> se evaluaron antes de que ' +
        'la app guardara las notas. Sabemos quién evaluó y cuándo, pero no con qué puntuación, y no se rellena a ojo. ' +
        'De aquí en adelante queda todo.</p>'));
    }

    /* 2026/2027 -> 26/27. Se usa en las cabeceras de las tablas de detalle:
       la temporada entera no cabe en columnas tan estrechas. */
    function corta(t) { return esc(t.replace(/^\d{2}(\d{2})\/\d{2}(\d{2})$/, '$1/$2')); }

    /* --- Todas las medidas, no solo altura y peso ---
       En dos tablas: lo que mide el cuerpo (crece solo) y lo que mide el
       rendimiento (se entrena). Mezclarlas hace creer que un chaval "mejoró"
       porque le crecieron los pies. */
    var meds = SF.evolucionMedidas(p, filas);
    var tempsM = filas.filter(function (f) { return f.medida; }).map(function (f) { return f.season; });

    var num = SF.numMedida;

    function tablaMedidas(titulo, lista, nota) {
      if (!lista.length) return;
      wrap.appendChild(el('<p class="sec-label">' + esc(titulo) + '</p>'));
      if (nota) wrap.appendChild(el('<p class="hint">' + nota + '</p>'));
      var headM = '<th>Medida</th>' + tempsM.map(function (t) { return '<th class="evo-y">' + corta(t) + '</th>'; }).join('') +
        '<th class="evo-y">Cambio</th>';
      var tM = el('<div class="evo-scroll"><table class="evo-tab evo-sk"><thead><tr>' + headM + '</tr></thead><tbody></tbody></table></div>');
      var tbM = tM.querySelector('tbody');
      lista.forEach(function (m) {
        var celdas = m.vals.map(function (v) {
          if (!v) return '<td class="evo-y"><span class="hint">—</span></td>';
          return '<td class="evo-y">' + esc(m.def.texto ? v : (m.def.metros ? (v / 100).toFixed(2) : num(v, m.def))) + '</td>';
        }).join('');
        /* En un sprint, bajar es mejorar. Se invierte solo el COLOR, nunca el
           signo: el número tiene que seguir diciendo la verdad (-0,15 s). */
        var d = m.delta, cls = '';
        if (d) cls = (m.def.menosEsMejor ? (d < 0) : (d > 0)) ? 'up' : 'down';
        tbM.appendChild(el('<tr><td>' + esc(m.def.label) +
          (m.def.metros ? ' <span class="hint">(m)</span>' : (m.def.u ? ' <span class="hint">(' + esc(m.def.u) + ')</span>' : '')) +
          '</td>' + celdas + '<td class="evo-y">' +
          (d ? '<span class="evo-d ' + cls + '">' + (d > 0 ? '+' : '') + num(d, m.def) + ' ' + esc(m.def.u || '') + '</span>' : '') +
          '</td></tr>'));
      });
      wrap.appendChild(tM);
    }

    tablaMedidas('El cuerpo, una a una', meds.filter(function (m) { return !m.def.test; }));
    tablaMedidas('Tests de rendimiento', meds.filter(function (m) { return m.def.test; }),
      'En sprint, cambio de dirección y deceleración <b>menos es mejor</b>: por eso una bajada sale en verde.');

    /* Asimetría por temporada: es el dato que más se sigue de un salto a una
       pierna, y sacarlo aquí evita que haya que restar dos columnas. */
    var asims = filas.filter(function (f) { return f.medida && SF.asimetria(f.medida); });
    if (asims.length) {
      var ult = SF.asimetria(asims[asims.length - 1].medida);
      wrap.appendChild(el('<p class="' + (ult.aviso ? 'aviso-lin' : 'hint') + '">Asimetría entre piernas: ' +
        asims.map(function (f) {
          var a = SF.asimetria(f.medida);
          return corta(f.season) + ' <b>' + a.pct + ' %</b>';
        }).join(' · ') +
        '. La última, más con la ' + esc(ult.fuerte) + '.' +
        (ult.aviso ? ' Por encima del ' + SF.ASIMETRIA_AVISO + ' % conviene comentarlo con el fisio; es un dato para mirar, no un diagnóstico.' : '') +
        '</p>'));
    }

    /* --- Detalle apartado por apartado --- */
    var grupos = SF.evolucionSkills(p, filas);
    if (!grupos.length) {
      wrap.appendChild(el('<p class="hint">Cuando haya una temporada evaluada aparecerá aquí el detalle de cada apartado.</p>'));
      return wrap;
    }
    var temps = filas.filter(function (f) { return f.stats; }).map(function (f) { return f.season; });
    wrap.appendChild(el('<p class="sec-label">Apartado por apartado</p>'));
    wrap.appendChild(el('<p class="hint">De 0 a ' + SF.EVAL_MAX + '. La última columna es lo que ha cambiado desde la ' +
      'primera temporada evaluada. Recuerda que la nota se pone comparándolo con <b>su categoría y su año</b>: ' +
      'mantener un 6 mientras sube de categoría ya es mejorar.</p>'));

    grupos.forEach(function (g) {
      var head = '<th>' + esc(g.grupo) + '</th>' + temps.map(function (t) {
        return '<th class="evo-y">' + corta(t) + '</th>';
      }).join('') + '<th class="evo-y">Cambio</th>';
      var t2 = el('<div class="evo-scroll"><table class="evo-tab evo-sk"><thead><tr>' + head + '</tr></thead><tbody></tbody></table></div>');
      var tb2 = t2.querySelector('tbody');
      g.items.forEach(function (it) {
        var celdas = it.vals.map(function (v) {
          return '<td class="evo-y">' + (v ? v : '<span class="hint">—</span>') + '</td>';
        }).join('');
        tb2.appendChild(el('<tr><td>' + esc(it.skill) + '</td>' + celdas +
          '<td class="evo-y">' + (it.delta ? delta(it.delta) : '') + '</td></tr>'));
      });
      wrap.appendChild(t2);
    });
    return wrap;
  }

  /* ---------- Formulario de jugador (alta / edición / import) ---------- */
  /* Formulario de evaluación deportiva: puntúa cada skill de 0 a 5, agrupado */
  function evalForm(p, sp, onSave, allowedGroups) {
    var stats = p.stats || {};
    var wrap = el('<div></div>');
    var bodyEl = el('<div></div>');
    var groups = Object.keys(sp.skills).filter(function (g) {
      return !allowedGroups || allowedGroups === 'all' || allowedGroups.indexOf(g) >= 0;
    });
    groups.forEach(function (group) {
      bodyEl.appendChild(el('<p class="sec-label">' + group + '</p>'));
      var grid = el('<div class="form-grid"></div>');
      sp.skills[group].forEach(function (sk) {
        var v = stats[sk] != null ? stats[sk] : '';
        var row = el('<div class="frow"><label>' + esc(sk) + '</label>' +
          '<input type="number" min="0" max="' + SF.EVAL_MAX + '" step="1" data-sk="' + esc(sk) + '" value="' + esc(v) + '">' +
          '<span class="ev-ancla"></span></div>');
        var inp = row.querySelector('input'), anc = row.querySelector('.ev-ancla');
        /* Al teclear la nota se dice en palabras qué significa: así dos
           entrenadores distintos puntúan parecido al mismo jugador. */
        function pinta() {
          var a = SF.evalAnchor(inp.value);
          anc.textContent = a ? a.label : '';
          anc.title = a ? a.desc : '';
          anc.className = 'ev-ancla' + (a ? ' n' + a.min : '');
        }
        inp.addEventListener('input', pinta); pinta();
        grid.appendChild(row);
      });
      bodyEl.appendChild(grid);
    });
    wrap.appendChild(el('<p class="hint"><b>De 0 a ' + SF.EVAL_MAX + ', comparándolo con su categoría y su año</b>, no con el baloncesto en abstracto. ' +
      'Deja en blanco lo que no hayas visto: no puntuar no resta.</p>'));
    var esc2 = el('<div class="ev-leyenda"></div>');
    SF.EVAL_ANCHORS.slice().reverse().forEach(function (a) {
      esc2.appendChild(el('<span class="ev-l n' + a.min + '"><b>' + a.min + (a.min === 9 ? '-10' : '-' + (a.min + 1)) + '</b> ' + esc(a.label) + '</span>'));
    });
    wrap.appendChild(esc2);
    wrap.appendChild(bodyEl);
    var foot = el('<div class="modal-actions"><button class="btn">Cancelar</button><button class="btn btn-primary">Guardar evaluación</button></div>');
    foot.children[0].onclick = U.closeModal;
    foot.children[1].onclick = function () {
      var ns = Object.assign({}, stats);
      bodyEl.querySelectorAll('input[data-sk]').forEach(function (i) {
        var val = (i.value || '').trim();
        if (val === '') { delete ns[i.dataset.sk]; }
        else { ns[i.dataset.sk] = Math.max(0, Math.min(5, Math.round(+val))); }
      });
      onSave(ns); U.closeModal();
    };
    wrap.appendChild(foot);
    return wrap;
  }

      frow('Deporte', '<select name="sport">' + sportOpts + '</select>') +
      frow('Posición principal', '<select name="primary_position">' + posOpts(sport, p.primary_position) + '</select>') +
      frow('Posición secundaria', '<select name="secondary_position">' + posOpts(sport, p.secondary_position) + '</select>') +
      frow('Altura (cm)', '<input type="number" name="height_cm" value="' + esc(p.height_cm) + '">') +
      frow('Peso (kg)', '<input type="number" name="weight_kg" value="' + esc(p.weight_kg) + '">') +
      frow('Envergadura (cm)', '<input type="number" name="wingspan_cm" value="' + esc(p.wingspan_cm) + '">') +
      frow('Altura de torso (cm)', '<input type="number" name="torso_height_cm" value="' + esc(p.torso_height_cm) + '">') +
      frow('Longitud de pie (cm)', '<input type="number" name="foot_length_cm" value="' + esc(p.foot_length_cm) + '">') +
      frow('Longitud de mano (cm)', '<input type="number" name="hand_length_cm" value="' + esc(p.hand_length_cm) + '">') +
      frow('Mano dominante', '<input name="dominant_hand" value="' + esc(p.dominant_hand) + '">') +
      frow('Club', '<input name="club" value="' + esc(p.club) + '">') +
      frow('Liga', '<input name="league" value="' + esc(p.league) + '">') +
      frow('Categoría', '<input name="category" value="' + esc(p.category) + '">') +
      frow('Edad de inicio', '<input type="number" name="start_age" value="' + esc(p.start_age) + '">') +
      frow('Centro educativo', '<input name="school" value="' + esc(p.school) + '">') +
      frow('Curso', '<input name="course" value="' + esc(p.course) + '">') +
      frow('Promedio de notas', '<input name="gpa" value="' + esc(p.gpa) + '">') +
      frow('Nivel de inglés', '<input name="english" value="' + esc(p.english) + '">') +
      frow('Otros idiomas', '<input name="other_languages" value="' + esc(p.other_languages) + '">') +
      frow('Fecha de graduación', '<input type="date" name="graduation_date" value="' + esc(p.graduation_date) + '">') +
      frow('Estado', '<select name="status">' + statusOpts + '</select>') +
      frow('Canal de captación', '<input name="channel" value="' + esc(p.channel) + '">') +
      frow('Objetivo', '<input name="objective" value="' + esc(p.objective) + '">');

    function frow(label, inner) { return '<div class="frow"><label>' + label + '</label>' + inner + '</div>'; }

    // al cambiar deporte, recargar posiciones
    f.querySelector('[name=sport]').addEventListener('change', function () {
      var sp = this.value;
      f.querySelector('[name=primary_position]').innerHTML = posOpts(sp, '');
      f.querySelector('[name=secondary_position]').innerHTML = posOpts(sp, '');
    });

    var foot = el('<div class="modal-actions"><button class="btn">Cancelar</button><button class="btn btn-primary">Guardar</button></div>');
    foot.children[0].onclick = U.closeModal;
    foot.children[1].onclick = function () {
      var data = {};
      f.querySelectorAll('input,select').forEach(function (i) { data[i.name] = i.value.trim(); });
      data.nationality = data.nationality ? data.nationality.split(',').map(function (x) { return x.trim(); }).filter(Boolean) : [];
      /* La fecha completa manda sobre el año suelto: si hay fecha, el año se
         recalcula de ella para que no puedan contradecirse. */
      data.birth_year = data.birth_date ? new Date(data.birth_date).getFullYear() : (data.birth_year ? +data.birth_year : null);
      data.height_cm = data.height_cm ? +data.height_cm : null;
      data.weight_kg = data.weight_kg ? +data.weight_kg : null;
      ['wingspan_cm', 'torso_height_cm', 'foot_length_cm', 'hand_length_cm', 'start_age'].forEach(function (k) {
        data[k] = data[k] ? +data[k] : null;
      });
      if (!data.first_name && !data.last_name) { U.toast('Pon al menos nombre o apellidos'); return; }
      onSave(data);
      U.closeModal();
    };
    var wrap = el('<div></div>'); wrap.appendChild(f); wrap.appendChild(foot);
    return wrap;
  }

  /* ===================== INICIO ===================== */
  /* Inicio específico por rol: "¿qué tengo que hacer hoy?" */
  function todayCard(title, sub) { return el('<div class="today"><div class="today-t">' + title + '</div>' + (sub ? '<div class="today-s">' + sub + '</div>' : '') + '</div>'); }

  function inicioEntrenador(view) {
    var u = SF.store.currentUser();
    var myTeams = SF.store.teams().filter(function (t) { return (t.coaches || []).indexOf(u.name) >= 0; });
    view.innerHTML = head('Hola, ' + esc(u.name), 'Tu día de un vistazo.');
    if (!myTeams.length) { view.appendChild(el('<div class="empty-panel"><p>Aún no tienes equipos asignados.</p></div>')); return; }
    myTeams.forEach(function (t) {
      var nt = teamUpcoming(t, 'entrenamiento')[0], nm = teamUpcoming(t, 'partido')[0];
      view.appendChild(el('<p class="sec-label">' + esc(t.name) + '</p>'));
      var c = el('<div class="today-wrap"></div>');
      if (nt) c.appendChild(todayCard('Próximo entrenamiento', fmtDate(nt.date) + (nt.time ? ' · ' + nt.time : '') + (nt.place ? '<br>' + esc(nt.place) : '')));
      if (nm) c.appendChild(todayCard('Próximo partido', 'vs ' + esc(nm.opponent || '') + '<br>' + fmtDate(nm.date) + (nm.time ? ' · ' + nm.time : '')));
      var roster = SF.store.players().filter(function (p) { return p.team_id === t.id; });
      c.appendChild(todayCard('Plantilla', roster.length + ' jugador(es)'));
      view.appendChild(c);
      var acts = el('<div class="row-c"></div>');
      if (nt || nm) {
        var ev = nt || nm;
        var bl = el('<button class="btn btn-primary btn-sm">' + ico('users') + 'Pasar lista</button>');
        bl.onclick = function () { attendanceModal(t, ev, function () { SF.router.render(); }); };
        acts.appendChild(bl);
      }
      var bw = el('<button class="btn btn-light btn-sm">' + ico('arrow') + 'Publicar aviso</button>');
      bw.onclick = function () { location.hash = '#/equipo/' + t.id; };
      var bo = el('<button class="btn btn-light btn-sm">' + ico('grid') + 'Abrir equipo</button>');
      bo.onclick = function () { location.hash = '#/equipo/' + t.id; };
      acts.appendChild(bw); acts.appendChild(bo); view.appendChild(acts);
    });
  }

  function inicioAdministrativo(view) {
    var ps = SF.store.players(), sum = { paid: 0, pending: 0, overdue: 0 };
    ps.forEach(function (p) { var t = SF.finTotals(p); sum.paid += t.paid; sum.pending += t.pending; sum.overdue += t.overdue; });
    var pend = SF.store.expenses().filter(function (e) { return e.status === 'pendiente'; });
    view.innerHTML = head('Caja del mes', 'Cobros, impagos y gastos por aprobar.');
    var k = el('<div class="kpis"></div>');
    [['Cobrado', sum.paid, ''], ['Pendiente', sum.pending, 'warn'], ['Vencido', sum.overdue, 'danger'], ['Gastos por aprobar', pend.length, 'purple']].forEach(function (x, i) {
      k.appendChild(el('<div class="kpi ' + x[2] + '"><div class="kpi-top"><span>' + x[0] + '</span></div><div class="kpi-num">' + (i === 3 ? x[1] : eur(x[1])) + '</div></div>'));
    });
    view.appendChild(k);
    var deb = ps.map(function (p) { var t = SF.finTotals(p); return { p: p, due: t.pending + t.overdue }; }).filter(function (x) { return x.due > 0; }).sort(function (a, b) { return b.due - a.due; });
    view.appendChild(el('<p class="sec-label">Jugadores con pagos pendientes</p>'));
    var dl = el('<div class="mini-list"></div>');
    if (!deb.length) dl.appendChild(el('<p class="hint">Todos al día.</p>'));
    deb.slice(0, 6).forEach(function (x) {
      var row = el('<div class="mini-row"><span>' + esc(x.p.full_name) + '</span><span class="row-actions"><span class="hint">debe ' + eur(x.due) + '</span> <button class="lnk" data-v>ver plan</button></span></div>');
      row.querySelector('[data-v]').onclick = function () { SF._openTab = 'finanzas'; location.hash = '#/jugador/' + x.p.id; };
      dl.appendChild(row);
    });
    view.appendChild(dl);
    var acts = el('<div class="row-c"></div>');
    var b1 = el('<button class="btn btn-primary btn-sm">' + ico('coins') + 'Ir a Economía</button>'); b1.onclick = function () { location.hash = '#/economia'; };
    var b2 = el('<button class="btn btn-light btn-sm">' + ico('card') + 'Ir a Finanzas</button>'); b2.onclick = function () { location.hash = '#/finanzas'; };
    acts.appendChild(b1); acts.appendChild(b2); view.appendChild(acts);
  }

  function inicioDT(view) {
    var r = role(), teams = SF.store.teams().filter(function (t) { return r.segments === 'all' || r.segments.indexOf(t.segment) >= 0; });
    view.innerHTML = head('Dirección técnica', 'Tus equipos y su seguimiento.');
    var players = scopedPlayers();
    var sinEval = players.filter(function (p) { return !(p.eval_log || []).length; });
    var k = el('<div class="kpis"></div>');
    k.appendChild(el('<div class="kpi"><div class="kpi-top"><span>Equipos</span></div><div class="kpi-num">' + teams.length + '</div></div>'));
    k.appendChild(el('<div class="kpi"><div class="kpi-top"><span>Jugadores</span></div><div class="kpi-num">' + players.length + '</div></div>'));
    k.appendChild(el('<div class="kpi warn"><div class="kpi-top"><span>Sin evaluar</span></div><div class="kpi-num">' + sinEval.length + '</div></div>'));
    view.appendChild(k);
    view.appendChild(el('<p class="sec-label">Equipos</p>'));
    var tl = el('<div class="mini-list"></div>');
    if (!teams.length) tl.appendChild(el('<p class="hint">Sin equipos en tu ámbito.</p>'));
    teams.forEach(function (t) {
      var n = SF.store.players().filter(function (p) { return p.team_id === t.id; }).length;
      var nt = teamUpcoming(t, 'entrenamiento')[0], nm = teamUpcoming(t, 'partido')[0];
      var nx = nm ? 'partido ' + fmtDate(nm.date) : nt ? 'entreno ' + fmtDate(nt.date) : 'sin citas';
      var row = el('<div class="mini-row"><span><b>' + esc(t.name) + '</b> · ' + n + ' jugadores</span><span class="row-actions"><span class="hint">' + nx + '</span> <button class="lnk" data-o>abrir</button></span></div>');
      row.querySelector('[data-o]').onclick = function () { location.hash = '#/equipo/' + t.id; };
      tl.appendChild(row);
    });
    view.appendChild(tl);
  }

  pages.inicio = function (view) {
    var rk = SF.store.role();
    if (rk === 'entrenador') return inicioEntrenador(view);
    if (rk === 'administrativo') return inicioAdministrativo(view);
    if (rk.indexOf('dt_') === 0) return inicioDT(view);
    var m = SF.store.metrics();
    var ps = SF.store.players();
    if (m.total === 0) {
      view.innerHTML = head('Inicio', SF.store.academy().name) +
        '<div class="empty-panel"><div class="em-ic">' + ico('users') + '</div>' +
        '<h3>Tu academia todavía no tiene jugadores</h3>' +
        '<p>Empieza creando una ficha a mano o pega un mensaje y deja que la IA la arme por ti.</p>' +
        '<div class="row-c"><button class="btn btn-primary" id="e1">' + ico('plus') + 'Añadir jugador</button>' +
        '<button class="btn" id="e2">' + ico('ai') + 'Importar con IA</button></div></div>';
      view.querySelector('#e1').onclick = function () { openCreate(); };
      view.querySelector('#e2').onclick = function () { location.hash = '#/importar'; };
      return;
    }
    var r = role(), u = SF.store.currentUser();
    var mios = scopedPlayers();                 // solo los jugadores de su ámbito
    var soloMios = mios.length !== ps.length;   // ¿ve una parte del club?

    /* --- Cabecera: saludo real, no uno fijo --- */
    view.innerHTML = '<div class="dash-hero"><div class="dash-hi">' + saludo() + ', ' + esc(u.name.split(' ')[0]) + '</div>' +
      '<p class="dash-date">' + fechaLarga() + ' · ' + esc(u.label) + (soloMios ? ' · ' + mios.length + ' jugadores a tu cargo' : '') + '</p></div>';

    /* --- Recuento de lo pendiente, cada cosa filtrada por lo que este rol ve --- */
    var enti = mios.filter(function (p) { return p.status === 'Entrevista'; });
    var incom = mios.filter(function (p) { return p.status === 'Datos incompletos'; });
    var sinVid = mios.filter(function (p) { return p.documents && p.documents.video_highlights === 'pendiente'; });
    var venc = r.canSeeFinance ? mios.filter(function (p) { return SF.finHas(p, 'vencido'); }) : [];
    var sinMed = mios.filter(function (p) { return !p.height_cm || !p.weight_kg; });
    var sinEval = mios.filter(function (p) { return !(p.eval_log || []).length; });

    /* Lo del fisioterapeuta. Su trabajo no es que falten datos ni vídeos:
       es quién no puede jugar, quién vuelve, y a quién hay que mirar. */
    var bajas = mios.filter(function (p) { return SF.dispo(p).k === 'no'; });
    var limit = mios.filter(function (p) { return SF.dispo(p).k === 'limitada'; });
    var caduc = mios.filter(function (p) { return SF.dispo(p).caducada; });
    var asim = mios.filter(function (p) { var a = SF.asimetria(p); return a && a.aviso; });

    /* --- FOCO: una sola cosa, la más urgente, con su botón.
       Un panel de inicio tiene que responder "¿qué hago ahora?", no
       "¿cuántas cosas hay?". Por eso hay una tarjeta y no cuatro. --- */
    var foco = null;
    var esSalud = r.canSetAvailability && !r.canSeeFinance;   // fisio o preparador
    if (esSalud && caduc.length) {
      foco = { cls: 'is-warn', ic: 'alert', t: caduc.length + (caduc.length === 1 ? ' alta que revisar' : ' altas que revisar'),
        s: 'La fecha prevista ya pasó y siguen marcados como no disponibles.', btn: 'Ver jugadores',
        go: function () { location.hash = '#/jugadores'; } };
    } else if (esSalud && bajas.length) {
      foco = { cls: 'is-danger', ic: 'alert', t: bajas.length + (bajas.length === 1 ? ' jugador no disponible' : ' jugadores no disponibles'),
        s: 'El cuerpo técnico lo ve en su ficha. Actualiza cuando haya novedades.', btn: 'Ver jugadores',
        go: function () { location.hash = '#/jugadores'; } };
    } else if (esSalud && asim.length) {
      foco = { cls: 'is-warn', ic: 'users', t: asim.length + (asim.length === 1 ? ' asimetría alta' : ' asimetrías altas'),
        s: 'Diferencia de más del ' + SF.ASIMETRIA_AVISO + ' % entre piernas en el salto a una pierna.', btn: 'Ver jugadores',
        go: function () { location.hash = '#/jugadores'; } };
    } else if (venc.length) {
      foco = { cls: 'is-danger', ic: 'card', t: venc.length + (venc.length === 1 ? ' cuota vencida' : ' cuotas vencidas'),
        s: 'Lo más antiguo lleva tiempo esperando. Conviene reclamarlo hoy.', btn: 'Ver impagos',
        go: function () { SF._jugQuery = '@Pagos vencidos'; location.hash = '#/jugadores'; } };
    } else if (incom.length) {
      foco = { cls: 'is-warn', ic: 'alert', t: incom.length + (incom.length === 1 ? ' ficha incompleta' : ' fichas incompletas'),
        s: 'Sin datos clave no se puede inscribir ni federar.', btn: 'Completar',
        go: function () { SF._jugQuery = '@Datos incompletos'; location.hash = '#/jugadores'; } };
    } else if (enti.length) {
      foco = { cls: '', ic: 'users', t: enti.length + (enti.length === 1 ? ' entrevista pendiente' : ' entrevistas pendientes'),
        s: 'Están esperando respuesta del club.', btn: 'Ver quiénes',
        go: function () { SF._jugQuery = '@Entrevistas'; location.hash = '#/jugadores'; } };
    } else if (r.canEditPhysical && sinMed.length) {
      foco = { cls: 'is-warn', ic: 'users', t: sinMed.length + ' sin medidas',
        s: 'Les falta altura o peso para poder seguir su crecimiento.', btn: 'Ver jugadores',
        go: function () { location.hash = '#/jugadores'; } };
    } else {
      foco = { cls: 'is-ok', ic: 'check', t: 'Todo al día',
        s: 'No hay nada urgente' + (soloMios ? ' en tus jugadores' : ' en el club') + ' ahora mismo.', btn: null };
    }
    var fc = el('<div class="foco ' + foco.cls + '"><div class="foco-ic">' + ico(foco.ic) + '</div>' +
      '<div class="foco-body"><p class="foco-t">' + esc(foco.t) + '</p><p class="foco-s">' + esc(foco.s) + '</p></div></div>');
    if (foco.btn) {
      var fb = el('<button class="btn btn-primary btn-sm">' + esc(foco.btn) + '</button>');
      fb.onclick = foco.go; fc.appendChild(fb);
    }
    view.appendChild(fc);

    /* --- Indicadores: solo los que este rol puede ver Y hacer algo con ellos.
       Un preparador físico no tiene por qué ver el dinero de las familias. --- */
    var kpis = [];
    if (esSalud) {
      /* Al fisioterapeuta no le sirve de nada saber cuántas fichas están
         incompletas o a quién le falta el vídeo. Su pantalla es otra. */
      kpis.push({ cls: 'danger', n: bajas.length, l: 'No disponibles', q: '', foot: bajas.length ? 'no pueden jugar' : 'nadie de baja' });
      kpis.push({ cls: 'warn', n: limit.length, l: 'Con limitaciones', q: '', foot: 'pueden, con restricciones' });
      kpis.push({ cls: 'warn', n: caduc.length, l: 'Altas por revisar', q: '', foot: 'la fecha prevista ya pasó' });
      kpis.push({ cls: 'purple', n: asim.length, l: 'Asimetrías altas', q: '', foot: 'más del ' + SF.ASIMETRIA_AVISO + ' % entre piernas' });
      if (r.canEditPhysical) kpis.push({ cls: 'warn', n: sinMed.length, l: 'Sin medidas', q: '', foot: 'sin altura o peso' });
    } else {
      if (r.canSeeFinance) kpis.push({ cls: 'danger', n: venc.length, l: 'Pagos vencidos', q: '@Pagos vencidos', foot: venc.length ? 'requiere gestión' : 'todo cobrado' });
      kpis.push({ cls: 'warn', n: incom.length, l: 'Datos incompletos', q: '@Datos incompletos', foot: 'faltan datos clave' });
      if (r.canEvaluate) kpis.push({ cls: '', n: sinEval.length, l: 'Sin evaluar', q: '', foot: 'ninguna evaluación aún' });
      if (r.canEditPhysical) kpis.push({ cls: 'warn', n: sinMed.length, l: 'Sin medidas', q: '', foot: 'sin altura o peso' });
      kpis.push({ cls: 'warn', n: sinVid.length, l: 'Pendiente de vídeo', q: '@Pendiente de vídeo', foot: 'sin highlights' });
      kpis.push({ cls: 'purple', n: enti.length, l: 'Entrevistas', q: '@Entrevistas', foot: 'por hacer' });
    }

    var kwrap = el('<div class="kpis"></div>');
    kpis.slice(0, 4).forEach(function (k) {
      var cero = k.n === 0;
      var b = el('<button class="kpi is-btn ' + (cero ? 'ok' : k.cls) + '">' +
        '<div class="kpi-top"><span>' + esc(k.l) + '</span>' + ico('arrow') + '</div>' +
        '<div class="kpi-num">' + k.n + '</div>' +
        '<div class="kpi-foot">' + esc(cero ? 'al día' : k.foot) + '</div></button>');
      b.onclick = function () { if (k.q) SF._jugQuery = k.q; location.hash = '#/jugadores'; };
      kwrap.appendChild(b);
    });
    view.appendChild(kwrap);

    /* --- Captación: solo para quien capta. Un fisio no mira el embudo. --- */
    if (r.nav.indexOf('captacion') >= 0) {
      view.appendChild(el('<p class="sec-label">Captación · de prospecto a jugador</p>'));
      var funnel = el('<div class="funnel"></div>');
      var fcol = { 'Nuevo': 'gray', 'Datos incompletos': 'warn', 'En evaluación': 'info', 'Entrevista': 'purple', 'Oferta enviada': 'teal', 'Inscrito': 'green' };
      SF.PIPELINE.forEach(function (s) {
        var n = mios.filter(function (p) { return p.status === s; }).length;
        var b = el('<button class="stage st-' + fcol[s] + '"><div class="n">' + n + '</div><div class="l">' +
          esc(s.replace('Datos incompletos', 'Incompleto').replace('Oferta enviada', 'Oferta')) + '</div></button>');
        b.onclick = function () { location.hash = '#/captacion'; };
        funnel.appendChild(b);
      });
      view.appendChild(funnel);
    }

    /* --- Dos columnas: lo que hay que resolver, y lo que viene --- */
    var cols = el('<div class="cols"></div>');

    var att = el('<div class="card"><h3>Necesita tu atención</h3><p class="hint">Lo parado o lo que vence. Toca para abrir la ficha.</p><div class="at-list"></div></div>');
    var list = att.querySelector('.at-list');
    /* Una fila por jugador, no una por problema. Si Diego debe la cuota, tiene
       la ficha a medias y le faltan medidas, es UNA persona a la que atender,
       no tres líneas de lista que empujan a los demás fuera de la pantalla. */
    var bruto = [];
    if (esSalud) {
      /* La lista del fisioterapeuta: a quién tiene que atender, no qué
         papeles faltan. */
      caduc.forEach(function (p) { bruto.push({ p: p, d: 'La fecha de alta ya pasó', t: 'warn', tt: 'Revisar', tab: 'deportivo' }); });
      bajas.forEach(function (p) {
        var dz = SF.dispo(p);
        bruto.push({ p: p, d: 'No disponible' + (dz.hasta ? ' · alta prevista ' + fmtDate(dz.hasta) : ''), t: 'danger', tt: 'Baja', tab: 'deportivo' });
      });
      limit.forEach(function (p) {
        var dz = SF.dispo(p);
        bruto.push({ p: p, d: 'Con limitaciones' + (dz.limitacion ? ' · ' + dz.limitacion : ''), t: 'warn', tt: 'Limitado', tab: 'deportivo' });
      });
      asim.forEach(function (p) {
        var a = SF.asimetria(p);
        bruto.push({ p: p, d: 'Asimetría del ' + a.pct + ' %, salta menos con la ' + a.debil, t: 'purple', tt: 'Mirar', tab: 'deportivo' });
      });
      sinMed.forEach(function (p) { bruto.push({ p: p, d: 'Sin altura o peso', t: 'gray', tt: 'Medidas', tab: 'deportivo' }); });
    } else {
      venc.forEach(function (p) { bruto.push({ p: p, d: 'Cuota vencida', t: 'danger', tt: 'Pago', tab: 'finanzas' }); });
      incom.forEach(function (p) { bruto.push({ p: p, d: 'Faltan datos clave', t: 'warn', tt: 'Incompleto' }); });
      enti.forEach(function (p) { bruto.push({ p: p, d: 'Entrevista pendiente', t: 'purple', tt: 'Agenda' }); });
      if (r.canEditPhysical) sinMed.forEach(function (p) { bruto.push({ p: p, d: 'Sin altura o peso', t: 'gray', tt: 'Medidas' }); });
    }

    var porJug = {}, items = [];
    bruto.forEach(function (x) {                      // el primero que llega es el más urgente
      if (porJug[x.p.id]) { porJug[x.p.id].mas++; return; }
      x.mas = 0; porJug[x.p.id] = x; items.push(x);
    });

    items.slice(0, 7).forEach(function (it) {
      var b = el('<button class="at-item"><div class="av av-purple">' + U.initials(it.p.full_name) + '</div>' +
        '<div class="at-body"><p class="at-name">' + esc(it.p.full_name) + '</p><p class="at-desc">' + esc(it.d) +
        (it.mas ? ' · y ' + it.mas + (it.mas === 1 ? ' cosa más' : ' cosas más') : '') + '</p></div>' +
        '<span class="tag tag-' + it.t + '">' + it.tt + '</span></button>');
      b.onclick = function () { if (it.tab) SF._openTab = it.tab; location.hash = '#/jugador/' + it.p.id; };
      list.appendChild(b);
    });
    if (items.length > 7) list.appendChild(el('<p class="hint" style="padding-top:10px">y ' + (items.length - 7) + ' jugadores más.</p>'));
    if (!items.length) list.appendChild(el('<div class="at-empty">' + ico('check') + '<span>Nada pendiente. Buen momento para adelantar trabajo.</span></div>'));
    cols.appendChild(att);

    var lado = el('<div></div>');

    /* Agenda: lo que viene es más útil que lo que pasó. */
    var citas = [];
    SF.store.teams().forEach(function (t) {
      if (r.segments !== 'all' && r.segments && r.segments.indexOf(t.segment) < 0) return;
      (teamUpcoming(t, 'partido') || []).slice(0, 2).forEach(function (e) { citas.push({ t: t, e: e, k: 'Partido' }); });
      (teamUpcoming(t, 'entrenamiento') || []).slice(0, 1).forEach(function (e) { citas.push({ t: t, e: e, k: 'Entreno' }); });
    });
    /* Las entrevistas también son citas: si están en la agenda del club, se
       ven donde el club mira la agenda, no escondidas en Captación. */
    SF.store.interviewsUpcoming().forEach(function (x) {
      if (!mios.some(function (p) { return p.id === x.p.id; })) return;
      citas.push({ t: { id: null, name: x.p.full_name }, e: x.e, k: 'Entrevista', jugador: x.p });
    });
    citas.sort(function (a, b) { return (a.e.date || '') < (b.e.date || '') ? -1 : 1; });
    var ag = el('<div class="card"><h3>Lo que viene</h3><p class="hint">Próximos partidos y entrenamientos.</p></div>');
    if (!citas.length) {
      var vacio = el('<div class="at-empty" style="color:var(--ink-3)">' + ico('cal') + '<span>Nada en el calendario.</span></div>');
      ag.appendChild(vacio);
      if (r.nav.indexOf('equipos') >= 0) {
        var bag = el('<button class="btn btn-light btn-sm">Programar en un equipo</button>');
        bag.onclick = function () { location.hash = '#/equipos'; };
        ag.appendChild(bag);
      }
    }
    citas.slice(0, 4).forEach(function (c) {
      var d = new Date(c.e.date + 'T00:00:00');
      var row = el('<div class="ag-item"><div class="ag-day"><div class="d">' + (isNaN(d) ? '—' : d.getDate()) + '</div>' +
        '<div class="m">' + (isNaN(d) ? '' : SF_MON[d.getMonth()]) + '</div></div>' +
        '<div><p class="ag-t">' + esc(c.k === 'Partido' ? 'vs ' + (c.e.opponent || '—') : c.k === 'Entrevista' ? 'Entrevista' : 'Entrenamiento') + '</p>' +
        '<p class="ag-s">' + esc(c.t.name) + (c.e.time ? ' · ' + esc(c.e.time) : '') + '</p></div></div>');
      row.onclick = function () {
        if (c.jugador) { SF._openTab = 'captacion'; location.hash = '#/jugador/' + c.jugador.id; }
        else location.hash = '#/equipo/' + c.t.id;
      };
      ag.appendChild(row);
    });
    lado.appendChild(ag);

    var rec = el('<div class="card"><h3>Últimos jugadores</h3><p class="hint">Recién añadidos.</p><div class="rec-list"></div></div>');
    mios.slice(0, 4).forEach(function (p) {
      var row = el('<div class="recent"><div class="rec-photo">' + U.initials(p.full_name) + '</div><div>' +
        '<p class="rec-name">' + esc(p.full_name) + '</p><p class="rec-meta">' + (p.birth_year || '—') + ' · ' + esc(p.primary_position || '—') + '</p></div></div>');
      row.onclick = function () { location.hash = '#/jugador/' + p.id; };
      rec.querySelector('.rec-list').appendChild(row);
    });
    if (!mios.length) rec.querySelector('.rec-list').appendChild(el('<p class="hint">Aún no tienes jugadores asignados.</p>'));
    lado.appendChild(rec);

    cols.appendChild(lado);
    view.appendChild(cols);
  };

  /* Saludo según la hora real, no uno fijo: a las nueve de la noche
     "buenos días" hace que la app parezca una maqueta. */
  function saludo() {
    var h = new Date().getHours();
    return h < 6 ? 'Buenas noches' : h < 13 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches';
  }
  var SF_MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var SF_DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  function fechaLarga() {
    var d = new Date();
    return SF_DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + SF_MESES[d.getMonth()];
  }

  /* ===================== JUGADORES ===================== */
  function openCreate() {
    U.modal('Nuevo jugador', playerForm({}, function (data) {
      var p = SF.store.create(data);
      U.toast('Jugador creado'); location.hash = '#/jugador/' + p.id;
    }));
  }

  pages.jugadores = function (view) {
    var actions = '<button class="btn" id="imp">' + ico('ai') + 'Importar mensaje</button>' +
      '<button class="btn" id="insc">' + ico('file') + 'Inscripción</button>' +
      '<button class="btn btn-primary" id="nuevo">' + ico('plus') + 'Nuevo jugador</button>';
    view.innerHTML = head('Jugadores', 'Vista principal: tarjetas con foto', actions);
    view.querySelector('#nuevo').onclick = openCreate;
    view.querySelector('#imp').onclick = function () { location.hash = '#/importar'; };
    /* Empieza siempre de cero: si alguien dejó una inscripción a medias, la
       siguiente familia no debe encontrarse los datos del anterior. */
    view.querySelector('#insc').onclick = function () { SF._insDatos = null; SF._insPaso = 1; location.hash = '#/inscripcion'; };

    var ps = scopedPlayers();
    var years = Array.from(new Set(ps.map(function (p) { return p.birth_year; }).filter(Boolean))).sort();
    var nats = Array.from(new Set([].concat.apply([], ps.map(function (p) { return p.nationality || []; }))));
    var poss = Array.from(new Set(ps.map(function (p) { return p.primary_position; }).filter(Boolean)));

    var bar = el('<div class="filters"></div>');
    bar.innerHTML =
      '<div class="search-mini">' + ico('search') + '<input id="q" placeholder="Buscar por nombre, año, posición…"></div>' +
      '<select id="fy"><option value="">Año</option>' + years.map(function (y) { return '<option>' + y + '</option>'; }).join('') + '</select>' +
      '<select id="fp"><option value="">Posición</option>' + poss.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('') + '</select>' +
      '<select id="fn"><option value="">Nacionalidad</option>' + nats.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '</select>' +
      '<select id="fs"><option value="">Estado</option>' + SF.STATUSES.map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select>' +
      '<div class="view-toggle"><button id="vg" class="' + (jugView === 'grid' ? 'on' : '') + '" aria-label="Tarjetas">' + ico('grid') + '</button><button id="vt" class="' + (jugView === 'table' ? 'on' : '') + '" aria-label="Tabla">' + ico('list') + '</button></div>';
    view.appendChild(bar);

    var out = el('<div id="jug-out"></div>'); view.appendChild(out);

    // aplicar query global (desde KPI o buscador)
    var qmap = { '@Pagos vencidos': function (p) { return SF.finHas(p, 'vencido'); }, '@Datos incompletos': function (p) { return p.status === 'Datos incompletos'; }, '@Pendiente de vídeo': function (p) { return p.documents.video_highlights === 'pendiente'; }, '@Entrevistas': function (p) { return p.status === 'Entrevista'; } };
    var gq = SF._jugQuery || ''; SF._jugQuery = null;
    var preFilter = qmap[gq] || null;
    if (gq && !preFilter) bar.querySelector('#q').value = gq;

    function render() {
      var q = bar.querySelector('#q').value.toLowerCase().trim();
      var fy = bar.querySelector('#fy').value, fp = bar.querySelector('#fp').value, fn = bar.querySelector('#fn').value, fs = bar.querySelector('#fs').value;
      var rows = ps.filter(function (p) {
        if (preFilter && !preFilter(p)) return false;
        if (fy && String(p.birth_year) !== fy) return false;
        if (fp && p.primary_position !== fp) return false;
        if (fn && (p.nationality || []).indexOf(fn) < 0) return false;
        if (fs && p.status !== fs) return false;
        if (q) {
          /* Búsqueda por NÚMERO DE FICHA. Acepta las tres formas en que la
             gente lo va a escribir: "7", "J-7", "J-0007". Si la consulta es
             un número, se compara EXACTA, para que buscar "7" no devuelva a
             todos los nacidos en 2007. */
          var qn = q.replace(/^j-?/, '').replace(/^0+(?=\d)/, '');
          if (/^\d+$/.test(qn) && String(p.ficha) === qn) return true;
          var hay = (p.full_name + ' ' + (p.primary_position || '') + ' ' + (p.nationality || []).join(' ') + ' ' +
            (p.birth_year || '') + ' ' + (p.scoutflow_id || '') + ' ' + SF.fichaCode(p.ficha)).toLowerCase();
          if (q.indexOf('sin pasaporte') >= 0) return p.documents.pasaporte === 'pendiente';
          if (hay.indexOf(q) < 0) return false;
        }
        return true;
      });
      out.innerHTML = '';
      out.appendChild(el('<p class="count">' + rows.length + ' jugador' + (rows.length === 1 ? '' : 'es') + (preFilter ? ' · filtro activo' : '') + '</p>'));
      if (!rows.length) { out.appendChild(el('<div class="empty-panel"><p>Ningún jugador con esos filtros.</p></div>')); return; }
      if (jugView === 'grid') {
        var g = el('<div class="grid"></div>');
        rows.forEach(function (p) { g.appendChild(U.playerCard(p)); });
        out.appendChild(g);
      } else {
        var t = el('<table class="tbl"><thead><tr><th>Jugador</th><th>Año</th><th>Posición</th><th>Estado</th><th>Score</th></tr></thead><tbody></tbody></table>');
        var tb = t.querySelector('tbody');
        rows.forEach(function (p) {
          var tr = el('<tr><td><div class="tcell"><span class="av-sm">' + U.initials(p.full_name) + '</span>' + esc(p.full_name) + '</div></td><td>' + (p.birth_year || '—') + '</td><td>' + esc(p.primary_position || '—') + '</td><td>' + U.statusTag(p.status) + '</td><td>' + (function () { var x = SF.scoutScore(p); return x ? x.score : '—'; })() + '</td></tr>');
          tr.onclick = function () { location.hash = '#/jugador/' + p.id; };
          tb.appendChild(tr);
        });
        out.appendChild(t);
      }
    }
    bar.querySelectorAll('input,select').forEach(function (i) { i.addEventListener('input', render); });
    bar.querySelector('#vg').onclick = function () { jugView = 'grid'; bar.querySelector('#vg').classList.add('on'); bar.querySelector('#vt').classList.remove('on'); render(); };
    bar.querySelector('#vt').onclick = function () { jugView = 'table'; bar.querySelector('#vt').classList.add('on'); bar.querySelector('#vg').classList.remove('on'); render(); };
    render();
  };

  /* ===================== FICHA MAESTRA ===================== */
  var TABS = [
    ['perfil', 'Perfil'], ['deportivo', 'Deportivo'], ['trayectoria', 'Trayectoria'], ['academico', 'Académico'], ['familia', 'Familia'],
    ['documentos', 'Documentos'], ['videos', 'Vídeos'], ['captacion', 'Captación'], ['seguimiento', 'Seguimiento'],
    ['informes', 'Informes'], ['finanzas', 'Finanzas'], ['portal', 'Portal Family'], ['notas', 'Notas internas']
  ];

  pages.jugador = function (view, id) {
    var p = SF.store.get(id);
    if (!p) { view.innerHTML = head('Jugador', '') + '<div class="empty-panel"><p>No encontrado.</p></div>'; return; }
    var r = role();
    var allowed = r.tabs === 'all' ? TABS.map(function (t) { return t[0]; }) : r.tabs;

    var back = '<button class="btn" id="back">' + ico('back') + 'Jugadores</button>';
    var edit = '<button class="btn" id="ed">' + ico('edit') + 'Editar perfil</button><button class="btn btn-danger" id="del">' + ico('trash') + '</button>';
    view.innerHTML = head('Ficha del jugador', '', back + edit);
    view.querySelector('#back').onclick = function () { location.hash = '#/jugadores'; };
    view.querySelector('#del').onclick = function () {
      if (confirm('¿Eliminar a ' + p.full_name + '?')) { SF.store.remove(p.id); U.toast('Eliminado'); location.hash = '#/jugadores'; }
    };
    view.querySelector('#ed').onclick = function () {
      U.modal('Editar perfil', playerForm(p, function (data) { SF.store.update(p.id, data); U.toast('Guardado'); SF.router.render(); }));
    };

    var fhead = el('<div class="ficha-head"><div class="fh-photo">' + U.initials(p.full_name) + '</div><div class="fh-info"></div></div>');
    var nat = (p.nationality || []).join(', ');
    fhead.querySelector('.fh-info').innerHTML =
      '<h2>' + esc(p.full_name) + '</h2>' +
      '<p class="fh-sub">' + (p.ficha != null ? '<b>' + SF.fichaCode(p.ficha) + '</b> · ' : '') + (p.dorsal ? 'dorsal ' + esc(p.dorsal) + ' · ' : '') + esc(p.scoutflow_id) + ' · ' + (p.birth_year || '—') + ' · ' + esc(p.primary_position || '—') + (p.height_cm ? ' · ' + (p.height_cm / 100).toFixed(2) + ' m' : '') + '</p>' +
      '<div class="fh-tags"></div>';

    /* Las etiquetas de la cabecera llevan a donde se gestiona cada cosa: si
       pone "Entrevista", lo lógico es poder pulsarla y ver cuándo es. */
    var tags = fhead.querySelector('.fh-tags');
    var tEstado = el('<button class="tag-lnk">' + U.statusTag(p.status) + '</button>');
    tEstado.title = 'Ver la captación de este jugador';
    tEstado.onclick = function () { SF._openTab = 'captacion'; SF.router.render(); };
    tags.appendChild(tEstado);

    /* Si no puede jugar, se ve en la cabecera sin abrir ninguna pestaña. Un
       entrenador que prepara la convocatoria no debería tener que buscarlo. */
    (function () {
      var dz = SF.dispo(p);
      if (!dz.activa) return;
      var t = el('<button class="tag-lnk"><span class="tag ' + dz.def.tag + '">' + esc(dz.def.corto) +
        (dz.limitacion ? ' · ' + esc(dz.limitacion) : '') + '</span></button>');
      t.title = 'Ver la disponibilidad en Deportivo';
      t.onclick = function () { SF._openTab = 'deportivo'; SF.router.render(); };
      tags.appendChild(t);
    })();

    /* Si hay entrevista programada, la fecha se ve aquí sin tener que buscarla. */
    var cita = SF.nextInterview(p), citaTarde = SF.overdueInterview(p);
    if (cita || citaTarde) {
      var c = cita || citaTarde;
      var hoyF = new Date().toISOString().slice(0, 10);
      var esHoy = c.date === hoyF;
      var bCita = el('<button class="tag-lnk"><span class="tag ' + (citaTarde && !cita ? 'tag-warn' : esHoy ? 'tag-purple' : 'tag-info') + '">' +
        ico('cal') + (esHoy ? 'Entrevista HOY' : 'Entrevista ' + fmtDate(c.date)) + (c.time ? ' · ' + esc(c.time) : '') +
        (citaTarde && !cita ? ' · sin cerrar' : '') + '</span></button>');
      bCita.title = 'Ver y editar la entrevista';
      bCita.onclick = function () { SF._openTab = 'captacion'; SF.router.render(); };
      tags.appendChild(bCita);
    }

    if (r.canSeeScore) {
      var ss = SF.scoutScore(p);
      var bSc = el('<button class="tag-lnk"><span class="tag tag-purple">Score ' +
        (ss ? ss.score : 'pendiente') + (ss && ss.cobertura < 60 ? ' ·' : '') + '</span></button>');
      bSc.title = ss
        ? 'Scout Score ' + ss.score + '/100. Sale de sus evaluaciones (técnica, física y mental), no lo teclea nadie. ' +
          'Calculado con ' + ss.puestos + ' de ' + ss.total + ' apartados evaluados.' +
          (ss.cobertura < 60 ? ' Ojo: falta más de la mitad por evaluar, así que es poco fiable.' : '') +
          ' Nunca lo ve la familia.'
        : 'Todavía sin evaluaciones, así que no hay Score. Se calcula solo en cuanto se puntúe.';
      bSc.onclick = function () { SF._openTab = 'deportivo'; SF.router.render(); };
      tags.appendChild(bSc);
    }
    tags.appendChild(el('<span class="tag tag-gray">' + esc(nat || '—') + '</span>'));
    view.appendChild(fhead);

    var tabbar = el('<div class="tabs"></div>');
    var body = el('<div class="tab-body"></div>');
    var cur = (SF._openTab && allowed.indexOf(SF._openTab) >= 0) ? SF._openTab : allowed[0];
    SF._openTab = null;
    TABS.forEach(function (t) {
      if (allowed.indexOf(t[0]) < 0) return;
      var b = el('<button class="tab' + (t[0] === cur ? ' on' : '') + '">' + t[1] + '</button>');
      b.onclick = function () { cur = t[0]; tabbar.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); paint(); };
      tabbar.appendChild(b);
    });
    view.appendChild(tabbar); view.appendChild(body);

    function paint() {
      body.innerHTML = '';
      if (cur === 'perfil') {
        var posNum = (SF.POS_NUM[p.sport] || {})[p.primary_position];
        var posLabel = p.primary_position ? (p.primary_position + (posNum ? ' (' + posNum + ')' : '')) : '';
        var g = el('<div class="field-grid"></div>');
        g.innerHTML = fld('Nombre completo', p.full_name) + fld('Fecha de nacimiento', p.birth_date) +
          fld('Edad', SF.store.age(p.birth_date) != null ? SF.store.age(p.birth_date) + ' años' : '') +
          fld('Nacionalidad', nat) + fld('País de residencia', p.residence_country) + fld('Ciudad', p.city) +
          fld('Sexo', p.gender) + fld('Teléfono', p.phone) + fld('Email', p.email) +
          fld('Instagram', p.instagram) + fld('Facebook', p.facebook) +
          fld('DNI / documento', p.dni) + fld('Dirección', p.address) + fld('Teléfono de emergencia', p.emergency_phone) +
          fld('Deporte', SF.SPORTS[p.sport] ? SF.SPORTS[p.sport].label : p.sport) +
          fld('Posición principal', posLabel) + fld('Posición secundaria', p.secondary_position);
        body.appendChild(g);

        /* --- Ficha de urgencia ---
           Lo mínimo que hace falta si un chaval se cae en un partido fuera de
           casa: a quién llamar, a qué es alérgico y su grupo sanguíneo. Eso sí
           lo ve el entrenador y el delegado, porque son quienes están allí.
           El resto del historial médico NO: eso es del fisio y de dirección. */
        (function () {
          var md = p.medical || {};
          var hay = md.allergies || md.blood_type || p.emergency_phone || md.correctors;
          if (!hay) return;
          body.appendChild(el('<p class="sec-label">Si pasa algo en un partido</p>'));
          body.appendChild(el('<div class="field-grid">' +
            fld('Llamar a', (p.family || {}).contact ? (p.family || {}).contact + ((p.family || {}).relation ? ' (' + (p.family || {}).relation + ')' : '') : '') +
            fld('Teléfono de emergencia', p.emergency_phone || (p.family || {}).phone) +
            fld('Alergias', md.allergies) +
            fld('Grupo sanguíneo', md.blood_type) +
            fld('Correctores', md.correctors) + '</div>'));
          body.appendChild(el('<p class="hint">Solo lo imprescindible para una urgencia. El historial médico completo no se enseña aquí: lo ven el fisioterapeuta y la dirección.</p>'));
        })();
      } else if (cur === 'deportivo') {
        var sp = SF.SPORTS[p.sport];

        /* --- ¿Puede jugar? ---
           Lo primero de la pestaña, porque es lo primero que mira un
           entrenador el viernes. Nunca dice qué tiene: solo si puede, qué no
           puede hacer, hasta cuándo y quién lo firmó. */
        (function () {
          var dz = SF.dispo(p);
          var puede = role().canSetAvailability;
          if (!dz.activa && !puede) return;            // sano y no puedo tocarlo: no ocupo pantalla
          var banda = el('<div class="dispo' + (dz.activa ? ' act' : '') + '"></div>');
          var txt = '<b>' + esc(dz.def.label) + '</b>';
          if (dz.limitacion) txt += ' · ' + esc(dz.limitacion);
          var pie = [];
          if (dz.desde) pie.push('desde ' + fmtDate(dz.desde));
          if (dz.hasta) pie.push('previsión de alta ' + fmtDate(dz.hasta));
          if (dz.by) pie.push('lo firma ' + dz.by + (dz.role ? ' · ' + dz.role : ''));
          banda.appendChild(el('<div class="dispo-t"><span class="tag ' + dz.def.tag + '">' + esc(dz.def.corto) + '</span>' +
            '<span>' + txt + '</span></div>' + (pie.length ? '<p class="hint">' + esc(pie.join(' · ')) + '</p>' : '')));
          if (dz.caducada) banda.appendChild(el('<p class="aviso-lin">La fecha de alta prevista ya ha pasado y sigue marcado como no disponible. Conviene revisarlo.</p>'));

          if (puede) {
            var bd = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Actualizar disponibilidad</button>');
            bd.onclick = function () {
              U.modal('¿Puede jugar? — ' + esc(p.full_name), smallForm([
                { name: 'estado', label: '¿Puede jugar?', type: 'select', options: SF.DISPO.map(function (x) { return x.label; }) },
                { name: 'limitacion', label: 'Qué NO puede hacer', type: 'select', options: SF.LIMITACIONES,
                  hint: 'En términos deportivos, nunca clínicos' },
                { name: 'desde', label: 'Desde', type: 'date' },
                { name: 'hasta', label: 'Previsión de alta', type: 'date' }
              ], {
                estado: dz.def.label, limitacion: dz.limitacion, desde: dz.desde, hasta: dz.hasta
              }, function (d2) {
                var k = (SF.DISPO.filter(function (x) { return x.label === d2.estado; })[0] || SF.DISPO[0]).k;
                SF.store.setDispo(p.id, {
                  estado: k, limitacion: k === 'disponible' ? '' : d2.limitacion,
                  desde: d2.desde, hasta: k === 'disponible' ? '' : d2.hasta
                }, SF.store.currentUser());
                p = SF.store.get(p.id); U.toast('Disponibilidad actualizada'); paint();
              }));
            };
            banda.appendChild(bd);
            banda.appendChild(el('<p class="hint">Aquí no se anota ninguna lesión ni diagnóstico. ' +
              'El club solo necesita saber si puede jugar y qué no puede hacer; lo clínico es del fisioterapeuta ' +
              'y no se guarda en la app.</p>'));
          }
          body.appendChild(banda);

          var hist = (p.availability_log || []).slice().reverse().slice(0, 5);
          if (hist.length > 1 && puede) {
            body.appendChild(el('<p class="sec-label">Historial de disponibilidad</p>'));
            var hl = el('<div class="mini-list"></div>');
            hist.forEach(function (h) {
              var def = SF.DISPO.filter(function (x) { return x.k === h.estado; })[0] || SF.DISPO[0];
              hl.appendChild(el('<div class="mini-row"><span><b>' + esc(def.corto) + '</b>' +
                (h.limitacion ? ' · ' + esc(h.limitacion) : '') + ' <span class="hint">' + esc(h.by || '') + '</span></span>' +
                '<span class="hint">' + fmtDate((h.at || '').slice(0, 10)) + '</span></div>'));
            });
            body.appendChild(hl);
          }
        })();

        body.appendChild(el('<div class="field-grid">' + fld('Club', p.club) + fld('Liga', p.league) + fld('Categoría', p.category) + fld('Equipo', teamName(p)) +
          fld('Dorsal', p.dorsal) + fld('Edad de inicio', p.start_age ? p.start_age + ' años' : '') + '</div>'));
        /* Altura: se distingue la medida de la estimada a ojo por el scout.
           Nunca se pisan: la del preparador físico manda. */
        if (p.height_cm || p.height_est_cm) {
          body.appendChild(el('<p class="hint">Altura: ' +
            (p.height_cm ? '<b>' + (p.height_cm / 100).toFixed(2) + ' m</b> medida' : '') +
            (p.height_cm && p.height_est_cm ? ' · ' : '') +
            (p.height_est_cm ? '~' + (p.height_est_cm / 100).toFixed(2) + ' m estimada por scouting' : '') + '</p>'));
        }
        var bRow = el('<div class="row-c"></div>');
        if (role().canManageTeams) {
          var bteam = el('<button class="btn btn-light btn-sm">' + ico('grid') + 'Asignar / cambiar equipo</button>');
          bteam.onclick = function () { U.modal('Asignar equipo — ' + esc(p.full_name), assignTeam(p, function () { p = SF.store.get(p.id); paint(); })); };
          bRow.appendChild(bteam);
        }
        /* El dorsal se asigna a principio de temporada: es la llave con la que
           el acta de la federación se cruza con esta ficha. */
        if (role().canManageTeams || role().canEvaluate) {
          var bDor = el('<button class="btn btn-light btn-sm">' + ico('edit') + (p.dorsal ? 'Cambiar dorsal' : 'Asignar dorsal') + '</button>');
          bDor.onclick = function () {
            U.modal('Dorsal — ' + esc(p.full_name), smallForm([
              { name: 'dorsal', label: 'Dorsal' },
              { name: 'height_est_cm', label: 'Altura estimada por scouting (cm)', type: 'number' }
            ], p, function (d) {
              SF.store.update(p.id, { dorsal: d.dorsal, height_est_cm: d.height_est_cm || null });
              U.toast('Guardado'); p = SF.store.get(p.id); paint();
            }));
          };
          bRow.appendChild(bDor);
        }
        if (bRow.children.length) body.appendChild(bRow);

        /* Estadísticas de partido importadas. Solo unas pocas métricas
           acordadas: el análisis profundo vive en su herramienta, no aquí. */
        var gs = (p.stats_games || []).slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
        if (gs.length) {
          body.appendChild(el('<p class="sec-label">Estadísticas de partido</p>'));
          var keys = Object.keys(gs[0].metrics || {});
          // Medias de la temporada
          var med = {};
          keys.forEach(function (k) {
            var vals = gs.map(function (g) { return g.metrics[k]; }).filter(function (v) { return typeof v === 'number'; });
            if (vals.length) med[k] = Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length * 10) / 10;
          });
          var mk = Object.keys(med);
          if (mk.length) body.appendChild(el('<div class="field-grid">' + mk.map(function (k) {
            return '<div class="field"><span class="f-lab">' + esc(k) + ' · media</span><span class="f-val">' + med[k] + '</span></div>';
          }).join('') + '</div>'));

          /* REGULARIDAD y CASA/FUERA: no se piden al staff, se calculan.
             Regularidad = cuánto se desvía de su media. 14-13-15 es regular;
             4-28-6 no. Se mide sobre la métrica principal disponible. */
          var kRef = ['puntos', 'valoracion', 'valoración'].filter(function (k) { return keys.indexOf(k) >= 0; })[0];
          if (kRef && gs.length >= 3) {
            var vs = gs.map(function (g) { return g.metrics[kRef]; }).filter(function (v) { return typeof v === 'number'; });
            var m = vs.reduce(function (a, b) { return a + b; }, 0) / vs.length;
            var sd = Math.sqrt(vs.reduce(function (a, b) { return a + Math.pow(b - m, 2); }, 0) / vs.length);
            var cv = m ? sd / m : 0;   // coeficiente de variación
            var lab = cv < 0.25 ? 'muy regular' : (cv < 0.45 ? 'regular' : 'irregular');
            var cls = cv < 0.25 ? 'tag-green' : (cv < 0.45 ? 'tag-warn' : 'tag-danger');
            body.appendChild(el('<p class="hint">Regularidad en <b>' + esc(kRef) + '</b>: <span class="tag ' + cls + '">' + lab + '</span> ' +
              '<span class="hint">(media ' + Math.round(m * 10) / 10 + ', desviación ' + Math.round(sd * 10) / 10 + ')</span></p>'));
          }
          var casa = gs.filter(function (g) { return g.home === true; }), fuera = gs.filter(function (g) { return g.home === false; });
          if (kRef && casa.length && fuera.length) {
            function prom(arr) { var v = arr.map(function (g) { return g.metrics[kRef]; }).filter(function (x) { return typeof x === 'number'; }); return v.length ? Math.round(v.reduce(function (a, b) { return a + b; }, 0) / v.length * 10) / 10 : '—'; }
            body.appendChild(el('<p class="hint">' + esc(kRef) + ' en casa: <b>' + prom(casa) + '</b> (' + casa.length + ') · fuera: <b>' + prom(fuera) + '</b> (' + fuera.length + ')</p>'));
          }

          var gt = el('<table class="tbl"><thead><tr><th>Fecha</th><th>Rival</th><th></th>' + keys.map(function (k) { return '<th>' + esc(k) + '</th>'; }).join('') + '</tr></thead><tbody></tbody></table>');
          var gtb = gt.querySelector('tbody');
          gs.slice(0, 10).forEach(function (g) {
            var hl = g.home === true ? '<span class="tag tag-gray">casa</span>' : (g.home === false ? '<span class="tag tag-gray">fuera</span>' : '');
            gtb.appendChild(el('<tr><td>' + esc(g.date || '') + '</td><td>' + esc(g.opponent || '') + '</td><td>' + hl + '</td>' +
              keys.map(function (k) { return '<td>' + esc(String(g.metrics[k] != null ? g.metrics[k] : '—')) + '</td>'; }).join('') + '</tr>'));
          });
          body.appendChild(gt);
          body.appendChild(el('<p class="hint">' + gs.length + ' partido' + (gs.length === 1 ? '' : 's') + ' importado' + (gs.length === 1 ? '' : 's') + ' · origen: CSV</p>'));
        }

        if (p.team_id) {
          var att0 = SF.store.attendanceStats(p.id);
          if (att0.total) body.appendChild(el('<p class="hint">Asistencia registrada: <b>' + att0.pct + '%</b> (' + att0.present + ' de ' + att0.total + ' citas)</p>'));
          var tt0 = SF.store.teamGet(p.team_id);
          if (tt0) {
            var nm0 = teamUpcoming(tt0, 'partido')[0], nt0 = teamUpcoming(tt0, 'entrenamiento')[0];
            if (nm0 || nt0) {
              body.appendChild(el('<p class="sec-label">Próximas citas del equipo</p>'));
              var al0 = el('<div class="mini-list"></div>');
              if (nm0) al0.appendChild(el('<div class="mini-row"><span><span class="tag tag-purple">Partido</span> ' + eventDesc(nm0) + '</span></div>'));
              if (nt0) al0.appendChild(el('<div class="mini-row"><span><span class="tag tag-gray">Entreno</span> ' + eventDesc(nt0) + '</span></div>'));
              body.appendChild(al0);
            }
          }
        }

        // ── Físico: medidas y antropometría (las toma el preparador físico) ──
        body.appendChild(el('<p class="sec-label">Físico — medidas</p>'));
        body.appendChild(el('<div class="field-grid">' +
          fld('Altura', p.height_cm ? (p.height_cm / 100).toFixed(2) + ' m' : '') +
          fld('Peso', p.weight_kg ? p.weight_kg + ' kg' : '') +
          fld('Envergadura', p.wingspan_cm ? p.wingspan_cm + ' cm' : '') +
          fld('Alcance vertical (sin impulso)', p.vertical_reach_stand ? p.vertical_reach_stand + ' cm' : '') +
          fld('Alcance vertical (con impulso)', p.vertical_reach_run ? p.vertical_reach_run + ' cm' : '') +
          fld('Salto de longitud (sin carrera)', p.long_jump_stand_cm ? p.long_jump_stand_cm + ' cm' : '') +
          fld('Salto de longitud (con carrera)', p.long_jump_run_cm ? p.long_jump_run_cm + ' cm' : '') +
          fld('Altura de torso', p.torso_height_cm ? p.torso_height_cm + ' cm' : '') +
          fld('Longitud de pie', p.foot_length_cm ? p.foot_length_cm + ' cm' : '') +
          fld('Longitud de manos', p.hand_length_cm ? p.hand_length_cm + ' cm' : '') +
          fld('Mano dominante', p.dominant_hand) +
          fld('Usa las dos manos', p.uses_both_hands) + '</div>'));

        /* Altura de salto: no se teclea, sale de los dos alcances que el club
           ya toma. Restarlo a mano cada temporada no lo hace nadie. */
        var altSalto = SF.alturaSalto(p);
        if (altSalto) {
          body.appendChild(el('<p class="hint">Con esos dos alcances, salta <b>' + altSalto + ' cm</b>.</p>'));
        }

        /* --- Tests de rendimiento --- */
        var tests = SF.MEASURE_FIELDS.filter(function (t) { return t.test && p[t.k]; });
        var asim = SF.asimetria(p);
        if (tests.length || asim) {
          body.appendChild(el('<p class="sec-label">Tests de rendimiento</p>'));
          if (tests.length) {
            body.appendChild(el('<div class="fields">' + tests.map(function (t) {
              return fld(t.label, t.texto ? p[t.k] : SF.numMedida(p[t.k], t) + (t.u ? ' ' + t.u : ''));
            }).join('') + '</div>'));
          }
          if (asim) {
            /* Se dice el dato y qué pierna, no un diagnóstico. La app no es
               un fisio y no debe sonar como si lo fuera. */
            body.appendChild(el('<p class="' + (asim.aviso ? 'aviso-lin' : 'hint') + '">' +
              'Asimetría entre piernas: <b>' + asim.pct + ' %</b>, salta más con la ' + esc(asim.fuerte) + '. ' +
              (asim.aviso
                ? 'Por encima del ' + SF.ASIMETRIA_AVISO + ' % conviene comentarlo con el fisio o el preparador; no es un diagnóstico, es un dato para mirar.'
                : 'Por debajo del ' + SF.ASIMETRIA_AVISO + ' %, que es lo habitual.') + '</p>'));
          }
        }

        var mlog = p.measure_log || [];
        if (mlog.length) {
          var lastM = mlog[mlog.length - 1];
          body.appendChild(el('<p class="hint">Última medición: <b>' + esc(lastM.by) + '</b> · ' + esc(lastM.role) + ' · ' + esc(lastM.date) + '</p>'));
        }
        if (role().canEditPhysical) {
          var edPhys = el('<button class="btn btn-primary btn-sm">' + ico('edit') + 'Editar medidas físicas</button>');
          edPhys.onclick = function () {
            U.modal('Medidas físicas — ' + esc(p.full_name), smallForm([
              { name: 'height_cm', label: 'Altura (cm)', type: 'number' },
              { name: 'weight_kg', label: 'Peso (kg)', type: 'number' },
              { name: 'wingspan_cm', label: 'Envergadura (cm)', type: 'number' },
              { name: 'vertical_reach_stand', label: 'Alcance vertical sin impulso (cm)', type: 'number' },
              { name: 'vertical_reach_run', label: 'Alcance vertical con impulso (cm)', type: 'number' },
              { name: 'long_jump_stand_cm', label: 'Salto de longitud sin carrera (cm)', type: 'number' },
              { name: 'long_jump_run_cm', label: 'Salto de longitud con carrera (cm)', type: 'number' },
              { name: 'torso_height_cm', label: 'Altura de torso (cm)', type: 'number' },
              { name: 'foot_length_cm', label: 'Longitud de pie (cm)', type: 'number' },
              { name: 'hand_length_cm', label: 'Longitud de manos (cm)', type: 'number' },
              { name: 'dominant_hand', label: 'Mano dominante', type: 'select', options: ['Derecha', 'Izquierda', 'Ambidiestra'] },
              { name: 'uses_both_hands', label: 'Usa las dos manos', type: 'select', options: ['Sí', 'No'] },

              { sep: 'Tests de rendimiento', nota: 'Rellena solo los que hagáis. Un hueco no pasa nada; un dato aproximado sí, porque luego se compara con el del año que viene.' },
              { name: 'cmj_cm', label: 'Salto vertical CMJ (cm)', type: 'number', step: '0.1' },
              { name: 'jump_single_l_cm', label: 'Salto a una pierna · izquierda (cm)', type: 'number', step: '0.1' },
              { name: 'jump_single_r_cm', label: 'Salto a una pierna · derecha (cm)', type: 'number', step: '0.1',
                hint: 'Con las dos piernas la app calcula sola la asimetría' },
              { name: 'dropjump_rsi', label: 'Drop jump · RSI', type: 'number', step: '0.01',
                hint: 'Índice de fuerza reactiva, sin unidad' },
              { name: 'sprint20_s', label: 'Sprint 20 m (s)', type: 'number', step: '0.01', hint: 'Menos es mejor' },
              { name: 'cod_s', label: 'Cambio de dirección (s)', type: 'number', step: '0.01', hint: 'Menos es mejor' },
              { name: 'decel_s', label: 'Test de deceleración (s)', type: 'number', step: '0.01', hint: 'Menos es mejor' },
              { name: 'nordic_n', label: 'Isquiotibiales nórdicos (N)', type: 'number', step: '1',
                hint: 'Fuerza excéntrica, en newtons' },
              { name: 'ankle_rom_deg', label: 'Movilidad de tobillo (°)', type: 'number', step: '0.5' },
              { name: 'measured_with', label: 'Medido con', type: 'select', options: SF.INSTRUMENTOS,
                hint: 'Importa: si cambiáis de método a mitad de temporada, los números dejan de ser comparables' }
            ], p, function (d) {
              var u = SF.store.currentUser();
              var hoy = new Date().toISOString().slice(0, 10);
              var entry = Object.assign({ by: u.name, role: u.label, date: hoy, season: SF.seasonOf(hoy) }, d);
              var newLog = (p.measure_log || []).slice(); newLog.push(entry);
              SF.store.update(p.id, Object.assign({}, d, { measure_log: newLog }));
              p = SF.store.get(p.id); U.toast('Medidas guardadas por ' + u.name); paint();
            }));
          };
          body.appendChild(el('<p class="hint">Las medidas las toma el preparador físico cada temporada; cada actualización queda registrada.</p>'));
          body.appendChild(edPhys);
        }
        if (mlog.length) {
          body.appendChild(el('<p class="sec-label">Historial de medidas</p>'));
          var ml = el('<div class="mini-list"></div>');
          mlog.slice().reverse().slice(0, 6).forEach(function (e) {
            var vals = [];
            if (e.height_cm) vals.push((e.height_cm / 100).toFixed(2) + ' m');
            if (e.weight_kg) vals.push(e.weight_kg + ' kg');
            if (e.wingspan_cm) vals.push('env. ' + e.wingspan_cm);
            if (e.vertical_reach_run) vals.push('alc. ' + e.vertical_reach_run);
            if (e.long_jump_run_cm) vals.push('long. ' + e.long_jump_run_cm);
            ml.appendChild(el('<div class="mini-row"><span><b>' + esc(e.date) + '</b> · ' + esc(vals.join(' · ')) + '</span><span class="hint">' + esc(e.by) + '</span></div>'));
          });
          body.appendChild(ml);
        }

        /* --- Crecimiento: una frase, no una tabla ---
