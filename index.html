  <script>
/* js/data.js */
/* ScoutFlow Academy — datos semilla y configuración.
   Todo es JS global (sin módulos, sin fetch) para que funcione también
   abriendo index.html con doble clic (file://). */
window.SF = window.SF || {};

/* Estados canónicos del jugador y orden del pipeline de captación */
SF.STATUSES = [
  'Nuevo', 'Datos incompletos', 'Pendiente de vídeo', 'En evaluación',
  'Entrevista', 'Oferta enviada', 'Inscrito', 'Rechazado'
];
SF.PIPELINE = ['Nuevo', 'Datos incompletos', 'En evaluación', 'Entrevista', 'Oferta enviada', 'Inscrito'];

/* ===================== INSCRIPCIÓN EN EL CLUB =====================
   El formulario que hoy se rellena en un papel y luego alguien pasa a mano.
   Aquí se rellena una vez y la ficha nace completa.

   Dos reglas que no son un capricho:

   1. Cada autorización se contesta SÍ o NO, a propósito, y se guarda quién
      la firmó y cuándo. Un "no contestado" no es un sí.
   2. La de imagen SE PUEDE CONTESTAR QUE NO y aun así completar la
      inscripción. Si condicionas la inscripción a que digan que sí, el
      consentimiento deja de ser libre y no vale (RGPD art. 7.4). Es un error
      muy común y sale caro. */
SF.CONSENTIMIENTOS = [
  { k: 'datos', titulo: 'Tratamiento de datos',
    texto: 'Autorizo al club a guardar y tratar los datos de esta ficha para gestionar la actividad deportiva: inscripción, licencia federativa, comunicaciones y cobros.',
    obligatorio: true,
    nota: 'Sin esto el club no puede ni inscribirle. Es la base de todo lo demás.' },
  { k: 'imagen', titulo: 'Uso de imagen',
    texto: 'Autorizo que se publiquen fotografías y vídeos en los que aparezca, en las redes sociales del club, su web y notas de prensa, siempre en el contexto de la actividad deportiva.',
    obligatorio: false,
    nota: 'Se puede decir que NO y seguir adelante sin ningún problema. Si dice que no, el club no publicará su imagen.' },
  { k: 'salidas', titulo: 'Desplazamientos y salidas',
    texto: 'Autorizo su participación en desplazamientos, torneos y actividades organizadas por el club fuera de las instalaciones habituales.',
    obligatorio: false },
  { k: 'sanitaria', titulo: 'Atención sanitaria urgente',
    texto: 'Autorizo al club a solicitar atención médica urgente si fuera necesario y no se pudiera contactar con la familia en ese momento.',
    obligatorio: false }
];

/* En España, a partir de los 14 años el menor puede consentir por sí mismo
   el tratamiento de sus datos; por debajo, firman los padres o tutores. */
SF.firmaMenor14 = function (birth_date) {
  if (!birth_date) return true;
  var d = new Date(birth_date + 'T00:00:00');
  if (isNaN(d)) return true;
  var e = (Date.now() - d.getTime()) / (365.25 * 24 * 3600 * 1000);
  return e < 14;
};

/* ===================== A QUIÉN LLEGA UN AVISO =====================
   Un club que trabaja con menores no le escribe a un niño de doce años: le
   escribe a su familia. Por debajo de 14 el mensaje va SIEMPRE a los tutores,
   aunque quien lo manda haya elegido "a los jugadores". No es una manía: es
   la misma edad a partir de la cual el menor puede consentir por sí mismo
   (LOPDGDD), y es la línea que un presidente entiende a la primera.

   A partir de 14 sí se puede escribir al jugador, y quien manda elige.

   Devuelve a quién le llega DE VERDAD, que puede no ser lo que se pidió. */
/* El primero es el que sale marcado por defecto, y va a propósito: en un club
   de formación lo normal es que un aviso lo vean la familia Y el jugador. El
   chaval de 15 años se entera de que hay equipación roja sin depender de que
   su padre le pase el recado, y la familia lo sabe igualmente. Por debajo de
   14 se recorta solo. */
SF.AUDIENCIAS = [
  { k: 'ambos', label: 'A las familias y a los jugadores', desc: 'Los dos lo ven. A los menores de 14 les llegará solo a su familia.' },
  { k: 'familias', label: 'Solo a las familias', desc: 'Lo reciben padres, madres y tutores. Para cuotas, papeles y asuntos de casa.' },
  { k: 'jugadores', label: 'Solo a los jugadores', desc: 'Para cosas del vestuario. A los menores de 14 les llegará a su familia igualmente.' }
];

SF.audienciaReal = function (audiencia, p) {
  var quiereJug = audiencia === 'jugadores' || audiencia === 'ambos';
  var quiereFam = audiencia === 'familias' || audiencia === 'ambos';
  var menor = p ? SF.firmaMenor14(p.birth_date) : true;
  /* Si es menor de 14 y solo se había marcado "jugadores", el mensaje no se
     pierde: se redirige a la familia. Un aviso que no llega a nadie es peor
     que uno mal dirigido. */
  if (menor) return { jugador: false, familia: true, redirigido: quiereJug && !quiereFam };
  return { jugador: quiereJug, familia: quiereFam, redirigido: false };
};

/* ===================== CONVERSACIONES =====================
   Bidireccional, pero NO es un chat. Funciona como un correo: hay un asunto,
   un primer mensaje y respuestas debajo. Nadie escribe "ok" a las once de la
   noche esperando que el entrenador conteste al momento.

   Quién puede escribir a quién no es libre, y esa es la parte importante:

     · La FAMILIA solo alcanza a las personas que llevan a su hijo: el
       entrenador de su equipo, el preparador físico de su equipo y el
       director técnico de su segmento. No al del equipo de al lado, ni a
       administración por la puerta de atrás.
     · El JUGADOR solo alcanza a su entrenador. Un menor no debe tener línea
       directa con cinco adultos del club.
     · El STAFF se escribe entre sí sin restricción.

   Y toda conversación en la que hay una familia o un menor la ve también
   dirección y el DT del segmento. No es control: es que el entrenador no se
   quede solo si un día una familia se pone difícil, y que el club tenga
   registro de lo que se habló. Se le dice a la familia en la propia pantalla,
   porque una supervisión que no se avisa es otra cosa. */

/* Personas del club a las que puede escribir la familia de un jugador. */
SF.destinatariosFamilia = function (p) {
  if (!p || !p.team_id) return [];
  var equipo = SF.store.teamGet(p.team_id);
  if (!equipo) return [];
  return SF.store.staff().filter(function (s) {
    var lleva = (s.team_ids || []).indexOf(p.team_id) >= 0;
    if (s.role === 'entrenador' || s.role === 'preparador_fisico') return lleva;
    /* El DT que corresponde sale del segmento del equipo, no de una lista
       que alguien tenga que mantener a mano. */
    var segs = (SF.ROLES[s.role] || {}).segments;
    if (!segs) return false;
    if (segs === 'all') return s.role === 'dt_general' && lleva;
    return segs.indexOf(equipo.segment) >= 0;
  });
};

/* El jugador solo escribe a su entrenador. */
SF.destinatariosJugador = function (p) {
  if (!p || !p.team_id) return [];
  return SF.store.staff().filter(function (s) {
    return s.role === 'entrenador' && (s.team_ids || []).indexOf(p.team_id) >= 0;
  });
};

/* Quién supervisa una conversación de un equipo: dirección y el DT que le
   toca. Se guarda en el hilo al crearlo para que quede constancia de quién
   tenía acceso ese día, aunque mañana cambien los cargos. */
SF.supervisoresDe = function (teamId) {
  var equipo = teamId ? SF.store.teamGet(teamId) : null;
  return SF.store.staff().filter(function (s) {
    if (s.role === 'dt_general') return true;
    var segs = (SF.ROLES[s.role] || {}).segments;
    if (!segs || segs === 'all' || !equipo) return false;
    return segs.indexOf(equipo.segment) >= 0;
  });
};

/* ===================== DISPONIBILIDAD =====================
   La decisión de producto más delicada de la app, y conviene entenderla.

   Un club necesita saber si un chaval puede jugar el sábado. NO necesita
   saber qué tiene. El diagnóstico es dato de salud del artículo 9 del RGPD,
   la categoría más protegida que existe, y además un fisioterapeuta
   colegiado tiene secreto profesional: su historia clínica no es del club.

   Así que ScoutFlow NO guarda diagnósticos. Guarda tres cosas:
     · si puede jugar,
     · qué NO puede hacer, en términos deportivos ("sin saltos"),
     · desde cuándo, hasta cuándo, y quién lo firma.

   Con eso el entrenador planifica el partido sin saber nada del cuerpo del
   jugador. Es la misma decisión que con el certificado de delitos: lo que no
   guardas no lo puedes perder ni filtrar.

   La limitación es funcional a propósito. "Sin saltos" es información
   deportiva; "tendinopatía rotuliana" es información clínica. Parecen lo
   mismo y no lo son. */
SF.DISPO = [
  { k: 'disponible', label: 'Disponible', tag: 'tag-green', corto: 'Disponible' },
  { k: 'limitada', label: 'Disponible con limitaciones', tag: 'tag-warn', corto: 'Con limitaciones' },
  { k: 'no', label: 'No disponible', tag: 'tag-danger', corto: 'No disponible' }
];
/* En términos de lo que puede o no puede HACER, nunca de lo que tiene. */
SF.LIMITACIONES = [
  'Sin saltos', 'Sin contacto', 'Sin cambios de dirección', 'Sin carrera',
  'Carga reducida', 'Solo trabajo específico', 'Solo gimnasio', 'Vuelta progresiva'
];

SF.dispo = function (p) {
  var a = (p && p.availability) || {};
  var k = a.estado || 'disponible';
  var def = SF.DISPO.filter(function (x) { return x.k === k; })[0] || SF.DISPO[0];
  /* Si la fecha de alta ya pasó, no se sigue diciendo que está de baja: se
     avisa de que hay que revisarlo. Un semáforo caducado engaña más que no
     tener semáforo. */
  var caducada = false;
  if (k !== 'disponible' && a.hasta) {
    var h = new Date(a.hasta + 'T23:59:59');
    if (!isNaN(h) && h.getTime() < Date.now()) caducada = true;
  }
  return { k: k, def: def, limitacion: a.limitacion || '', desde: a.desde || '', hasta: a.hasta || '',
    by: a.by || '', role: a.role || '', at: a.at || '', caducada: caducada, activa: k !== 'disponible' };
};

/* ===================== LICENCIAS FEDERATIVAS =====================
   Esto NO tramita nada: prepara. Antes de entrar en la intranet de la
   federación te dice quién está listo y a quién le falta qué.

   Lo que más tiempo cuesta no es teclear: es empezar una ficha, descubrir a
   mitad que falta el DNI, salir a buscarlo y volver. Eso es lo que se evita.

   Los permisos de los padres NO se piden aquí: ya se firman al inscribir al
   jugador en el club. Pedirlos otra vez sería marear a la familia. */
SF.LICENCIA_REQ = [
  { k: 'nombre', label: 'Nombre y apellidos', ok: function (p) { return !!(p.full_name || '').trim(); } },
  { k: 'fecha', label: 'Fecha de nacimiento completa', ok: function (p) { return !!p.birth_date; },
    nota: 'No basta el año: la federación pide día, mes y año' },
  { k: 'dni', label: 'DNI, NIE o pasaporte', ok: function (p) { return !!(p.dni || '').trim(); } },
  { k: 'sexo', label: 'Sexo', ok: function (p) { return !!p.gender; },
    nota: 'Determina la categoría en la que se inscribe' },
  { k: 'nacionalidad', label: 'Nacionalidad', ok: function (p) { return !!(p.nationality || []).length; } },
  { k: 'equipo', label: 'Equipo asignado', ok: function (p) { return !!p.team_id; },
    nota: 'La licencia se pide por equipo' },
  { k: 'contacto', label: 'Teléfono o email de contacto',
    ok: function (p) { return !!(p.phone || p.email || (p.family || {}).phone || (p.family || {}).email); } },
  { k: 'domicilio', label: 'Domicilio', ok: function (p) { return !!(p.address || '').trim(); } }
];

SF.licenciaPend = function (p) {
  return SF.LICENCIA_REQ.filter(function (r) { return !r.ok(p); });
};
SF.licenciaListo = function (p) { return SF.licenciaPend(p).length === 0; };

/* Los datos en bloque, listos para pegar en la intranet. No inventamos el
   formato de fichero de la federación hasta saber cuál es: copiar y pegar
   campo a campo funciona siempre y no engaña a nadie. */
SF.licenciaTexto = function (p) {
  var f = p.family || {};
  return [
    'Nombre: ' + (p.first_name || ''),
    'Apellidos: ' + (p.last_name || ''),
    'Fecha de nacimiento: ' + (p.birth_date || ''),
    'Sexo: ' + (p.gender || ''),
    'DNI / documento: ' + (p.dni || ''),
    'Nacionalidad: ' + (p.nationality || []).join(', '),
    'Domicilio: ' + (p.address || ''),
    'Ciudad: ' + (p.city || ''),
    'Teléfono: ' + (p.phone || f.phone || ''),
    'Email: ' + (p.email || f.email || '')
  ].join('\n');
};

/* ===================== VÍDEOS =====================
   Guardamos ENLACES, no archivos. Y no es un apaño: es lo correcto.
   El vídeo de un chaval ya está en YouTube, en Drive o en la plataforma del
   club, subido por la familia o por el scout. Volver a subirlo aquí sería
   duplicar gigas, pagar almacenamiento y, sobre todo, hacernos responsables
   de custodiar la imagen de un menor sin necesidad.

   Cuando llegue Supabase se podrán subir archivos también, pero los enlaces
   seguirán siendo lo más usado. */
SF.VIDEO_TYPES = ['Highlights', 'Partido completo', 'Entrenamiento', 'Prueba física', 'Otro'];

/* Reconoce YouTube y Vimeo para poder enseñar la miniatura y reproducir
   dentro de la ficha. Cualquier otro enlace (Drive, Hudl, un .mp4) se guarda
   igual: se abre fuera y ya está. */
SF.videoInfo = function (url) {
  url = String(url || '').trim();
  if (!url) return null;
  var yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if (yt) return { fuente: 'YouTube', id: yt[1], embed: 'https://www.youtube-nocookie.com/embed/' + yt[1],
    miniatura: 'https://img.youtube.com/vi/' + yt[1] + '/mqdefault.jpg' };
  var vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return { fuente: 'Vimeo', id: vm[1], embed: 'https://player.vimeo.com/video/' + vm[1], miniatura: null };
  if (/drive\.google\.com/.test(url)) return { fuente: 'Google Drive', embed: null, miniatura: null };
  return { fuente: 'Enlace', embed: null, miniatura: null };
};

/* ===================== CRECIMIENTO Y EDAD RELATIVA =====================

   Dos cosas distintas que en formación se confunden constantemente:
     · la EDAD RELATIVA: dentro del mismo año, quién nació antes;
     · la MADUREZ: quién ha dado ya el estirón.
   Las dos hacen que un chaval parezca mejor de lo que es (o peor), y las dos
   se pueden calcular con datos que ya tenemos. */

/* --- Trimestre de nacimiento ---
   Dentro de un mismo año, los nacidos en enero-marzo están sistemáticamente
   sobrerrepresentados en las canteras. No porque sean mejores: porque son
   hasta once meses mayores cuando alguien los eligió. Sale gratis de la
   fecha de nacimiento y destapa un sesgo que casi ningún club ve. */
SF.birthQuarter = function (p) {
  if (!p.birth_date) return null;
  var m = new Date(p.birth_date + 'T00:00:00').getMonth();
  if (isNaN(m)) return null;
  var q = Math.floor(m / 3) + 1;
  return { q: q, label: 'Q' + q, meses: ['ene-mar', 'abr-jun', 'jul-sep', 'oct-dic'][q - 1],
    tardio: q >= 3 };   // Q3 y Q4: los más jóvenes de su año
};

/* --- Talla diana familiar ---
   La fórmula clínica de siempre: media de la estatura de los padres, más 6,5
   cm si es chico y menos 6,5 si es chica. Es una ESTIMACIÓN con un margen
   amplio (±8,5 cm cubre a la gran mayoría), y así hay que enseñarla: como
   una horquilla, nunca como una cifra exacta.

   Nota: existe el método Khamis-Roche, que además usa la talla y el peso
   actuales del chaval y afina bastante más. Necesita unas tablas de
   coeficientes por edad que aún no tenemos; cuando las consigamos, este
   cálculo se sustituye sin tocar nada más. */
SF.tallaDiana = function (p) {
  var f = (p.family || {});
  var pa = +f.father_height_cm, ma = +f.mother_height_cm;
  if (!pa || !ma) return null;
  var chica = (p.gender || '').toLowerCase().indexOf('f') === 0 || (p.gender || '').toLowerCase().indexOf('muj') === 0;
  var diana = (pa + ma) / 2 + (chica ? -6.5 : 6.5);
  var out = { cm: Math.round(diana), min: Math.round(diana - 8.5), max: Math.round(diana + 8.5), chica: chica };
  if (p.height_cm) {
    out.actual = p.height_cm;
    out.pct = Math.round(p.height_cm / diana * 100);
    out.faltan = Math.round(diana - p.height_cm);
  }
  return out;
};

/* ===================== EVALUACIÓN Y SCOUT SCORE =====================
   Escala de 0 a 10. Se eligió por dos razones:
     · Una escala de 11 puntos es más fiable que una de 5: hay sitio para
       matizar y las medias se mueven de forma significativa.
     · En España todo el mundo lee el 1-10 como las notas del colegio, así
       que no hay que enseñar a nadie a usarla.

   Pero un número solo es subjetivo: un 5 significa cosas distintas para cada
   entrenador. Por eso cada tramo lleva su descripción, y la referencia SIEMPRE
   es su categoría y su año, no el baloncesto en abstracto. Sin eso, dos
   personas puntúan distinto al mismo jugador y el Score no vale nada. */
SF.EVAL_MAX = 10;
SF.EVAL_ANCHORS = [
  { min: 9, label: 'Referencia', desc: 'Destaca incluso fuera de su categoría' },
  { min: 7, label: 'Por encima', desc: 'Claramente mejor que la media de su año' },
  { min: 5, label: 'En la media', desc: 'Lo esperable para su categoría y edad' },
  { min: 3, label: 'Por debajo', desc: 'Le falta respecto a su año' },
  { min: 1, label: 'Muy por debajo', desc: 'Es su punto débil, hay que trabajarlo' }
];
SF.evalAnchor = function (v) {
  v = +v || 0;
  for (var i = 0; i < SF.EVAL_ANCHORS.length; i++) if (v >= SF.EVAL_ANCHORS[i].min) return SF.EVAL_ANCHORS[i];
  return null;
};

/* Peso de cada bloque en el Score. Se puede cambiar por academia: no es lo
   mismo un club de cantera que uno que ficha para competir ya.
   Por defecto lo mental pesa más que lo físico, porque en formación la
   actitud predice el desarrollo mejor que el físico de hoy, que además
   cambia solo con la edad. */
SF.SCORE_WEIGHTS = { 'Técnica': 40, 'Física': 25, 'Mental': 35 };

/* El Scout Score sale de las evaluaciones. Nadie lo teclea.
   Devuelve también de cuántos apartados sale: un 84 con 3 notas puestas no
   vale lo mismo que un 84 con 15, y eso hay que decirlo. */
SF.scoutScore = function (p, statsOverride) {
  var sp = SF.SPORTS[p.sport || 'baloncesto'];
  if (!sp || !sp.skills) return null;
  /* Con statsOverride se calcula el Score de unas notas ANTIGUAS, para poder
     comparar la temporada de hace tres años con la de ahora. Sin esto, el
     histórico se vería en crudo y nadie lee 22 números por temporada. */
  var stats = statsOverride || p.stats || {};
  var pesoTotal = 0, acumulado = 0, puestos = 0, total = 0, porGrupo = {};

  Object.keys(sp.skills).forEach(function (g) {
    var skills = sp.skills[g], suma = 0, n = 0;
    skills.forEach(function (sk) {
      total++;
      var v = +stats[sk];
      if (v > 0) { suma += v; n++; puestos++; }
    });
    if (!n) { porGrupo[g] = null; return; }               // grupo sin evaluar: no penaliza
    var media = suma / n;
    porGrupo[g] = media;
    var w = SF.SCORE_WEIGHTS[g] != null ? SF.SCORE_WEIGHTS[g] : 100 / Object.keys(sp.skills).length;
    pesoTotal += w; acumulado += media * w;
  });

  if (!pesoTotal || !puestos) return null;                // sin nada evaluado, no hay Score
  return {
    score: Math.round((acumulado / pesoTotal) * 10),      // media ponderada 0-10 -> 0-100
    puestos: puestos, total: total,
    cobertura: Math.round(puestos / total * 100),
    porGrupo: porGrupo
  };
};

/* ===================== EVOLUCIÓN DEL JUGADOR =====================
   Un chaval entra con ocho años y se va con dieciocho. Si cada evaluación
   pisa la anterior, el club pierde justo lo que más vale de tenerlo diez
   temporadas: poder ver cómo ha cambiado.

   Por eso cada evaluación guarda una FOTO de las notas, no solo la fecha.
   Una foto por temporada: si el entrenador la retoca en enero, corrige la de
   esa temporada; en septiembre nace una nueva y la anterior queda cerrada.
   Es como funciona un club, y evita llenar el historial de entradas iguales.

   La temporada va de julio a junio. Una evaluación del 3 de septiembre de
   2019 pertenece a 2019/2020; una del 10 de mayo de 2020, también. */
SF.seasonOf = function (dateStr) {
  var d = dateStr ? new Date(dateStr + (dateStr.length === 10 ? 'T00:00:00' : '')) : new Date();
  if (isNaN(d)) return SF.SEASON;
  var y = d.getFullYear();
  var ini = d.getMonth() >= 6 ? y : y - 1;      // julio (mes 6) abre temporada
  return ini + '/' + (ini + 1);
};

/* Edad exacta en una fecha dada. Si solo hay año de nacimiento, se dice
   la edad que cumplía ese año y se avisa de que es aproximada. */
SF.ageAt = function (p, dateStr) {
  var ref = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  if (isNaN(ref)) return null;
  if (p.birth_date) {
    var b = new Date(p.birth_date + 'T00:00:00');
    if (isNaN(b)) return null;
    var a = ref.getFullYear() - b.getFullYear();
    var m = ref.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && ref.getDate() < b.getDate())) a--;
    return a >= 0 && a < 60 ? { años: a, exacta: true } : null;
  }
  if (p.birth_year) {
    var ap = ref.getFullYear() - p.birth_year;
    return ap >= 0 && ap < 60 ? { años: ap, exacta: false } : null;
  }
  return null;
};

/* Todo lo que toma el preparador físico, en un solo sitio. Definirlo aquí y
   no en cada pantalla evita que se añada un campo a la ficha y luego no
   aparezca en el historial, que es justo lo que pasaba antes.
   'texto: true' son los que no son un número y por tanto no tienen resta:
   pasar de "No" a "Sí" en usar las dos manos no son centímetros, pero es
   probablemente el cambio más importante que hace un jugador de cantera. */
SF.MEASURE_FIELDS = [
  { k: 'height_cm', label: 'Altura', u: 'cm', metros: true },
  { k: 'weight_kg', label: 'Peso', u: 'kg' },
  { k: 'wingspan_cm', label: 'Envergadura', u: 'cm' },
  { k: 'vertical_reach_stand', label: 'Alcance vertical sin impulso', u: 'cm' },
  { k: 'vertical_reach_run', label: 'Alcance vertical con impulso', u: 'cm' },
  { k: 'long_jump_stand_cm', label: 'Salto de longitud sin carrera', u: 'cm' },
  { k: 'long_jump_run_cm', label: 'Salto de longitud con carrera', u: 'cm' },
  { k: 'torso_height_cm', label: 'Altura de torso', u: 'cm' },
  { k: 'foot_length_cm', label: 'Longitud de pie', u: 'cm' },
  { k: 'hand_length_cm', label: 'Longitud de manos', u: 'cm' },
  { k: 'dominant_hand', label: 'Mano dominante', texto: true },
  { k: 'uses_both_hands', label: 'Usa las dos manos', texto: true },

  /* --- Tests de rendimiento ---
     Estos NO los mide ScoutFlow: los mide el preparador con su material o con
     una app tipo My Jump Lab, y aquí se anotan para poder seguirlos temporada
     a temporada. Es la división del trabajo que tiene sentido: ellos miden
     bien, nosotros recordamos bien.

     'menosEsMejor' existe porque en un sprint bajar de 3,20 a 3,05 es mejorar.
     Sin esta marca, la app pintaría en rojo una mejora, que es peor que no
     pintar nada. */
  { k: 'cmj_cm', test: true, label: 'Salto vertical (CMJ)', u: 'cm', step: '0.1' },
  { k: 'jump_single_l_cm', test: true, label: 'Salto a una pierna · izquierda', u: 'cm', step: '0.1' },
  { k: 'jump_single_r_cm', test: true, label: 'Salto a una pierna · derecha', u: 'cm', step: '0.1' },
  { k: 'dropjump_rsi', test: true, label: 'Drop jump · RSI', u: '', step: '0.01' },
  { k: 'sprint20_s', test: true, label: 'Sprint 20 m', u: 's', step: '0.01', menosEsMejor: true },
  { k: 'cod_s', test: true, label: 'Cambio de dirección', u: 's', step: '0.01', menosEsMejor: true },
  { k: 'decel_s', test: true, label: 'Test de deceleración', u: 's', step: '0.01', menosEsMejor: true },
  { k: 'nordic_n', test: true, label: 'Isquiotibiales nórdicos', u: 'N', step: '1' },
  { k: 'ankle_rom_deg', test: true, label: 'Movilidad de tobillo', u: '°', step: '0.5' },
  { k: 'measured_with', test: true, label: 'Medido con', texto: true }
];

/* Instrumentos. Importa de verdad: un CMJ tomado con el móvil y uno tomado a
   ojo con un cronómetro no son comparables, y si el club cambia de método a
   mitad de temporada la evolución miente sin que nadie se entere. */
SF.INSTRUMENTOS = ['My Jump Lab', 'Otra app de móvil', 'Plataforma de contacto', 'Fotocélulas', 'Cronómetro manual', 'Cinta métrica', 'Goniómetro', 'Otro'];

/* Los decimales, según lo que se mide. JavaScript escribe 25.0 como "25" y
   -0.20 como "-0.2"; en una columna de tiempos eso hace dudar de si falta una
   cifra. Cada medida se muestra con los decimales con los que se toma. */
SF.numMedida = function (v, def) {
  var d = (def && def.step === '0.01') ? 2 : ((def && def.step === '0.1') ? 1 : 0);
  return d ? (+v).toFixed(d) : String(v);
};

/* Asimetría entre piernas. En baloncesto una diferencia grande entre la
   izquierda y la derecha es un aviso: se asocia a más riesgo de lesión y a
   peor rendimiento en los cambios de dirección. El umbral que se maneja
   habitualmente en la literatura ronda el 10 %, así que por encima de ahí se
   avisa, sin diagnosticar nada: esto no sustituye a un fisio. */
SF.ASIMETRIA_AVISO = 10;
SF.asimetria = function (m) {
  if (!m) return null;
  var i = +m.jump_single_l_cm, d = +m.jump_single_r_cm;
  if (!i || !d) return null;
  var alto = Math.max(i, d), bajo = Math.min(i, d);
  var pct = Math.round((alto - bajo) / alto * 1000) / 10;
  return { pct: pct, fuerte: i > d ? 'izquierda' : 'derecha', debil: i > d ? 'derecha' : 'izquierda', aviso: pct >= SF.ASIMETRIA_AVISO };
};

/* Altura de salto = lo que llega con impulso menos lo que llega parado.
   Son dos datos que el club ya toma; restarlos a mano cada vez es justo el
   tipo de cuenta que nadie hace y que la app puede hacer sola. */
SF.alturaSalto = function (m) {
  if (!m) return null;
  var a = +m.vertical_reach_run, b = +m.vertical_reach_stand;
  if (!a || !b || a <= b) return null;
  return a - b;
};

/* Junta medidas y evaluaciones en una sola línea temporal por temporada.
   Devuelve de la más antigua a la más reciente, con la diferencia respecto
   a la temporada anterior ya calculada: sin las diferencias hay que restar
   a mano y entonces nadie lo mira. */
SF.evolucion = function (p) {
  var porTemp = {};
  function fila(season) {
    if (!porTemp[season]) porTemp[season] = { season: season, medida: null, eval: null };
    return porTemp[season];
  }

  (p.measure_log || []).forEach(function (m) {
    var f = fila(m.season || SF.seasonOf(m.date));
    /* Si hay varias medidas en la misma temporada nos quedamos con la última:
       la del final de curso cuenta el crecimiento real de ese año. */
    if (!f.medida || (m.date || '') >= (f.medida.date || '')) f.medida = m;
  });

  (p.eval_log || []).forEach(function (e) {
    var f = fila(e.season || SF.seasonOf(e.date));
    if (!f.eval || (e.date || '') >= (f.eval.date || '')) f.eval = e;
  });

  var filas = Object.keys(porTemp).sort().map(function (k) { return porTemp[k]; });
  if (!filas.length) return [];

  var prev = null;
  filas.forEach(function (f) {
    var fecha = (f.eval && f.eval.date) || (f.medida && f.medida.date) || null;
    f.fecha = fecha;
    f.edad = SF.ageAt(p, fecha);
    f.altura = f.medida && f.medida.height_cm ? +f.medida.height_cm : null;
    f.peso = f.medida && f.medida.weight_kg ? +f.medida.weight_kg : null;
    f.stats = f.eval && f.eval.stats ? f.eval.stats : null;
    f.sinDetalle = !!(f.eval && !f.eval.stats);
    var ss = f.stats ? SF.scoutScore(p, f.stats) : null;
    f.score = ss ? ss.score : null;
    f.cobertura = ss ? ss.cobertura : null;
    f.porGrupo = ss ? ss.porGrupo : null;

    /* Diferencias contra la ÚLTIMA temporada que tenía ese dato, no contra la
       inmediatamente anterior: si un año no se le midió, el crecimiento no
       desaparece, se acumula. */
    f.dAltura = null; f.dPeso = null; f.dScore = null;
    var pa = null, pp = null, psc = null;
    filas.slice(0, filas.indexOf(f)).forEach(function (a) {
      if (a.altura != null) pa = a.altura;
      if (a.peso != null) pp = a.peso;
      if (a.score != null) psc = a.score;
    });
    if (f.altura != null && pa != null) f.dAltura = f.altura - pa;
    if (f.peso != null && pp != null) f.dPeso = Math.round((f.peso - pp) * 10) / 10;
    if (f.score != null && psc != null) f.dScore = f.score - psc;
    prev = f;
  });
  return filas;
};

/* Igual que las destrezas, pero con las medidas del preparador físico: una
   fila por medida y una columna por temporada. Solo salen las que se han
   tomado alguna vez. */
SF.evolucionMedidas = function (p, filas) {
  var conM = filas.filter(function (f) { return f.medida; });
  if (!conM.length) return [];
  var out = [];
  SF.MEASURE_FIELDS.forEach(function (def) {
    var vals = conM.map(function (f) {
      var v = f.medida[def.k];
      if (v === undefined || v === null || v === '') return null;
      return def.texto ? String(v) : (+v || null);
    });
    if (!vals.some(function (v) { return v; })) return;        // nunca tomada
    var prim = null, ult = null;
    vals.forEach(function (v) { if (v) { if (prim === null) prim = v; ult = v; } });
    var delta = null;
    /* Dos decimales: un sprint mejora 0,15 s. Redondeando a uno solo, esa
       mejora se convertiría en 0,2 y el dato dejaría de ser el que se midió. */
    if (!def.texto && prim !== null && ult !== null) delta = Math.round((ult - prim) * 100) / 100;
    out.push({ def: def, vals: vals, delta: delta });
  });
  return out;
};

/* Para el detalle apartado por apartado: cada destreza con su valor en cada
   temporada. Solo devuelve las que se han puntuado alguna vez, porque una
   tabla con 22 filas vacías no la lee nadie. */
SF.evolucionSkills = function (p, filas) {
  var sp = SF.SPORTS[p.sport || 'baloncesto'];
  if (!sp || !sp.skills) return [];
  var conNotas = filas.filter(function (f) { return f.stats; });
  if (!conNotas.length) return [];
  var out = [];
  Object.keys(sp.skills).forEach(function (g) {
    var items = [];
    sp.skills[g].forEach(function (sk) {
      var vals = conNotas.map(function (f) { return +f.stats[sk] || null; });
      if (!vals.some(function (v) { return v; })) return;      // nunca evaluada
      var prim = null, ult = null;
      vals.forEach(function (v) { if (v) { if (prim === null) prim = v; ult = v; } });
      items.push({ skill: sk, vals: vals, delta: (prim !== null && ult !== null) ? ult - prim : null });
    });
    if (items.length) out.push({ grupo: g, items: items });
  });
  return out;
};

/* ===================== ENTREVISTAS =====================
   La etapa del pipeline es UN valor: dice por dónde va el jugador. Pero la
   realidad no cabe en un valor: alguien puede estar en "Oferta enviada", que
   le falten papeles Y tener entrevista el jueves, todo a la vez.

   Por eso las entrevistas son cosas con fecha propia, independientes de la
   etapa: se programan, avisan, y cuando pasan se guardan con lo que se habló.
   Un club que no recuerda qué se le dijo a una familia en marzo tiene un
   problema en junio. */
SF.INTERVIEW_TYPES = ['Con la familia', 'Con el jugador', 'Familia y jugador', 'Videollamada', 'Visita al club', 'Prueba deportiva'];

SF.interviews = function (p) { return (p && p.interviews) || []; };

/* La próxima que aún no se ha celebrado. */
SF.nextInterview = function (p) {
  var hoy = new Date().toISOString().slice(0, 10);
  return SF.interviews(p)
    .filter(function (e) { return !e.done && e.date; })
    .sort(function (a, b) { return a.date.localeCompare(b.date); })
    .filter(function (e) { return e.date >= hoy; })[0] || null;
};
/* Programada, con fecha ya pasada y sin cerrar: se quedó en el aire. */
SF.overdueInterview = function (p) {
  var hoy = new Date().toISOString().slice(0, 10);
  return SF.interviews(p).filter(function (e) { return !e.done && e.date && e.date < hoy; })
    .sort(function (a, b) { return b.date.localeCompare(a.date); })[0] || null;
};
SF.pastInterviews = function (p) {
  return SF.interviews(p).filter(function (e) { return e.done; })
    .sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
};

/* Lo que le falta a un jugador, independientemente de su etapa. Esto es lo
   que antes obligaba a elegir entre "Datos incompletos" y "Oferta enviada". */
SF.pendientesDe = function (p, opts) {
  var out = [];
  if (p.status === 'Datos incompletos') out.push({ k: 'datos', t: 'Faltan datos', c: 'warn' });
  var dp = (typeof SF.docsPend === 'function') ? SF.docsPend(p) : [];
  if (dp.length) out.push({ k: 'docs', t: dp.length + (dp.length === 1 ? ' documento' : ' documentos'), c: 'warn' });
  if (p.documents && p.documents.video_highlights === 'pendiente') out.push({ k: 'video', t: 'Sin vídeo', c: 'gray' });
  if ((opts || {}).finanzas && SF.finHas(p, 'vencido')) out.push({ k: 'pago', t: 'Pago vencido', c: 'danger' });
  return out;
};

/* Estado de habilitación para la temporada en curso.
   Sin fila de esta temporada -> NO habilitado. La caducidad es automática. */
SF.staffStatus = function (s) {
  var c = s.clearance || {}, l = s.licence || {};
  var okClear = !!(c.cleared && c.season === SF.SEASON);
  var licNA = l.status === 'no_aplica' || !l.status;
  var okLic = licNA || (l.status === 'vigente' && l.season === SF.SEASON);
  if (!okClear) return { level: 'bad', label: 'Sin habilitar', why: 'Falta la comprobación de esta temporada' };
  if (!okLic) return { level: 'warn', label: 'Licencia caducada', why: 'La licencia federativa no es de ' + SF.SEASON };
  return { level: 'ok', label: 'Al día', why: '' };
};

/* ===================== TRAYECTORIA DEPORTIVA =====================
   Un jugador no "estuvo en un club entre 2021 y 2023": jugó tres temporadas,
   cada una en una categoría, y a veces recuerda en qué puesto quedaron.
   Por eso el club es la carpeta y las temporadas van dentro.

   Estructura: [{ club, seasons: [{ season, category, competition, finish }] }] */

/* Temporadas para elegir, de la actual hacia atrás. Un desplegable en vez de
   texto libre evita acabar con "21-22", "2021/2022" y "2021-22" mezclados,
   que es lo que hace imposible filtrar después. */
SF.seasonOptions = function (n) {
  var y = new Date().getFullYear() + 1, out = [];
  for (var i = 0; i < (n || 20); i++) {
    var a = y - i - 1;
    out.push(a + '/' + String(a + 1).slice(2));
  }
  return out;
};

SF.sportCategories = function (sport) {
  return (SF.SPORTS[sport || 'baloncesto'] || {}).categories || [];
};

/* Normaliza y migra. Lo de antes era { club, from, to }: NO inventamos las
   temporadas intermedias (sería meter datos que nadie ha dicho), se conserva
   tal cual se escribió y ya se detalla a mano si hace falta.
   También junta en una sola carpeta los clubes repetidos. */
SF.careerNorm = function (ch) {
  var out = [], idx = {};
  (ch || []).forEach(function (c) {
    var nombre = (c.club || '').trim();
    if (!nombre) return;
    var k = nombre.toLowerCase();
    if (!idx[k]) { idx[k] = { club: nombre, seasons: [] }; out.push(idx[k]); }
    if (c.seasons && c.seasons.length) {
      c.seasons.forEach(function (t) { idx[k].seasons.push(t); });
    } else if (c.from || c.to) {
      idx[k].seasons.push({
        season: (c.from || '') + (c.to ? '–' + c.to : ''),
        category: c.category || '', competition: c.competition || '', finish: c.finish || ''
      });
    }
  });
  out.forEach(function (c) {
    c.seasons.sort(function (a, b) { return (b.season || '').localeCompare(a.season || ''); });
  });
  out.sort(function (a, b) {
    return ((b.seasons[0] || {}).season || '').localeCompare((a.seasons[0] || {}).season || '');
  });
  return out;
};

/* Qué le falta a una persona del staff.
   Ojo con el certificado de delitos sexuales: la app NO lo guarda ni lo
   pide subido. Es un dato penal (RGPD art. 10). El club lo comprueba y
   anota únicamente que se ha comprobado, cuándo y quién. Por eso el
   recordatorio dice "preséntalo", nunca "súbelo". */
SF.staffPend = function (s) {
  var out = [], c = s.clearance || {}, l = s.licence || {}, lock = s.lock || {};

  if (!(c.cleared && c.season === SF.SEASON)) out.push({
    key: 'antecedentes', grave: true,
    label: 'Certificado de delitos de naturaleza sexual',
    nota: 'Obligatorio cada temporada para cualquier persona con contacto habitual con menores, también voluntarios (LOPIVI).',

  });

  var licAplica = l.status && l.status !== 'no_aplica';
  if (licAplica && !(l.status === 'vigente' && l.season === SF.SEASON)) out.push({
    key: 'licencia', grave: false,

    como: 'Añádela desde tu ficha, con la entidad, el año y el número de título.'

  return out;
};

   nada de lo que ya estaba cargado. */

  var legacy = { pasaporte: 'dni', expediente: 'expediente', seguro_medico: 'seguro_medico', video_highlights: 'video_highlights' };
  return Object.keys(legacy).map(function (old) {

    return { key: c.key, label: c.label, group: c.group, owner: c.owner, due: '',

             delivered: (st === 'validado' || st === 'recibido'), delivered_at: '' };
  });
};

};

/* Reconstruye el historial de cada jugador hacia atrás desde lo que es hoy.
   Un club no rellena cuatro temporadas de golpe, pero para una demostración
   necesitamos que existan; lo que no hacemos es inventarlas al azar: se
   aplica una curva de crecimiento y una progresión de notas coherentes con
   la edad, para que lo que se enseñe sea creíble. */
SF.buildSquad = function () {
  var TEMPS = ['2023/2024', '2024/2025', '2025/2026', '2026/2027'];
  var F_MED = ['2023-10-04', '2024-09-30', '2025-09-15', '2026-07-10'];
  var F_EVA = ['2024-05-20', '2025-05-15', '2026-06-10'];
  /* Fracción del crecimiento que aún le quedaba en cada temporada. Se estira
     al final: en cadete se crece menos que en infantil. */
  var CURVA = { 4: [1, 0.55, 0.22, 0], 3: [1, 0.5, 0], 2: [1, 0], 1: [0] };
  var PF = { by: 'Diego Sosa', role: 'Preparador Físico' };
  var ENT = { by: 'Carlos Gorosito', role: 'Entrenador' };

  function r1(x) { return Math.round(x * 10) / 10; }
  function r2(x) { return Math.round(x * 100) / 100; }

  return SF.SQUAD_ROWS.map(function (r, idx) {
    var n = r.anos, k0 = 4 - n, curva = CURVA[n];
    var num = idx + 8;

    /* --- Medidas, una por temporada suya --- */
    var med = [];
    for (var k = 0; k < n; k++) {
      var f = curva[k];                                   // 1 = lo más antiguo
      var alt = Math.round(r.alt - r.crec * f);
      var pes = Math.round(r.peso - (r.crec * 0.75) * f);
      med.push({
        by: PF.by, role: PF.role, date: F_MED[k0 + k], season: TEMPS[k0 + k],
        height_cm: alt, weight_kg: pes,
        wingspan_cm: Math.round(alt + (r.pos === 'Pívot' || r.pos === 'Ala-pívot' ? 6 : 3)),
        vertical_reach_stand: Math.round(alt * 1.29),
        vertical_reach_run: Math.round(alt * 1.29 + (r.cmj - 8 * f)),
        long_jump_stand_cm: Math.round(r.cmj * 5.1 - 26 * f),
        long_jump_run_cm: Math.round(r.cmj * 6.2 - 34 * f),
        torso_height_cm: Math.round(alt * 0.5),
        foot_length_cm: Math.round(alt / 6.4),
        hand_length_cm: Math.round(alt / 8.7),
        dominant_hand: r.zurdo ? 'Izquierda' : 'Derecha',
        uses_both_hands: f > 0.5 ? 'No' : 'Sí',
        cmj_cm: r1(r.cmj - 8 * f),
        jump_single_l_cm: r1(r.sl - 4 * f),
        jump_single_r_cm: r1(r.sr - 4 * f),
        dropjump_rsi: r2(r.rsi - 0.3 * f),
        sprint20_s: r2(r.sp + 0.26 * f),          // antes tardaba más
        cod_s: r2(r.cod + 0.4 * f),
        decel_s: r2(1.34 + 0.16 * f),
        nordic_n: Math.round(320 - 70 * f),
        ankle_rom_deg: Math.round(36 - 4 * f),
        measured_with: 'My Jump Lab'
      });
    }

    /* --- Evaluaciones: las tres de fin de temporada que le corresponden ---
       El que llega de fuera solo tiene la de la prueba de acceso. */
    var evs = [];
    function notasDe(resta, quitar) {
      var o = {}, keys = Object.keys(r.notas);
      keys.forEach(function (sk, i) {
        if (quitar && i >= keys.length - 3) return;       // apartados que aún no se evaluaban
        var v = Math.round(r.notas[sk] - resta);
        o[sk] = Math.max(1, Math.min(5, v));
      });
      return o;
    }
    if (n === 1) {
      evs.push({ by: ENT.by, role: ENT.role, date: '2026-06-25', season: '2026/2027', stats: notasDe(0) });
    } else {
      for (var e = 0; e < 3; e++) {
        if (e < k0) continue;                             // aún no estaba en el club
        evs.push({ by: ENT.by, role: ENT.role, date: F_EVA[e], season: TEMPS[e],
          stats: notasDe((2 - e) * 0.7, e === 0) });
      }
    }

    /* --- Papeles y dinero: cada estado enseña una pantalla distinta --- */
    var DOCS = {
      ok: { pasaporte: 'validado', expediente: 'validado', video_highlights: 'validado', seguro_medico: 'validado' },
      falta_seguro: { pasaporte: 'validado', expediente: 'validado', video_highlights: 'recibido', seguro_medico: 'pendiente' },
      falta_expediente: { pasaporte: 'validado', expediente: 'pendiente', video_highlights: 'validado', seguro_medico: 'validado' },
      falta_todo: { pasaporte: 'recibido', expediente: 'pendiente', video_highlights: 'pendiente', seguro_medico: 'pendiente' }
    };
    var cuota = r.pagos === 'beca' ? 48 : 95;
    var meses = ['Marzo', 'Abril', 'Mayo', 'Junio'];
    var pendDesde = { al_dia: 9, beca: 9, pendiente: 2, vencido: 1 }[r.pagos];
    var items = [{ id: r.id + '-ins', type: 'inscripcion', label: 'Inscripción', month: '', amount: 150,
      status: r.pagos === 'vencido' ? 'pendiente' : 'pagado', method: 'Recibo domiciliado' }];
    meses.forEach(function (m, mi) {
      items.push({ id: r.id + '-' + mi, type: 'cuota', label: 'Cuota ' + m, month: m, amount: cuota,
        status: mi >= pendDesde ? 'pendiente' : 'pagado' });
    });

    return P({
      id: r.id, scoutflow_id: 'SF-2026-' + String(num).padStart(4, '0'),
      first_name: r.nom, last_name: r.ape, full_name: r.nom + ' ' + r.ape,
      birth_date: r.d, birth_year: +r.d.slice(0, 4), gender: 'M',
      nationality: r.nac || ['España'], residence_country: 'España', city: 'Madrid',
      sport: 'baloncesto', primary_position: r.pos, secondary_position: r.pos2 || '',
      height_cm: r.alt, weight_kg: r.peso,
      wingspan_cm: med[n - 1].wingspan_cm, torso_height_cm: med[n - 1].torso_height_cm,
      foot_length_cm: med[n - 1].foot_length_cm, hand_length_cm: med[n - 1].hand_length_cm,
      vertical_reach_stand: med[n - 1].vertical_reach_stand, vertical_reach_run: med[n - 1].vertical_reach_run,
      long_jump_stand_cm: med[n - 1].long_jump_stand_cm, long_jump_run_cm: med[n - 1].long_jump_run_cm,
      cmj_cm: r.cmj, jump_single_l_cm: r.sl, jump_single_r_cm: r.sr, dropjump_rsi: r.rsi,
      sprint20_s: r.sp, cod_s: r.cod, decel_s: med[n - 1].decel_s,
      nordic_n: med[n - 1].nordic_n, ankle_rom_deg: med[n - 1].ankle_rom_deg,
      measured_with: 'My Jump Lab',
      dominant_hand: r.zurdo ? 'Izquierda' : 'Derecha', uses_both_hands: med[n - 1].uses_both_hands,
      dorsal: r.dor, team_id: 't1', status: 'Inscrito',
      club: 'CBJA Academy', league: 'Liga Cadete FBM', category: 'Cadete',
      start_age: n === 1 ? 11 : 12 - n,
      channel: n === 1 ? 'Scout' : 'Referencia',
      capture_date: n === 1 ? '2026-06-18' : '2023-05-20',
      responsible: 'Carlos Gorosito',
      career_history: (r.origen ? [r.origen] : []).concat([{
        club: 'CBJA Academy',
        seasons: TEMPS.slice(k0).map(function (t, i) {
          return { season: t, category: (+t.slice(0, 4) - (+r.d.slice(0, 4))) >= 15 ? 'Cadete' : 'Infantil',
            competition: 'Liga ' + ((+t.slice(0, 4) - (+r.d.slice(0, 4))) >= 15 ? 'Cadete' : 'Infantil') + ' FBM' };
        })
      }]),
      selections: { local: '', provincial: '', regional: r.seleccion || '', national: '' },
      school: r.cole, course: r.curso, gpa: r.gpa, english: 'Intermedio',
      dni: '99' + String(100000 + num * 137).slice(0, 6) + 'Z',
      address: 'Madrid', emergency_phone: '+34 600 ' + (700 + num) + ' ' + (100 + num),
      family_active: r.docs === 'ok',
      family: { contact: r.fam[0], relation: r.fam[1],
        phone: '+34 600 ' + (700 + num) + ' ' + (100 + num),
        email: r.nom.toLowerCase().replace(/[áéíóúñ]/g, '') + '.' + r.ape.toLowerCase().replace(/[áéíóúñ]/g, '') + '@example.com',
        father_height_cm: r.padre, mother_height_cm: r.madre },
      medical: { congenital: 'No', congenital_detail: '', surgeries: 'No', surgeries_detail: '',
        injuries: r.lesion ? 'Sí' : 'No', injuries_detail: r.lesion || '',

  function canLS() {
    try { var k = '__sf_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  }
  var LS = canLS();

  function read() {
    if (LS) {
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }
    return mem;
  }
  function write(db) {
    if (LS) localStorage.setItem(KEY, JSON.stringify(db));
    else mem = db;
  }

  function seed() {
    /* Número de ficha: correlativo, permanente y TONTO. No codifica equipo ni
       categoría a propósito: si lo hiciera, mentiría en cuanto el jugador
       cambiase de equipo. Sirve para buscar, para hablar por teléfono y como
       referencia de pago en la transferencia. */
    var seedPlayers = JSON.parse(JSON.stringify(SF.SEED_PLAYERS));
    seedPlayers.forEach(function (p, i) { if (p.ficha == null) p.ficha = i + 1; });
    return {
      academy: JSON.parse(JSON.stringify(SF.ACADEMY)),
      players: seedPlayers,
      teams: JSON.parse(JSON.stringify(SF.TEAMS || [])),
      expenses: JSON.parse(JSON.stringify(SF.EXPENSES || [])),
      staff: JSON.parse(JSON.stringify(SF.STAFF || [])),
      role: 'director',
      seq: (SF.SEED_PLAYERS ? SF.SEED_PLAYERS.length + 1 : 8), teamSeq: (SF.TEAMS ? SF.TEAMS.length + 1 : 1)
    };
  }

  function db() {
    var d = read();
    if (!d) { d = seed(); write(d); }
    if (!d.teams) { d.teams = JSON.parse(JSON.stringify(SF.TEAMS || [])); d.teamSeq = (SF.TEAMS ? SF.TEAMS.length + 1 : 1); write(d); }
    if (!d.expenses) { d.expenses = JSON.parse(JSON.stringify(SF.EXPENSES || [])); write(d); }
    if (!d.staff) { d.staff = JSON.parse(JSON.stringify(SF.STAFF || [])); write(d); }
    if (!d.academy.economy && SF.ACADEMY.economy) { d.academy.economy = JSON.parse(JSON.stringify(SF.ACADEMY.economy)); write(d); }
    /* Migración: asigna número de ficha a quien no lo tenga, sin borrar datos.
       Así no hay que subir la versión del almacén y nadie pierde su trabajo. */
    if (d.players && d.players.some(function (p) { return p.ficha == null; })) {
      var max = d.players.reduce(function (m, p) { return Math.max(m, p.ficha || 0); }, 0);
      d.players.forEach(function (p) { if (p.ficha == null) p.ficha = ++max; });
      write(d);
    }
    /* Migración de la escala de evaluación: de 0-5 a 0-10.
       Se multiplica por 2, que conserva exactamente la proporción (un 3 sobre 5
       es un 6 sobre 10) y no pierde ni inventa nada. Se hace una sola vez y
       queda marcado, para no volver a doblarlo en cada carga. */
    if (d.eval_scale !== 10) {
      (d.players || []).forEach(function (p) {
        function doblar(st) {
          if (!st) return;
          Object.keys(st).forEach(function (k) {
            var v = +st[k];
            if (v > 0 && v <= 5) st[k] = v * 2;
          });
        }
        doblar(p.stats);
        /* También las notas guardadas en el histórico: si no, una evaluación
           de hace tres años se leería en otra escala y parecería que el chaval
           ha mejorado el doble de lo que ha mejorado. */
        (p.eval_log || []).forEach(function (e) { doblar(e.stats); });
      });
      d.eval_scale = 10;
      write(d);
    }
    /* Migración del historial: hasta ahora una evaluación solo dejaba quién y
       cuándo, no las notas, así que cada nueva evaluación borraba la anterior.
       Aquí se hacen tres cosas, todas sin inventar nada:
         1. Se sella la temporada en medidas y evaluaciones que no la tengan.
         2. Las notas actuales se adjuntan a la ÚLTIMA evaluación, que es de
            quien son: así no se pierde la que hay hoy.
         3. Las anteriores quedan marcadas como "sin detalle". No se rellenan
            a ojo: es la ficha de un menor, y un dato inventado es peor que
            un hueco. */
    if (!d.eval_hist_v1) {
      (d.players || []).forEach(function (p) {
        (p.measure_log || []).forEach(function (m) {
          if (!m.season) m.season = SF.seasonOf(m.date);
        });
        var log = p.eval_log || [];
        log.forEach(function (e) { if (!e.season) e.season = SF.seasonOf(e.date); });
        if (log.length && p.stats && Object.keys(p.stats).length) {
          var ult = log[log.length - 1];
          if (!ult.stats) ult.stats = JSON.parse(JSON.stringify(p.stats));
        }
      });
      d.eval_hist_v1 = true;
      write(d);
    }
    /* Migración de avisos: los que ya existen no sabían a quién iban. Se les
       pone el criterio por defecto (a las familias) para que sigan siendo
       visibles donde lo eran, sin abrirlos de golpe a los jugadores. */
    if (!d.ann_aud_v1) {
      (d.announcements || []).forEach(function (a) {
        if (!a.audience) a.audience = 'familias';
        (a.targets || []).forEach(function (t) {
          if (t.to_family === undefined) t.to_family = true;
          if (t.to_player === undefined) t.to_player = false;
        });
      });
      d.ann_aud_v1 = true;
      write(d);
    }
    /* Los hilos nacieron con un solo destinatario. Ahora admiten varios, así
       que el que había se convierte en una lista de uno. */
    if (!d.conv_multi_v1) {
      (d.convs || []).forEach(function (c) {
        if (!c.to_staff_ids) c.to_staff_ids = c.to_staff ? [c.to_staff] : [];
      });
      d.conv_multi_v1 = true;
      write(d);
    }
    return d;
  }

  function save(d) { write(d); }

  function age(birth_date) {
    if (!birth_date) return null;
    var b = new Date(birth_date), n = new Date();
    var a = n.getFullYear() - b.getFullYear();
    var m = n.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
    return a;
  }

  return {
    persistent: LS,
    reset: function () { if (LS) localStorage.removeItem(KEY); mem = null; },
    age: age,

    academy: function () { return db().academy; },
    saveAcademy: function (patch) { var d = db(); Object.assign(d.academy, patch); save(d); },
    /* ---- VÍDEOS ---- */
    videoAdd: function (playerId, data) {
      var d = db(), u = (SF.USERS || {})[d.role] || d.role;
      var v = Object.assign({ id: 'v' + Date.now(), type: 'Highlights', title: '', url: '', date: '', notes: '',
        by: u, added_at: new Date().toISOString().slice(0, 10) }, data);
      d.players = d.players.map(function (p) {
        if (p.id !== playerId) return p;
        var np = Object.assign({}, p, { videos: (p.videos || []).concat([v]) });
        /* Si es de highlights, el documento pendiente de vídeo pasa a
           recibido solo: si no, Documentos seguiría pidiéndolo eternamente. */
        if (v.type === 'Highlights' && np.documents && np.documents.video_highlights === 'pendiente') {
          np.documents = Object.assign({}, np.documents, { video_highlights: 'recibido' });
        }
        return np;
      });
      save(d); return v;
    },
    videoRemove: function (playerId, id) {
      var d = db();
      d.players = d.players.map(function (p) {
        return p.id === playerId ? Object.assign({}, p, { videos: (p.videos || []).filter(function (v) { return v.id !== id; }) }) : p;
      });
      save(d);
    },

    /* ---- ENTREVISTAS ---- */
    interviewAdd: function (playerId, data) {
      var d = db(), u = (SF.USERS || {})[d.role] || d.role;
      var e = Object.assign({
        id: 'e' + Date.now(), date: '', time: '', type: '', place: '', with: u,
        notes: '', done: false, outcome: '', created_at: new Date().toISOString().slice(0, 10)
      }, data);
      d.players = d.players.map(function (p) {
        return p.id === playerId ? Object.assign({}, p, { interviews: (p.interviews || []).concat([e]) }) : p;
      });
      save(d); return e;
    },
    interviewUpdate: function (playerId, id, patch) {
      var d = db();
      d.players = d.players.map(function (p) {
        if (p.id !== playerId) return p;
        return Object.assign({}, p, {
          interviews: (p.interviews || []).map(function (e) { return e.id === id ? Object.assign({}, e, patch) : e; })
        });
      });
      save(d);
    },
    interviewRemove: function (playerId, id) {
      var d = db();
      d.players = d.players.map(function (p) {
        if (p.id !== playerId) return p;
        return Object.assign({}, p, { interviews: (p.interviews || []).filter(function (e) { return e.id !== id; }) });
      });
      save(d);
    },
    /* Todas las entrevistas del club que aún no se han celebrado, en orden.
       Sirve para la agenda de Inicio: lo que viene, no lo que pasó. */
    interviewsUpcoming: function () {
      var hoy = new Date().toISOString().slice(0, 10), out = [];
      db().players.forEach(function (p) {
        (p.interviews || []).forEach(function (e) {
          if (!e.done && e.date && e.date >= hoy) out.push({ p: p, e: e });
        });
      });
      return out.sort(function (a, b) { return a.e.date.localeCompare(b.e.date); });
    },

    saveEconomy: function (patch) { var d = db(); d.academy.economy = Object.assign({}, d.academy.economy || {}, patch); save(d); },

    /* ---- PRESUPUESTO, por temporada ----
       Se guarda por temporada para poder comparar con la anterior: la
       pregunta de la reunión de julio es "¿qué partidas se desviaron?". */
    budget: function (season) {
      var b = ((db().academy.budgets || {})[season || SF.SEASON]) || {};
      return { lines: b.lines || {}, prev_balance: b.prev_balance || 0, closed: !!b.closed };
    },
    budgetSetLine: function (season, key, patch) {
      var d = db(), s = season || SF.SEASON;
      d.academy.budgets = d.academy.budgets || {};
      var b = d.academy.budgets[s] = d.academy.budgets[s] || { lines: {}, prev_balance: 0 };
      b.lines[key] = Object.assign({}, b.lines[key] || {}, patch);
      save(d);
    },
    budgetSetMeta: function (season, patch) {
      var d = db(), s = season || SF.SEASON;
      d.academy.budgets = d.academy.budgets || {};
      d.academy.budgets[s] = Object.assign({ lines: {}, prev_balance: 0 }, d.academy.budgets[s] || {}, patch);
      save(d);
    },
    budgetSeasons: function () { return Object.keys(db().academy.budgets || {}); },

    expenses: function () { return (db().expenses || []).slice(); },
    expenseAdd: function (e) { var d = db(); if (!d.expenses) d.expenses = []; d.expenses.push(e); save(d); return e; },
    expenseUpdate: function (id, patch) { var d = db(); var x = (d.expenses || []).filter(function (e) { return e.id === id; })[0]; if (x) { Object.assign(x, patch); save(d); } return x; },
    expenseRemove: function (id) { var d = db(); d.expenses = (d.expenses || []).filter(function (e) { return e.id !== id; }); save(d); },

    role: function () { return db().role; },
    setRole: function (r) { var d = db(); d.role = r; save(d); },
    currentUser: function () {
      var r = db().role;
      return { role: r, label: (SF.ROLES[r] || {}).label || r, name: (SF.USERS || {})[r] || (SF.ROLES[r] || {}).label || r };
    },

    players: function () { return db().players.slice(); },
    get: function (id) { return db().players.filter(function (p) { return p.id === id; })[0] || null; },

    /* ---- STAFF ---- */
    staff: function () { return db().staff.slice(); },
    staffGet: function (id) { return db().staff.filter(function (s) { return s.id === id; })[0] || null; },
    /* Quién soy yo: en la demo, el primer staff con mi rol. En producción
       saldrá del usuario autenticado. */
    staffMe: function () {
      var r = db().role;
      return db().staff.filter(function (s) { return s.role === r; })[0] || null;
    },
    /* Toda modificación queda registrada: quién, cuándo y qué.
       Sin historial, una ficha bloqueada no acredita nada. */
    staffUpdate: function (id, patch, action) {
      var d = db();
      var who = (SF.USERS || {})[d.role] || d.role;
      var lab = (SF.ROLES[d.role] || {}).label || d.role;
      d.staff = d.staff.map(function (s) {
        if (s.id !== id) return s;
        var next = Object.assign({}, s, patch);
        next.history = (s.history || []).concat([{
          at: new Date().toISOString(), by: who, role: lab,
          action: action || 'Modificación de la ficha'
        }]);
        return next;
      });
      save(d);
      return d.staff.filter(function (s) { return s.id === id; })[0];
    },
    /* Asignar / quitar una ficha de staff a un equipo. Lo hace dirección. */
    staffAssign: function (id, teamId, on) {
      var d = db();
      d.staff = d.staff.map(function (s) {
        if (s.id !== id) return s;
        var t = (s.team_ids || []).slice(), i = t.indexOf(teamId);
        if (on && i < 0) t.push(teamId);
        if (!on && i >= 0) t.splice(i, 1);
        return Object.assign({}, s, { team_ids: t });
      });
      save(d);
    },
    staffOfTeam: function (teamId) {
      return db().staff.filter(function (s) { return (s.team_ids || []).indexOf(teamId) >= 0; });
    },

    create: function (obj) {
      var d = db();
      var n = d.seq++;
      obj.id = 'p' + n;
      obj.scoutflow_id = 'SF-2026-' + String(n).padStart(4, '0');
      // Número de ficha correlativo: el siguiente libre, nunca se reutiliza.
      obj.ficha = d.players.reduce(function (m, x) { return Math.max(m, x.ficha || 0); }, 0) + 1;
      if (!obj.full_name) obj.full_name = ((obj.first_name || '') + ' ' + (obj.last_name || '')).trim();
      if (obj.birth_date && !obj.birth_year) obj.birth_year = new Date(obj.birth_date).getFullYear();
      obj.created_at = new Date().toISOString();
      d.players.unshift(obj);
      save(d);
      return obj;
    },
    update: function (id, patch) {
      var d = db();
      var p = d.players.filter(function (x) { return x.id === id; })[0];
      if (!p) return null;
      Object.assign(p, patch);
      if (patch.first_name || patch.last_name)
        p.full_name = ((p.first_name || '') + ' ' + (p.last_name || '')).trim();
      if (patch.birth_date) p.birth_year = new Date(patch.birth_date).getFullYear();
      save(d);
      return p;
    },
    remove: function (id) {
      var d = db();
      d.players = d.players.filter(function (x) { return x.id !== id; });
      save(d);
    },

    /* ── Equipos ── */
    teams: function () { return db().teams.slice(); },
    teamGet: function (id) { return db().teams.filter(function (t) { return t.id === id; })[0] || null; },
    teamCreate: function (obj) {
      var d = db(); var n = d.teamSeq++; obj.id = 't' + n;
      if (!obj.coaches) obj.coaches = []; if (!obj.wall) obj.wall = [];
      obj.created_at = new Date().toISOString();
      d.teams.push(obj); save(d); return obj;
    },
    teamUpdate: function (id, patch) {
      var d = db(); var t = d.teams.filter(function (x) { return x.id === id; })[0];
      if (!t) return null; Object.assign(t, patch); save(d); return t;
    },
    teamRemove: function (id) {
      var d = db();
      d.teams = d.teams.filter(function (x) { return x.id !== id; });
      d.players.forEach(function (p) { if (p.team_id === id) p.team_id = ''; });
      save(d);
    },
    teamPost: function (id, msg) {
      var d = db(); var t = d.teams.filter(function (x) { return x.id === id; })[0];
      if (!t) return null; if (!t.wall) t.wall = []; t.wall.push(msg); save(d); return t;
    },
    teamAddEvent: function (id, ev) {
      var d = db(); var t = d.teams.filter(function (x) { return x.id === id; })[0];
      if (!t) return null; if (!t.events) t.events = []; t.events.push(ev); save(d); return t;
    },
    teamRemoveEvent: function (id, evId) {
      var d = db(); var t = d.teams.filter(function (x) { return x.id === id; })[0];
      if (!t) return null; t.events = (t.events || []).filter(function (e) { return e.id !== evId; }); save(d); return t;
    },
    teamSetAttendance: function (teamId, evId, marks, by) {
      var d = db(); var t = d.teams.filter(function (x) { return x.id === teamId; })[0];
      if (!t) return null;
      var ev = (t.events || []).filter(function (e) { return e.id === evId; })[0];
      if (!ev) return null;
      ev.attendance = marks; ev.attendance_by = by; ev.attendance_at = new Date().toISOString().slice(0, 10);
      save(d); return ev;
    },
    attendanceStats: function (playerId) {
      var teams = db().teams || [], tot = 0, pres = 0;
      teams.forEach(function (t) {
        (t.events || []).forEach(function (e) {
          if (!e.attendance || !e.attendance[playerId]) return;
          tot++; if (e.attendance[playerId] === 'presente') pres++;
        });
      });
      return { total: tot, present: pres, pct: tot ? Math.round(pres / tot * 100) : null };
    },

    /* ---- AVISOS ----
       NO es un chat: va en un solo sentido. Un aviso se escribe una vez y se
       generan destinos independientes, uno por jugador. Nadie ve a los demás
       destinatarios. El "visto" se guarda separado (jugador / tutores) porque
       que lo abra la madre no significa que se haya enterado el chaval. */
    announcements: function (teamId) {
      var d = db();
      return (d.announcements || []).filter(function (a) { return !teamId || a.team_id === teamId; })
        .sort(function (x, y) { return (y.created_at || '').localeCompare(x.created_at || ''); });
    },
    annGet: function (id) { return (db().announcements || []).filter(function (a) { return a.id === id; })[0] || null; },
    /* Avisos de UN jugador, tenga equipo o no. Un jugador en seguimiento
       todavía no pertenece a ningún equipo y también hay que poder avisarle. */
    /* 'quien' filtra por a quién iba dirigido: el portal de la familia no
       debe enseñar lo que era solo para el vestuario, ni al revés. Sin
       parámetro devuelve todo, que es lo que necesita el staff. */
    annForPlayer: function (pid, quien) {
      return (db().announcements || [])
        .filter(function (a) {
          if (a.retracted_at) return false;
          var t = (a.targets || []).filter(function (x) { return x.player_id === pid; })[0];
          if (!t) return false;
          if (quien === 'family') return t.to_family !== false;
          if (quien === 'player') return t.to_player === true;
          return true;
        })
        .sort(function (x, y) { return (y.created_at || '').localeCompare(x.created_at || ''); });
    },
    annCreate: function (teamId, data, playerIds) {
      var d = db(); d.announcements = d.announcements || [];
      var u = (SF.USERS || {})[d.role] || d.role;
      /* 'audience' dice a quién va: 'familias', 'jugadores' o 'ambos'.
         Sin esto no se puede prometer a un club a quién llega un mensaje, que
         es justo lo que un presidente pregunta. Y por cada jugador se guarda
         si le tocaba a él, a su familia o a los dos, porque en un mismo aviso
         al equipo puede no ser igual para todos: a los menores de 14 se
         escribe a la familia, no al niño. */
      var aud = data.audience || 'familias';
      var a = {
        id: 'a' + Date.now(), team_id: teamId, author: u,
        author_role: (SF.ROLES[d.role] || {}).label || d.role,
        kind: data.kind || 'aviso', title: data.title, body: data.body,
        audience: aud,
        needs_rsvp: !!data.needs_rsvp, created_at: new Date().toISOString(),
        targets: (playerIds || []).map(function (pid) {
          var p = (d.players || []).filter(function (x) { return x.id === pid; })[0];
          var real = SF.audienciaReal(aud, p);
          return { player_id: pid, to_player: real.jugador, to_family: real.familia,
            read_player: null, read_family: null, rsvp: null, rsvp_by: null };
        })
      };
      d.announcements.push(a); save(d); return a;
    },
    /* ---- CONVERSACIONES ----
       Un hilo: asunto, quién lo abre, a quién va, y mensajes debajo. Los
       supervisores se guardan al crearlo: si mañana cambia el director, la
       conversación no cambia de dueños retroactivamente. */
    /* to_staff admite uno o varios. Un mensaje a cinco entrenadores es UN
       hilo con cinco destinatarios: si fueran cinco hilos, nadie vería la
       respuesta del otro y la coordinación se pierde, que es justo para lo
       que sirve. Cuando NO se quiere eso, quien escribe marca "que cada uno
       responda solo a mí" y entonces sí se crean hilos separados. */
    /* Cambiar la disponibilidad deja rastro: quién lo firmó y cuándo. Si un
       día hay que explicar por qué un chaval jugó lesionado, tiene que
       poder saberse quién dio el alta. */
    setDispo: function (playerId, datos, quien) {
      var d = db();
      (d.players || []).forEach(function (p) {
        if (p.id !== playerId) return;
        var a = Object.assign({}, datos, {
          by: quien.name, role: quien.label, at: new Date().toISOString()
        });
        p.availability = a;
        p.availability_log = (p.availability_log || []).concat([a]);
      });
      save(d);
    },

    convCreate: function (data) {
      var d = db(); d.convs = d.convs || [];
      var ids = data.to_staff_ids || (data.to_staff ? [data.to_staff] : []);
      var ahora = new Date().toISOString();
      var c = {
        id: 'c' + Date.now() + Math.floor(Math.random() * 1000),
        player_id: data.player_id || null,
        team_id: data.team_id || null,
        subject: data.subject,
        opened_by: data.from,                  // {kind, id, name, role}
        to_staff_ids: ids,
        to_staff: ids[0] || null,              // se conserva por compatibilidad
        supervisores: (SF.supervisoresDe(data.team_id) || []).map(function (s) { return s.id; }),
        created_at: ahora,
        closed_at: null,
        messages: [{
          at: ahora, by: data.from, text: data.text,
          read_by: [data.from.kind === 'staff' ? data.from.id : data.from.kind]
        }]
      };
      d.convs.push(c); save(d); return c;
    },
    convReply: function (convId, from, text) {
      var d = db();
      (d.convs || []).forEach(function (c) {
        if (c.id !== convId) return;
        c.messages.push({ at: new Date().toISOString(), by: from, text: text,
          read_by: [from.kind === 'staff' ? from.id : from.kind] });
      });
      save(d);
    },
    convMarkRead: function (convId, quien) {
      var d = db();
      (d.convs || []).forEach(function (c) {
        if (c.id !== convId) return;
        c.messages.forEach(function (m) {
          m.read_by = m.read_by || [];
          if (m.read_by.indexOf(quien) < 0) m.read_by.push(quien);
        });
      });
      save(d);
    },
    convClose: function (convId, by) {
      var d = db();
      (d.convs || []).forEach(function (c) {
        if (c.id === convId) { c.closed_at = new Date().toISOString(); c.closed_by = by; }
      });
      save(d);
    },
    /* Hilos de un jugador, para su portal y para su ficha. */
    convsForPlayer: function (pid, kind) {
      return (db().convs || [])
        .filter(function (c) {
          if (c.player_id !== pid) return false;
          /* El jugador solo ve los hilos que abrió él: los de sus padres con
             el club no son suyos. */
          if (kind === 'jugador') return c.opened_by && c.opened_by.kind === 'jugador';
          if (kind === 'familia') return c.opened_by && c.opened_by.kind === 'familia';
          return true;
        })
        .sort(function (a, b) { return (b.messages[b.messages.length - 1].at).localeCompare(a.messages[a.messages.length - 1].at); });
    },
    /* Hilos que le tocan a una persona del staff: los suyos, los que abrió y
       los que supervisa. */
    convsForStaff: function (staffId) {
      return (db().convs || [])
        .filter(function (c) {
          var dest = c.to_staff_ids || (c.to_staff ? [c.to_staff] : []);
          if (dest.indexOf(staffId) >= 0) return true;
          if (c.opened_by && c.opened_by.kind === 'staff' && c.opened_by.id === staffId) return true;
          return (c.supervisores || []).indexOf(staffId) >= 0;
        })
        .sort(function (a, b) { return (b.messages[b.messages.length - 1].at).localeCompare(a.messages[a.messages.length - 1].at); });
    },

          if (t.player_id !== playerId) return;
          t.rsvp = value; t.rsvp_by = by; t.rsvp_at = new Date().toISOString();
        });
      });
      save(d);
    },
    annMarkRead: function (annId, playerId, who) {
      var d = db();
      (d.announcements || []).forEach(function (a) {
        if (a.id !== annId) return;
        a.targets.forEach(function (t) {
          if (t.player_id !== playerId) return;
          if (who === 'player') t.read_player = t.read_player || new Date().toISOString();

        });
      });
      save(d);
    },

    /* ---- COMUNICADOS DEL CLUB ----
       Dirección / administración -> entrenadores (o directo a las familias).
       Dos modos:

                       quiera, añadiendo contexto. Dirección ve quién lo ha
                       reenviado: sin eso, una cascada se pierde en silencio.
         'directo'  -> va a las familias sin pasar por el entrenador.
       El alcance lo pone el rol: la DT de femenino solo ve equipos femeninos. */
    comms: function () {
      var d = db();
      return (d.comms || []).slice().sort(function (x, y) { return (y.created_at || '').localeCompare(x.created_at || ''); });
    },

    /* Buzón de una persona del staff: lo suyo y solo lo suyo. */
    commsForStaff: function (staffId) {
      return this.comms().filter(function (c) {
        return (c.staff_targets || []).some(function (t) { return t.staff_id === staffId; });
      }).map(function (c) {
        var t = (c.staff_targets || []).filter(function (t) { return t.staff_id === staffId; })[0] || {};
        return { c: c, leido: !!t.read_at, relayed: !!t.relayed_at, team_id: t.team_id || null };
      });
    },
    commUnread: function (staffId) {
      return this.commsForStaff(staffId).filter(function (x) { return !x.leido; }).length;
    },
    commCreate: function (data, staffTargets) {
      var d = db(); d.comms = d.comms || [];
      var u = (SF.USERS || {})[d.role] || d.role;
      var c = {
        id: 'c' + Date.now(), mode: data.mode || 'reenviar',
        author: u, author_role: (SF.ROLES[d.role] || {}).label || d.role,
        title: data.title, body: data.body, created_at: new Date().toISOString(),
        staff_targets: (staffTargets || []).map(function (s) {
          return { staff_id: s.staff_id, team_id: s.team_id, read_at: null, relayed_at: null };
        })
      };
      d.comms.push(c); save(d); return c;
    },
    commMarkRead: function (id, staffId) {
      var d = db();
      (d.comms || []).forEach(function (c) {
        if (c.id !== id) return;
        c.staff_targets.forEach(function (t) { if (t.staff_id === staffId && !t.read_at) t.read_at = new Date().toISOString(); });
      });
      save(d);
    },
    commMarkRelayed: function (id, staffId, teamId) {
      var d = db();
      (d.comms || []).forEach(function (c) {
        if (c.id !== id) return;

        });

    },

    /* Equivalencias aprendidas al importar: "RIOS, MARTIN" del acta de la
       federación -> nuestro jugador p2. Se asigna a mano una vez y ya entra
       solo el resto de la temporada. */
    importAliases: function () { return db().import_aliases || {}; },
    importAliasSet: function (key, playerId) {
      var d = db(); d.import_aliases = d.import_aliases || {};
      d.import_aliases[key] = playerId; save(d);
    },

    userPerms: function () { return (db().user_perms || []).slice(); },
    /* Solo los vigentes: los caducados dejan de aplicar solos, sin que
       nadie tenga que acordarse de quitarlos. */
    userPermsActive: function (staffId) {
      var hoy = new Date().toISOString().slice(0, 10);
      return (db().user_perms || []).filter(function (x) {
        return x.staff_id === staffId && !x.revoked_at && x.until >= hoy;
      });
    },
    userPermGrant: function (staffId, perm, reason, until) {
      if (SF.PERM_NUNCA.indexOf(perm) >= 0) return null;   // candado 4
      var d = db(); d.user_perms = d.user_perms || [];
      var x = {
        id: 'up' + Date.now(), staff_id: staffId, perm: perm,
        reason: reason, until: until,
        granted_by: (SF.USERS || {})[d.role] || d.role,
        granted_at: new Date().toISOString().slice(0, 10), revoked_at: null
      };
      d.user_perms.push(x); save(d); return x;
    },
    userPermRevoke: function (id) {
      var d = db();
      (d.user_perms || []).forEach(function (x) { if (x.id === id) x.revoked_at = new Date().toISOString().slice(0, 10); });
      save(d);
    },

    exportJSON: function () { return JSON.stringify(db(), null, 2); },
    importJSON: function (text) {
      var parsed = JSON.parse(text);
      if (!parsed.players) throw new Error('JSON sin "players"');
      save(parsed);
    },

    /* métricas para Inicio / Finanzas / etc. */
    metrics: function () {
      var ps = db().players;
      var incomplete = ps.filter(function (p) { return p.status === 'Datos incompletos'; });
      var noVideo = ps.filter(function (p) { return p.documents && p.documents.video_highlights === 'pendiente'; });
      var overdue = ps.filter(function (p) { return SF.finHas(p, 'vencido'); });
      var pending = ps.filter(function (p) { return SF.finHas(p, 'pendiente'); });
      var family = ps.filter(function (p) { return p.family_active; });
      var evaluating = ps.filter(function (p) { return p.status === 'En evaluación'; });
      var byStatus = {};
      SF.PIPELINE.forEach(function (s) { byStatus[s] = ps.filter(function (p) { return p.status === s; }).length; });
      return {
        total: ps.length, incomplete: incomplete, noVideo: noVideo, overdue: overdue,
        pending: pending, family: family, evaluating: evaluating, byStatus: byStatus
      };
    }
  };
})();

/* Páginas de la app. Cada función recibe (view, param) y pinta dentro de #view. */
window.SF = window.SF || {};
(function () {
  var U = SF.ui, el = U.el, esc = U.esc, ico = U.ico;
  var pages = {};
  var jugView = 'grid';      // estado vista Jugadores
  var jugQuery = '';         // búsqueda activa (desde buscador global)

  function head(title, subtitle, actionsHTML) {
    return '<div class="page-head"><div><h2>' + esc(title) + '</h2>' +
      (subtitle ? '<p class="sub">' + subtitle + '</p>' : '') + '</div>' +
      '<div class="head-actions">' + (actionsHTML || '') + '</div></div>';
  }
  /* Permisos efectivos = los del rol MÁS las excepciones vigentes.
     Se resuelve aquí, en el único sitio por el que pasa toda la app, así que
     la delegación funciona en todas las pantallas sin tocarlas una a una.
     Es un OR: nunca resta nada de lo que el rol ya da. */
  function role() {
    var base = SF.ROLES[SF.store.role()];
    var me = SF.store.staffMe();
    if (!me) return base;
    var extra = SF.store.userPermsActive(me.id);
    if (!extra.length) return base;
    var merged = Object.assign({}, base);
    merged.nav = (base.nav || []).slice();
    extra.forEach(function (x) {
      merged[x.perm] = true;
      var def = SF.PERM_KEYS.filter(function (k) { return k.key === x.perm; })[0];
      (def && def.nav || []).forEach(function (n) { if (merged.nav.indexOf(n) < 0) merged.nav.push(n); });
    });
    merged._extra = extra;
    return merged;
  }

  function scopedPlayers() {
