           Solo aparece si hay datos. Y siempre con la horquilla, porque una
           estimación sin margen se lee como una certeza. */
        var td = SF.tallaDiana(p), bq = SF.birthQuarter(p);
        if (td || (bq && bq.tardio)) {
          body.appendChild(el('<p class="sec-label">Crecimiento</p>'));
          if (td) {
            /* Tres casos, y el tercero pasa más de lo que parece: un chaval
               puede superar ya la estimación de sus padres. Decirle entonces
               que "le faltan -4 cm" sería absurdo. */
            var frase = !td.pct ? 'Falta su altura actual para saber cuánto le queda.'
              : td.pct >= 100 ? 'Ya <b>ha superado</b> la talla que cabría esperar por la de sus padres.'
              : td.pct >= 97 ? 'Está prácticamente en su talla de adulto: le quedarían unos <b>' + td.faltan + ' cm</b>.'
              : 'Le queda por crecer: va por el <b>' + td.pct + '%</b> de su talla estimada, unos <b>' + td.faltan + ' cm</b> más.';
            body.appendChild(el('<div class="foco"><div class="foco-ic">' + ico('chart') + '</div><div class="foco-body">' +
              '<p class="foco-t">Talla estimada de adulto: ' + (td.cm / 100).toFixed(2) + ' m</p>' +
              '<p class="foco-s">' + frase + ' Horquilla realista: entre <b>' + (td.min / 100).toFixed(2) + '</b> y <b>' + (td.max / 100).toFixed(2) + ' m</b>.</p>' +
              '</div></div>'));
            body.appendChild(el('<p class="hint">Calculado con la estatura de sus padres (talla diana familiar). Es una <b>estimación con margen amplio</b>, ' +
              'no una predicción: influyen la genética y la alimentación. <b>No se le enseña a la familia.</b></p>'));
          }
          if (bq && bq.tardio) {
            body.appendChild(el('<p class="hint">Nació en <b>' + bq.meses + '</b> (' + bq.label + '): es de los <b>más jóvenes de su año</b>. ' +
              'Compite contra chavales hasta once meses mayores, y eso pesa mucho a estas edades.</p>'));
          }
        }

        /* --- Scout Score: de dónde sale, a la vista ---
           Un número que nadie sabe cómo se calcula es un número que se
           discute. Aquí se ve la media de cada bloque y cuánto pesa. */
        if (sp && role().canSeeScore) {
          var ss = SF.scoutScore(p);
          body.appendChild(el('<p class="sec-label">Scout Score</p>'));
          if (!ss) {
            body.appendChild(el('<p class="hint">Sin evaluaciones todavía. El Score se calcula solo en cuanto se puntúe algo.</p>'));
          } else {
            var poco = ss.cobertura < 60;
            var cajaS = el('<div class="score-box' + (poco ? ' flojo' : '') + '">' +
              '<div class="score-n">' + ss.score + '<span>/100</span></div>' +
              '<div class="score-d"></div></div>');
            var det = cajaS.querySelector('.score-d');
            Object.keys(sp.skills).forEach(function (g) {
              var m = ss.porGrupo[g], w = SF.SCORE_WEIGHTS[g];
              det.appendChild(el('<div class="score-g"><span class="sg-n">' + esc(g) + ' <b>' + (w != null ? w + '%' : '') + '</b></span>' +
                '<span class="sg-b"><i style="width:' + (m ? Math.round(m * 10) : 0) + '%"></i></span>' +
                '<span class="sg-v">' + (m ? m.toFixed(1) : '—') + '</span></div>'));
            });
            body.appendChild(cajaS);
            body.appendChild(el('<p class="hint">Media ponderada de sus evaluaciones · <b>' + ss.puestos + ' de ' + ss.total + '</b> apartados evaluados' +
              (poco ? ' · <b class="c-warn">falta más de la mitad, tómalo con pinzas</b>' : '') +
              '. Lo calcula la app: no lo escribe nadie.</p>'));
          }
        }

        if (sp) Object.keys(sp.skills).forEach(function (group) {
          body.appendChild(el('<p class="sec-label">' + group + '</p>'));
          var rows = el('<div class="skills"></div>');
          sp.skills[group].forEach(function (sk) {
            var v = (p.stats && p.stats[sk]) || 0;
            var a = SF.evalAnchor(v);
            rows.appendChild(el('<div class="skill"><span>' + sk + '</span><div class="bar"><i style="width:' +
              (v ? Math.round(v / SF.EVAL_MAX * 100) : 4) + '%"></i></div><b title="' + (a ? esc(a.desc) : '') + '">' +
              (v ? v + (a ? ' · ' + a.label : '') : 'sin evaluar') + '</b></div>'));
          });
          body.appendChild(rows);
        });

        // Evaluación: registro y edición (permiso por rol)
        var log = p.eval_log || [];
        if (log.length) {
          var last = log[log.length - 1];
          body.appendChild(el('<p class="hint">Última evaluación: <b>' + esc(last.by) + '</b> · ' + esc(last.role) + ' · ' + esc(last.date) + '</p>'));
        } else {
          body.appendChild(el('<p class="hint">Sin evaluación registrada todavía.</p>'));
        }
        if (role().canEvaluate && sp) {
          var groups = role().evalGroups;
          var restricted = groups && groups !== 'all';
          var edEval = el('<button class="btn btn-primary btn-sm">' + ico('star') + (restricted ? 'Editar evaluación física' : 'Editar evaluación') + '</button>');
          edEval.onclick = function () {
            U.modal('Evaluación deportiva — ' + esc(p.full_name), evalForm(p, sp, function (ns) {
              var u = SF.store.currentUser();
              /* Se guarda la escala con la que se puntuó. Sin esto, si mañana
                 cambia la escala no hay forma de saber si un 5 era "la mitad"
                 o "el máximo": es justo lo que nos pasó al pasar de 5 a 10. */
              var hoy = new Date().toISOString().slice(0, 10);
              var temp = SF.seasonOf(hoy);
              /* Una entrada por temporada. Si ya hay evaluación de esta
                 temporada se corrige esa; si no, nace una nueva y la del año
                 pasado queda cerrada con sus notas intactas. Así el club puede
                 ver diez años después cómo ha cambiado el chaval. */
              var entry = {
                by: u.name, role: u.label, date: hoy, season: temp,
                scale: SF.EVAL_MAX,
                stats: JSON.parse(JSON.stringify(ns))
              };
              var newLog = (p.eval_log || []).slice();
              var i = -1;
              newLog.forEach(function (e, k) { if ((e.season || SF.seasonOf(e.date)) === temp) i = k; });
              var corregida = i >= 0;
              if (corregida) { entry.creada = newLog[i].creada || newLog[i].date; newLog[i] = entry; }
              else newLog.push(entry);
              SF.store.update(p.id, { stats: ns, eval_log: newLog });
              p = SF.store.get(p.id);
              U.toast(corregida ? 'Evaluación de ' + temp + ' corregida por ' + u.name
                                : 'Evaluación de ' + temp + ' guardada por ' + u.name);
              paint();
            }, groups));
          };
          body.appendChild(edEval);
        }
        if (log.length) {
          body.appendChild(el('<p class="sec-label">Historial de evaluaciones</p>'));
          var hl = el('<div class="mini-list"></div>');
          log.slice().reverse().slice(0, 6).forEach(function (e) {
            var temp = e.season || SF.seasonOf(e.date);
            var ssH = e.stats ? SF.scoutScore(p, e.stats) : null;
            hl.appendChild(el('<div class="mini-row"><span><b>' + esc(temp) + '</b> · ' + esc(e.by) + ' · ' + esc(e.role) +
              (ssH ? ' · Score ' + ssH.score : '<span class="hint"> · sin detalle guardado</span>') +
              '</span><span class="hint">' + esc(e.date) + '</span></div>'));
          });
          body.appendChild(hl);
          /* El botón vive en Trayectoria, pero el entrenador y el preparador
             físico NO tienen esa pestaña, y son justo los dos que evalúan y
             miden. Sin esto, quien crea el historial no puede verlo. */
          var bEvo2 = el('<button class="btn btn-light btn-sm">' + ico('chart') + 'Ver evolución por temporadas</button>');
          bEvo2.onclick = function () { U.modal('Evolución — ' + esc(p.full_name), evolucionBody(p)); };
          body.appendChild(bEvo2);
        }


      } else if (cur === 'trayectoria') {
        /* Pestaña propia: por dónde ha pasado. Estaba al final de
           Deportivo, debajo de las evaluaciones, y no se veía. */
        /* Antes de por dónde ha pasado: cómo ha cambiado. Un chaval que lleva
           ocho temporadas en el club es la información más valiosa que tiene
           una cantera, y hasta ahora no se veía en ningún sitio. */
        (function () {
          var fl = SF.evolucion(p);
          var banda = el('<div class="evo-band"></div>');
          var conAlt = fl.filter(function (f) { return f.altura != null; });
          var linea = !fl.length
            ? 'Sin temporadas registradas todavía.'
            : fl.length + (fl.length === 1 ? ' temporada registrada' : ' temporadas registradas') +
              ' · de ' + esc(fl[0].season) + ' a ' + esc(fl[fl.length - 1].season) +
              (conAlt.length > 1 && conAlt[conAlt.length - 1].altura > conAlt[0].altura
                ? ' · ha crecido ' + (conAlt[conAlt.length - 1].altura - conAlt[0].altura) + ' cm' : '');
          banda.appendChild(el('<div class="evo-band-txt"><b>Evolución del jugador</b><span>' + linea + '</span></div>'));
          var bEvo = el('<button class="btn btn-primary btn-sm">' + ico('chart') + 'Ver evolución</button>');
          bEvo.onclick = function () { U.modal('Evolución — ' + esc(p.full_name), evolucionBody(p)); };
          banda.appendChild(bEvo);
          body.appendChild(banda);
        })();

        // Trayectoria de clubes: cada club es una carpeta con sus temporadas
        body.appendChild(el('<p class="sec-label">Trayectoria deportiva</p>'));
        var ch = SF.careerNorm(p.career_history);
        var cats = SF.sportCategories(p.sport || SF.store.academy().primary_sport);

        function guardaCarrera(arr) {
          SF.store.update(p.id, { career_history: arr });
          p = SF.store.get(p.id); paint();
        }
        function campos(actual) {
          return [
            { name: 'season', label: 'Temporada', type: 'select', options: SF.seasonOptions() },
            { name: 'category', label: 'Categoría', type: 'select', options: cats },
            { name: 'competition', label: 'Competición o liga (opcional)' },
            { name: 'finish', label: 'Puesto final (opcional)' }
          ];
        }

        var chWrap = el('<div></div>');
        if (!ch.length) chWrap.appendChild(el('<p class="hint">Sin trayectoria registrada.</p>'));

        ch.forEach(function (c, ci) {
          var n = c.seasons.length;
          var card = el('<div class="car-club"><div class="car-head">' +
            '<span class="car-name">' + esc(c.club) + ' <span class="car-n">· ' + n +
            (n === 1 ? ' temporada' : ' temporadas') + '</span></span>' +
            '<button class="lnk-del" title="Quitar el club y sus temporadas">' + ico('trash') + '</button></div></div>');

          card.querySelector('.lnk-del').onclick = function () {
            if (!confirm('¿Quitar ' + c.club + ' y sus ' + n + (n === 1 ? ' temporada?' : ' temporadas?'))) return;
            var arr = ch.slice(); arr.splice(ci, 1); guardaCarrera(arr);
          };

          if (!n) card.appendChild(el('<p class="car-vacio">Sin temporadas todavía.</p>'));
          c.seasons.forEach(function (t, ti) {
            var det = [t.category, t.competition].filter(Boolean).join(' · ');
            var row = el('<div class="car-season">' +
              '<span class="car-y">' + esc(t.season || '—') + '</span>' +
              '<span class="car-d">' + (det ? esc(det) : '<span class="hint">sin categoría</span>') + '</span>' +
              (t.finish ? '<span class="car-fin">' + esc(t.finish) + '</span>' : '') +
              '<button class="lnk" data-e>editar</button><button class="lnk-del">' + ico('trash') + '</button></div>');
            row.querySelector('[data-e]').onclick = function () {
              U.modal('Temporada en ' + c.club, smallForm(campos(), t, function (d) {
                var arr = ch.slice(); arr[ci].seasons[ti] = d; guardaCarrera(arr);
              }));
            };
            row.querySelector('.lnk-del').onclick = function () {
              var arr = ch.slice(); arr[ci].seasons.splice(ti, 1); guardaCarrera(arr);
            };
            card.appendChild(row);
          });

          /* Añadir temporada DENTRO del club: es el caso normal, tres años
             en el mismo sitio subiendo de categoría. */
          var pie = el('<div class="car-add"></div>');
          var bt = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir temporada en ' + esc(c.club) + '</button>');
          bt.onclick = function () {
            U.modal('Nueva temporada en ' + c.club, smallForm(campos(), {}, function (d) {
              if (!d.season) { U.toast('Elige la temporada'); return false; }
              var arr = ch.slice(); arr[ci].seasons.push(d); guardaCarrera(arr);
            }));
          };
          pie.appendChild(bt); card.appendChild(pie);
          chWrap.appendChild(card);
        });
        body.appendChild(chWrap);

        var addClub = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir club</button>');
        addClub.onclick = function () {
          U.modal('Añadir club a la trayectoria', smallForm(
            [{ name: 'club', label: 'Club' }].concat(campos()), {},
            function (d) {
              if (!d.club) { U.toast('Falta el nombre del club'); return false; }
              var arr = ch.slice();
              arr.push({ club: d.club, seasons: d.season ? [{ season: d.season, category: d.category, competition: d.competition, finish: d.finish }] : [] });
              guardaCarrera(arr);
            }));
        };
        body.appendChild(addClub);

        // Selecciones
        var sel = p.selections || {};
        body.appendChild(el('<p class="sec-label">Selecciones</p>'));
        body.appendChild(el('<div class="field-grid">' + fld('Local / colegio', sel.local) + fld('Provincial', sel.provincial) + fld('Regional', sel.regional) + fld('Nacional', sel.national) + '</div>'));
        var edSel = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Editar selecciones</button>');
        edSel.onclick = function () {
          U.modal('Selecciones', smallForm(
            [{ name: 'local', label: 'Local / colegio' }, { name: 'provincial', label: 'Provincial' }, { name: 'regional', label: 'Regional' }, { name: 'national', label: 'Nacional' }],
            sel, function (d) { SF.store.update(p.id, { selections: d }); p = SF.store.get(p.id); paint(); }));
        };
        body.appendChild(edSel);

        // Competencias
        body.appendChild(el('<p class="sec-label">Competencias</p>'));
        var comps = p.competitions || [];
        var cWrap = el('<div class="mini-list"></div>');
        if (!comps.length) cWrap.appendChild(el('<p class="hint">Sin competencias registradas.</p>'));
        comps.forEach(function (c, i) {
          var meta = [c.place, c.ranking, c.result].filter(Boolean).join(' · ');
          var row = el('<div class="mini-row"><div><b>' + esc(c.name || '—') + '</b> <span class="hint">' + esc(c.date || '') + '</span>' + (meta ? '<br><span class="hint">' + esc(meta) + '</span>' : '') + '</div><button class="lnk-del">' + ico('trash') + '</button></div>');
          row.querySelector('.lnk-del').onclick = function () { var arr = comps.slice(); arr.splice(i, 1); SF.store.update(p.id, { competitions: arr }); p = SF.store.get(p.id); paint(); };
          cWrap.appendChild(row);
        });
        body.appendChild(cWrap);
        var addComp = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir competencia</button>');
        addComp.onclick = function () {
          U.modal('Añadir competencia', smallForm(
            [{ name: 'name', label: 'Nombre' }, { name: 'date', label: 'Fecha' }, { name: 'place', label: 'Lugar' }, { name: 'ranking', label: 'Ranking / puesto' }, { name: 'result', label: 'Marcas / resultado' }], {},
            function (d) { if (!d.name) return; var arr = (p.competitions || []).slice(); arr.push(d); SF.store.update(p.id, { competitions: arr }); p = SF.store.get(p.id); paint(); }));
        };
        body.appendChild(addComp);
      } else if (cur === 'academico') {
        body.appendChild(el('<div class="field-grid">' + fld('Centro', p.school) + fld('Curso', p.course) +
          fld('Promedio de notas', p.gpa) + fld('Nivel de inglés', p.english) + fld('Otros idiomas', p.other_languages) +
          fld('Fecha de graduación', p.graduation_date) + fld('Intereses', p.objective) + '</div>'));
      } else if (cur === 'familia') {
        var fam = p.family || {};
        body.appendChild(el('<div class="field-grid">' + fld('Contacto', fam.contact) + fld('Relación', fam.relation) + fld('Teléfono', fam.phone) + fld('Email', fam.email) + fld('Family activo', p.family_active ? 'Sí' : 'No') + '</div>'));

        /* Estatura de los padres. Dos campos que parecen una curiosidad y son
           lo que permite estimar hasta dónde va a crecer: en baloncesto eso
           cambia por completo la lectura de un jugador. */
        body.appendChild(el('<p class="sec-label">Estatura de los padres</p>'));
        body.appendChild(el('<div class="field-grid">' +
          fld('Padre', fam.father_height_cm ? fam.father_height_cm + ' cm' : '') +
          fld('Madre', fam.mother_height_cm ? fam.mother_height_cm + ' cm' : '') + '</div>'));
        if (SF.store.role() !== 'padre' && SF.store.role() !== 'jugador') {
          var bAlt = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Anotar estatura de los padres</button>');
          bAlt.onclick = function () {
            U.modal('Estatura de los padres', smallForm([
              { name: 'father_height_cm', label: 'Estatura del padre (cm)', type: 'number' },
              { name: 'mother_height_cm', label: 'Estatura de la madre (cm)', type: 'number' }
            ], fam, function (d) {
              SF.store.update(p.id, { family: Object.assign({}, fam, { father_height_cm: +d.father_height_cm || null, mother_height_cm: +d.mother_height_cm || null }) });
              U.toast('Guardado'); p = SF.store.get(p.id); paint();
            }));
          };
          body.appendChild(bAlt);
          body.appendChild(el('<p class="hint">Con esto y su talla actual, la app estima <b>hasta dónde va a crecer</b>. ' +
            'Se pregunta a la familia sin más misterio: es un dato de salud habitual en cualquier reconocimiento.</p>'));
        }
      } else if (cur === 'documentos') {
        /* Expediente de documentación, compuesto por jugador.
           Cada línea lleva quién la aporta y para cuándo: un visado sin fecha
           no es un pendiente, es un problema que se descubre tarde. */
        var docs = SF.docsOf(p).slice();
        var puedeGestionar = ['director', 'administrativo'].indexOf(SF.store.role()) >= 0;

        function guardar(lista, accion) {
          SF.store.update(p.id, { docs_req: lista });
          p = SF.store.get(p.id); paint();
          if (accion) U.toast(accion);
        }

        var grupos = {};
        docs.forEach(function (d) { (grupos[d.group || 'Otros'] = grupos[d.group || 'Otros'] || []).push(d); });

        var pend = docs.filter(function (d) { return !d.delivered; });
        var venc = docs.filter(SF.docVencido);
        var resumen = el('<div class="empty-panel" style="text-align:left"></div>');
        resumen.appendChild(el('<p><b>' + (docs.length - pend.length) + ' de ' + docs.length + '</b> entregados' +
          (venc.length ? ' · <span class="tag tag-danger">' + venc.length + ' fuera de plazo</span>' : '') + '</p>'));
        body.appendChild(resumen);

        Object.keys(grupos).forEach(function (g) {
          body.appendChild(el('<p class="sec-label">' + esc(g) + '</p>'));
          var dl = el('<div class="mini-list"></div>');
          grupos[g].forEach(function (d) {
            var i = docs.indexOf(d);
            var estado = d.delivered
              ? '<span class="tag tag-green">entregado' + (d.delivered_at ? ' ' + fmtDate(d.delivered_at) : '') + '</span>'
              : (SF.docVencido(d) ? '<span class="tag tag-danger">fuera de plazo</span>' : '<span class="tag tag-warn">pendiente</span>');
            /* La apostilla se controla aparte: un documento puede estar
               entregado y aun así no valer porque le falta el sello. */
            var apo = d.apostilla
              ? (d.apostillado ? ' <span class="tag tag-green">apostillado</span>'
                               : ' <span class="tag tag-danger">falta apostilla</span>')
              : '';
            var plazo = d.due ? '<span class="hint">límite ' + fmtDate(d.due) + '</span>' : '';
            var row = el('<div class="mini-row"><span><b>' + esc(d.label) + '</b> <span class="hint">· lo aporta ' + esc(d.owner || 'Familia') + '</span><br>' +
              estado + apo + ' ' + plazo +
              (d.requisito ? '<br><span class="hint">' + esc(d.requisito) + '</span>' : '') +
              (d.note ? ' <span class="hint">' + esc(d.note) + '</span>' : '') + '</span><span class="row-actions"></span></div>');
            var acts = row.querySelector('.row-actions');
            if (puedeGestionar) {
              var bt = el('<button class="lnk">' + (d.delivered ? 'Marcar pendiente' : 'Marcar entregado') + '</button>');
              bt.onclick = function () {
                var l = docs.slice();
                l[i] = Object.assign({}, d, { delivered: !d.delivered, delivered_at: d.delivered ? '' : new Date().toISOString().slice(0, 10) });
                guardar(l, 'Actualizado');
              };
              if (d.apostilla) {
                var bap = el('<button class="lnk">' + (d.apostillado ? 'Quitar apostilla' : 'Apostillado') + '</button>');
                bap.onclick = function () { var l = docs.slice(); l[i] = Object.assign({}, d, { apostillado: !d.apostillado }); guardar(l, 'Actualizado'); };
                acts.appendChild(bap);
              }
              var be2 = el('<button class="lnk">Plazo</button>');
              be2.onclick = function () {
                U.modal('Plazo y responsable — ' + d.label, smallForm([
                  { name: 'due', label: 'Fecha límite', type: 'date' },
                  { name: 'owner', label: 'Quién lo aporta', type: 'select', options: ['Familia', 'Club', 'Jugador'] },
                  { name: 'note', label: 'Nota', }
                ], d, function (v) {
                  var l = docs.slice(); l[i] = Object.assign({}, d, v); guardar(l, 'Guardado');
                }));
              };
              var bx = el('<button class="lnk-del">' + ico('x') + '</button>');
              bx.onclick = function () { var l = docs.slice(); l.splice(i, 1); guardar(l, 'Quitado del expediente'); };
              acts.appendChild(bt); acts.appendChild(be2); acts.appendChild(bx);
            }
            dl.appendChild(row);
          });
          body.appendChild(dl);
        });

        if (puedeGestionar) {
          var bAdd = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir documento</button>');
          bAdd.onclick = function () {
            var yaKeys = docs.map(function (d) { return d.key; });
            var libres = SF.DOC_CATALOG.filter(function (c) { return yaKeys.indexOf(c.key) < 0; });
            var box = el('<div class="mini-list"></div>');
            if (!libres.length) box.appendChild(el('<p class="hint">Ya están todos los del catálogo.</p>'));
            var porGrupo = {};
            libres.forEach(function (c) { (porGrupo[c.group] = porGrupo[c.group] || []).push(c); });
            Object.keys(porGrupo).forEach(function (g) {
              box.appendChild(el('<p class="sec-label">' + esc(g) + '</p>'));
              porGrupo[g].forEach(function (c) {
                var r = el('<button class="mini-row" style="width:100%;text-align:left;cursor:pointer"><span>' + esc(c.label) + ' <span class="hint">· ' + esc(c.owner) + '</span></span></button>');
                r.onclick = function () {
                  guardar(docs.concat([{ key: c.key, label: c.label, group: c.group, owner: c.owner, due: '', delivered: false }]), c.label + ' añadido');
                  U.closeModal();
                };
                box.appendChild(r);
              });
            });
            U.modal('Añadir al expediente de ' + p.full_name, box);
          };
          body.appendChild(bAdd);

          /* Plantillas: cargar el expediente entero de golpe. Componerlo a
             mano documento a documento es lento y se olvida alguno. */
          var bPre = el('<button class="btn btn-light btn-sm">' + ico('file') + 'Cargar plantilla</button>');
          bPre.onclick = function () {
            var box = el('<div class="mini-list"></div>');
            Object.keys(SF.DOC_PRESETS).forEach(function (nombre) {
              var keys = SF.DOC_PRESETS[nombre];
              var r = el('<button class="mini-row" style="width:100%;text-align:left;cursor:pointer"><span><b>' + esc(nombre) + '</b><br><span class="hint">' + keys.length + ' documentos</span></span></button>');
              r.onclick = function () {
                var ya = docs.map(function (d) { return d.key; });
                var nuevos = keys.filter(function (k) { return ya.indexOf(k) < 0; }).map(function (k) {
                  var c = SF.docCat(k);
                  return { key: c.key, label: c.label, group: c.group, owner: c.owner, due: '',
                           apostilla: !!c.apostilla, apostillado: false, requisito: c.requisito || '', delivered: false };
                });
                U.closeModal();
                guardar(docs.concat(nuevos), nuevos.length + ' documentos añadidos');
              };
              box.appendChild(r);
            });
            U.modal('Plantillas de expediente', box);
          };
          body.appendChild(bPre);

          body.appendChild(el('<p class="hint">El expediente se compone por jugador: un jugador internacional en seguimiento necesita papeles que un jugador local no. <b>' + SF.DOC_FORMATO + '</b></p>'));
        }

        /* Los antecedentes médicos son dato de salud del artículo 9 del RGPD:
           enfermedad congénita, cardiopatías, operaciones. Antes los veía
           cualquiera con esta pestaña — es decir, administración — y NO los
           veía el fisioterapeuta, que es el único sanitario del club. Estaba
           exactamente del revés. Ahora solo los ven quien tiene canSeeMedical
           (fisio y dirección) y la propia familia, que son sus datos.
           Lo que administración y el entrenador necesitan para una urgencia
           —alergias, grupo sanguíneo, teléfono— está en Perfil. */
        if (role().canSeeMedical) {
          body.appendChild(el('<p class="sec-label">Antecedentes médicos</p>'));
          var md = p.medical || {};
          var mg = el('<div class="field-grid">' +
            fld('Enfermedad congénita', (md.congenital || '') + (md.congenital_detail ? ' — ' + md.congenital_detail : '')) +
            fld('Enf. respiratorias / cardíacas', (md.cardio_resp || '') + (md.cardio_resp_detail ? ' — ' + md.cardio_resp_detail : '')) +
            fld('Intervenciones quirúrgicas', (md.surgeries || '') + (md.surgeries_detail ? ' — ' + md.surgeries_detail : '')) +
            fld('Lesiones músculo-esqueléticas', (md.injuries || '') + (md.injuries_detail ? ' — ' + md.injuries_detail : '')) +
            fld('Grupo sanguíneo', md.blood_type) +
            fld('Alergias', md.allergies) +
            fld('Correctores (lentes / plantillas)', md.correctors) +
            fld('Esquema de vacunación completo', md.vaccination) + '</div>');
          body.appendChild(mg);
          if (md.notes) body.appendChild(el('<p class="hint">' + esc(md.notes) + '</p>'));
          body.appendChild(el('<p class="hint">Datos de salud sensibles. No visibles en el Portal Family salvo lo que la familia rellene.</p>'));
          var edMed = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Editar antecedentes médicos</button>');
          edMed.onclick = function () {
            U.modal('Antecedentes médicos', smallForm([
              { name: 'congenital', label: 'Enfermedad congénita', type: 'select', options: ['Sí', 'No'] },
              { name: 'congenital_detail', label: '¿Cuál?' },
              { name: 'cardio_resp', label: 'Enf. respiratorias / cardíacas', type: 'select', options: ['Sí', 'No'] },
              { name: 'cardio_resp_detail', label: 'Detalle' },
              { name: 'surgeries', label: 'Intervenciones quirúrgicas', type: 'select', options: ['Sí', 'No'] },
              { name: 'surgeries_detail', label: 'Detalle' },
              { name: 'injuries', label: 'Lesiones músculo-esqueléticas', type: 'select', options: ['Sí', 'No'] },
              { name: 'injuries_detail', label: 'Detalle' },
              { name: 'blood_type', label: 'Grupo sanguíneo' },
              { name: 'allergies', label: 'Alergias (medic. / aliment.)' },
              { name: 'correctors', label: 'Correctores (lentes / plantillas)' },
              { name: 'vaccination', label: 'Vacunación completa', type: 'select', options: ['Sí', 'No'] },
              { name: 'notes', label: 'Observaciones', type: 'textarea' }
            ], md, function (d) { SF.store.update(p.id, { medical: d }); p = SF.store.get(p.id); U.toast('Antecedentes guardados'); paint(); }));
          };
          body.appendChild(edMed);
        }
      } else if (cur === 'videos') {
        var vids = (p.videos || []).slice().sort(function (a, b) { return (b.date || b.added_at || '').localeCompare(a.date || a.added_at || ''); });
        var puedeVid = SF.store.role() !== 'padre' && SF.store.role() !== 'jugador';

        if (!vids.length) {
          body.appendChild(el('<div class="empty-panel"><div class="em-ic">' + ico('camera') + '</div>' +
            '<h3>Sin vídeos todavía</h3><p>Pega el enlace de YouTube, Vimeo o Google Drive. No hace falta subir el archivo.</p></div>'));
        }

        var vw = el('<div class="vid-list"></div>');
        vids.forEach(function (v) {
          var inf = SF.videoInfo(v.url) || {};
          var card = el('<div class="vid">' +
            '<div class="vid-thumb">' + (inf.miniatura
              ? '<img src="' + esc(inf.miniatura) + '" alt="">'
              : '<span class="vid-src">' + esc(inf.fuente || 'Enlace') + '</span>') +
            (inf.embed ? '<span class="vid-play">▶</span>' : '') + '</div>' +
            '<div class="vid-b"><p class="vid-t">' + esc(v.title || v.type) + '</p>' +
            '<p class="vid-m"><span class="tag tag-purple">' + esc(v.type) + '</span> ' +
            (v.date ? fmtDate(v.date) + ' · ' : '') + esc(inf.fuente || '') +
            (v.by ? ' · ' + esc(v.by) : '') + '</p>' +
            (v.notes ? '<p class="vid-n">' + esc(v.notes) + '</p>' : '') + '</div>' +
            '<div class="vid-acc"></div></div>');

          var acc = card.querySelector('.vid-acc');
          /* Se reproduce dentro de la ficha: si hay que salir a otra pestaña
             para ver diez segundos de un tiro, no lo ve nadie. */
          if (inf.embed) {
            var bp = el('<button class="lnk">ver aquí</button>');
            bp.onclick = function () {
              U.modal(v.title || v.type, el('<div class="vid-frame"><iframe src="' + esc(inf.embed) +
                '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'));
            };
            card.querySelector('.vid-thumb').style.cursor = 'pointer';
            card.querySelector('.vid-thumb').onclick = bp.onclick;
            acc.appendChild(bp);
          }
          var ba = el('<a class="lnk" href="' + esc(v.url) + '" target="_blank" rel="noopener noreferrer">abrir</a>');
          acc.appendChild(ba);

      } else if (cur === 'captacion') {
        body.appendChild(el('<div class="field-grid">' + fld('Canal de origen', p.channel) + fld('Fecha de captación', p.capture_date) + fld('Responsable', p.responsible) + fld('Objetivo', p.objective) + '</div>'));

        /* --- Entrevistas: las que vienen y las que ya se hicieron ---
           Guardar lo que se habló y cuándo no es burocracia: es lo que te

        body.appendChild(el('<p class="sec-label">Entrevistas</p>'));

          .sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });

                  { name: 'notes', label: 'Qué se habló y qué se acordó', type: 'textarea' }
                ], { notes: e.notes }, function (d) {
                  SF.store.interviewUpdate(p.id, e.id, { done: true, outcome: d.outcome, notes: d.notes, done_on: hoyS });

                }));

              var be2 = el('<button class="lnk">cambiar fecha</button>');
              be2.onclick = function () { entrevistaModal(p, e, function () { p = SF.store.get(p.id); paint(); }); };

              bd2.onclick = function () { if (confirm('¿Quitar esta entrevista?')) { SF.store.interviewRemove(p.id, e.id); p = SF.store.get(p.id); paint(); } };
              ra.appendChild(bh); ra.appendChild(be2); ra.appendChild(bd2);

            lp.appendChild(row);

        if (hechas.length) {
          body.appendChild(el('<p class="hint" style="margin-top:10px">Ya celebradas</p>'));

      } else if (cur === 'seguimiento') {
        var tr = p.tracking || { steps: {}, log: [], next: {} };
        var canT = SF.store.role() !== 'padre';

        // Próxima acción
        body.appendChild(el('<p class="sec-label">Próxima acción</p>'));
        var nx = tr.next || {};
        body.appendChild(el('<p class="hint">' + (nx.action ? '<b>' + esc(nx.action) + '</b>' + (nx.date ? ' · ' + fmtDate(nx.date) : '') : 'Sin próxima acción definida.') + '</p>'));
        if (canT) {
          var bn = el('<button class="btn btn-light btn-sm">' + ico('edit') + 'Definir próxima acción</button>');
          bn.onclick = function () {
            U.modal('Próxima acción', smallForm([{ name: 'action', label: 'Acción' }, { name: 'date', label: 'Fecha', type: 'date' }], { action: nx.action, date: nx.date }, function (d) {
              var t2 = JSON.parse(JSON.stringify(p.tracking || { steps: {}, log: [] })); t2.next = { action: d.action, date: d.date };
              SF.store.update(p.id, { tracking: t2 }); p = SF.store.get(p.id); U.toast('Próxima acción guardada'); paint();
            }));
          };
          body.appendChild(bn);
        }

        // Línea temporal con hitos marcables
        body.appendChild(el('<p class="sec-label">Línea temporal</p>'));
        body.appendChild(el('<p class="hint">' + (canT ? 'Toca un hito para marcarlo como completado y dejar una anotación de qué pasó y cuándo.' : 'Estado del proceso del jugador.') + '</p>'));
        var tl = el('<div class="timeline"></div>');
        SF.PIPELINE.forEach(function (s, i) {
          var st = (tr.steps || {})[s] || {};
          var done = st.done || i <= statusIdx;
          var meaning = (SF.PIPELINE_INFO || {})[s] || '';
          var meta = st.date ? '<span class="tl-meta">' + (st.by ? esc(st.by) + ' · ' : '') + fmtDate(st.date) + '</span>' : '';
          var step = el('<div class="tl-step ' + (done ? 'done' : '') + (canT ? ' clickable' : '') + '"><span class="tl-dot"></span>' +
            '<div class="tl-body"><div class="tl-title">' + esc(s) + meta + '</div>' +
            '<div class="tl-desc">' + esc(meaning) + '</div>' +
            (st.note ? '<div class="tl-note">' + esc(st.note) + '</div>' : '') + '</div></div>');
          if (canT) {
            step.onclick = function () {
              U.modal('Hito: ' + esc(s), smallForm([
                { name: 'done', label: '¿Completado?', type: 'select', options: ['Sí', 'No'] },
                { name: 'date', label: 'Fecha', type: 'date' },
                { name: 'note', label: 'Anotación', type: 'textarea' }
              ], { done: done ? 'Sí' : 'No', date: st.date || new Date().toISOString().slice(0, 10), note: st.note || '' }, function (d) {
                var t2 = JSON.parse(JSON.stringify(p.tracking || { steps: {}, log: [] })); if (!t2.steps) t2.steps = {};
                t2.steps[s] = { done: d.done === 'Sí', date: d.date, by: SF.store.currentUser().name, note: d.note };
                SF.store.update(p.id, { tracking: t2 }); p = SF.store.get(p.id); U.toast('Hito actualizado'); paint();
              }));
            };
          }
          tl.appendChild(step);
        });
        body.appendChild(tl);

        // Registro de seguimiento (anotaciones)
        body.appendChild(el('<p class="sec-label">Registro de seguimiento</p>'));
        var slog = (tr.log || []).slice().reverse();
        var lw = el('<div class="wall"></div>');
        if (!slog.length) lw.appendChild(el('<p class="hint">Sin anotaciones todavía.</p>'));
        slog.forEach(function (m) { lw.appendChild(el('<div class="msg"><div class="msg-head"><b>' + esc(m.by) + '</b> <span class="hint">' + esc(m.date) + '</span></div><p>' + esc(m.text) + '</p></div>')); });
        body.appendChild(lw);
        if (canT) {
          var comp = el('<div class="composer"><textarea id="tn" placeholder="Añade una anotación de seguimiento…"></textarea><button class="btn btn-primary" id="ta">' + ico('arrow') + 'Añadir</button></div>');
          body.appendChild(comp);
          comp.querySelector('#ta').onclick = function () {
            var txt = comp.querySelector('#tn').value.trim(); if (!txt) return;
            var t2 = JSON.parse(JSON.stringify(p.tracking || { steps: {}, log: [] })); if (!t2.log) t2.log = [];
            t2.log.push({ date: new Date().toISOString().slice(0, 10), by: SF.store.currentUser().name, text: txt });
            SF.store.update(p.id, { tracking: t2 }); p = SF.store.get(p.id); U.toast('Anotación añadida'); paint();
          };
        }
      } else if (cur === 'informes') {
        var b = el('<button class="btn btn-primary">' + ico('ai') + 'Analizar con IA</button>');
        b.onclick = function () { analizarIA(p); };
        body.appendChild(b);
        body.appendChild(el('<p class="hint">Genera resumen ejecutivo, fortalezas, áreas de mejora y siguiente paso (simulado).</p>'));
      } else if (cur === 'finanzas') {
        if (!role().canSeeFinance) { body.appendChild(el('<div class="empty-panel"><p>Tu rol no tiene acceso a finanzas.</p></div>')); return; }
        var refF = function () { p = SF.store.get(p.id); paint(); };
        body.appendChild(bankBlock(p, role().canManageFinance, refF));
        body.appendChild(finPlanBlock(p, role().canManageFinance, refF));
        if (role().canManageFinance) { var bf = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Generar plan FBM</button>'); bf.onclick = function () { genPlanFBMModal(p, refF); }; body.appendChild(bf); }
        body.appendChild(kitBlock(p, role().canManageFinance, refF));
      } else if (cur === 'portal') {
        var b3 = el('<button class="btn btn-primary">' + ico('family') + 'Ver portal de la familia</button>');
        b3.onclick = function () { location.hash = '#/portal-family/' + p.id; };
        body.appendChild(el('<div class="field-grid">' + fld('Acceso Family', p.family_active ? 'Activado' : 'No activado') + fld('Contacto', (p.family || {}).contact) + '</div>'));
        body.appendChild(b3);
      } else if (cur === 'notas') {
        if (!role().canSeeNotes) { body.appendChild(el('<div class="empty-panel"><p>Tu rol no puede ver notas internas.</p></div>')); return; }
        var ta = el('<textarea class="notes" placeholder="Situación económica, presupuesto, beca posible, observaciones de scout…">' + esc(p.notes_internal) + '</textarea>');
        var sv = el('<button class="btn btn-primary">Guardar notas</button>');
        sv.onclick = function () { SF.store.update(p.id, { notes_internal: ta.value }); p = SF.store.get(p.id); U.toast('Notas guardadas'); };
        body.appendChild(el('<p class="hint">Solo staff autorizado. Aquí vive el presupuesto y la situación económica.</p>'));
        body.appendChild(ta); body.appendChild(sv);
      }
    }
    paint();
  };

  /* "Analizar con IA" — resumen basado en reglas (simulado, honesto) */
  function analizarIA(p) {
    var strengths = [], gaps = [];
    if (p.height_cm >= 195) strengths.push('Envergadura física destacada para su posición.');
    var ssInf = SF.scoutScore(p);
    if (ssInf && ssInf.score >= 80) strengths.push('Scout Score alto (' + ssInf.score + ' sobre 100, de ' + ssInf.puestos + ' apartados evaluados).');
    if ((p.nationality || []).length > 1) strengths.push('Doble nacionalidad: facilita movilidad internacional.');
    if (!strengths.length) strengths.push('Perfil en evaluación; faltan datos para destacar fortalezas.');
    var missing = [];
    if (p.documents.pasaporte === 'pendiente') missing.push('pasaporte');
    if (p.documents.video_highlights === 'pendiente') missing.push('vídeo highlights');
    if (!p.email) missing.push('email de contacto');
    if (!p.club) missing.push('club actual');
    if (missing.length) gaps.push('Faltan: ' + missing.join(', ') + '.');
    var next = p.status === 'Datos incompletos' ? 'Completar la ficha y solicitar vídeo a la familia.' :
      p.status === 'En evaluación' ? 'Asignar Scout Score y agendar entrevista.' :
        p.status === 'Entrevista' ? 'Preparar oferta tras la entrevista.' : 'Hacer seguimiento del estado actual.';
    var node = el('<div class="ia-report"><p class="sec-label">Resumen ejecutivo</p><p>' + esc(p.full_name) + ', ' + (p.birth_year || '') + ', ' + esc(p.primary_position || '') + '. Estado: ' + esc(p.status) + '.</p>' +
      '<p class="sec-label">Fortalezas</p><ul>' + strengths.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +
      '<p class="sec-label">Áreas / datos faltantes</p><ul>' + (gaps.length ? gaps : ['Ficha razonablemente completa.']).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +
      '<p class="sec-label">Siguiente paso sugerido</p><p>' + esc(next) + '</p>' +
      '<p class="hint">Generado por reglas (demo). En v0.3 esto lo produce la IA real con el texto y documentos del jugador.</p></div>');
    U.modal('Análisis con IA · ' + p.full_name, node);
  }

  /* ===================== IMPORTAR CON IA ===================== */
  /* ¿De quién habla este texto? Busca si ya existe esa persona en el club.
     Es la diferencia entre crear un duplicado y completar la ficha que ya
     tienes a medias, que es lo que pasa de verdad: los datos llegan a
     cachos, por WhatsApp, a lo largo de semanas. */
  function buscarParecido(d) {
    var nombre = ((d.first_name || '') + ' ' + (d.last_name || '')).trim().toLowerCase();
    if (!nombre || nombre.length < 3) return null;
    var trozos = nombre.split(/\s+/).filter(function (x) { return x.length > 2; });
    if (!trozos.length) return null;
    var mejor = null, mejorPuntos = 0;
    SF.store.players().forEach(function (p) {
      var suyo = (p.full_name || '').toLowerCase();
      var puntos = trozos.filter(function (t) { return suyo.indexOf(t) >= 0; }).length;
      /* Coincidir en año de nacimiento suma mucho: hay muchos "García". */
      if (d.birth_year && p.birth_year === d.birth_year) puntos += 1.5;
      if (puntos > mejorPuntos) { mejorPuntos = puntos; mejor = p; }
    });
    return mejorPuntos >= 2 ? { p: mejor, puntos: mejorPuntos } : null;
  }

  var CAMPOS_IMPORT = [
    ['first_name', 'Nombre'], ['last_name', 'Apellidos'], ['birth_date', 'Fecha de nacimiento'],
    ['birth_year', 'Año'], ['primary_position', 'Posición'], ['secondary_position', 'Posición secundaria'],
    ['height_cm', 'Altura'], ['weight_kg', 'Peso'], ['nationality', 'Nacionalidad'],
    ['city', 'Ciudad'], ['residence_country', 'País'], ['phone', 'Teléfono'], ['email', 'Email'],
    ['club', 'Club actual'], ['league', 'Liga'], ['category', 'Categoría'],
    ['school', 'Centro de estudios'], ['course', 'Curso'], ['objective', 'Objetivo']
  ];
  function pinta(k, v) {
    if (v == null || v === '') return '';
    if (k === 'nationality') return [].concat(v).join(', ');
    if (k === 'height_cm') return (v / 100).toFixed(2) + ' m';
    if (k === 'weight_kg') return v + ' kg';
    return String(v);
  }

  pages.importar = function (view) {
    view.innerHTML = head('Importar desde un mensaje',
      'Pega un WhatsApp, un correo o una nota. La app saca los datos y te dice si es alguien nuevo o si completa una ficha que ya tienes.');
    var wrap = el('<div class="import-wrap"></div>');
    var ta = el('<textarea class="import-ta" placeholder="Pega aquí el mensaje tal cual llegó, con sus faltas y su desorden. Por ejemplo:&#10;&#10;[21:14, 3/9/2026] Ángel Prieto: buenas Jorge te paso el chaval del q te hablé&#10;[21:14] Ángel Prieto: Martin Rios, del 2009, juega de 3&#10;[21:15] Ángel Prieto: mide 1.92 ya, esta en el juventud alcala&#10;[21:16] Ángel Prieto: el padre se llama Roberto, tlf 600111222"></textarea>');
    var btns = el('<div class="row-c"><button class="btn btn-primary" id="ext">' + ico('ai') + 'Leer el mensaje</button></div>');
    var estado = el('<p class="hint" id="ia-estado"></p>');
    var outp = el('<div id="ext-out"></div>');
    wrap.appendChild(ta); wrap.appendChild(btns); wrap.appendChild(estado); wrap.appendChild(outp);
    view.appendChild(wrap);

    view.appendChild(el('<div class="foco is-warn"><div class="foco-ic">' + ico('alert') + '</div><div class="foco-body">' +
      '<p class="foco-t">De momento, solo con datos de prueba</p>' +
      '<p class="foco-s">El texto se envía a un proveedor de IA para leerlo. Antes de pegar aquí datos reales de un menor ' +
      'hay que tenerlo recogido en el contrato con el club y avisar a las familias. Para probar, invéntate los nombres.</p></div></div>'));

    btns.querySelector('#ext').onclick = function () {
      var t = ta.value.trim();
      if (!t) { U.toast('Pega algún texto primero'); return; }
      estado.textContent = 'Leyendo el mensaje…';
      outp.innerHTML = '';

      fetch('/api/extraer', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto: t })
      }).then(function (r) { return r.json(); }).catch(function () { return { ok: false, motivo: 'red' }; })
        .then(function (res) {
          if (res.ok) {
            estado.innerHTML = 'Leído con IA <span class="hint">(' + esc(res.modelo || '') + ')</span>';
            if (res.campos && res.campos.sin_datos) {
              outp.appendChild(el('<div class="empty-panel"><p>Ese texto no habla de ningún jugador.</p></div>'));
              return;
            }
            resultado(res.campos, res.campos.resumen);
          } else {
            /* Sin IA la app sigue funcionando con el lector de siempre, pero
               se dice claramente que es peor, para que nadie se confunda. */
            var motivo = res.motivo === 'sin_clave'
              ? 'La IA no está conectada todavía, así que he usado el lector básico: solo pilla año, altura, posición y cuatro nacionalidades. ' +
                'Para activarla, añade en Vercel una clave: <b>GEMINI_API_KEY</b> (Google, tiene capa gratuita), ' +
                '<b>ANTHROPIC_API_KEY</b> o <b>OPENAI_API_KEY</b>. La app usa la que encuentre.'
              : res.motivo === 'red' ? 'No he podido contactar con el servidor. He usado el lector básico.'
              : 'La IA ha respondido con un error' + (res.detalle ? ': <span class="hint">' + esc(res.detalle) + '</span>' : '') +
                '. He usado el lector básico.';
            estado.innerHTML = '<b>' + motivo + '</b>';
            resultado(parseText(t), null);
          }
        });
    };

    function resultado(d, resumen) {
      outp.innerHTML = '';
      if (resumen) outp.appendChild(el('<p class="hint" style="font-style:italic">' + esc(resumen) + '</p>'));

      var hay = CAMPOS_IMPORT.filter(function (c) { return pinta(c[0], d[c[0]]) !== ''; });
      if (!hay.length) { outp.appendChild(el('<div class="empty-panel"><p>No he sacado ningún dato de ese texto.</p></div>')); return; }

      var card = el('<div class="card"><p class="sec-label">Esto es lo que he entendido</p></div>');
      card.appendChild(el('<div class="field-grid">' + hay.map(function (c) {
        return fld(c[1], pinta(c[0], d[c[0]]));
      }).join('') + '</div>'));

      /* ¿Es alguien que ya está? */
      var parecido = buscarParecido(d);
      if (parecido) {
        var p = parecido.p;
        card.appendChild(el('<p class="sec-label">Creo que ya lo tienes</p>'));
        card.appendChild(el('<p class="hint">Esto se parece a <b>' + esc(p.full_name) + '</b> (' + SF.fichaCode(p.ficha) +
          (p.birth_year ? ' · ' + p.birth_year : '') + '). Puedes completar su ficha o crear uno nuevo.</p>'));

        var bComp = el('<button class="btn btn-primary btn-sm">' + ico('edit') + 'Completar la ficha de ' + esc(p.full_name.split(' ')[0]) + '</button>');
        bComp.onclick = function () { completar(p, d); };
        var bNuevo = el('<button class="btn btn-light btn-sm">Es otro jugador, crear ficha nueva</button>');
        bNuevo.onclick = function () { crearNuevo(d); };
        var fila = el('<div class="row-c"></div>'); fila.appendChild(bComp); fila.appendChild(bNuevo);
        card.appendChild(fila);
      } else {
        var bC = el('<button class="btn btn-primary">' + ico('plus') + 'Crear la ficha</button>');
        bC.onclick = function () { crearNuevo(d); };
        card.appendChild(bC);
      }
      outp.appendChild(card);
    }

    function crearNuevo(d) {
      var data = {};
      CAMPOS_IMPORT.forEach(function (c) { if (d[c[0]] != null && d[c[0]] !== '') data[c[0]] = d[c[0]]; });
      if (d.family_contact || d.family_phone) {
        data.family = { contact: d.family_contact || '', relation: d.family_relation || '', phone: d.family_phone || '', email: d.family_email || '' };
      }
      U.modal('Revisar antes de crear', playerForm(data, function (fin) {
        var np = SF.store.create(fin); U.toast('Ficha creada'); location.hash = '#/jugador/' + np.id;
      }));
    }

    /* Completar una ficha existente. La regla: NUNCA pisar un dato que ya
       está sin preguntar. Lo que está vacío se marca solo; lo que choca se
       enseña en rojo y hay que decidirlo a mano. */
    function completar(p, d) {
      var body = el('<div></div>');
      var nuevos = [], choques = [];
      CAMPOS_IMPORT.forEach(function (c) {
        var k = c[0], v = d[k];
        if (v == null || v === '' || (Array.isArray(v) && !v.length)) return;
        var actual = p[k];
        var vacio = actual == null || actual === '' || (Array.isArray(actual) && !actual.length);
        if (vacio) nuevos.push({ k: k, label: c[1], v: v });
        else if (pinta(k, actual) !== pinta(k, v)) choques.push({ k: k, label: c[1], v: v, antes: actual });
      });
      /* La familia va aparte porque vive dentro de p.family. Se trata igual
         que el resto: si está vacío se añade, y si no coincide se avisa.
         Antes, un teléfono distinto del padre se perdía sin decir nada. */
      [['family_contact', 'contact', 'Contacto familiar'],
       ['family_phone', 'phone', 'Teléfono de la familia'],
       ['family_email', 'email', 'Email de la familia']].forEach(function (f) {
        var v = d[f[0]]; if (!v) return;
        var actual = (p.family || {})[f[1]];
        if (!actual) nuevos.push({ k: f[0], label: f[2], v: v });
        else if (String(actual).trim() !== String(v).trim()) choques.push({ k: f[0], label: f[2], v: v, antes: actual });
      });

      if (!nuevos.length && !choques.length) {
        body.appendChild(el('<p class="hint">Ese mensaje no aporta nada nuevo: ya lo tenías todo.</p>'));
      }
      if (nuevos.length) {
        body.appendChild(el('<p class="sec-label">Se añade (estaba vacío)</p>'));
        nuevos.forEach(function (x) {
          var row = el('<label class="chk" style="padding:6px 0"><input type="checkbox" checked data-k="' + x.k + '">' +
            '<span><b>' + esc(x.label) + ':</b> ' + esc(pinta(x.k, x.v)) + '</span></label>');
          body.appendChild(row);
        });
      }
      if (choques.length) {
        body.appendChild(el('<p class="sec-label">No coincide con lo que ya tenías</p>'));
        body.appendChild(el('<p class="hint">Desmarcado a propósito. Decide tú: el mensaje puede ser más reciente… o estar equivocado.</p>'));
        choques.forEach(function (x) {
          var row = el('<label class="chk" style="padding:6px 0"><input type="checkbox" data-k="' + x.k + '">' +
            '<span><b>' + esc(x.label) + ':</b> tienes <b>' + esc(pinta(x.k, x.antes)) + '</b> → ponerlo en <b class="c-warn">' + esc(pinta(x.k, x.v)) + '</b></span></label>');
          body.appendChild(row);
        });
      }

      var foot = el('<div class="modal-actions"><button class="btn">Cancelar</button><button class="btn btn-primary">Guardar en la ficha</button></div>');
      foot.children[0].onclick = U.closeModal;
      foot.children[1].onclick = function () {
        var patch = {}, fam = Object.assign({}, p.family || {}), tocado = 0;
        body.querySelectorAll('input[type=checkbox]').forEach(function (i) {
          if (!i.checked) return;
          var k = i.dataset.k, todos = nuevos.concat(choques).filter(function (x) { return x.k === k; })[0];
          if (!todos) return;
          tocado++;
          if (k === 'family_contact') fam.contact = todos.v;
          else if (k === 'family_phone') fam.phone = todos.v;
          else if (k === 'family_email') fam.email = todos.v;
          else patch[k] = todos.v;
        });
        if (JSON.stringify(fam) !== JSON.stringify(p.family || {})) patch.family = fam;
        if (!tocado) { U.toast('No has marcado nada'); return; }
        SF.store.update(p.id, patch);
        U.closeModal(); U.toast(tocado + ' dato(s) añadidos a ' + p.full_name);
        location.hash = '#/jugador/' + p.id;
      };
      var w = el('<div></div>'); w.appendChild(body); w.appendChild(foot);
      U.modal('Completar la ficha de ' + p.full_name, w);
    }

    function parseText(t) {
      var d = { sport: 'baloncesto', status: 'Datos incompletos' };
      var year = (t.match(/\b(19|20)\d{2}\b/) || [])[0]; if (year) d.birth_year = +year;
      var h = t.match(/1[,\.]\d{2}\s*m|\b1\d{2}\s*cm/i);
      if (h) { var num = h[0].replace(/[^\d,\.]/g, '').replace(',', '.'); d.height_cm = num.indexOf('.') >= 0 ? Math.round(parseFloat(num) * 100) : +num; }
      var pos = ['Base', 'Escolta', 'Alero', 'Ala-pívot', 'Pívot'].filter(function (p) { return new RegExp(p, 'i').test(t); });
      if (pos.length) { d.primary_position = pos[0]; if (pos[1]) d.secondary_position = pos[1]; }
      var nats = []; if (/argentin/i.test(t)) nats.push('Argentina'); if (/español|espana|españa/i.test(t)) nats.push('España'); if (/mexic|méxic/i.test(t)) nats.push('México'); if (/colombi/i.test(t)) nats.push('Colombia');
      d.nationality = nats;
      var words = t.split(/[\n,]/)[0].trim().split(/\s+/).filter(function (w) { return /^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+$/.test(w); });
      if (words.length) { d.first_name = words.slice(0, 2).join(' '); d.last_name = words.slice(2).join(' '); }
      return d;
    }
  };

  /* ===================== CAPTACIÓN (pipeline) ===================== */
  /* Formulario de entrevista, reutilizado desde el tablero y desde la ficha. */
  function entrevistaModal(p, ev, onSave) {
    var esNueva = !ev;
    ev = ev || {};
    var f = smallForm([
      { name: 'date', label: 'Fecha', type: 'date' },
      { name: 'time', label: 'Hora' },
      { name: 'type', label: '¿Con quién?', type: 'select', options: SF.INTERVIEW_TYPES },
      { name: 'place', label: 'Dónde (o enlace de la videollamada)' },
      { name: 'with', label: 'Por parte del club' },
      { name: 'notes', label: 'Notas', type: 'textarea' }
    ], ev, function (d) {
      if (!d.date) { U.toast('Ponle fecha, que si no no hay recordatorio'); return false; }
      if (esNueva) SF.store.interviewAdd(p.id, d);
      else SF.store.interviewUpdate(p.id, ev.id, d);
      if (onSave) onSave(d);
    });
    U.modal(esNueva ? 'Programar entrevista — ' + p.full_name : 'Entrevista — ' + p.full_name, f);
  }

  /* Avisar a la familia de la fecha. Va por el tablón del portal, con el
     formato de siempre: notificación del club, y dentro el mensaje. */
  function avisarEntrevista(p, d) {
    SF.store.annCreate(p.team_id || null, {
      kind: 'entrevista',
      title: 'Entrevista con el club',
      body: 'Os proponemos una entrevista' + (d.type ? ' (' + d.type.toLowerCase() + ')' : '') + '.\n\n' +
        'Fecha: ' + fmtDate(d.date) + (d.time ? ' a las ' + d.time : '') +
        (d.place ? '\nLugar: ' + d.place : '') +
        '\n\nSi no os viene bien, contestad y buscamos otro momento.'
    }, [p.id]);
  }

  pages.captacion = function (view) {
    var r = role();
    view.innerHTML = head('Captación', 'De prospecto a jugador. La etapa dice por dónde va; las etiquetas, qué le falta.');
    var ps = scopedPlayers();
    var hoy = new Date().toISOString().slice(0, 10);

    /* Lo que hay que atender hoy, antes del tablero: una entrevista que se
       pasó de fecha sin cerrar es lo más fácil de perder de vista. */
    var caducadas = ps.map(function (p) { return { p: p, e: SF.overdueInterview(p) }; }).filter(function (x) { return x.e; });
    var proximas = SF.store.interviewsUpcoming().filter(function (x) { return ps.some(function (p) { return p.id === x.p.id; }); });

    if (caducadas.length) {
      view.appendChild(el('<div class="foco is-warn"><div class="foco-ic">' + ico('alert') + '</div><div class="foco-body">' +
        '<p class="foco-t">' + caducadas.length + (caducadas.length === 1 ? ' entrevista pasó de fecha' : ' entrevistas pasaron de fecha') + ' sin cerrar</p>' +
        '<p class="foco-s">' + esc(caducadas.map(function (x) { return x.p.full_name.split(' ')[0] + ' (' + fmtDate(x.e.date) + ')'; }).slice(0, 4).join(', ')) +
        '. Ábrelas y anota qué pasó, o cámbiales la fecha.</p></div></div>'));
    } else if (proximas.length) {
      var n0 = proximas[0];
      view.appendChild(el('<div class="foco"><div class="foco-ic">' + ico('cal') + '</div><div class="foco-body">' +
        '<p class="foco-t">Próxima entrevista: ' + esc(n0.p.full_name) + '</p>' +
        '<p class="foco-s">' + fmtDate(n0.e.date) + (n0.e.time ? ' a las ' + esc(n0.e.time) : '') +
        (n0.e.type ? ' · ' + esc(n0.e.type.toLowerCase()) : '') + (proximas.length > 1 ? ' · y ' + (proximas.length - 1) + ' más programadas' : '') +
        '</p></div></div>'));
    }

    var board = el('<div class="board"></div>');
    SF.PIPELINE.forEach(function (stage) {
      var enEtapa = ps.filter(function (p) { return p.status === stage; });
      var col = el('<div class="bcol"><div class="bcol-head">' + esc(stage) + ' <span>' + enEtapa.length + '</span></div><div class="bcol-body"></div></div>');
      var bd = col.querySelector('.bcol-body');

      if (!enEtapa.length) bd.appendChild(el('<p class="bcol-vacio">Nadie aquí</p>'));

      enEtapa.forEach(function (p) {
        var next = SF.nextInterview(p), tarde = SF.overdueInterview(p);
        var pend = SF.pendientesDe(p, { finanzas: r.canSeeFinance });

        var c = el('<div class="kcard">' +
          '<div class="kc-name">' + esc(p.full_name) + '</div>' +
          '<div class="kc-meta">' + (p.birth_year || '—') + ' · ' + esc(p.primary_position || '—') +
          (p.origin ? ' · ' + esc(p.origin) : '') + '</div>' +
          /* Lo pendiente va SIEMPRE, esté en la etapa que esté. */
          (pend.length ? '<div class="kc-tags">' + pend.map(function (x) {
            return '<span class="tag tag-' + x.c + '">' + esc(x.t) + '</span>';
          }).join('') + '</div>' : '') +
          (tarde
            ? '<div class="kc-cita tarde">' + ico('alert') + 'Entrevista del ' + fmtDate(tarde.date) + ' sin cerrar</div>'
            : next
              ? '<div class="kc-cita' + (next.date === hoy ? ' hoy' : '') + '">' + ico('cal') +
                (next.date === hoy ? 'Entrevista HOY' : 'Entrevista ' + fmtDate(next.date)) +
                (next.time ? ' · ' + esc(next.time) : '') + '</div>'
              : '') +
          '</div>');

        var acc = el('<div class="kc-acc"></div>');
        var sel = el('<select class="kc-move"></select>');
        sel.innerHTML = SF.PIPELINE.map(function (s) { return '<option' + (s === stage ? ' selected' : '') + '>' + s + '</option>'; }).join('');
        sel.onclick = function (e) { e.stopPropagation(); };
        sel.onchange = function () { SF.store.update(p.id, { status: sel.value }); U.toast(p.full_name + ' → ' + sel.value); SF.router.render(); };
        acc.appendChild(sel);

        var bcita = el('<button class="kc-cal" title="' + (next || tarde ? 'Ver o cambiar la entrevista' : 'Programar entrevista') + '">' + ico('cal') + '</button>');
        bcita.onclick = function (e) {
          e.stopPropagation();
          entrevistaModal(p, next || tarde || null, function (d) {
            U.toast('Entrevista guardada');
            if (confirm('¿Aviso a la familia de ' + p.full_name + ' con la fecha?')) { avisarEntrevista(p, d); U.toast('Aviso enviado a la familia'); }
            SF.router.render();
          });
        };
        acc.appendChild(bcita);
        c.appendChild(acc);

        c.onclick = function () { SF._openTab = 'captacion'; location.hash = '#/jugador/' + p.id; };
        bd.appendChild(c);
      });
      board.appendChild(col);
    });
    view.appendChild(board);
    view.appendChild(el('<p class="hint">La <b>etapa</b> es una sola: por dónde va. Lo que le falta —papeles, vídeo, pagos— sale como etiqueta ' +
      'y no depende de la etapa: se puede tener una oferta enviada y deber documentación a la vez. ' +
      'El botón del calendario programa la entrevista y, si quieres, avisa a la familia.</p>'));
  };

  /* ===================== DOCUMENTOS ===================== */
  /* ===================== DOCUMENTOS =====================
     Esta pantalla NO repite lo que ya está en cada ficha: enseña solo
     LO QUE FALTA, en jugadores y en staff, y sirve para pedirlo.
     El recordatorio se manda uno a uno: cada familia recibe solo lo suyo,
     nunca una lista con los nombres de los demás. */
  pages.documentos = function (view) {
    view.innerHTML = head('Documentos', 'Solo lo que falta. Desde aquí se pide.');
    /* Por defecto avisan dirección y administración. Si el director le da el
       permiso "Gestionar documentación" a otra persona, aquí lo hereda sola. */
    var puedeAvisar = role().canDocs || ['director', 'administrativo'].indexOf(SF.store.role()) >= 0;

    /* ---------- filtro por equipo ---------- */
    var teams = SF.store.teams();
    var bar = el('<div class="filters"><select id="ft"><option value="">Todos los equipos</option>' +
      teams.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + '</option>'; }).join('') +
      '<option value="__sin">Sin equipo</option></select></div>');
    view.appendChild(bar);

    var out = el('<div></div>'); view.appendChild(out);

    function paint() {
      out.innerHTML = '';
      var ft = bar.querySelector('#ft').value;
      /* scopedPlayers, no players: una dirección técnica de un segmento no
         debe ver la documentación de los jugadores de otro. */
      var ps = scopedPlayers().filter(function (p) {
        if (ft === '__sin') return !p.team_id;
        return !ft || p.team_id === ft;
      });
      var faltan = ps.map(function (p) { return { p: p, pend: SF.docsPend(p) }; })
        .filter(function (x) { return x.pend.length; });
      // Lo que está fuera de plazo va primero: es lo que urge.
      faltan.sort(function (a, b) {
        return b.pend.filter(SF.docVencido).length - a.pend.filter(SF.docVencido).length;
      });

      /* ---------- resumen y envío masivo ---------- */
      var top = el('<div class="empty-panel" style="text-align:left"></div>');
      if (!faltan.length) {
        top.appendChild(el('<p><b>Nada pendiente.</b> Toda la documentación de jugadores está entregada.</p>'));
      } else {
        var totalDocs = faltan.reduce(function (a, x) { return a + x.pend.length; }, 0);
        top.appendChild(el('<p><b>' + faltan.length + ' jugador' + (faltan.length === 1 ? '' : 'es') + '</b> con documentación pendiente · ' + totalDocs + ' documento' + (totalDocs === 1 ? '' : 's') + ' en total</p>'));
        if (puedeAvisar) {
          var bAll = el('<button class="btn btn-primary btn-sm">' + ico('ai') + 'Enviar recordatorio a los ' + faltan.length + '</button>');
          bAll.onclick = function () {
            if (!confirm('Se enviará un aviso a cada familia con SU documentación pendiente. Nadie ve la de los demás. ¿Continuar?')) return;
            var n = 0;
            faltan.forEach(function (x) { if (enviarRecordatorio(x.p, x.pend)) n++; });
            U.toast(n + ' recordatorios enviados'); SF.router.render();
          };
          top.appendChild(bAll);
          top.appendChild(el('<p class="hint">Cada familia recibe un aviso propio, solo con lo que le falta a su hijo/a.</p>'));
        } else {
          top.appendChild(el('<p class="hint">Los recordatorios los envía dirección o administración.</p>'));
        }
      }
      out.appendChild(top);

      /* ---------- jugadores ---------- */
      if (faltan.length) {
        out.appendChild(el('<p class="sec-label">Jugadores</p>'));
        var l = el('<div class="mini-list"></div>');
        faltan.forEach(function (x) {
          var tName = x.p.team_id ? (SF.store.teamGet(x.p.team_id) || {}).name : 'En seguimiento · sin equipo';
          var av = x.p.doc_reminder_at ? '<span class="hint">avisado ' + fmtDate(x.p.doc_reminder_at) + '</span>' : '';
          var row = el('<div class="mini-row"><span><b>' + esc(x.p.full_name) + '</b> <span class="hint">' + SF.fichaCode(x.p.ficha) + ' · ' + esc(tName || '') + '</span><br>' +
            x.pend.map(function (d) {
              return '<span class="tag ' + (SF.docVencido(d) ? 'tag-danger' : 'tag-warn') + '">' + esc(d.label) +
                (d.due ? ' · ' + fmtDate(d.due) : '') + '</span>';
            }).join(' ') + '</span>' +
            '<span class="row-actions">' + av + '<button class="lnk" data-f>Ficha</button></span></div>');
          row.querySelector('[data-f]').onclick = function () { location.hash = '#/jugador/' + x.p.id; };
          if (puedeAvisar) {
            var b1 = el('<button class="lnk" data-r>Recordar</button>');
            b1.onclick = function () {
              if (enviarRecordatorio(x.p, x.pend)) { U.toast('Recordatorio enviado a ' + x.p.full_name); SF.router.render(); }
            };
            row.querySelector('.row-actions').insertBefore(b1, row.querySelector('[data-f]'));
          }
          l.appendChild(row);
        });
        out.appendChild(l);
      }

      /* ---------- staff ---------- */
      var staffMal = SF.store.staff().map(function (s) { return { s: s, pend: SF.staffPend(s) }; })
        .filter(function (x) { return x.pend.length; });
      out.appendChild(el('<p class="sec-label">Staff</p>'));
      if (!staffMal.length) out.appendChild(el('<p class="hint">Todo el staff está al día.</p>'));
      var sl = el('<div class="mini-list"></div>');
      staffMal.forEach(function (x) {
        var s = x.s;
        var av = s.doc_reminder_at ? '<span class="hint">avisado ' + fmtDate(s.doc_reminder_at) + '</span> ' : '';
        var row = el('<div class="mini-row"><span><b>' + esc(s.full_name) + '</b> <span class="hint">' + SF.staffCode(s.num) + ' · ' + esc(roleLabel(s.role)) + '</span><br>' +
          x.pend.map(function (d) {
            return '<span class="tag ' + (d.grave ? 'tag-danger' : 'tag-warn') + '">' + esc(d.label) + '</span>';
          }).join(' ') + '</span>' +
          '<span class="row-actions">' + av + '<button class="lnk" data-f>Ficha</button></span></div>');
        row.querySelector('[data-f]').onclick = function () { location.hash = '#/staff/' + s.id; };
        if (puedeAvisar) {
          var br = el('<button class="lnk" data-r>Recordar</button>');
          br.onclick = function () {
            enviarRecordatorioStaff(s, x.pend);
            U.toast('Recordatorio enviado a ' + s.full_name); SF.router.render();
          };
          row.querySelector('.row-actions').insertBefore(br, row.querySelector('[data-f]'));
        }
        sl.appendChild(row);
      });
      out.appendChild(sl);

      if (staffMal.length && puedeAvisar) {
        var bTodos = el('<button class="btn btn-light btn-sm">' + ico('arrow') + 'Avisar a los ' + staffMal.length + ' del staff</button>');
        bTodos.onclick = function () {
          if (!confirm('Se enviará a cada persona un aviso con lo suyo, solo lo suyo. ¿Seguimos?')) return;
          staffMal.forEach(function (x) { enviarRecordatorioStaff(x.s, x.pend); });
          U.toast(staffMal.length + ' recordatorios enviados'); SF.router.render();
        };
        out.appendChild(bTodos);
        out.appendChild(el('<p class="hint">Cada persona recibe únicamente lo que le falta a ella. El certificado de delitos sexuales <b>no se sube a la app</b>: se presenta en administración y el club solo anota que se ha comprobado.</p>'));
      }
    }

    /* Envía un aviso individual a la familia con SU documentación pendiente */
    function enviarRecordatorio(p, pend) {
      /* Funciona con o sin equipo: un jugador en seguimiento todavía no
         pertenece a ninguno y es justo al que más papeles le faltan. */
      var soloFamilia = pend.filter(function (d) { return (d.owner || 'Familia') !== 'Club'; });
      if (!soloFamilia.length) return false;   // si todo lo tramita el club, no se molesta a la familia

      /* El aviso arrastra el requisito y la apostilla de cada documento.
         Es justo lo que hoy se escribe a mano en un WhatsApp larguísimo, y
         donde se cuela el error que hace que el consulado lo devuelva. */
      var lista = soloFamilia.map(function (d) {
        var t = '· ' + d.label + (d.due ? '  — antes del ' + fmtDate(d.due) : '');
        if (d.apostilla) t += '\n    ⚠ Debe llevar la Apostilla de La Haya. Sin ese sello no se acepta en España.';
        if (d.requisito) t += '\n    ' + d.requisito;
        if (d.delivered && d.apostilla && !d.apostillado) t += '\n    (Ya lo tenemos, pero falta apostillarlo.)';
        return t;
      }).join('\n\n');

      SF.store.annCreate(p.team_id || null, {
        kind: 'documentacion',
        title: 'Documentación pendiente',
        body: 'Todavía falta por reunir:\n\n' + lista +
              '\n\n' + SF.DOC_FORMATO +
              '\n\nPuedes enviarlo por correo a secretaría o entregarlo en el club. Lo marcamos al recibirlo.'
      }, [p.id]);
      SF.store.update(p.id, { doc_reminder_at: new Date().toISOString().slice(0, 10) });
      return true;
    }

    /* El aviso al staff va por el canal de comunicaciones que ya existe, y
       queda registrado en su historial de ficha: si mañana hay que demostrar
       que se pidió el certificado, consta quién avisó y cuándo. */
    function enviarRecordatorioStaff(s, pend) {
      var lista = pend.map(function (d) {
        return '· ' + d.label + '\n    ' + d.nota + '\n    ' + d.como;
      }).join('\n\n');

      SF.store.commCreate({
        mode: 'directo',
        title: 'Documentación pendiente',
        body: 'Hola ' + s.full_name.split(' ')[0] + ':\n\nPara poder estar habilitado esta temporada (' + SF.SEASON + ') falta esto:\n\n' + lista +
              '\n\nSi ya lo has entregado, avisa a administración y lo revisamos.'
      }, [{ staff_id: s.id, team_id: null }]);

      SF.store.staffUpdate(s.id, { doc_reminder_at: new Date().toISOString().slice(0, 10) },
        'Recordatorio de documentación enviado: ' + pend.map(function (d) { return d.label; }).join(', '));
      return true;
    }

    bar.querySelector('#ft').addEventListener('change', paint);
    paint();
  };

  pages.informes = function (view) {
    view.innerHTML = head('Informes', 'Un resumen automático de cada jugador: en qué destaca, qué le falta y qué tocaría hacer.');
    /* scopedPlayers: un entrenador solo analiza a los suyos. Antes esta
       pantalla enseñaba la plantilla entera del club a cualquiera que
       tuviera Informes en el menú. */
    var ps = scopedPlayers();

    view.appendChild(el('<p class="hint">Pulsa <b>Analizar</b> y la app te resume ese jugador en media página: qué tiene a favor, ' +
      'qué datos le faltan y cuál sería el siguiente paso según la fase en la que esté. ' +
      'Sirve para preparar una reunión o una llamada a la familia sin repasar toda la ficha. ' +
      '<b>No lo ve nadie de fuera del club</b> y no se guarda: es un resumen de consulta.</p>'));

    if (!ps.length) {
      view.appendChild(el('<div class="empty-panel"><p>No tienes jugadores a tu cargo todavía.</p></div>'));
      return;
    }

    var list = el('<div class="card"></div>');
    ps.forEach(function (p) {
      /* Se dice de un vistazo qué va a salir en el análisis: si la ficha
         está vacía, el resumen va a estar vacío, y más vale avisar antes. */
      var ss = SF.scoutScore(p);
      var pend = SF.pendientesDe(p);
      var pista = ss ? 'Score ' + ss.score + ' · ' + ss.puestos + '/' + ss.total + ' evaluado' : 'sin evaluar todavía';
      if (pend.length) pista += ' · ' + pend.map(function (x) { return x.t.toLowerCase(); }).join(', ');

      var row = el('<div class="att"><div class="av av-purple">' + U.initials(p.full_name) + '</div>' +
        '<div class="att-body"><p class="att-name">' + esc(p.full_name) + '</p>' +
        '<p class="att-desc">' + esc(p.status) + ' · ' + esc(pista) + '</p></div>' +
        '<button class="btn">' + ico('ai') + 'Analizar</button></div>');
      row.querySelector('button').onclick = function () { analizarIA(p); };
      list.appendChild(row);
    });
    view.appendChild(list);

    view.appendChild(el('<p class="hint">Ojo con no confundirlo: <b>esto</b> es un resumen automático para uso interno. ' +
      'Los <b>informes que se publican a la familia</b> —el trimestral, el deportivo— se escriben en la ficha del jugador, ' +
      'en su pestaña Informes, y solo los ve la familia cuando los publicas a propósito.</p>'));
  };

    var t = el('<table class="tbl"><thead><tr><th>Rol</th><th>Secciones</th><th>Evalúa</th><th>Medidas</th><th>Score</th><th>Finanzas</th><th>Notas internas</th></tr></thead><tbody></tbody></table>');

  /* ===================== PORTAL FAMILY (mobile) ===================== */
  /* ===================== ECONOMÍA DE LA ACADEMIA ===================== */
  /* ===================== LA CAJA =====================
     Regla, y es la que pidió Jorge: del saldo solo se resta el dinero que YA
     HA SALIDO (gastos pagados) y solo se suma el que YA HA ENTRADO (cuotas
     cobradas). Un gasto aprobado está comprometido, pero sigue en la cuenta;
     una cuota pendiente no es dinero, es una promesa.

     Tres estados de gasto, y cada uno cuenta distinto:
       pendiente  · alguien lo ha pasado, sin aprobar     → no toca la caja
       aprobado   · aprobado, aún sin pagar               → comprometido
       pagado     · el dinero salió de la cuenta          → resta del saldo */
  function econSummary() {
    var ps = SF.store.players(), cobrado = 0, porCobrar = 0, vencido = 0;
    ps.forEach(function (p) {
      var t = SF.finTotals(p);
      cobrado += t.paid; porCobrar += t.pending + t.overdue; vencido += t.overdue;
    });
    var exps = SF.store.expenses();
    var suma = function (f) { return exps.filter(f).reduce(function (s, e) { return s + (+e.amount || 0); }, 0); };
    var pagado = suma(function (e) { return e.status === 'pagado'; });
    var comprometido = suma(function (e) { return e.status === 'aprobado'; });
    var porAprobar = suma(function (e) { return e.status === 'pendiente'; });

    var ec = SF.store.academy().economy || {};
    var prev = +ec.prev_balance || 0;
    var saldo = prev + cobrado - pagado;                  // dinero real, hoy

    return {
      prev: prev, cobrado: cobrado, porCobrar: porCobrar, vencido: vencido,
      pagado: pagado, comprometido: comprometido, porAprobar: porAprobar,
      saldo: saldo,
      disponible: saldo - comprometido,                   // lo que queda si pagas lo aprobado
      proyectado: saldo + porCobrar - comprometido,       // si se cobra todo y se paga lo aprobado
      exps: exps, players: ps,
      /* nombres antiguos, para no romper otras pantallas */
      income: cobrado, pending: porCobrar, spent: pagado, balance: saldo
    };
  }
  function eur(n) { return Math.round(n).toLocaleString('es-ES') + ' €'; }
  function expStatusTag(s) {
    var c = s === 'pagado' ? 'green' : s === 'aprobado' ? 'info' : s === 'rechazado' ? 'danger' : 'warn';
    var t = s === 'aprobado' ? 'aprobado, sin pagar' : s;
    return '<span class="tag tag-' + c + '">' + esc(t) + '</span>';
  }

  function expenseModal(refresh) {

    var f = el('<div class="form-grid">' +

      '<div class="frow"><label>Nota (opcional)</label><input id="n"></div></div>');

    foot.children[0].onclick = U.closeModal;

      if (!concept || !amt) { U.toast('Indica concepto e importe'); return; }
