  /* ===================== COMUNICADOS DEL CLUB ===================== */
  pages.comunicados = function (view) {
    var teams = scopeTeams();
    var r = SF.store.role();
    view.innerHTML = head('Comunicados', 'Del club a los entrenadores, o directo a las familias.');

    var alcance = (['director', 'dt_general', 'administrativo'].indexOf(r) >= 0)
      ? 'Alcanzas a todo el club.'
      : 'Tu alcance: ' + (teams.length ? teams.map(function (t) { return t.name; }).join(', ') : 'ningún equipo') + '.';
    view.appendChild(el('<p class="hint">' + alcance + '</p>'));

    var bNew = el('<button class="btn btn-primary btn-sm">' + ico('ai') + 'Nuevo comunicado</button>');
    bNew.onclick = function () {
      var sel = {}; teams.forEach(function (t) { sel[t.id] = true; });
      var box = el('<div></div>');
      var f = el('<div class="form-grid">' +
        '<div class="frow"><label>Título</label><input id="ti" placeholder="Torneo de Navidad"></div>' +
        '<div class="frow"><label>Mensaje</label><textarea id="bo" rows="3"></textarea></div>' +
        '<div class="frow"><label>¿Cómo se envía?</label><select id="md">' +
        '<option value="reenviar">Al entrenador, para que lo reenvíe a su equipo</option>' +
        '<option value="directo">Directo a las familias, sin pasar por el entrenador</option>' +
        '</select></div></div>');
      box.appendChild(f);
      box.appendChild(el('<p class="hint" id="expl">El entrenador lo recibe y decide cuándo mandarlo a su equipo. Tú verás quién lo ha reenviado y quién no.</p>'));
      f.querySelector('#md').onchange = function () {
        box.querySelector('#expl').innerHTML = this.value === 'directo'
          ? 'Va directamente a las familias de los equipos elegidos. Úsalo para avisos administrativos: equipación, plazos, pagos.'
          : 'El entrenador lo recibe y decide cuándo mandarlo a su equipo. Tú verás quién lo ha reenviado y quién no.';
      };

      box.appendChild(el('<p class="sec-label">¿A qué equipos?</p>'));
      var list = el('<div class="att-list"></div>');
      function paint() {
        list.innerHTML = '';
        teams.forEach(function (t) {
          var on = !!sel[t.id];
          var row = el('<button class="mini-row" style="width:100%;text-align:left;cursor:pointer"><span>' + (on ? '☑ ' : '☐ ') +
            '<b>' + esc(t.name) + '</b> · ' + esc(SF.SEGMENTS[t.segment] || t.segment || '') + '</span></button>');
          row.onclick = function () { sel[t.id] = !sel[t.id]; paint(); };
          list.appendChild(row);
        });
      }
      paint(); box.appendChild(list);

      var foot = el('<div class="modal-actions"><button class="btn">Cancelar</button><button class="btn btn-primary">Enviar</button></div>');
      foot.children[0].onclick = U.closeModal;
      foot.children[1].onclick = function () {
        var title = f.querySelector('#ti').value.trim();
        if (!title) { U.toast('Ponle un título'); return; }
        var ids = Object.keys(sel).filter(function (k) { return sel[k]; });
        if (!ids.length) { U.toast('Elige al menos un equipo'); return; }
        var mode = f.querySelector('#md').value;
        var body = f.querySelector('#bo').value.trim();

        if (mode === 'directo') {
          // Sin intermediario: un aviso por equipo, a todos sus jugadores.
          var tot = 0;
          ids.forEach(function (tid) {
            var roster = SF.store.players().filter(function (p) { return p.team_id === tid; });
            if (!roster.length) return;
            SF.store.annCreate(tid, { title: title, body: body, kind: 'club' }, roster.map(function (p) { return p.id; }));
            tot += roster.length;
          });
          SF.store.commCreate({ mode: 'directo', title: title, body: body }, []);
          U.closeModal(); U.toast('Enviado a ' + tot + ' familias'); SF.router.render();
        } else {
          // Cascada: llega a cada entrenador de esos equipos.
          var tg = [];
          ids.forEach(function (tid) {
            SF.store.staffOfTeam(tid).filter(function (s) { return s.role === 'entrenador'; })
              .forEach(function (s) { tg.push({ staff_id: s.id, team_id: tid }); });
          });
          if (!tg.length) { U.toast('Esos equipos no tienen entrenador asignado'); return; }
          SF.store.commCreate({ mode: 'reenviar', title: title, body: body }, tg);
          U.closeModal(); U.toast('Enviado a ' + tg.length + ' entrenadores'); SF.router.render();
        }
      };
      var w = el('<div></div>'); w.appendChild(box); w.appendChild(foot);
      U.modal('Nuevo comunicado', w);
    };
    view.appendChild(bNew);

    /* Enviados, con el estado del reenvío: es lo que hace útil la cascada */
    view.appendChild(el('<p class="sec-label">Enviados</p>'));
    var cs = SF.store.comms();
    if (!cs.length) view.appendChild(el('<p class="hint">Todavía no has enviado ningún comunicado.</p>'));
    cs.forEach(function (c) {
      var box = el('<div class="empty-panel" style="text-align:left;margin-bottom:10px"></div>');
      box.appendChild(el('<p><b>' + esc(c.title) + '</b> <span class="hint">' + fmtDate((c.created_at || '').slice(0, 10)) + ' · ' + esc(c.author) + '</span></p>'));
      if (c.body) box.appendChild(el('<p class="hint">' + esc(c.body) + '</p>'));
      if (c.mode === 'directo') {
        box.appendChild(el('<p class="hint"><span class="tag tag-purple">directo a familias</span></p>'));
      } else {
        var rel = c.staff_targets.filter(function (t) { return t.relayed_at; }).length;
        var leidos = c.staff_targets.filter(function (t) { return t.read_at; }).length;
        box.appendChild(el('<p class="hint"><span class="tag ' + (rel === c.staff_targets.length ? 'tag-green' : 'tag-warn') + '">' +
          rel + ' de ' + c.staff_targets.length + ' reenviado</span> · ' + leidos + ' lo han leído</p>'));
        var ul = el('<div class="mini-list"></div>');
        c.staff_targets.forEach(function (t) {
          var s = SF.store.staffGet(t.staff_id), tm = SF.store.teamGet(t.team_id);
          if (!s) return;
          ul.appendChild(el('<div class="mini-row"><span>' + esc(s.full_name) + ' <span class="hint">' + esc(tm ? tm.name : '') + '</span></span>' +
            '<span class="row-actions">' + (t.relayed_at ? '<span class="tag tag-green">reenviado</span>' :
              (t.read_at ? '<span class="tag tag-warn">leído, sin reenviar</span>' : '<span class="tag tag-gray">sin leer</span>')) + '</span></div>'));
        });
        box.appendChild(ul);
      }
      view.appendChild(box);
    });
  };

  pages['mi-equipo'] = function (view) {
    var mine = myTeams();
    var u = SF.store.currentUser();
    view.innerHTML = head('Mi equipo', 'Lo del día: citas, asistencia y avisos.');
    if (!mine.length) { view.appendChild(el('<div class="empty-panel"><p>Todavía no tienes ningún equipo asignado. La dirección técnica lo hace desde tu ficha.</p></div>')); return; }

    mine.forEach(function (t) {
      var roster = SF.store.players().filter(function (p) { return p.team_id === t.id; });
      var nextEv = teamUpcoming(t)[0];
      var anns = SF.store.announcements(t.id);

      view.appendChild(el('<p class="sec-label">' + esc(t.name) + ' · ' + roster.length + ' jugadores</p>'));

      /* --- Comunicados del club pendientes de reenviar --- */
      var meS = SF.store.staffMe();
      if (meS) {
        var pend = SF.store.comms().filter(function (c) {
          return c.mode === 'reenviar' && c.staff_targets.some(function (x) { return x.staff_id === meS.id && x.team_id === t.id && !x.relayed_at; });
        });
        pend.forEach(function (c) {
          SF.store.commMarkRead(c.id, meS.id);
          var cb = el('<div class="empty-panel" style="text-align:left;border-left:3px solid var(--purple)"></div>');
          cb.appendChild(el('<p><span class="tag tag-purple">Del club</span> <b>' + esc(c.title) + '</b></p>'));
          if (c.body) cb.appendChild(el('<p class="hint">' + esc(c.body) + '</p>'));
          cb.appendChild(el('<p class="hint">' + esc(c.author) + ' · ' + esc(c.author_role) + ' · ' + fmtDate((c.created_at || '').slice(0, 10)) + '</p>'));
          var br = el('<button class="btn btn-primary btn-sm">' + ico('ai') + 'Reenviar a mi equipo</button>');
          br.onclick = function () {
            U.modal('Reenviar: ' + c.title, annComposer(t, roster, {
              title: c.title, body: c.body, players: roster.map(function (p) { return p.id; })
            }, function () { SF.store.commMarkRelayed(c.id, meS.id, t.id); }));
          };
          cb.appendChild(br);
          view.appendChild(cb);
        });
      }

      /* --- Lo urgente arriba --- */
      var top = el('<div class="empty-panel" style="text-align:left"></div>');
      if (nextEv) {
        var lbl = nextEv.type === 'partido' ? 'Partido vs ' + esc(nextEv.opponent || 'rival') : 'Entrenamiento';
        top.appendChild(el('<p><b>' + lbl + '</b> · ' + fmtDate(nextEv.date) + (nextEv.time ? ' · ' + nextEv.time : '') + (nextEv.place ? ' · ' + esc(nextEv.place) : '') + '</p>'));
        var conv = anns.filter(function (a) { return a.needs_rsvp; })[0];
        if (conv) {
          var si = conv.targets.filter(function (x) { return x.rsvp === 'ire'; }).length;
          var pend = conv.targets.filter(function (x) { return !x.rsvp; }).length;
          top.appendChild(el('<p class="hint"><b>' + si + '</b> confirmados · <b>' + pend + '</b> sin responder</p>'));
        } else top.appendChild(el('<p class="hint">Sin convocatoria enviada todavía.</p>'));
      } else top.appendChild(el('<p class="hint">Sin citas próximas. Añade un entrenamiento o un partido.</p>'));

      var sinApto = roster.filter(function (p) { return (p.documents || {}).seguro_medico !== 'validado'; });
      if (sinApto.length) top.appendChild(el('<p class="hint">' + sinApto.length + ' jugador' + (sinApto.length === 1 ? '' : 'es') + ' con el seguro médico pendiente: ' + esc(sinApto.map(function (p) { return p.full_name; }).join(', ')) + '</p>'));
      view.appendChild(top);

      /* --- Cuatro botones, y ya --- */
      var acts = el('<div class="row-c"></div>');
      var b1 = el('<button class="btn btn-primary btn-sm">' + ico('ai') + 'Enviar aviso</button>');
      b1.onclick = function () { U.modal('Aviso a ' + t.name, annComposer(t, roster, null)); };
      var b2 = el('<button class="btn btn-light btn-sm">' + ico('users') + 'Convocar</button>');
      b2.onclick = function () {
        U.modal('Convocatoria · ' + t.name, annComposer(t, roster, {
          title: nextEv ? ((nextEv.type === 'partido' ? 'Convocatoria partido ' : 'Convocatoria ') + fmtDate(nextEv.date) + (nextEv.time ? ' · ' + nextEv.time : '')) : 'Convocatoria',
          rsvp: true, players: roster.map(function (p) { return p.id; })
        }));
      };
      var b3 = el('<button class="btn btn-light btn-sm">' + ico('list') + 'Pasar lista</button>');
      b3.onclick = function () {
        if (!nextEv) { U.toast('No hay ninguna cita próxima'); return; }
        attendanceModal(t, nextEv, function () { SF.router.render(); });
      };
      var b4 = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir cita</button>');
      b4.onclick = function () { trainingModal(t, function () { SF.router.render(); }); };
      acts.appendChild(b1); acts.appendChild(b2); acts.appendChild(b3); acts.appendChild(b4);
      view.appendChild(acts);

      /* --- Plantilla con asistencia --- */
      view.appendChild(el('<p class="sec-label">Plantilla y asistencia</p>'));
      var rl = el('<div class="mini-list"></div>');
      if (!roster.length) rl.appendChild(el('<p class="hint">Sin jugadores en la plantilla.</p>'));
      roster.forEach(function (p) {
        var st = SF.store.attendanceStats ? SF.store.attendanceStats(p.id) : null;
        var pct = st && st.pct != null ? st.pct : null;
        var tag = pct == null ? '<span class="hint">sin datos</span>'
          : '<span class="tag ' + (pct >= 80 ? 'tag-green' : (pct >= 60 ? 'tag-warn' : 'tag-danger')) + '">' + pct + '% asistencia</span>';
        var row = el('<div class="mini-row"><span><b>' + esc(p.full_name) + '</b> · ' + (p.birth_year || '') + ' · ' + esc(p.primary_position || '') + '</span><span class="row-actions">' + tag + '<button class="lnk" data-o>Ficha</button></span></div>');
        row.querySelector('[data-o]').onclick = function () { location.hash = '#/jugador/' + p.id; };
        rl.appendChild(row);
      });
      view.appendChild(rl);

      /* --- Avisos enviados y sus respuestas --- */
      view.appendChild(el('<p class="sec-label">Avisos enviados</p>'));
      if (!anns.length) view.appendChild(el('<p class="hint">Todavía no has enviado ningún aviso.</p>'));
      var al = el('<div class="mini-list"></div>');
      anns.slice(0, 8).forEach(function (a) {
        var vistos = a.targets.filter(function (x) { return x.read_player || x.read_family; }).length;
        var conf = a.targets.filter(function (x) { return x.rsvp === 'ire'; }).length;
        var resume = vistos + '/' + a.targets.length + ' visto' + (a.needs_rsvp ? ' · ' + conf + ' confirmados' : '');
        var row = el('<div class="mini-row"><span><b>' + esc(a.title) + '</b> <span class="hint">' + fmtDate((a.created_at || '').slice(0, 10)) + '</span></span><span class="row-actions"><span class="hint">' + resume + '</span><button class="lnk" data-v>Ver respuestas</button></span></div>');
        row.querySelector('[data-v]').onclick = function () { U.modal(a.title, annResponses(a, roster)); };
        al.appendChild(row);
      });
      view.appendChild(al);
    });
  };

  pages.equipo = function (view, id) {
    var t = SF.store.teamGet(id);
    if (!t) { view.innerHTML = head('Equipo', '') + '<div class="empty-panel"><p>Equipo no encontrado.</p></div>'; return; }
    var r = role();
    var can = r.canManageTeams;
    var head2 = '<button class="btn" id="back">' + ico('back') + 'Equipos</button>' + (can ? '<button class="btn" id="ed">' + ico('edit') + 'Editar</button><button class="btn btn-danger" id="del">' + ico('trash') + '</button>' : '');
    view.innerHTML = head('Equipo', '', head2);
    view.querySelector('#back').onclick = function () { location.hash = '#/equipos'; };
    if (can) {
      view.querySelector('#ed').onclick = function () { U.modal('Editar equipo', teamForm(t, function (d) { SF.store.teamUpdate(t.id, d); U.toast('Guardado'); SF.router.render(); })); };
      view.querySelector('#del').onclick = function () { if (confirm('¿Eliminar el equipo ' + t.name + '? Los jugadores quedarán sin equipo.')) { SF.store.teamRemove(t.id); U.toast('Equipo eliminado'); location.hash = '#/equipos'; } };
    }
    var seg = SF.SEGMENTS[t.segment] || t.segment || '—';
    view.appendChild(el('<div class="ficha-head"><div class="fh-photo">' + ico('grid') + '</div><div class="fh-info"><h2>' + esc(t.name) + '</h2><p class="fh-sub">' + esc((SF.SPORTS[t.sport] || {}).label || '') + ' · ' + esc(seg) + ' · ' + esc(t.category || '') + '</p></div></div>'));

    // Plantilla
    view.appendChild(el('<p class="sec-label">Plantilla</p>'));
    var roster = SF.store.players().filter(function (p) { return p.team_id === t.id; });
    var rl = el('<div class="mini-list"></div>');
    if (!roster.length) rl.appendChild(el('<p class="hint">Sin jugadores asignados.</p>'));
    roster.forEach(function (p) {
      var row = el('<div class="mini-row"><span><b>' + esc(p.full_name) + '</b> · ' + (p.birth_year || '—') + ' · ' + esc(p.primary_position || '—') + '</span><span class="row-actions"><button class="lnk" data-open>Ver ficha</button>' + (can ? '<button class="lnk-del" data-rm>' + ico('x') + '</button>' : '') + '</span></div>');
      row.querySelector('[data-open]').onclick = function () { location.hash = '#/jugador/' + p.id; };
      var rm = row.querySelector('[data-rm]'); if (rm) rm.onclick = function () { SF.store.update(p.id, { team_id: '' }); U.toast('Quitado del equipo'); SF.router.render(); };
      rl.appendChild(row);
    });
    view.appendChild(rl);
    if (can) { var addP = el('<button class="btn btn-light btn-sm">' + ico('search') + 'Buscar y añadir jugadores</button>'); addP.onclick = function () { openAddPlayers(t); }; view.appendChild(addP); }

    /* Partidos y estadísticas del equipo.
       Se pega el acta y cada fila va a la ficha de SU jugador, identificado
       por el dorsal que tiene asignado desde principio de temporada. */
    view.appendChild(el('<p class="sec-label">Partidos y estadísticas</p>'));
    var statsRoster = SF.store.players().filter(function (p) { return p.team_id === t.id; });
    var allGames = [];
    statsRoster.forEach(function (p) {
      (p.stats_games || []).forEach(function (g) { allGames.push({ p: p, g: g }); });
    });
    // Agrupadas por partido (misma fecha y rival)
    var byGame = {};
    allGames.forEach(function (x) {
      var k = (x.g.date || '') + '|' + (x.g.opponent || '');
      (byGame[k] = byGame[k] || { date: x.g.date, opponent: x.g.opponent, home: x.g.home, rows: [] }).rows.push(x);
    });
    var gameKeys = Object.keys(byGame).sort(function (a, b) { return (byGame[b].date || '').localeCompare(byGame[a].date || ''); });

    if (!gameKeys.length) view.appendChild(el('<p class="hint">Todavía no hay estadísticas cargadas para este equipo.</p>'));
    var gl = el('<div class="mini-list"></div>');
    gameKeys.slice(0, 10).forEach(function (k) {
      var G = byGame[k];
      var hl = G.home === true ? '<span class="tag tag-gray">casa</span>' : (G.home === false ? '<span class="tag tag-gray">fuera</span>' : '');
      var row = el('<div class="mini-row"><span><b>' + esc(G.opponent || 'rival') + '</b> · ' + fmtDate(G.date) + ' ' + hl + '</span>' +
        '<span class="row-actions"><span class="hint">' + G.rows.length + ' jugador' + (G.rows.length === 1 ? '' : 'es') + '</span><button class="lnk" data-v>Ver</button></span></div>');
      row.querySelector('[data-v]').onclick = function () {
        var keys = Object.keys(G.rows[0].g.metrics || {});
        var tb = el('<table class="tbl"><thead><tr><th>Dorsal</th><th>Jugador</th>' + keys.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody></tbody></table>');
        var body2 = tb.querySelector('tbody');
        G.rows.sort(function (a, b) { return (parseInt(a.p.dorsal, 10) || 99) - (parseInt(b.p.dorsal, 10) || 99); }).forEach(function (x) {
          body2.appendChild(el('<tr><td>' + esc(x.p.dorsal || '—') + '</td><td>' + SF.fichaCode(x.p.ficha) + ' · ' + esc(x.p.full_name) + '</td>' +
            keys.map(function (c) { return '<td>' + esc(String(x.g.metrics[c] != null ? x.g.metrics[c] : '—')) + '</td>'; }).join('') + '</tr>'));
        });
        U.modal(esc(G.opponent || 'Partido') + ' · ' + fmtDate(G.date), tb);
      };
      gl.appendChild(row);
    });
    view.appendChild(gl);

    // canManageThisTeam() aquí y no canEv: esa variable se define más abajo.
    if (canManageThisTeam(t)) {
      var bStats = el('<button class="btn btn-light btn-sm">' + ico('chart') + 'Cargar acta / estadísticas</button>');
      bStats.onclick = function () {
        var box = el('<div></div>');
        statsImport(box, t.id);
        U.modal('Cargar estadísticas · ' + t.name, box);
      };
      view.appendChild(bStats);
      /* Sin dorsal no hay forma de cruzar el acta: se avisa aquí, que es
         donde el entrenador lo va a resolver. */
      var sinDorsal = statsRoster.filter(function (p) { return !p.dorsal; });
      if (sinDorsal.length) view.appendChild(el('<p class="hint">' + sinDorsal.length + ' jugador' + (sinDorsal.length === 1 ? '' : 'es') +
        ' sin dorsal asignado: ' + esc(sinDorsal.map(function (p) { return p.full_name; }).join(', ')) +
        '. Sin dorsal no se les puede cruzar con el acta.</p>'));
    }

    // Cuerpo técnico — desde las fichas de staff asignadas a este equipo.
    // Con distintivo de habilitación: quien no puede trabajar con jugadores
    // tiene que verse AQUÍ, antes del sábado, no en una pestaña escondida.
    view.appendChild(el('<p class="sec-label">Cuerpo técnico</p>'));
    var sTeam = SF.store.staffOfTeam(t.id);
    var sl = el('<div class="mini-list"></div>');
    if (!sTeam.length) sl.appendChild(el('<p class="hint">Sin cuerpo técnico asignado.' + ((t.coaches || []).length ? ' (Antiguo: ' + esc(t.coaches.join(', ')) + ')' : '') + '</p>'));
    sTeam.forEach(function (s) {
      var stt = SF.staffStatus(s);
      var cls = stt.level === 'ok' ? 'tag-green' : (stt.level === 'warn' ? 'tag-warn' : 'tag-danger');
      var row = el('<div class="mini-row"><span><b>' + esc(s.full_name) + '</b> · ' + esc(roleLabel(s.role)) + ' <span class="hint">' + SF.staffCode(s.num) + '</span></span>' +
        '<span class="row-actions"><span class="tag ' + cls + '">' + stt.label + '</span><button class="lnk" data-open>Ver ficha</button></span></div>');
      row.querySelector('[data-open]').onclick = function () { location.hash = '#/staff/' + s.id; };
      sl.appendChild(row);
    });
    view.appendChild(sl);
    if (can) {
      var bAsig = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Asignar staff a este equipo</button>');
      bAsig.onclick = function () {
        var libres = SF.store.staff().filter(function (s) { return (s.team_ids || []).indexOf(t.id) < 0; });
        var box = el('<div class="mini-list"></div>');
        if (!libres.length) box.appendChild(el('<p class="hint">Todo el staff ya está asignado a este equipo.</p>'));
        libres.forEach(function (s) {
          var stt = SF.staffStatus(s);
          var r2 = el('<button class="mini-row" style="width:100%;text-align:left;cursor:pointer"><span><b>' + esc(s.full_name) + '</b> · ' + esc(roleLabel(s.role)) + '</span><span class="hint">' + stt.label + '</span></button>');
          r2.onclick = function () { SF.store.staffAssign(s.id, t.id, true); U.closeModal(); U.toast(s.full_name + ' asignado a ' + t.name); SF.router.render(); };
          box.appendChild(r2);
        });
        U.modal('Asignar staff a ' + t.name, box);
      };
      view.appendChild(bAsig);
    }

    // Familias
    view.appendChild(el('<p class="sec-label">Familias del equipo</p>'));
    var fams = roster.filter(function (p) { return p.family_active && p.family && p.family.contact; });
    var fl = el('<div class="mini-list"></div>');
    if (!fams.length) fl.appendChild(el('<p class="hint">Ninguna familia con acceso activo en este equipo.</p>'));
    fams.forEach(function (p) { fl.appendChild(el('<div class="mini-row"><span><b>' + esc(p.family.contact) + '</b> · ' + esc(p.family.relation || '') + '</span><span class="hint">' + esc(p.full_name) + '</span></div>')); });
    view.appendChild(fl);

    // Calendario — entrenamientos y partidos
    view.appendChild(el('<p class="sec-label">Calendario — entrenamientos y partidos</p>'));
    var canEv = canManageThisTeam(t);
    var matches = teamUpcoming(t, 'partido'), trains = teamUpcoming(t, 'entrenamiento');
    var cl = el('<div class="mini-list"></div>');
    if (!matches.length && !trains.length) cl.appendChild(el('<p class="hint">Sin citas próximas.</p>'));
    function evRow(ev, tag) {
      var att = ev.attendance ? Object.keys(ev.attendance).filter(function (k) { return ev.attendance[k] === 'presente'; }).length : null;
      var badge = ev.attendance ? ' <span class="tag tag-green">lista: ' + att + '</span>' : '';
      var row = el('<div class="mini-row"><span>' + tag + ' ' + eventDesc(ev) + badge + '</span><span class="row-actions">' +
        (canEv ? '<button class="lnk" data-at>' + (ev.attendance ? 'ver lista' : 'pasar lista') + '</button><button class="lnk-del" data-rm>' + ico('x') + '</button>' : '') + '</span></div>');
      if (canEv) {
        row.querySelector('[data-at]').onclick = function () { attendanceModal(t, ev, function () { SF.router.render(); }); };
        row.querySelector('[data-rm]').onclick = function () { SF.store.teamRemoveEvent(t.id, ev.id); SF.router.render(); };
      }
      return row;
    }
    matches.forEach(function (ev) { cl.appendChild(evRow(ev, '<span class="tag tag-purple">Partido</span>')); });
    trains.forEach(function (ev) { cl.appendChild(evRow(ev, '<span class="tag tag-gray">Entreno</span>')); });
    view.appendChild(cl);
    if (canEv) {
      var evtools = el('<div class="row-c"></div>');
      var bt = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir entrenamiento</button>'); bt.onclick = function () { trainingModal(t, function () { SF.router.render(); }); };
      var bm = el('<button class="btn btn-light btn-sm">' + ico('plus') + 'Añadir partido</button>'); bm.onclick = function () { matchModal(t, function () { SF.router.render(); }); };
      evtools.appendChild(bt); evtools.appendChild(bm); view.appendChild(evtools);
      view.appendChild(el('<p class="hint">Al añadir una cita se manda un aviso a las familias y a los jugadores de 14 en adelante, y en los partidos se les pide confirmación. Lo verás abajo, en Enviados. Los partidos los carga el entrenador según la federación.</p>'));
    }

    /* ---------- Mensajes al equipo ----------
       Antes esto era un tablón: se escribía y se quedaba colgado, sin saber a
       quién llegaba ni si alguien lo había leído. Ahora cada mensaje es un
       aviso con destinatarios y acuse, que es lo que un club necesita para
       poder decir "se lo mandé a las doce familias y lo han abierto ocho". */
    view.appendChild(el('<p class="sec-label">Mensajes al equipo</p>'));
    var roster = SF.store.players().filter(function (x) { return x.team_id === t.id; });
    var menores = roster.filter(function (x) { return SF.firmaMenor14(x.birth_date); }).length;

    if (!roster.length) {
      view.appendChild(el('<p class="hint">Este equipo aún no tiene jugadores, así que no hay a quién escribir.</p>'));
    } else {
      var comp = el('<div class="composer-x"></div>');
      comp.appendChild(el('<input id="mt" placeholder="Asunto: equipación del sábado">'));
      comp.appendChild(el('<textarea id="mb" placeholder="Escribe el mensaje…"></textarea>'));
      var fila = el('<div class="composer-row"></div>');
      fila.appendChild(el('<select id="ma">' + SF.AUDIENCIAS.map(function (x) {
        return '<option value="' + x.k + '">' + esc(x.label) + '</option>';
      }).join('') + '</select>'));
      fila.appendChild(el('<label class="chk"><input type="checkbox" id="mr"> Pedir confirmación de asistencia</label>'));
      var bSend = el('<button class="btn btn-primary" id="send">' + ico('arrow') + 'Enviar</button>');
      fila.appendChild(bSend);
      comp.appendChild(fila);
      var expl = el('<p class="hint"></p>');
      comp.appendChild(expl);
      view.appendChild(comp);

      function explica() {
        var k = comp.querySelector('#ma').value;
        var def = SF.AUDIENCIAS.filter(function (x) { return x.k === k; })[0];
        var cuenta = { jug: 0, fam: 0, redir: 0 };
        roster.forEach(function (x) {
          var real = SF.audienciaReal(k, x);
          if (real.jugador) cuenta.jug++;
          if (real.familia) cuenta.fam++;
          if (real.redirigido) cuenta.redir++;
        });
        var partes = [];
        if (cuenta.fam) partes.push('<b>' + cuenta.fam + '</b> ' + (cuenta.fam === 1 ? 'familia' : 'familias'));
        if (cuenta.jug) partes.push('<b>' + cuenta.jug + '</b> ' + (cuenta.jug === 1 ? 'jugador' : 'jugadores'));
        expl.innerHTML = esc(def.desc) + ' Lo recibirán ' + (partes.join(' y ') || 'nadie') + '.' +
          (cuenta.redir ? ' <b>' + cuenta.redir + '</b> ' + (cuenta.redir === 1 ? 'es menor de 14 y le llegará a su familia.' : 'son menores de 14 y les llegará a su familia.') : '');
      }
      comp.querySelector('#ma').onchange = explica; explica();

      bSend.onclick = function () {
        var titulo = comp.querySelector('#mt').value.trim();
        var cuerpo = comp.querySelector('#mb').value.trim();
        if (!titulo) { U.toast('Ponle un asunto: es lo que ven primero'); return; }
        var a = SF.store.annCreate(t.id, {
          title: titulo, body: cuerpo, kind: 'equipo',
          audience: comp.querySelector('#ma').value,
          needs_rsvp: comp.querySelector('#mr').checked
        }, roster.map(function (x) { return x.id; }));
        var n = a.targets.filter(function (x) { return x.to_family || x.to_player; }).length;
        U.toast('Enviado a ' + n + (n === 1 ? ' destinatario' : ' destinatarios'));
        SF.router.render();
      };
      if (menores) view.appendChild(el('<p class="hint">' + menores +
        (menores === 1 ? ' jugador es menor de 14 años, así que sus mensajes van siempre a su familia.'
                       : ' jugadores son menores de 14 años, así que sus mensajes van siempre a su familia.') +
        ' Es la misma edad a partir de la cual el menor puede consentir por sí mismo.</p>'));
    }

    /* --- Enviados, con el acuse a la vista --- */
    var envs = SF.store.announcements(t.id);
    view.appendChild(el('<p class="sec-label">Enviados</p>'));
    if (!envs.length) view.appendChild(el('<p class="hint">Todavía no se ha enviado ningún mensaje a este equipo.</p>'));
    var lista = el('<div class="mini-list"></div>');
    envs.slice(0, 10).forEach(function (a) {
      var dest = (a.targets || []).filter(function (x) { return x.to_family || x.to_player; });
      var abiertos = dest.filter(function (x) { return x.read_player || x.read_family; }).length;
      var aud = (SF.AUDIENCIAS.filter(function (x) { return x.k === a.audience; })[0] || {}).label || 'A las familias';
      var pct = dest.length ? Math.round(abiertos / dest.length * 100) : 0;
      var color = pct === 100 ? 'tag-green' : (pct >= 50 ? 'tag-warn' : 'tag-gray');
      var row = el('<div class="mini-row"><span><b>' + esc(a.title) + '</b> <span class="hint">' +
        esc(aud.toLowerCase()) + ' · ' + fmtDate((a.created_at || '').slice(0, 10)) + ' · ' + esc(a.author || '') + '</span></span>' +
        '<span class="row-actions"><span class="tag ' + color + '">' + abiertos + ' de ' + dest.length + ' lo han abierto</span>' +
        '<button class="lnk" data-v>Ver quién</button></span></div>');
      row.querySelector('[data-v]').onclick = function () { U.modal(a.title, annResponses(a, roster)); };
      lista.appendChild(row);
    });
    view.appendChild(lista);

    /* Los mensajes del tablón antiguo no se borran: se enseñan aparte y se
       dice claramente que aquello no llegaba a nadie. Borrar lo que alguien
       escribió sería peor que reconocer que estaba mal hecho. */
    var wall = (t.wall || []).slice().reverse();
    if (wall.length) {
      view.appendChild(el('<p class="sec-label">Tablón antiguo</p>'));
      view.appendChild(el('<p class="hint">Mensajes escritos antes de que existieran los destinatarios. Se quedaban en esta pantalla: <b>no llegaban a las familias</b>. Se conservan solo como histórico.</p>'));
      var wallWrap = el('<div class="wall"></div>');
      wall.forEach(function (m) {
        wallWrap.appendChild(el('<div class="msg"><div class="msg-head"><b>' + esc(m.by) + '</b> <span class="hint">' + esc(m.role) + ' · ' + esc(m.date) + '</span></div><p>' + esc(m.text) + '</p></div>'));
      });
      view.appendChild(wallWrap);
    }
  };

  /* ===================== PRESUPUESTO =====================
     El "real" de cada partida se saca de lo que la app ya sabe: lo cobrado a
     los jugadores y los gastos aprobados. Eso es lo que una hoja de cálculo
     no puede hacer, y por lo que merece la pena que esto viva aquí. */
  function budgetReal(auto) {
    if (!auto) return null;
    if (auto.indexOf('cat:') === 0) {
      var c = auto.slice(4);
      return SF.store.expenses().filter(function (e) { return e.status === 'aprobado' && e.category === c; })
        .reduce(function (s, e) { return s + (+e.amount || 0); }, 0);
    }
    var tipo = { cuotas: 'cuota', matricula: 'inscripcion', torneo: 'torneo' }[auto];
    if (!tipo) return null;
    var t = 0;
    SF.store.players().forEach(function (p) {
      SF.finItems(p).forEach(function (i) { if (i.type === tipo && i.status === 'pagado') t += (+i.amount || 0); });
    });
    return t;
  }

  pages.presupuesto = function (view) {
    var r = role();
    if (!r.canManageFinance) {
      view.innerHTML = head('Presupuesto', '') + '<div class="empty-panel"><p>Tu rol no gestiona el presupuesto del club.</p></div>';
      return;
    }
    var temp = SF._presTemp || SF.SEASON;
    var b = SF.store.budget(temp);

    view.innerHTML = head('Presupuesto ' + esc(temp), 'Lo que prevés ingresar y gastar, partida a partida. La columna «real» se rellena sola con lo cobrado y los gastos aprobados.');

    function linea(k) { return b.lines[k] || {}; }
    function previsto(k) { return +linea(k).previsto || 0; }
    function real(x) {
      var a = budgetReal(x.auto);
      return a != null ? a : (+linea(x.key).real || 0);
    }
    function cuenta(x) {   // ¿entra en el total prudente?
      return !(x.riesgo && !linea(x.key).confirmado);
    }

    var ing = SF.BUDGET_PLAN.filter(function (x) { return x.tipo === 'ingreso'; });
    var gas = SF.BUDGET_PLAN.filter(function (x) { return x.tipo === 'gasto'; });
    var sum = function (arr, f) { return arr.reduce(function (s, x) { return s + f(x); }, 0); };

    var totIngP = sum(ing, function (x) { return previsto(x.key); });
    var totIngPrud = sum(ing, function (x) { return cuenta(x) ? previsto(x.key) : 0; });
    var totIngR = sum(ing, real);
    var totGasP = sum(gas, function (x) { return previsto(x.key); });
    var totGasR = sum(gas, real);
    var enRiesgo = totIngP - totIngPrud;

    /* --- Cabecera de resultados --- */
    var k = el('<div class="kpis"></div>');
    [['Ingresos previstos', totIngP, ''],
     ['Gastos previstos', totGasP, ''],
     ['Resultado previsto', totIngP - totGasP, (totIngP - totGasP) >= 0 ? 'ok' : 'danger'],
     ['Resultado real hasta hoy', totIngR - totGasR, (totIngR - totGasR) >= 0 ? 'ok' : 'danger']
    ].forEach(function (x) {
      k.appendChild(el('<div class="kpi ' + x[2] + '"><div class="kpi-top"><span>' + x[0] + '</span></div>' +
        '<div class="kpi-num" style="font-size:23px">' + eur(x[1]) + '</div></div>'));
    });
    view.appendChild(k);

    /* --- El aviso que da todo el sentido a separar las subvenciones ---
       Un club que solo cuadra gracias a ayudas que pueden no llegar es un
       club frágil, aunque su presupuesto sume. */
    if (enRiesgo > 0) {
      var prudente = totIngPrud - totGasP;
      var malo = prudente < 0;
      view.appendChild(el('<div class="foco ' + (malo ? 'is-danger' : 'is-warn') + '">' +
        '<div class="foco-ic">' + ico('alert') + '</div><div class="foco-body">' +
        '<p class="foco-t">' + eur(enRiesgo) + ' dependen de ayudas sin confirmar</p>' +
        '<p class="foco-s">' + (malo
          ? 'Sin ellas el resultado sería <b>' + eur(prudente) + '</b>. El club estaría pagando su funcionamiento con dinero que puede no llegar, y suele llegar tarde.'
          : 'Sin ellas el resultado sigue siendo ' + eur(prudente) + '. El club se sostiene solo, que es como debe ser.') +
        '</p></div></div>'));
    }

    /* --- Las partidas --- */
    function bloque(titulo, lista) {
      view.appendChild(el('<p class="sec-label">' + titulo + '</p>'));
      view.appendChild(el('<div class="pre-cab"><span>Partida</span><span>Previsto</span><span>Real</span><span>Desviación</span></div>'));

      var grupos = [];
      lista.forEach(function (x) { if (grupos.indexOf(x.grupo) < 0) grupos.push(x.grupo); });

      grupos.forEach(function (g) {
        var deG = lista.filter(function (x) { return x.grupo === g; });
        var card = el('<div class="pre-grupo"><div class="pre-head"><span>' + esc(g) + '</span>' +
          '<span class="tot">' + eur(sum(deG, function (x) { return previsto(x.key); })) + '</span></div></div>');

        deG.forEach(function (x) {
          var auto = budgetReal(x.auto), rv = real(x), pv = previsto(x.key);
          /* Desviación: en ingresos es buena si supera lo previsto; en gastos,
             al revés. Un número rojo tiene que significar siempre "mal". */
          var dif = rv - pv;
          var buena = x.tipo === 'ingreso' ? dif >= 0 : dif <= 0;
          var pct = pv ? Math.round(Math.abs(dif) / pv * 100) : null;

          var row = el('<div class="pre-row">' +
            '<span class="pre-lab">' + esc(x.label) +
              (x.nota ? '<button class="q" title="' + esc(x.nota) + '">?</button>' : '') +
              (x.riesgo ? '<span class="pre-riesgo">puede no llegar</span>' : '') + '</span>' +
            '<span><input class="pre-in" type="number" min="0" step="10" value="' + (pv || '') + '" placeholder="0"></span>' +
            (auto != null
              ? '<span class="pre-real auto" title="Calculado por la app">' + eur(auto) + '</span>'
              : '<span><input class="pre-in real" type="number" min="0" step="10" value="' + (+linea(x.key).real || '') + '" placeholder="0"></span>') +
            '<span class="pre-dev ' + (pv || rv ? (buena ? 'bien' : 'mal') : '') + '">' +
              (pv || rv ? (dif >= 0 ? '+' : '−') + eur(Math.abs(dif)) + (pct != null ? ' · ' + pct + '%' : '') : '—') +
            '</span></div>');

          if (x.riesgo) {
            var chk = el('<label class="pre-chk"><input type="checkbox"' + (linea(x.key).confirmado ? ' checked' : '') + '> concedida</label>');
            chk.querySelector('input').onchange = function () {
              SF.store.budgetSetLine(temp, x.key, { confirmado: this.checked }); SF.router.render();
            };
            row.querySelector('.pre-lab').appendChild(chk);
          }

          var inp = row.querySelector('.pre-in');
          inp.onchange = function () { SF.store.budgetSetLine(temp, x.key, { previsto: +this.value || 0 }); SF.router.render(); };
          var inr = row.querySelector('.pre-in.real');
          if (inr) inr.onchange = function () { SF.store.budgetSetLine(temp, x.key, { real: +this.value || 0 }); SF.router.render(); };

          card.appendChild(row);
        });
        view.appendChild(card);
      });

      var tp = sum(lista, function (x) { return previsto(x.key); }), tr = sum(lista, real);
      var td = tr - tp, tb = titulo.indexOf('Ingresos') === 0 ? td >= 0 : td <= 0;
      view.appendChild(el('<div class="pre-tot"><span>Total ' + esc(titulo.toLowerCase()) + '</span>' +
        '<span>' + eur(tp) + '</span><span>' + eur(tr) + '</span>' +
        '<span class="pre-dev ' + (tb ? 'bien' : 'mal') + '">' + (td >= 0 ? '+' : '−') + eur(Math.abs(td)) + '</span></div>'));
    }

    bloque('Ingresos previstos', ing);
    bloque('Gastos previstos', gas);

    /* --- Sugerencia de imprevistos: es la partida que todo el mundo olvida --- */
    var imp = previsto('imprevistos'), baseGasto = totGasP - imp;
    if (baseGasto > 0) {
      var reco = Math.round(baseGasto * 0.04 / 10) * 10;
      if (imp === 0) {
        view.appendChild(el('<p class="hint" style="margin-top:12px">No has reservado nada para <b>imprevistos</b>. ' +
          'Siempre se rompe algo o aparece un arbitraje de un partido aplazado. Con tus gastos, un 4 % serían unos <b>' + eur(reco) + '</b>.</p>'));
      } else {
        var pc = Math.round(imp / baseGasto * 100);
        view.appendChild(el('<p class="hint" style="margin-top:12px">Imprevistos: ' + eur(imp) + ' · un ' + pc + ' % de los gastos' +
          (pc < 3 ? ' (lo habitual es entre un 3 % y un 5 %)' : '') + '.</p>'));
      }
    }

    view.appendChild(el('<p class="hint">La columna <b>real</b> en morado la calcula la app sola: las cuotas y matrículas cobradas ' +
      'de las fichas de jugadores, y los gastos <b>aprobados</b> de Economía. Las demás se escriben a mano.</p>'));
  };

  /* ===================== INSCRIPCIÓN =====================
     Por pasos y no en una sola pantalla larga: una familia delante de una
     tablet abandona un formulario de cuarenta campos. En cinco pasos cortos,
     no. */
  pages.inscripcion = function (view) {
    var paso = SF._insPaso || 1;
    var D = SF._insDatos = SF._insDatos || { consent: {} };
    var PASOS = ['El jugador', 'La familia', 'Salud', 'Autorizaciones', 'Equipación y pago'];

    view.innerHTML = head('Inscripción en el club',
      'Se rellena una vez y la ficha queda hecha. Puede rellenarla la familia aquí mismo, en una tablet.');

    /* Barra de pasos: saber cuánto queda es la mitad de terminarlo. */
    var barra = el('<div class="pasos"></div>');
    PASOS.forEach(function (nombre, i) {
      var n = i + 1;
      barra.appendChild(el('<div class="paso' + (n === paso ? ' on' : n < paso ? ' hecho' : '') + '">' +
        '<span class="paso-n">' + (n < paso ? '✓' : n) + '</span><span class="paso-t">' + nombre + '</span></div>'));
    });
    view.appendChild(barra);

    var caja = el('<div class="card"></div>');
    view.appendChild(caja);

    function campo(k, label, tipo, opciones, ayuda) {
      var v = D[k] == null ? '' : D[k];
      var inner;
      if (tipo === 'select') inner = '<select data-k="' + k + '"><option value="">—</option>' +
        opciones.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
      else if (tipo === 'textarea') inner = '<textarea data-k="' + k + '">' + esc(v) + '</textarea>';
      else inner = '<input type="' + (tipo || 'text') + '" data-k="' + k + '" value="' + esc(v) + '">';
      return '<div class="frow"><label>' + label + '</label>' + inner +
        (ayuda ? '<span class="hint">' + ayuda + '</span>' : '') + '</div>';
    }
    function leer() {
      caja.querySelectorAll('[data-k]').forEach(function (i) { D[i.dataset.k] = (i.value || '').trim(); });
    }

    if (paso === 1) {
      caja.innerHTML = '<div class="form-grid">' +
        campo('first_name', 'Nombre *') + campo('last_name', 'Apellidos *') +
        campo('birth_date', 'Fecha de nacimiento *', 'date') +
        campo('gender', 'Sexo *', 'select', ['M', 'F']) +
        campo('dni', 'DNI, NIE o pasaporte', null, null, 'Hace falta para la licencia federativa') +
        campo('nationality', 'Nacionalidad', null, null, 'Si tiene dos, sepáralas con coma') +
        campo('address', 'Domicilio') + campo('city', 'Ciudad') +
        campo('phone', 'Teléfono del jugador') + campo('email', 'Email del jugador') +
        campo('school', 'Centro de estudios') + campo('course', 'Curso') +
        '</div>';
    } else if (paso === 2) {
      caja.innerHTML = '<p class="sec-label">Contacto principal</p><div class="form-grid">' +
        campo('fam_contact', 'Nombre y apellidos *') +
        campo('fam_relation', 'Relación *', 'select', ['Padre', 'Madre', 'Tutor/a legal']) +
        campo('fam_phone', 'Teléfono *') + campo('fam_email', 'Email *') +
        campo('fam_dni', 'DNI del que firma') +
        '</div><p class="sec-label">Segundo contacto (opcional)</p><div class="form-grid">' +
        campo('fam2_contact', 'Nombre y apellidos') + campo('fam2_phone', 'Teléfono') +
        '</div><p class="sec-label">Estatura de los padres (opcional)</p><div class="form-grid">' +
        campo('father_height_cm', 'Estatura del padre (cm)', 'number') +
        campo('mother_height_cm', 'Estatura de la madre (cm)', 'number') +
        '</div>';
      caja.appendChild(el('<p class="hint">Lo de la estatura no es curiosidad: permite estimar hasta dónde va a crecer, ' +
        'que en baloncesto ayuda a no confundir al que hoy es grande con el que va a serlo. Se puede dejar en blanco.</p>'));
    } else if (paso === 3) {
      caja.innerHTML = '<div class="form-grid">' +
        campo('apto', '¿Tiene reconocimiento médico con apto? *', 'select', ['Sí', 'No', 'Pendiente']) +
        campo('apto_fecha', 'Fecha del reconocimiento', 'date') +
        campo('emergencia', 'Teléfono de emergencia') +
        '</div>' +
        '<div class="frow" style="margin-top:10px">' +
        '<label>Alergias, medicación o algo que deba saber el club en una urgencia</label>' +
        '<textarea data-k="salud_notas">' + esc(D.salud_notas || '') + '</textarea></div>';
      caja.appendChild(el('<p class="hint">Solo lo imprescindible para atenderle si pasa algo. ' +
        'El club <b>no guarda el historial médico</b>: eso es un dato de salud y no nos corresponde custodiarlo.</p>'));
    } else if (paso === 4) {
      var menor = SF.firmaMenor14(D.birth_date);
      caja.appendChild(el('<p class="hint">' + (menor
        ? 'Es menor de 14 años, así que estas autorizaciones las firma <b>el padre, la madre o el tutor</b>.'
        : 'Tiene 14 años o más: puede firmar por sí mismo, aunque lo habitual es que lo haga la familia.') + '</p>'));
      SF.CONSENTIMIENTOS.forEach(function (c) {
        var val = D.consent[c.k];
        var b = el('<div class="cons"><b>' + esc(c.titulo) + (c.obligatorio ? ' *' : '') + '</b>' +
          '<p>' + esc(c.texto) + '</p>' +
          (c.nota ? '<p class="hint">' + esc(c.nota) + '</p>' : '') +
          '<div class="cons-yn"><button class="cyn' + (val === 'si' ? ' on' : '') + '" data-v="si">Sí, autorizo</button>' +
          '<button class="cyn no' + (val === 'no' ? ' on' : '') + '" data-v="no">No autorizo</button></div></div>');
        b.querySelectorAll('.cyn').forEach(function (btn) {
          btn.onclick = function () { D.consent[c.k] = btn.dataset.v; SF.router.render(); };
        });
        caja.appendChild(b);
      });
      caja.appendChild(el('<div class="form-grid" style="margin-top:12px">' +
        campo('firma_nombre', 'Nombre y apellidos de quien firma *') +
        campo('firma_dni', 'DNI de quien firma') + '</div>'));
      caja.appendChild(el('<p class="hint">Se guarda quién firma y en qué fecha. La familia puede cambiar de opinión ' +
        'cuando quiera: retirar un consentimiento es un derecho, y basta con pedirlo al club.</p>'));
    } else {
      var kit = (SF.store.academy().kit) || {};
      caja.innerHTML = '<div class="form-grid">' +
        campo('talla', 'Talla de equipación', 'select', ['6', '8', '10', '12', '14', 'XS', 'S', 'M', 'L', 'XL', 'XXL']) +
        campo('metodo_pago', 'Forma de pago', 'select', ['Recibo domiciliado', 'Transferencia', 'Tarjeta', 'Bizum', 'Efectivo']) +
        campo('iban', 'IBAN (si es domiciliado)') +
        campo('team_id_nombre', 'Equipo', 'select', SF.store.teams().map(function (t) { return t.name; })) +
        '</div>';
      caja.appendChild(el('<p class="hint">Si aún no sabéis el equipo, se deja en blanco y lo asigna el club después.</p>'));
    }

    /* --- Navegación --- */
    var pie = el('<div class="row-c"></div>');
    if (paso > 1) {
      var bAtras = el('<button class="btn btn-light">' + ico('back') + 'Atrás</button>');
      bAtras.onclick = function () { leer(); SF._insPaso = paso - 1; SF.router.render(); };
      pie.appendChild(bAtras);
    }
    if (paso < 5) {
      var bSig = el('<button class="btn btn-primary">Siguiente</button>');
      bSig.onclick = function () {
        leer();
        var falta = [];
        if (paso === 1) {
          if (!D.first_name) falta.push('el nombre');
          if (!D.last_name) falta.push('los apellidos');
          if (!D.birth_date) falta.push('la fecha de nacimiento');
          if (!D.gender) falta.push('el sexo');
        }
        if (paso === 2) {
          if (!D.fam_contact) falta.push('el nombre del contacto');
          if (!D.fam_relation) falta.push('la relación');
          if (!D.fam_phone) falta.push('el teléfono');
          if (!D.fam_email) falta.push('el email');
        }
        if (paso === 3 && !D.apto) falta.push('si tiene apto médico');
        if (paso === 4) {
          SF.CONSENTIMIENTOS.forEach(function (c) {
            if (!D.consent[c.k]) falta.push('contestar «' + c.titulo + '»');
            else if (c.obligatorio && D.consent[c.k] === 'no') falta.push('el consentimiento de tratamiento de datos, sin el que el club no puede inscribirle');
          });
          if (!D.firma_nombre) falta.push('el nombre de quien firma');
        }
        if (falta.length) { U.toast('Falta ' + falta.slice(0, 2).join(' y ')); return; }
        SF._insPaso = paso + 1; SF.router.render();
      };
      pie.appendChild(bSig);
    } else {
      var bFin = el('<button class="btn btn-primary">' + ico('check') + 'Crear la ficha</button>');
      bFin.onclick = function () {
        leer();
        var eq = SF.store.teams().filter(function (t) { return t.name === D.team_id_nombre; })[0];
        var p = SF.store.create({
          first_name: D.first_name, last_name: D.last_name, birth_date: D.birth_date,
          gender: D.gender, dni: D.dni, address: D.address, city: D.city,
          phone: D.phone, email: D.email, school: D.school, course: D.course,
          nationality: (D.nationality || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean),
          team_id: eq ? eq.id : null,

          family: {
            contact: D.fam_contact, relation: D.fam_relation, phone: D.fam_phone, email: D.fam_email,
            dni: D.fam_dni, contact2: D.fam2_contact, phone2: D.fam2_phone,
            father_height_cm: +D.father_height_cm || null, mother_height_cm: +D.mother_height_cm || null
          },
          medical_ok: D.apto, medical_date: D.apto_fecha, emergency_phone: D.emergencia, medical_notes: D.salud_notas,
          kit_order: D.talla ? { sizes: { 'Equipación': D.talla }, status: 'pedido' } : null,
          bank: { method: D.metodo_pago, iban: D.iban },

          inscripcion: {
